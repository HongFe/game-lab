<!doctype html>
<html lang="ko" class="ui-light ui-warm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cdeef3">
<title>복덕방 마을</title>
<style>
/* G032 복덕방 마을 — 게임 밖 UI는 공용 키트(ui-light ui-warm), 강조색 = 살구 */
html:root{--ui-accent:#f08d5e;--ui-on-accent:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#cdeef3;color:var(--ui-text);font-family:var(--ui-font);overscroll-behavior:none;user-select:none;-webkit-user-select:none;word-break:keep-all}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}
#app.shake{animation:shk .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fxcv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#fxcv{pointer-events:none;z-index:85}
#flash{position:fixed;inset:0;pointer-events:none;z-index:84;opacity:0;background:#fff}

/* 위 HUD: 칩 한 줄 + 순자산 진행 한 줄 */
.g-top{position:absolute;left:0;right:0;top:0;z-index:20;padding:var(--ui-s2) var(--ui-s3) 0;padding-top:max(var(--ui-s2),env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.g-row{display:flex;gap:6px;align-items:center;min-width:0}
.g-top .ui-chip,.g-top .ui-btn{pointer-events:auto}
.g-top .ui-chip{height:34px;padding:0 10px}
.g-top .ui-btn.icon{width:40px;min-height:40px;height:40px;border-radius:50%;background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
#nwChip{flex:1;justify-content:space-between;min-width:0}
#nwChip .g-meter{flex:1;height:6px;border-radius:9px;background:var(--ui-surface2);overflow:hidden;margin:0 4px;min-width:30px}
#nwChip .g-meter>i{display:block;height:100%;background:#e7b84d;border-radius:inherit;transition:width .4s}
#nwChip .ui-stars .ui-icon{width:14px;height:14px}
#nwChip small{font-weight:400;color:var(--ui-muted);font-size:12px}
.g-chip-c b{color:var(--ui-text)}
.g-bump{animation:bump .35s var(--ui-in)}
@keyframes bump{40%{transform:scale(1.14)}}
#fc{align-self:center;max-width:100%;height:32px;font-size:13px;background:#fffaf0;border:1px solid rgba(90,69,53,.15)}
#fc .ui-icon{color:#c7774d}
#fc.bad .ui-icon{color:var(--ui-bad)}
#fc[hidden]{display:none}

/* 아래 dock: 복덕방 · 내 집 · 턴 끝(주 버튼) */
.g-dock{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:var(--ui-s3);padding-bottom:max(var(--ui-s3),env(safe-area-inset-bottom));display:flex;gap:var(--ui-s2);align-items:flex-end;background:linear-gradient(to bottom,rgba(247,241,232,0),rgba(247,241,232,.92) 45%)}
.g-dock .ui-btn{min-height:56px;box-shadow:var(--ui-shadow1);background:var(--ui-surface)}
.ui-btn.g-dk{flex-direction:column;gap:2px;padding:0 var(--ui-s2);font-size:13px;min-width:66px;position:relative;white-space:nowrap}
.ui-btn.g-dk .ui-icon{width:22px;height:22px}
.g-dk>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
#bEnd{flex:1;flex-direction:column;gap:4px;background:var(--ui-accent);color:var(--ui-on-accent);font-size:18px;min-height:60px}
#bEnd .ui-pips>i{background:rgba(255,255,255,.35);width:16px}
#bEnd .ui-pips>i.on{background:#fff}
#alertRow{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:19;display:flex;justify-content:center;gap:6px;pointer-events:none}
#alertRow .ui-chip{pointer-events:auto;cursor:pointer;height:36px}
#alertRow .ui-chip .ui-icon{color:#c7774d}

/* 방 화면 UI */
#roomTop,#roomBot,#mags{transition:opacity .25s}
#roomTop{position:absolute;left:0;right:0;top:0;z-index:21;padding:var(--ui-s2) var(--ui-s3);padding-top:max(var(--ui-s2),env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#roomTop>*{pointer-events:auto}
#roomTop .ui-btn.icon{width:44px;min-height:44px;height:44px;border-radius:50%;background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
.g-rtitle{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.g-rtitle b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-rtitle small{font-size:12px;color:var(--ui-muted);white-space:nowrap}
#homeChips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#homeChips::-webkit-scrollbar{display:none}
#homeChips .ui-chip{cursor:pointer;flex:none;height:32px;font-size:13px}
#homeChips .ui-chip.on{box-shadow:inset 0 0 0 2px var(--ui-text)}
#roomBot{position:absolute;left:0;right:0;bottom:0;z-index:21;padding:0 var(--ui-s3) var(--ui-s3);padding-bottom:max(var(--ui-s3),env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--ui-s2);background:linear-gradient(to bottom,rgba(247,241,232,0),rgba(247,241,232,.95) 30%)}
#drawer{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none;touch-action:pan-x}
#drawer::-webkit-scrollbar{display:none}
.g-fi{flex:none;width:64px;height:76px;border-radius:var(--ui-r2);background:var(--ui-surface);box-shadow:var(--ui-shadow1);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px;position:relative;cursor:pointer;border:0;font:700 12px/1 var(--ui-font);color:var(--ui-text);touch-action:none}
.g-fi canvas{width:56px;height:52px;pointer-events:none}
.g-fi span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ui-muted);margin-top:2px}
.g-fi.own span{color:var(--ui-text)}
.g-fi.off{opacity:.45}
.g-fi .ui-badge{position:absolute;top:-5px;right:-5px}
.g-acts{display:flex;gap:6px}
.g-acts .ui-btn{flex:1;flex-direction:column;gap:2px;min-height:54px;padding:0 4px;font-size:12px;background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
.g-acts .ui-btn .ui-icon{width:20px;height:20px}
#selBar{position:absolute;z-index:22;display:flex;gap:6px;transform:translate(-50%,-100%)}
#selBar .ui-btn{min-height:44px;width:44px;padding:0;border-radius:50%;background:var(--ui-surface);box-shadow:var(--ui-shadow2)}
#cozyChip .ui-stars .ui-icon{width:14px;height:14px}
#cmpBar{position:absolute;left:0;right:0;bottom:0;z-index:23;padding:var(--ui-s4);padding-bottom:max(var(--ui-s4),env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--ui-s2);align-items:center}
.g-cmplab{position:absolute;z-index:23;top:calc(env(safe-area-inset-top) + 120px);font:700 14px/1 var(--ui-font);background:var(--ui-surface);padding:6px 12px;border-radius:999px;box-shadow:var(--ui-shadow1)}

/* 시트 공통 */
.ui-sheet{max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.g-shead{display:flex;align-items:center;gap:var(--ui-s3);margin-bottom:var(--ui-s3)}
.g-shead canvas{width:72px;height:72px;flex:none;border-radius:var(--ui-r2);background:linear-gradient(#e7f5f8,#fff6e7)}
.g-shead .g-grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.g-price{font:700 28px/1.1 var(--ui-font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.g-stack{display:flex;flex-direction:column;gap:var(--ui-s2)}
.g-kv{display:flex;align-items:center;gap:var(--ui-s2);font-size:14px;line-height:1.3;padding:6px 0;border-bottom:1px dashed rgba(90,69,53,.14)}
.g-kv>span{flex:1;color:var(--ui-muted);display:flex;align-items:center;gap:6px}
.g-kv>b{font-variant-numeric:tabular-nums}
.g-kv.big>b{font-size:20px}
.g-tags{display:flex;gap:6px;flex-wrap:wrap}
.g-tag{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:999px;background:var(--ui-surface2);font:700 13px/1 var(--ui-font)}
.g-tag .ui-icon{width:16px;height:16px;color:var(--ui-muted)}
.g-tag.q{background:#fff;box-shadow:inset 0 0 0 1.5px rgba(90,69,53,.25);color:var(--ui-muted)}
.g-tag.good{background:#e1f4e7;color:#2f7a4c}.g-tag.good .ui-icon{color:#2f7a4c}
.g-tag.bad{background:#fde5e4;color:#b94744}.g-tag.bad .ui-icon{color:#b94744}
.g-tag.hot{background:#f0736f;color:#fff;animation:hot 1s ease-in-out infinite}
@keyframes hot{50%{filter:brightness(1.12)}}
.g-bars{display:flex;flex-direction:column;gap:4px}
.g-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
.g-bar i{height:8px;border-radius:9px;background:#cfe3ee;display:block}
.g-bar.ask i{background:#f3b48e}
.g-bar em{font-style:normal;min-width:56px}
.g-bubble{position:relative;background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.4;box-shadow:var(--ui-shadow1);align-self:flex-start}
.g-bubble:after{content:"";position:absolute;left:-6px;top:14px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.g-row2{display:flex;gap:var(--ui-s2)}
.g-row2>.ui-btn{flex:1}
.g-offer{display:flex;align-items:center;gap:var(--ui-s3);width:100%;min-height:56px;border:0;border-radius:var(--ui-r2);background:var(--ui-surface2);padding:0 var(--ui-s4);font:700 16px/1 var(--ui-font);color:var(--ui-text);cursor:pointer;font-variant-numeric:tabular-nums;transition:transform 90ms}
.g-offer:active{transform:scale(.97)}
.g-offer .g-grow{flex:1;text-align:left;display:flex;flex-direction:column;gap:3px}
.g-offer small{font-weight:400;font-size:12px;color:var(--ui-muted)}
.g-offer .g-p{font-size:16px;min-width:48px;text-align:right}
.g-offer svg.face{width:30px;height:30px}
.g-offer:disabled{opacity:.4}
.g-seg{display:flex;background:var(--ui-surface2);border-radius:var(--ui-r2);padding:3px;gap:3px}
.g-seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font:700 14px/1 var(--ui-font);color:var(--ui-muted);cursor:pointer}
.g-seg button.on{background:var(--ui-surface);color:var(--ui-text);box-shadow:var(--ui-shadow1)}
.g-seg button:disabled{opacity:.35}
input[type=range].g-range{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-x}
.g-range::-webkit-slider-runnable-track{height:10px;border-radius:9px;background:linear-gradient(to right,#f3b48e var(--p,0%),var(--ui-surface2) var(--p,0%))}
.g-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #5a4535;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.g-range::-moz-range-track{height:10px;border-radius:9px;background:var(--ui-surface2)}
.g-range::-moz-range-progress{height:10px;border-radius:9px;background:#f3b48e}
.g-range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #5a4535}
.g-paper{background:#fffdf6;border-radius:var(--ui-r2);padding:var(--ui-s4);box-shadow:inset 0 0 0 1px rgba(90,69,53,.12),0 2px 0 rgba(90,69,53,.06);position:relative;background-image:repeating-linear-gradient(transparent 0 31px,rgba(90,69,53,.05) 31px 32px)}
.g-need{display:flex;align-items:center;justify-content:space-between;padding:var(--ui-s3) var(--ui-s4);border-radius:var(--ui-r2);background:var(--ui-surface2);font-size:14px}
.g-need b{font-size:20px;font-variant-numeric:tabular-nums}
.g-need.bad{background:#fde5e4}.g-need.bad b{color:#b94744}
.g-stamp{position:absolute;right:18px;top:12px;width:92px;height:92px;border-radius:50%;border:5px solid #e0524f;color:#e0524f;display:grid;place-items:center;font:800 22px/1 var(--ui-font);transform:rotate(-14deg) scale(2.4);opacity:0;pointer-events:none;z-index:5;mix-blend-mode:multiply}
.g-stamp.on{animation:stamp .34s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.92}}
.g-pick{display:flex;gap:6px;flex-wrap:wrap}
.g-sw{width:46px;height:46px;border-radius:12px;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(90,69,53,.2)}
.g-sw.on{box-shadow:inset 0 0 0 3px var(--ui-text)}
.g-ten{display:flex;gap:var(--ui-s3);align-items:center}
.g-ten canvas{width:64px;height:72px;flex:none}
.g-face{width:26px;height:26px;vertical-align:middle}

/* 복덕방 안 */
#office{padding:0;justify-content:flex-start;background:#f7efe2}
.g-ohead{width:100%;max-width:560px;position:relative}
.g-ohead canvas{width:100%;height:230px;display:block}
.g-otop{position:absolute;left:var(--ui-s3);right:var(--ui-s3);top:max(var(--ui-s2),env(safe-area-inset-top));display:flex;gap:var(--ui-s2);align-items:center}
.g-otop .ui-btn.icon{width:44px;min-height:44px;height:44px;border-radius:50%;background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
.g-otab{display:flex;gap:4px;background:rgba(255,255,255,.75);padding:3px;border-radius:999px;flex:1;box-shadow:var(--ui-shadow1)}
.g-otab button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font:700 14px/1 var(--ui-font);color:var(--ui-muted);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 6px;white-space:nowrap}
.g-otab button.on{background:#fff;color:var(--ui-text);box-shadow:var(--ui-shadow1)}
.g-otab button .ui-icon{width:14px;height:14px}
.g-obubble{position:absolute;left:50%;top:76px;right:12px}
.g-board{width:100%;max-width:560px;flex:1;padding:var(--ui-s4) var(--ui-s3) var(--ui-s6);background:#e9d3b3;background-image:radial-gradient(rgba(120,80,40,.10) 1px,transparent 1.5px);background-size:9px 9px;box-shadow:inset 0 8px 12px -8px rgba(90,60,30,.35)}
.g-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-s3)}
.g-card{position:relative;border:0;background:#fffdf7;border-radius:6px;padding:12px 10px 10px;box-shadow:0 2px 0 rgba(90,60,30,.12),0 6px 14px rgba(90,60,30,.12);display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left;font-family:var(--ui-font);color:var(--ui-text);transition:transform 120ms}
.g-card:nth-child(odd){transform:rotate(-1.2deg)}.g-card:nth-child(even){transform:rotate(1deg)}
.g-card:active{transform:scale(.97)}
.g-card:before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffb3a6,#e0524f);box-shadow:0 2px 2px rgba(0,0,0,.25)}
.g-card canvas{width:100%;height:84px;border-radius:4px;background:linear-gradient(#e9f6fa,#fff4e4)}
.g-card .g-cz{font-size:12px;color:var(--ui-muted);display:flex;align-items:center;gap:4px}
.g-card .g-cz .ui-icon{width:14px;height:14px}
.g-card b{font-size:18px;font-variant-numeric:tabular-nums}
.g-card .g-qs{display:flex;gap:3px}
.g-card .g-q{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--ui-surface2);font:700 12px/1 var(--ui-font);color:var(--ui-muted)}
.g-card .g-q .ui-icon{width:14px;height:14px}
.g-card .g-hot{position:absolute;top:8px;right:8px;background:#f0736f;color:#fff;border-radius:999px;padding:3px 8px;font:700 12px/1 var(--ui-font)}
.g-card.done{opacity:.5}
.g-card.lockc{display:grid;place-items:center;min-height:160px;color:var(--ui-muted);gap:8px}

/* 컷신 · 정산 */
#cut{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;background:rgba(40,30,25,.5);padding:var(--ui-s5);opacity:0;pointer-events:none;transition:opacity .2s}
#cut.on{opacity:1;pointer-events:auto}
.g-ccard{width:100%;max-width:340px;background:#fffaf2;border-radius:24px;padding:var(--ui-s3);box-shadow:var(--ui-shadow2);display:flex;flex-direction:column;gap:var(--ui-s3);align-items:center;transform:scale(.85) translateY(20px);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#cut.on .g-ccard{transform:none}
.g-ccard canvas{width:100%;height:190px;border-radius:16px;display:block}
.g-ccard h2{margin:0;font-size:22px;line-height:1.25}
.g-skip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(28px,env(safe-area-inset-bottom));font-size:12px;color:#fff;opacity:.85;display:flex;align-items:center;gap:4px}
.g-ledger{display:flex;flex-direction:column;gap:2px;width:100%}
.g-line{display:flex;align-items:center;gap:8px;font-size:14px;padding:7px 2px;border-bottom:1px dashed rgba(90,69,53,.14);animation:ui-enter .22s var(--ui-in) both}
.g-line .ui-icon{width:18px;height:18px;color:var(--ui-muted)}
.g-line span{flex:1}
.g-line b{font-variant-numeric:tabular-nums}
.g-line.pos b{color:#2f8a57}.g-line.neg b{color:#c4504c}
.g-moves{display:flex;flex-wrap:wrap;gap:6px}
.g-mv{display:inline-flex;align-items:center;gap:3px;font:700 13px/1 var(--ui-font);padding:6px 8px;border-radius:999px;background:var(--ui-surface2);animation:ui-pop .3s var(--ui-in) both}
.g-mv.up{color:#c4504c}.g-mv.dn{color:#3f72b8}
.g-mv .ui-icon{width:14px;height:14px}
.g-season{position:fixed;left:50%;top:38%;z-index:80;transform:translate(-50%,-50%);font:800 44px/1 var(--ui-font);color:#fff;text-shadow:0 3px 0 rgba(90,69,53,.35),0 0 24px rgba(255,255,255,.6);pointer-events:none;animation:sea 1.3s var(--ui-in) both}
@keyframes sea{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

/* 시작 · 결과 · 도감 */
#title .ui-col{gap:var(--ui-s3)}
#heroCv{width:100%;max-width:340px;height:230px;display:block;margin:0 auto}
.g-route{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center}
.g-route canvas{width:44px;height:44px}
.g-route .ui-icon{width:14px;height:14px;color:var(--ui-muted)}
.g-learn{display:flex;gap:var(--ui-s3);align-items:center;text-align:left;width:100%}
.g-learn .ui-icon{color:#c7774d}
.g-dex{display:flex;flex-direction:column;gap:6px}
.g-dex button.ui-item{min-height:52px}
.g-dex .lock{opacity:.45}
.g-dexd{display:flex;flex-direction:column;gap:var(--ui-s3)}
.g-dexd h3{margin:0;font-size:20px}
.g-dexd p{margin:0;font-size:14px;line-height:1.6}
.g-dexd .lab{font-size:12px;color:var(--ui-muted);font-weight:700}

/* 손짓 · 돋보기 */
.ui-hand{font-size:0}
.ui-hand svg{width:40px;height:40px}
.g-mag{position:absolute;z-index:22;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(240,141,94,.55),var(--ui-shadow2);display:grid;place-items:center;cursor:pointer;animation:mag 1.1s ease-in-out infinite}
.g-mag .ui-icon{width:24px;height:24px;color:#5a4535}
.g-mag.done{animation:none;box-shadow:var(--ui-shadow1)}
@keyframes mag{50%{transform:scale(1.12);box-shadow:0 0 0 7px rgba(240,141,94,.25),var(--ui-shadow2)}}
.g-hide{display:none!important}
#sel{position:fixed;inset:0;background:#111;color:#9f9;font:12px/1.4 monospace;white-space:pre-wrap;overflow:auto;padding:10px;z-index:200}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}
.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}
.ui-btn:active{transform:scale(.96)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.ui-level:active{transform:scale(.94)}
.ui-level.cur{box-shadow:inset 0 0 0 2px var(--ui-text)}   /* 강조색은 주 버튼에만 → 지금 칸은 테두리로 */
.ui-level.lock{color:var(--ui-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line);pointer-events:none}
.ui-level .ui-stars .ui-icon{width:10px;height:10px}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}
.ui-stars .off{color:var(--ui-line);opacity:1}
.ui-light .ui-stars .off{color:rgba(15,20,30,.15)}
.ui-stars.big .ui-icon{width:40px;height:40px}
.ui-stars.big{gap:var(--ui-s2)}

/* HUD: 위쪽 칩 줄 */
.ui-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:var(--ui-s2);align-items:center;padding:var(--ui-s3);padding-top:max(var(--ui-s3),env(safe-area-inset-top));pointer-events:none}
.ui-hud>*{pointer-events:auto}
.ui-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--ui-s3);border-radius:999px;background:color-mix(in srgb,var(--ui-surface) 86%,transparent);box-shadow:var(--ui-shadow1);font:700 var(--ui-t2)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ui-text)}
.ui-chip .ui-icon{width:16px;height:16px;color:var(--ui-muted)}
.ui-chip.accent .ui-icon{color:var(--ui-accent)}
.ui-meter{height:6px;border-radius:999px;background:var(--ui-surface2);overflow:hidden}
.ui-meter>i{display:block;height:100%;background:var(--ui-accent);border-radius:inherit;transition:width 200ms var(--ui-in)}

/* 안내 카드(한 번에 하나) · 토스트 · 시트 */
.ui-tip{display:flex;align-items:center;gap:var(--ui-s3);background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s3) var(--ui-s4);box-shadow:var(--ui-shadow2);font-size:var(--ui-t3);line-height:1.5;color:var(--ui-text);font-family:var(--ui-font)}
.ui-tip .ui-icon{color:var(--ui-accent)}
.ui-toast{position:fixed;left:50%;bottom:max(var(--ui-s6),env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--ui-text);color:var(--ui-bg);padding:var(--ui-s3) var(--ui-s4);border-radius:var(--ui-r1);font:700 var(--ui-t2)/1.25 var(--ui-font);max-width:calc(100vw - 32px);width:max-content;text-align:center;transition:opacity 180ms var(--ui-in),transform 180ms var(--ui-in)}
.ui-toast.on{opacity:1;transform:translate(-50%,0)}
.ui-toast.top{bottom:auto;top:max(25%,env(safe-area-inset-top))}
.ui-sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ui-surface);border-radius:var(--ui-r3) var(--ui-r3) 0 0;padding:var(--ui-s5);padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));box-shadow:var(--ui-shadow2);transform:translateY(100%);transition:transform 195ms var(--ui-out)}
.ui-sheet.on{transform:none;transition:transform 225ms var(--ui-in)}
.ui-sheet:not(.on){box-shadow:none}
.ui-scrim{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity 195ms var(--ui-out)}
.ui-scrim.on{opacity:1;pointer-events:auto;transition:opacity 225ms var(--ui-in)}
.ui-list{display:flex;flex-direction:column;gap:var(--ui-s2)}
.ui-list li{display:flex;align-items:center;gap:var(--ui-s3);font-size:var(--ui-t2);line-height:1.5}
.ui-list li .ui-icon{color:var(--ui-muted)}
.ui-em{width:28px;height:28px;display:inline-grid;place-items:center;font-size:20px;line-height:1;flex:none}

/* 등장 모션 */
.ui-enter{animation:ui-enter 225ms var(--ui-in) both}
.ui-enter-2{animation:ui-enter 225ms var(--ui-in) 60ms both}
.ui-enter-3{animation:ui-enter 225ms var(--ui-in) 120ms both}
.ui-pop{animation:ui-pop 300ms var(--ui-in) both}
@keyframes ui-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ui-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ui-enter,.ui-enter-2,.ui-enter-3,.ui-pop{animation:ui-fade 150ms linear both}.ui-btn,.ui-level{transition:none}}
@keyframes ui-fade{from{opacity:0}to{opacity:1}}

/* 화면 머리 · 목록 줄 · 아래 고정 · 단계 막대 · 한 줄 카드 (2026-11-27 G003 시범에서 추가) */
.ui-head{display:flex;align-items:center;gap:var(--ui-s2);min-height:var(--ui-touch)}
.ui-head>.ui-h{flex:1}
.ui-item{display:flex;align-items:center;gap:var(--ui-s3);background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3)}
.ui-item>.ui-grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--ui-s1)}
.ui-item b{font-size:var(--ui-t3);font-weight:700;line-height:1.25}
.ui-item small{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25}
.ui-item.lock{opacity:.5}
.ui-line{display:flex;align-items:center;gap:var(--ui-s2);background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3) var(--ui-s4);font-size:var(--ui-t3);line-height:1.25}
.ui-line>.ui-grow{flex:1;color:var(--ui-muted)}
.ui-line b{font-variant-numeric:tabular-nums}
.ui-dock{position:sticky;bottom:0;padding-top:var(--ui-s3);background:linear-gradient(to bottom,transparent,var(--ui-bg) 40%)}
.ui-pips{display:inline-flex;gap:3px}.ui-pips>i{width:14px;height:6px;border-radius:999px;background:var(--ui-line)}.ui-pips>i.on{background:var(--ui-text)}
.ui-strike{text-decoration:line-through;text-decoration-thickness:3px;opacity:.6}
.ui-good{color:var(--ui-good)}.ui-bad{color:var(--ui-bad)}

/* 칩 보조 숫자(값/한도) · 첫 판 손짓 (v1.2) */
.ui-chip small{font-weight:400;color:var(--ui-muted);margin-left:-4px}
.ui-hand{position:absolute;z-index:40;width:44px;height:44px;margin:-6px 0 0 -14px;pointer-events:none;font-size:36px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));transition:left 600ms var(--ui-in),top 600ms var(--ui-in),opacity 150ms linear}
.ui-hand.tap{animation:ui-tap 900ms var(--ui-in) infinite}
@keyframes ui-tap{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(6px) scale(.9)}}
@media (prefers-reduced-motion:reduce){.ui-hand,.ui-hand.tap{animation:none;transition:opacity 150ms linear}}

/* v1.3 (G012 반영): 숨김, 줄 오른쪽 값, 작은 안내, 배지 색 */
.ui-screen[hidden],.ui-sheet[hidden],.ui-tip[hidden],.ui-screen.hide,.ui-screen.off{display:none}
.ui-item>.ui-val{font:700 var(--ui-t3)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.ui-tip.sm{font-size:var(--ui-t2);padding:var(--ui-s2) var(--ui-s3);gap:var(--ui-s2)}
.ui-tip.sm b{font-weight:700}
.ui-badge.good{background:var(--ui-good)}
.ui-badge.muted{background:var(--ui-surface2);color:var(--ui-muted)}

/* v1.4 (G021·G022 반영) */
.ui-light .ui-screen.dim{background:rgba(20,28,40,.45)}
.ui-levels.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.ui-btn.float{background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
.ui-chip .ui-stars .ui-icon{color:inherit}
.ui-chip .ui-stars .off{color:var(--ui-line)}

/* v1.5 (G002·G006 반영) */
[hidden].ui-badge,[hidden].ui-chip,[hidden].ui-btn,[hidden].ui-item,[hidden].ui-line{display:none}
button.ui-item{appearance:none;border:0;width:100%;text-align:left;color:var(--ui-text);font-family:var(--ui-font);cursor:pointer;transition:transform 90ms var(--ui-in)}
button.ui-item:active{transform:scale(.98)}
.ui-pips>i.bad{background:var(--ui-bad)}.ui-pips>i.good{background:var(--ui-good)}
.ui-hud.static{position:static;padding:0}
</style>

/* ---------- 시장: 시드 하나로 24턴 전체를 미리 만든다(플레이어 행동과 무관 → 같은 시드 = 같은 동네) ---------- */
function buildMarket(seed) {
  const r = R(hash(seed, "mk"));
  let ph = "rec", left = 2 + Math.floor(r() * 2), downs = 0;
  const ix = {}; ZK.forEach(z => ix[z] = 1);
  let base = 3.0, reg = 0, regLeft = 0, subway = 0, subT = 0, bombs = 0, academy = 0;
  const eff = []; const jrAdj = {}; ZK.forEach(z => jrAdj[z] = 0); const jrEff = [];
  const pass = []; let tt = 1;
  for (let s = 1; s <= 5; s++) { let d = 2 + Math.floor(r() * 2); const late = r() < .2; if (late) d += 1; tt += d; pass.push({ t: tt, s, late }); }
  const cutoff = [40 + Math.floor(r() * 10), 42 + Math.floor(r() * 10)];
  const aucOrder = []; for (let i = 0; i < 40; i++) aucOrder.push(r());
  const mk = [null]; let stage = 0, prevPh = ph, fcNext = null;
  for (let t = 1; t <= 25; t++) {
    const m = { t, ph, base, reg, ev: [], cut: null, fc: null, stage, boss: false, jr: {}, late: false, sub: null, auc: null };
    if (t <= 24 && t >= 2) {
      if (ph !== prevPh) { m.cyc = ph; if (prevPh === "down") m.boss = true; }
      if (fcNext && fcNext.k === "rate") {
        const x = r(), [pu, pd] = fcNext.p; const res = x < pu ? "rateUp" : x < pu + pd ? "rateDown" : "rateHold";
        if (res === "rateUp") base = Math.min(5.5, base + .5); if (res === "rateDown") base = Math.max(1.5, base - .5);
        m.ev.push(res); if (res !== "rateHold") eff.push({ z: "*", per: res === "rateUp" ? -.01 : .01, left: 1 });
        m.fcRes = { k: "rate", res, p: fcNext.p };
      } else if (fcNext && fcNext.k === "reg") {
        const x = r(), [pt, pe] = fcNext.p; const res = x < pt ? "tight" : x < pt + pe ? "ease" : "regHold";
        if (res === "tight") { reg = -1; regLeft = 4; } if (res === "ease") { reg = 1; regLeft = 4; }
        m.ev.push(res); m.fcRes = { k: "reg", res, p: fcNext.p };
      } else if (r() < .42) {
        const w = {}; if (!subway && t <= 18) w.subway = 1; if (subway === 1 && t >= subT + 2) w.subDelay = 1.4; if (!academy) w.academy = 1; if (bombs < 2) w.bomb = .9;
        if (Object.keys(w).length) {
          const e = pickW(r, w); m.ev.push(e);
          if (e === "subway") { subway = 1; subT = t; eff.push({ z: "station", per: .08 / 3, left: 3 }); }
          if (e === "subDelay") { subway = 2; eff.push({ z: "station", per: -.02, left: 2 }); }
          if (e === "academy") { academy = 1; eff.push({ z: "school", per: .03, left: 2 }); jrEff.push({ z: "school", v: .03, left: 4 }); }
          if (e === "bomb") { bombs++; eff.push({ z: "newtown", per: -.04, left: 2 }); jrEff.push({ z: "newtown", v: -.06, left: 4 }); }
        }
      }
      const p = pass.find(q => q.t === t); if (p) { stage = p.s; m.stage = stage; m.ev.push("redevPass"); eff.push({ z: "redev", per: stage === 5 ? .12 : .05, left: 1 }); m.late = p.late; }
      if (t % 4 === 2) m.ev.push("taxBill");
    }
    m.reg = reg; m.base = base; m.stage = stage;
    const jph = ph === "down" ? -.14 : ph === "adj" ? -.06 : ph === "up" ? .02 : 0;
    ZK.forEach(z => m.jr[z] = clamp(ZONES[z].jr + jrAdj[z] + jph, .4, .8));
    m.ix = Object.assign({}, ix);
    if (SUB_T.includes(t)) m.sub = { cutoff: cutoff[SUB_T.indexOf(t)] };
    if (t >= 12 && t % 3 === 0 && t <= 24) m.auc = { k: aucOrder[t] };
    // 다음 턴 예고
    fcNext = null;
    if (RATE_T.includes(t + 1)) fcNext = { k: "rate", p: RATE_P[ph] };
    else if (REG_T.includes(t + 1)) fcNext = { k: "reg", p: REG_P[ph] };
    m.fc = fcNext;
    mk.push(m);
    // t → t+1 시세 이동
    ZK.forEach(z => {
      const Z = ZONES[z]; let d = PH[ph].ret * Z.beta + Z.drift + (r() - .5) * .012;
      for (const e of eff) if (e.z === z || e.z === "*") d += e.per;
      ix[z] *= 1 + d;
    });
    for (const e of eff) e.left--; for (let i = eff.length - 1; i >= 0; i--) if (eff[i].left <= 0) eff.splice(i, 1);
    ZK.forEach(z => jrAdj[z] = 0); for (const e of jrEff) { jrAdj[e.z] += e.v; e.left--; } for (let i = jrEff.length - 1; i >= 0; i--) if (jrEff[i].left <= 0) jrEff.splice(i, 1);
    if (regLeft > 0 && --regLeft === 0) reg = 0;
    prevPh = ph;
    if (--left <= 0) {
      if (ph === "rec") { ph = "up"; left = 4 + Math.floor(r() * 4); }
      else if (ph === "up") { ph = "adj"; left = 2 + Math.floor(r() * 3); }
      else if (ph === "adj") { if (downs === 0 || r() < .5) { ph = "down"; downs++; left = 2 + Math.floor(r() * 2); } else { ph = "rec"; left = 3 + Math.floor(r() * 3); } }
      else { ph = "rec"; left = 3 + Math.floor(r() * 3); }
    }
  }
  return mk;
}
