<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>고양이 타자수</title>
<style>
:root{--bg:#f4efe6;--ink:#2b2633;--sub:#857c8f;--card:#fffdf8;--line:#e2d9ca;--acc:#ff8a3d;--ok:#2fae6b;--bad:#e5484d;--key:#fbf8f2;--key2:#d9d0c1;--blue:#3b6fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:17px} .top h1 small{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.stars{font-size:15px;color:#f2b01e;letter-spacing:2px}
.mail{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);overflow:hidden;position:relative}
.mail .bar{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#efe7da;font-size:11.5px;color:var(--sub)}
.mail .bar i{width:9px;height:9px;border-radius:50%;background:#e6c8b0;display:inline-block}
.mail .f{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid #f0e8dc;font-size:13px} .mail .f b{color:var(--sub);font-weight:600;width:44px}
.subj{font:800 28px/1.2 ui-monospace,Menlo,monospace;padding:10px 12px 4px;min-height:52px;letter-spacing:2px;word-break:break-all}
.subj .c{display:inline-block;width:3px;height:26px;background:var(--blue);vertical-align:-4px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.subj span.n{display:inline-block;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-10px) scale(1.5);color:var(--acc)}}
.goal{padding:0 12px 10px;font-size:12.5px;color:var(--sub)} .goal b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
#kb{width:100%;display:block;touch-action:none}
.ctl{display:flex;gap:8px}
.ctl button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 0;font:800 14px -apple-system,sans-serif;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.ctl button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ctl button.go{flex:1.6;background:var(--acc);border-color:#e27120;color:#fff;box-shadow:0 3px 0 #c45e15}
.ctl button:disabled{opacity:.4}
.fish{font-size:13px;color:var(--sub);text-align:center}
.modes{display:flex;gap:8px}
.modes button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 4px;font:800 13.5px -apple-system,sans-serif;color:var(--ink);cursor:pointer}
.modes button small{display:block;font-size:10.5px;color:var(--sub);font-weight:600}
.modes button.on{border-color:var(--acc);background:#fff3e8}
#mJump.on{border-color:var(--blue);background:#eaf0ff}
.modes button:disabled{opacity:.35}
.modes b{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.nav{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)} .nav button{background:none;border:0;color:var(--sub);font:inherit;padding:4px 6px;cursor:pointer} .nav button:disabled{opacity:.3}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(43,38,51,.45);padding:18px;z-index:5}
.ov.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:18px;width:min(360px,100%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h2{margin:0 0 4px} .box .big{font-size:34px;color:#f2b01e;letter-spacing:4px}
.reply{background:#f3eee6;border-radius:12px;padding:10px 12px;margin:10px 0;text-align:left;font-size:14px}
.reply small{display:block;color:var(--sub);font-size:11.5px;margin-bottom:3px}
.box .sent{font:800 20px ui-monospace,Menlo,monospace;letter-spacing:2px}
.box button{width:100%;border:0;border-radius:12px;padding:12px;font:800 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:#efe7da;color:var(--ink)}
.box button.pri{background:var(--acc);color:#fff}
.box ul{text-align:left;font-size:13.5px;line-height:1.7;padding-left:18px}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.plane{position:fixed;font-size:34px;z-index:6;pointer-events:none;animation:fly 1s ease-in forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(70vw,-60vh) rotate(-20deg) scale(.5);opacity:0}}
.conf{position:fixed;width:8px;height:5px;z-index:6;pointer-events:none;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><h1>🐈 고양이 타자수<small id="lvl">메일 1</small></h1><div class="stars" id="best"></div></div>
  <div class="mail" id="mail">
    <div class="bar"><i></i><i></i><i></i>&nbsp;새 메일</div>
    <div class="f"><b>받는 이</b>부장님</div>
    <div class="f"><b>미션</b><span id="mission"></span></div>
    <div class="subj" id="subj"><span class="c"></span></div>
    <div class="goal">목표: <b id="goal"></b> · 간식은 <b id="maxT"></b>개까지</div>
  </div>
  <div class="modes"><button id="mWalk" class="on">🐟 걸어가기<small>지나는 키 전부 입력</small></button><button id="mJump">🐭 뛰어오르기 <b id="jl">0</b><small>착지한 키만 입력</small></button></div>
  <canvas id="kb"></canvas>
  <div class="fish" id="fish"></div>
  <div class="ctl"><button id="undo">↶ 간식 빼기</button><button id="clear">비우기</button><button class="go" id="go">▶ 출발</button></div>
  <div class="nav"><button id="prev">◀ 이전 메일</button><span>키를 탭해 간식을 순서대로 놓기</span><button id="next">다음 메일 ▶</button></div>
</div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>

const kb = $("kb"), ctx = kb.getContext("2d");

let ac = null;

const SFX = {
  place(n) { beep(520 + n * 90, .06, "triangle", .06); buzz(6); },
  remove() { beep(300, .06, "triangle", .05, 0, 200); },
  key(ch) { const i = Math.max(0, "QWERTYUIOPASDFGHJKLZXCVBNM".indexOf(ch)); beep(700 + (i % 10) * 45 + (i / 10 | 0) * 30, .035, "square", .035); beep(120, .03, "triangle", .05); buzz(4); },

// ───────── 그리기 ─────────

      ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y));
      if (p.j) { ctx.setLineDash([2, 6]); ctx.strokeStyle = "rgba(59,111,224,.9)"; const mx = (X(a.x) + X(p.x)) / 2, my = Math.min(Y(a.y), Y(p.y)) - S * .9; ctx.quadraticCurveTo(mx, my, X(p.x), Y(p.y)); }
      else { ctx.setLineDash([5, 5]); ctx.strokeStyle = "rgba(255,138,61,.85)"; ctx.lineTo(X(p.x), Y(p.y)); }
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }
  // 간식
  treats.forEach((tr, i) => {
    const k = KEYS[tr.k], bob = Math.sin(t / 250 + i) * 2;
    if (running && runInfo && i < runInfo.eaten) return;
    ctx.font = `${Math.round(S * .62)}px sans-serif`; ctx.fillText(tr.j ? "🐭" : "🐟", X(k.x) + S * .18, Y(k.y) - S * .12 + bob);
    ctx.fillStyle = tr.j ? "#3b6fe0" : "#ff8a3d"; ctx.beginPath(); ctx.arc(X(k.x) - S * .28, Y(k.y) - S * .28, S * .17, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `900 ${Math.round(S * .22)}px -apple-system,sans-serif`; ctx.fillText(i + 1, X(k.x) - S * .28, Y(k.y) - S * .27);
  });
  // 파티클
  parts = parts.filter(p => (p.life -= 1 / 60) > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .25; ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.r, p.r); });
  ctx.globalAlpha = 1;
  drawCat(X(cat.x), Y(cat.y), t);
}
function drawCat(x, y, t) {
  const s = S / 40, bob = running ? Math.abs(Math.sin(t / 90)) * 3 : Math.sin(t / 600) * 1.2;
  ctx.save(); ctx.translate(x, y - 6 - bob); ctx.scale(s * cat.face, s);
  ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.beginPath(); ctx.ellipse(0, 18 + bob / s, 16, 5, 0, 0, 7); ctx.fill();
  // 꼬리
  ctx.strokeStyle = "#f08a3c"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-12, 6); ctx.quadraticCurveTo(-26, 2 + Math.sin(t / 200) * 6, -22, -14); ctx.stroke();
  // 몸
  ctx.fillStyle = "#f6a25a"; ctx.beginPath(); ctx.ellipse(-2, 6, 15, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#f08a3c"; ctx.fillRect(-10, 0, 4, 10); ctx.fillRect(-2, -1, 4, 11);
  // 발
  ctx.fillStyle = "#fff4e8"; const ph = running ? Math.sin(t / 70) * 3 : 0;
  ctx.beginPath(); ctx.ellipse(-8 + ph, 16, 4, 3, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(6 - ph, 16, 4, 3, 0, 0, 7); ctx.fill();
  // 머리
  ctx.fillStyle = "#f6a25a"; ctx.beginPath(); ctx.arc(12, -6, 11, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, -13); ctx.lineTo(6, -24); ctx.lineTo(12, -15); ctx.fill(); ctx.beginPath(); ctx.moveTo(14, -15); ctx.lineTo(21, -23); ctx.lineTo(21, -11); ctx.fill();
  ctx.fillStyle = "#ffc9b0"; ctx.beginPath(); ctx.moveTo(6.5, -15); ctx.lineTo(7.5, -21); ctx.lineTo(10.5, -15.5); ctx.fill();
  ctx.fillStyle = "#2b2633"; const blink = (t % 3200) < 120 ? .2 : 1;
  ctx.beginPath(); ctx.ellipse(9, -7, 1.8, 2.4 * blink, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(17, -7, 1.8, 2.4 * blink, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#e5677a"; ctx.beginPath(); ctx.arc(13, -3, 1.6, 0, 7); ctx.fill();
  ctx.strokeStyle = "#2b2633"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(20, -3); ctx.lineTo(27, -5); ctx.moveTo(20, -1); ctx.lineTo(27, 0); ctx.stroke();
  ctx.restore();
}
function burst(x, y, n, cols) { if (!JUICE) return; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 1 + Math.random() * 3; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: .6, max: .6, r: 3 + Math.random() * 3, col: cols[i % cols.length] }); } }

// ───────── 입력 ─────────
kb.addEventListener("pointerdown", e => {
  if (running || $("ov").classList.contains("on")) return;
  const b = kb.getBoundingClientRect(), x = (e.clientX - b.left - PX) / S, y = (e.clientY - b.top - PY) / S, k = keyAt(x, y);
  if (k < 0) return;
  if (treats.length && treats[treats.length - 1].k === k) { treats.pop(); SFX.remove(); update(); return; }
  if (treats.length >= lv().opt + 1) { $("fish").classList.add("shake"); setTimeout(() => $("fish").classList.remove("shake"), 360); SFX.fail(); return; }
  if (k === (treats.length ? treats[treats.length - 1].k : lv().start)) return;
  const j = mode === "jump"; treats.push({ k, j }); SFX.place(treats.length); if (j) mode = "walk"; pressed[k] = performance.now(); burst(X(KEYS[k].x), Y(KEYS[k].y), 6, ["#ff8a3d", "#ffd27a"]); update();
});
$("mWalk").onclick = () => { mode = "walk"; SFX.remove(); update(); };
$("mJump").onclick = () => { mode = "jump"; SFX.place(1); update(); };
$("undo").onclick = () => { if (!running && treats.length) { treats.pop(); SFX.remove(); update(); } };
$("clear").onclick = () => { if (!running) { treats = []; SFX.remove(); update(); } };
$("go").onclick = () => run();
$("prev").onclick = () => load(L - 1);
$("next").onclick = () => load(L + 1);

// ───────── 실행 ─────────
const SPEED = 3.2; // 키/초
function run() {
  if (running || !treats.length) return;
  running = true; typedShown = ""; renderSubj(); runInfo = Object.assign(walk(lv().start, treats), { eaten: 0 }); evIdx = 0; runT0 = performance.now(); update(); SFX.meow();
}
function stepRun(t) {
  const d = Math.min(runInfo.dist, (t - runT0) / 1000 * SPEED);
  // 위치
  const P = runInfo.pts; let i = 1; while (i < P.length - 1 && P[i].d < d) i++;
  const a = P[i - 1], b = P[i], u = b.d > a.d ? (d - a.d) / (b.d - a.d) : 1;
  const nx = a.x + (b.x - a.x) * Math.min(1, u), ny = a.y + (b.y - a.y) * Math.min(1, u) - (b.j ? Math.sin(Math.min(1, u) * Math.PI) * .8 : 0);
  if (Math.abs(nx - cat.x) > .001) cat.face = nx > cat.x ? 1 : -1;
  cat.x = nx; cat.y = ny;
  runInfo.eaten = P.filter((p, j) => j > 0 && p.d <= d).length;
  // 입력 이벤트
  while (evIdx < runInfo.ev.length && runInfo.ev[evIdx].d <= d) {
    const e = runInfo.ev[evIdx++], k = KEYS[e.key];
    pressed[e.key] = t; typedShown = e.typed;
    if (e.key === BS) { SFX.bs(); burst(X(k.x), Y(k.y), 12, ["#c2410c", "#2b2633", "#fff"]); renderSubj(); }
    else { SFX.key(k.ch); burst(X(k.x), Y(k.y), 4, ["#fff", "#ffd27a"]); renderSubj(true); }
  }
  if (d >= runInfo.dist) { running = false; finish(); }
}
function finish() {
  const ok = typedShown === lv().word, used = treats.length, st = ok ? (used <= lv().opt ? 3 : 2) : 0;
  update();
  if (ok) {
    save.stars[L] = Math.max(save.stars[L] || 0, st); save.unlocked = Math.max(save.unlocked, L + 2); store.set(save);
    SFX.win(); emit("level_clear", { level: L + 1, treats: used, stars: st });
    if (JUICE) { const pl = document.createElement("div"); pl.className = "plane"; pl.textContent = "✉️"; const r = $("mail").getBoundingClientRect(); pl.style.left = r.left + 20 + "px"; pl.style.top = r.top + 60 + "px"; document.body.appendChild(pl); setTimeout(() => pl.remove(), 1000);
      for (let i = 0; i < 26; i++) { const c = document.createElement("div"); c.className = "conf"; c.style.background = ["#ff8a3d", "#2fae6b", "#3b6fe0", "#f2b01e", "#e5677a"][i % 5]; c.style.left = "50%"; c.style.top = "30%"; c.style.setProperty("--dx", (Math.random() - .5) * 360 + "px"); c.style.setProperty("--dy", (Math.random() - .3) * 400 + "px"); document.body.appendChild(c); setTimeout(() => c.remove(), 1250); } }
    setTimeout(() => {
      const last = L + 1 >= LEVELS.length;
      $("box").innerHTML = `<h2>전송 완료 ✉️</h2><div class="big">${"★".repeat(st)}${"☆".repeat(3 - st)}</div><div class="sent">${lv().word}</div>
        <div class="reply"><small>부장님의 답장</small>${OK_REPLY[(L * 7 + used) % OK_REPLY.length]}</div>
        <p style="font-size:12.5px;color:var(--sub)">간식 ${used}개 사용 · 최소 ${lv().opt}개${st < 3 ? " — 더 적게 풀 수 있어요!" : ""}</p>
        <button onclick="load(L)">다시</button>${last ? '<button class="pri" onclick="ending()">🎉 끝</button>' : '<button class="pri" onclick="load(L+1)">다음 메일</button>'}`;
      $("ov").classList.add("on");
    }, 700);
  } else {
    SFX.fail(); emit("fail", { level: L + 1, typed: typedShown });
    if (JUICE) { $("wrap").classList.add("shake"); setTimeout(() => $("wrap").classList.remove("shake"), 360); }
    setTimeout(() => {
      const r = BAD_REPLY[(L + typedShown.length) % BAD_REPLY.length].replace("{t}", typedShown || "(빈 메일)");
      $("box").innerHTML = `<h2>앗, 오타 😿</h2><div class="sent" style="color:var(--bad)">${typedShown || "(빈 메일)"}</div><p style="font-size:13px;color:var(--sub)">목표: <b>${lv().word}</b></p>
        <div class="reply"><small>부장님의 답장</small>${r}</div><button class="pri" onclick="retry()">간식 다시 놓기</button><button onclick="load(L)">처음부터</button>`;
      $("ov").classList.add("on");
    }, 500);
  }
}
function retry() { $("ov").classList.remove("on"); const k = KEYS[lv().start]; cat.x = k.x; cat.y = k.y; typedShown = ""; renderSubj(); update(); }
function ending() { $("box").innerHTML = `<h2>오늘 메일 끝! 🐈</h2><p>모든 메일을 보냈어요. 고양이는 이제 키보드 위에서 잡니다.</p><button class="pri" onclick="load(0)">처음 메일부터</button>`; }
function loop(t) { if (running) stepRun(t); draw(t); requestAnimationFrame(loop); }

// ───────── 시작 ─────────
addEventListener("resize", () => { resize(); });
resize();
const q = new URLSearchParams(location.search);
if (q.has("selftest")) {
  const rows = []; let ok = 0;
  LEVELS.forEach((l, i) => { const r = walk(l.start, l.sol), pass = r.typed === l.word && l.sol.length === l.opt && l.sol.filter(t => t.j).length <= l.jumps; if (pass) ok++; rows.push(`${i + 1}\t${pass ? "OK" : "FAIL"}\t${l.word}\t간식 ${l.sol.length}/${l.opt}\t결과 ${r.typed}\t함정 ${l.trap ? "O" : "-"}\t⌫ ${l.usesBS ? "O" : "-"}`); });
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest">${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/${LEVELS.length}`;
  load(0);
} else if (q.has("autoplay")) {
  auto = true; load((Number(q.get("autoplay")) || 1) - 1);
  lv().sol.forEach((t, i) => setTimeout(() => { treats.push(t); SFX.place(treats.length); pressed[t.k] = performance.now(); update(); }, 500 + i * 450));
  setTimeout(run, 700 + lv().sol.length * 450);
} else {
  load(q.has("level") ? Number(q.get("level")) - 1 : Math.min(save.unlocked - 1, LEVELS.length - 1));
  if (!save.seenHelp) { save.seenHelp = 1; store.set(save); $("box").innerHTML = `<h2>🐈 고양이 타자수</h2><ul><li>키를 탭해 🐟 간식을 <b>순서대로</b> 놓아요</li><li>🐟 생선: 고양이가 <b>직선으로 걸어가며</b> 밟은 키가 <b>전부</b> 입력돼요</li><li>🐭 쥐: 고양이가 <b>폴짝 뛰어서</b> 착지한 키만 입력돼요 (개수 제한)</li><li>⌫를 밟으면 한 글자 지워져요</li><li>목표 단어를 정확히 만들어 부장님께 보내기!</li></ul><button class="pri" onclick="document.getElementById('ov').classList.remove('on')">시작</button>`; $("ov").classList.add("on"); }
}
requestAnimationFrame(loop);
</script>
