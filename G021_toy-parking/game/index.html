<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5bb8e8">
<title>꼬마 주차요원</title>
<style>
:root{--sky:#5bb8e8;--sky2:#8fd3f4;--panel:#ffffff;--ink:#23324a;--sub:#6b7a90;--acc:#ffc533;--line:#d7e3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#top,#bot,#wrap{width:100%;max-width:480px}
#top{display:flex;align-items:center;gap:6px;height:52px}
.ib{width:46px;height:46px;flex:0 0 46px;border:0;border-radius:14px;background:rgba(255,255,255,.92);font-size:22px;line-height:46px;padding:0;cursor:pointer;
  box-shadow:0 3px 0 rgba(35,50,74,.18);color:var(--ink)}
.ib:active,.big:active,.rb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,50,74,.18)}
#lvl{min-width:44px;height:46px;border-radius:14px;background:var(--ink);color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px}
.pill{height:40px;border-radius:20px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;padding:0 10px;white-space:nowrap}
#mv{flex:1}
#goal{flex:1.4;font-size:15px} #goal b{color:#e8a300;letter-spacing:-1px;margin-right:4px}
#wrap{position:relative;margin-top:8px;display:flex;justify-content:center}
canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 8px 0 rgba(35,50,74,.22)}
#bot{display:flex;gap:12px;margin-top:14px;justify-content:center}
.big{flex:1;max-width:120px;height:62px;border:0;border-radius:18px;background:#fff;font-size:30px;cursor:pointer;box-shadow:0 4px 0 rgba(35,50,74,.2);padding:0}
.big:disabled{opacity:.4}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border-radius:18px;background:rgba(20,30,50,.45);z-index:5}
.ov.on{display:flex}
.box{background:#fff;border-radius:22px;padding:18px 16px 16px;width:min(300px,88%);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.stars{font-size:46px;letter-spacing:6px;height:60px;line-height:60px}
.stars span{display:inline-block;color:#d9e1ea}
.stars span.on{color:var(--acc);text-shadow:0 3px 0 #d19a0a;animation:starpop .4s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.line{font-size:22px;font-weight:800;margin:4px 0}
.gain{font-size:17px;font-weight:800;color:#2e8a5c;background:#e6f8ee;border-radius:12px;padding:6px 8px;margin:8px 0 4px;white-space:nowrap}
.gain:empty{display:none}
.row{display:flex;gap:10px;margin-top:12px}
.rb{flex:1;height:60px;border:0;border-radius:16px;font-size:24px;font-weight:900;cursor:pointer;background:#eef3f8;color:var(--ink);box-shadow:0 4px 0 rgba(35,50,74,.18)}
.rb.pri{background:var(--acc);box-shadow:0 4px 0 #d19a0a}
.card canvas,#newcar{display:block;margin:0 auto;box-shadow:none;border-radius:14px}
.card .ico{font-size:30px;line-height:36px;font-weight:900;white-space:nowrap}
.rb{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;height:34px;padding:0 5px;font-size:16px;font-weight:900;color:var(--ink)}
.badge img{height:28px;display:block}
.sh{display:inline-block;margin:0 2px}
#sel .box{width:min(340px,94%);padding:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.grid button{height:52px;border:0;border-radius:12px;background:#eef3f8;font-size:18px;font-weight:900;color:var(--ink);cursor:pointer;padding:0;line-height:1.1}
.grid button small{display:block;font-size:13px;color:#e8a300;letter-spacing:-1px}
.grid button.cur{outline:3px solid var(--acc)}
.grid button:disabled{opacity:.35}
#selftest{position:fixed;left:0;top:0;right:0;bottom:0;overflow:auto;margin:0;background:#fff;color:#111;font-size:11px;padding:8px;z-index:9;white-space:pre}
</style>
</head>

    if (drag.lo === drag.hi || (push < 0 ? drag.base === drag.lo : drag.base === drag.hi) && Math.abs(drag.v - drag.base) < .05) { sfx.nope(); wobble(drag.i); }   // 못 가는 쪽: 고개 젓기
    else { sfx.bump(); bounce(drag.i, -push, .08); shake(2); }
    const r = carRect(drag.i, drag.v), h = M.h[drag.i];
    puff(push > 0 ? (h ? r.x + r.w : r.x + r.w / 2) : (h ? r.x : r.x + r.w / 2), push > 0 ? (h ? r.y + r.h / 2 : r.y + r.h) : (h ? r.y + r.h / 2 : r.y), 4, { speed: 45, life: .35, r: 2.5, col: "rgba(255,255,255,.6)" });
  } else if (!push) drag.bumped = 0;
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag, v = Math.round(d.v); drag = null;
  anim[d.i] = { from: d.v, to: v, t0: performance.now(), dur: 90 };     // 칸 단위로 '착'
  if (v !== d.base) { apply({ i: d.i, to: v }); afterMove(d.i, d.base, v); }
  else if (!d.moved && performance.now() - d.t0 < 400) tapCar(d.i);
  hud();
}
// 톡 치기(4세는 탭을 많이 한다): 차가 들썩 + 갈 수 있는 쪽 화살표. 화살표를 누르면 그쪽 끝까지
function tapCar(i) {
  const [lo, hi] = rangeOf(M, pos, i), arrows = [];
  // 끝까지 가되, 가는 길에 자기 칸이 있으면 칸에서 멈춘다(지나쳐 버리지 않게)
  const tg = M.kind[i] === "C" ? M.tgt[i] : -1;
  if (lo < pos[i]) arrows.push({ dir: -1, to: tg >= lo && tg < pos[i] ? tg : lo });
  if (hi > pos[i]) arrows.push({ dir: 1, to: tg > pos[i] && tg <= hi ? tg : hi });
  if (!arrows.length) { sfx.nope(); wobble(i); return; }
  sfx.grab(); bounce(i, arrows[0].dir, .06);
  tapSel = { i, arrows, t0: performance.now() };
}
function arrowPos(i, dir) {
  const cell = dir > 0 ? pos[i] + M.len[i] : pos[i] - 1;
  return M.h[i] ? { x: PAD + cell * S + S / 2, y: PAD + M.fix[i] * S + S / 2 } : { x: PAD + M.fix[i] * S + S / 2, y: PAD + cell * S + S / 2 };
}
function arrowAt(p) {
  for (const a of tapSel.arrows) { const c = arrowPos(tapSel.i, a.dir); if (Math.hypot(p.x - c.x, p.y - c.y) < S * .58) return a; }
  return null;
}
function slideTo(i, to) {
  const from = pos[i];
  anim[i] = { from, to, t0: performance.now(), dur: 110 + Math.abs(to - from) * 70 };
  apply({ i, to }); afterMove(i, from, to); hud();
}
function drawArrows(t) {
  if (!tapSel || cleared) return;
  const i = tapSel.i, u = (t - tapSel.t0) / 1000, h = M.h[i];
  tapSel.arrows.forEach(a => {
    const c = arrowPos(i, a.dir), r = S * .34, off = Math.sin(u * 7) * S * .05 * a.dir;
    const x = c.x + (h ? off : 0), y = c.y + (h ? 0 : off), ang = h ? (a.dir > 0 ? 0 : Math.PI) : (a.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.arc(x + 1, y + 3, r, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = M.kind[i] === "C" ? COLS[M.col[i]].d : "#5a6273";
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(r * .55, 0); ctx.lineTo(-r * .32, -r * .5); ctx.lineTo(-r * .32, r * .5); ctx.closePath(); ctx.fill(); ctx.restore();
  });
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

function afterMove(i, from, to) {
  const dist = Math.abs(to - from), dir = Math.sign(to - from), h = M.h[i];
  sfx.move(dist); bounce(i, dir, .07 + dist * .015);
  const r = carRect(i, to), back = dir > 0 ? 0 : 1;
  puff(h ? r.x + r.w * back : r.x + r.w / 2, h ? r.y + r.h / 2 : r.y + r.h * back, 2 + dist * 2,
    { angle: h ? (dir > 0 ? Math.PI : 0) : (dir > 0 ? -Math.PI / 2 : Math.PI / 2), spread: 1.6, speed: 30 + dist * 8, life: .5, r: 4 });
  slotCheck();
  if (isGoal(M, pos)) win();
}
function slotCheck() {     // 칸에 쏙 → 웃음 + 딩(차마다 다른 음)
  M.colorIdx.forEach(i => {
    const now = pos[i] === M.tgt[i];
    if (now && !inSlot[i]) {
      const r = carRect(i, pos[i]);
      setTimeout(() => sfx.ding(M.col[i]), 90);
      puff(r.x + r.w / 2, r.y + r.h / 2, 14, { speed: 110, life: .7, r: 3, cols: [COLS[M.col[i]].c, "#fff", "#ffc533"], square: true, drag: .9 });
    }
    inSlot[i] = now;
  });
}

// ── 판 끝: 빵빵 합창 → 결과 카드 ──
function win() {
  cleared = true; busy = true; guide = null; tapSel = null;
  const lv = LEVELS[L], st = starsFor(moves, lv.opt_moves), prevStars = save.stars[L] || 0, prevBest = save.best[L], before = totalStars();
  const firstClear = !prevStars;
  save.stars[L] = Math.max(prevStars, st);
  if (prevBest === undefined || moves < prevBest) save.best[L] = moves;
  save.unlocked = Math.max(save.unlocked, L + 2);
  store.set(save);
  const after = totalStars(), skin = SKINS.find(s => s.at === L + 1);
  // 늘어난 것 한 가지: 새 차(그림) > 기록 단축 > 별
  let gain = "", newSkin = null;
  if (firstClear && skin) newSkin = skin.e;
  else if (prevBest !== undefined && moves < prevBest) gain = `🚗 ${prevBest}번 → ${moves}번`;
  else if (after > before) gain = `⭐ 별 ${before} → ${after}`;
  const sec = Math.round((performance.now() - t0play) / 1000);
  emit("level_clear", { level: L + 1, moves, min: lv.opt_moves, stars: st, hints, sec });
  window.__g021.lastResult = { level: L + 1, moves, stars: st, hints };
  const last = L + 1 === LEVELS.length, rounds = last ? 3 : 1;
  for (let k = 0; k < rounds; k++) pos.forEach((_, i) => { sfx.honk(1 + (i % 5) * .12, k * .6 + i * .07); setTimeout(() => bounce(i, i % 2 ? 1 : -1, .12), (k * .6 + i * .07) * 1000); });
  shake(3);
  puff(BW / 2, BW * .2, last ? 90 : 50, { angle: -Math.PI / 2, spread: 3, speed: 240, g: 320, life: 1.3, r: 4, cols: CONF, square: true, drag: .96 });
  setTimeout(() => showResult(st, gain, newSkin), JUICE ? 650 + (rounds - 1) * 600 : 150);
}
function showResult(st, gain, newSkin) {
  busy = false;
  const nx = L + 2, last = nx > LEVELS.length;
  const pre = last ? "" : `▶ ${nx}${badgeHTML(nx)}`;
  $("resbox").innerHTML = `<div class="stars">${[0, 1, 2].map(k => `<span class="${k < st ? "on" : ""}" style="animation-delay:${.15 + k * .25}s">★</span>`).join("")}</div>
    <div id="ncwrap"></div>
    <div class="line">🚗 ${moves}</div><div class="gain">${gain}</div>
    <div class="row"><button class="rb" id="again" aria-label="다시">🔄</button>${last ? `<button class="rb pri" id="tomenu" aria-label="레벨">☰</button>` : `<button class="rb pri" id="next" aria-label="다음">${pre}</button>`}</div>`;
  $("res").classList.add("on");
  newcar = null;
  if (newSkin) {   // 새 차: 글 대신 큰 그림
    const sc = mkScene({ cols: 2, rows: 1, cars: [[0, 0, 2, "H", "C", 0, -1]], noBg: true }, 240, 120, .3), [c, c2] = sceneCanvas(sc);
    c.id = "newcar"; $("ncwrap").appendChild(c);
    newcar = { sc, c2, e: newSkin, t0: performance.now() + 750 };
    setTimeout(() => sfx.brrm(), 700);
  }
  for (let k = 0; k < st; k++) setTimeout(() => sfx.star(k), 150 + k * 250);
  $("again").onclick = () => load(L, true);
  if ($("next")) $("next").onclick = () => load(L + 1, true);
  if ($("tomenu")) $("tomenu").onclick = openMenu;
}

// ── 버튼 ──
$("undo").onclick = () => {
  if (cleared || busy || !hist.length) return;
  const h = hist.pop(), cur = pos[h.i];
  pos[h.i] = h.from; moves--;
  anim[h.i] = { from: cur, to: h.from, t0: performance.now(), dur: 160 };
  sfx.whoosh(); bounce(h.i, Math.sign(h.from - cur), .05);
  M.colorIdx.forEach(i => inSlot[i] = pos[i] === M.tgt[i]);
  guide = null; tapSel = null; lastTouch = performance.now(); hud();
};
$("reset").onclick = () => { if (busy) return; leave("reset"); load(L, true); };
$("hint").onclick = () => { if (busy || cleared) return; lastTouch = performance.now(); sfx.tap(); showHint(true); };
$("snd").onclick = () => { save.mute = !save.mute; store.set(save); hud(); if (!save.mute) sfx.tap(); };
function openMenu() {
  if (busy) return;
  const btns = LEVELS.map((_, k) => {
    const s = save.stars[k] || 0, lock = k + 1 > save.unlocked && !q.has("level");
    return `<button data-k="${k}" class="${k === L ? "cur" : ""}" ${lock ? "disabled" : ""}>${lock ? "🔒" : k + 1}<small>${s ? "★".repeat(s) : "&nbsp;"}</small></button>`;
  }).join("");
  $("selbox").innerHTML = `<div class="row" style="margin:0;justify-content:space-between;align-items:center"><span style="font-size:22px;font-weight:900">⭐ ${totalStars()}</span><button class="ib" id="selx" aria-label="닫기">✕</button></div><div class="grid">${btns}</div>`;
  $("sel").classList.add("on"); guide = null;
  $("selx").onclick = () => $("sel").classList.remove("on");
  $("selbox").querySelectorAll(".grid button").forEach(b => b.onclick = () => {
    const k = Number(b.dataset.k); sfx.tap();
    leave(k === L ? "reset" : "prev"); load(k, true);
  });
}
$("menu").onclick = openMenu;
addEventListener("resize", () => { resize(); });

window.__g021 = { load: n => load(n - 1, true), solve: n => solveFrom(mkModel(LEVELS[n - 1]), mkModel(LEVELS[n - 1]).start), state: () => ({ level: L + 1, pos: pos.slice(), moves, hints, cleared }), lastResult: null };

// ═════════ 자체 검사 (?selftest) ═════════
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function runSelftest() {
  const rows = []; let pass = 0, total = 0;
  const T = (ok, line) => { total++; if (ok) pass++; rows.push((ok ? "OK   " : "FAIL ") + line); };
  let solveMs = 0, hintMax = 0, bfsMax = 0, tabMax = 0;
  const seenTruck = [], seenCone = [], seenColorTruck = [];
  for (let n = 0; n < LEVELS.length; n++) {
    const lv = LEVELS[n], no = n + 1, tb = TABLE[n], m = mkModel(lv);
    // [A] 풀림
    let t1 = performance.now(); const acts = solveFrom(m, m.start); solveMs += performance.now() - t1;
    T(!!acts, `L${no} [A] 풀림 ${acts ? acts.length + "수" : "해 없음"}`);
    // [B] 최소 수 = opt_moves, 게임 apply로 재생
    load(n); (acts || []).forEach(apply);
    T(!!acts && acts.length === lv.opt_moves && isGoal(M, pos) && moves === lv.opt_moves, `L${no} [B] 봇 ${acts ? acts.length : "-"} / opt ${lv.opt_moves} / 재생 ${moves}수 ${isGoal(M, pos) ? "모두 칸" : "칸 아님"}`);
    // [C] 곡선: 표 ±1, 무작위 봇 풀림률(참고)
    const R = rng(1000 + no); let solved = 0;
    for (let g = 0; g < 50; g++) { const p = m.start.slice(); for (let s = 0; s < 300; s++) { if (isGoal(m, p)) break; const ms = movesOf(m, p); const a = ms[Math.floor(R() * ms.length)]; p[a.i] = a.to; } if (isGoal(m, p)) solved++; }
    T(Math.abs(lv.opt_moves - tb[4]) <= 1, `L${no} [C] 최소 ${lv.opt_moves} (표 ${tb[4]}) · 무작위 봇 풀림 ${solved * 2}%`);
    // [D] 규칙 일치
    const nC = m.colorIdx.length, nG = m.kind.filter(k => k === "G").length, nCone = lv.cones.length;
    const grayTruck = m.kind.some((k, i) => k === "G" && m.len[i] === 3), colorTruck = m.colorIdx.some(i => m.len[i] === 3);
    const slotOk = m.colorIdx.every(i => m.tgt[i] >= 0 && m.tgt[i] + m.len[i] <= m.n && [...Array(m.len[i])].every((_, j) => !m.cone[m.h[i] ? m.fix[i] * m.n + m.tgt[i] + j : (m.tgt[i] + j) * m.n + m.fix[i]]));
    const parked = m.colorIdx.filter(i => m.start[i] === m.tgt[i]);
    let parkOk = parked.length === (PARKED[no] || 0);
    if (PARKED[no]) parkOk = parkOk && parked.every(i => (acts || []).some(a => a.i === i));
    // 15레벨 전: 칸에 넣은 차를 다시 빼지 않고도 최소 해 / 15·25: 빼야만 최소 해
    const nu = solveFrom(m, m.start, true), nuLen = nu ? nu.length : -1;
    const unparkOk = no < 15 ? nuLen === lv.opt_moves : PARKED[no] ? (nuLen < 0 || nuLen > lv.opt_moves) : true;
    const anyTruck = m.len.some(x => x === 3);
    const truckOk = no < TRUCK_FROM ? !anyTruck : no === TRUCK_FROM ? grayTruck : true;
    const coneOk = no < CONE_FROM ? nCone === 0 : nCone >= 1;
    const ctOk = no < COLOR_TRUCK_FROM ? !colorTruck : no === COLOR_TRUCK_FROM ? colorTruck : true;
    T(lv.n === tb[0] && nC === tb[1] && nG === tb[2] && nCone === tb[3] && slotOk && parkOk && truckOk && coneOk && ctOk && unparkOk,
      `L${no} [D] ${lv.n}×${lv.n} 색${nC} 회${nG} 🚧${nCone} 칸줄${slotOk ? "✓" : "✗"} 빼기${parkOk ? "✓" : "✗"}(${parked.length}) 트럭${truckOk ? "✓" : "✗"} 고깔${coneOk ? "✓" : "✗"} 색트럭${ctOk ? "✓" : "✗"} 안빼고${nuLen < 0 ? "불가" : nuLen}${unparkOk ? "✓" : "✗"}`);
    // [E] 막힘 없음
    const an = analyze(m);
    T(an.unreached === 0 && an.startDist === lv.opt_moves, `L${no} [E] 상태 ${an.size}개 중 못 푸는 상태 ${an.unreached}`);
    // [F] 힌트 정직성: 무작위 10수 뒤 💡만 따라가기
    load(n); const R2 = rng(77 + no);
    for (let s = 0; s < 10; s++) { const ms = movesOf(M, pos); apply(ms[Math.floor(R2() * ms.length)]); }
    const need = (solveFrom(M, pos) || []).length; let follow = 0;
    t1 = performance.now(); nextMove(); bfsMax = Math.max(bfsMax, performance.now() - t1);   // 캐시 없을 때(BFS)
    t1 = performance.now(); distTab = analyze(M); tabMax = Math.max(tabMax, performance.now() - t1);
    while (!isGoal(M, pos) && follow < 99) { t1 = performance.now(); const a = nextMove(); hintMax = Math.max(hintMax, performance.now() - t1); if (!a) break; apply(a); follow++; }
    T(isGoal(M, pos) && follow === need, `L${no} [F] 힌트 따라 ${follow}수 / 남은 최소 ${need}`);
  }
  // [G] 첫 성공: 1레벨 첫 끌기 어디든 1~2수
  const m1 = mkModel(LEVELS[0]);
  const g1 = movesOf(m1, m1.start).every(a => { const p = m1.start.slice(); p[a.i] = a.to; return isGoal(m1, p) || (solveFrom(m1, p) || [0, 0]).length <= 1; });
  T(g1 && LEVELS[0].opt_moves === 1, `L1 [G] 첫 끌기 1~2수 안에 성공`);
  // [H] 속도
  T(solveMs <= 1000, `[H] 30레벨 풀이 ${solveMs.toFixed(0)}ms (≤1000)`);
  T(hintMax <= 100, `[H] 💡 계산 최대 ${hintMax.toFixed(2)}ms (≤100, 거리표 캐시) · 캐시 없을 때 ${bfsMax.toFixed(1)}ms · 거리표 만들기 최대 ${tabMax.toFixed(0)}ms(8ms씩 나눠 계산)`);
  // [I] 규칙 카드 시연이 실제 규칙대로인가 (끄는 수는 갈 수 있는 수, '통'은 정말 막힌 수, 끝나면 모든 색 차가 칸에)
  const bad = [];
  Object.entries(DEMO).forEach(([lv, d]) => {
    const sc = mkScene(d, 236, 210), m = sc.M, p = m.start.slice();
    d.steps.forEach((st, j) => {
      const [lo, hi] = rangeOf(m, p, st.i), can = st.to >= lo && st.to <= hi && st.to !== p[st.i];
      if (st.bump ? can : !can) bad.push(lv + "#" + (j + 1));
      if (!st.bump && can) p[st.i] = st.to;
    });
    if (!isGoal(m, p)) bad.push(lv + " 끝");
    if (lv === "15" && !(m.start[0] === m.tgt[0] && d.steps[0].i === 0)) bad.push("15 빼기");
  });
  T(!bad.length && Object.keys(DEMO).length === 12, `[I] 규칙 카드 시연 ${Object.keys(DEMO).length}개 규칙대로 ${bad.join(",") || "✓"}`);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest">SELFTEST ${pass}/${total}\n${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${pass}/${total}`;
}

// ═════════ 시작 ═════════
if (SELFTEST) {
  resize(); runSelftest(); load(0);
} else if (AUTOPLAY) {
  load(Number(q.get("autoplay")) - 1); requestAnimationFrame(frame);
  const acts = solveFrom(M, pos) || []; let j = 0;
  const step = () => {
    if (j >= acts.length) return;
    const a = acts[j++];
    guide = { i: a.i, to: a.to, from: pos[a.i], t0: performance.now() - 200 };
    setTimeout(() => {
      guide = null; const from = pos[a.i];
      anim[a.i] = { from, to: a.to, t0: performance.now(), dur: 320 };
      apply(a); afterMove(a.i, from, a.to); hud();
      setTimeout(step, 520);
    }, 1000);
  };
  setTimeout(step, 900);
} else {
  const start = q.has("level") ? Number(q.get("level")) - 1 : Math.min(save.unlocked - 1, LEVELS.length - 1);
  load(start); requestAnimationFrame(frame);
}
</script>
