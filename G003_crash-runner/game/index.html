<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>폭락 러너</title>
<style>
:root{--bg:#0d1016;--tx:#eef1f7;--sub:#8b93a7;--up:#26d07c;--dn:#ff4d5e;--acc:#ffcc4d;--panel:rgba(22,26,36,.86);--line:#2a3142}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.ticker{height:22px;overflow:hidden;white-space:nowrap;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);margin:0 -12px 8px;background:rgba(13,16,22,.7)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite;line-height:22px}
@keyframes tick{to{transform:translateX(-100%)}}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ret{font:800 34px/1 ui-monospace,Menlo,monospace;letter-spacing:-1px;transition:color .15s}
.ret small{display:block;font:600 11px -apple-system,sans-serif;color:var(--sub);letter-spacing:0;margin-top:4px}
.lev{font:900 22px ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;min-width:66px;transition:transform .12s}
.lev small{display:block;font:600 10px -apple-system,sans-serif;color:var(--sub)}
.lev.pop{transform:scale(1.25)}
.acct{font-size:12px;color:var(--sub);margin-top:6px} .acct b{color:var(--tx)}
#cash{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe28a,#ffb300 60%,#c98500);color:#2a1d00;font:900 17px -apple-system,sans-serif;box-shadow:0 6px 0 #8a5c00,0 10px 24px rgba(0,0,0,.45);display:none;touch-action:none}
#cash small{display:block;font-size:11px;font-weight:700}
#cash:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5c00}
#cash:disabled{filter:grayscale(.8) brightness(.6)}
.tip{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:12px;color:var(--sub);pointer-events:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.72);padding:20px}
.ov.on{display:flex}
.box{background:#161a24;border:1px solid var(--line);border-radius:18px;padding:20px 18px 16px;width:min(360px,100%);text-align:center}
.box h1{margin:0;font-size:28px;letter-spacing:-.5px} .box h2{margin:0;font-size:24px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:8px 0}
.box .big{font:900 40px ui-monospace,Menlo,monospace;margin:6px 0}
.box .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;text-align:left}
.box .grid div{background:#10131b;border-radius:10px;padding:7px 9px;font-size:11.5px;color:var(--sub)}
.box .grid b{display:block;font:800 15px ui-monospace,Menlo,monospace;color:var(--tx)}
.box ul{text-align:left;font-size:13px;color:#cfd5e3;padding-left:18px;margin:10px 0;line-height:1.7}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font:800 16px -apple-system,sans-serif;background:var(--acc);color:#1b1b1b;margin-top:8px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.title{display:inline-block;background:#232a3a;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--acc);font-weight:800}
.disc{font-size:10.5px;color:#5d6578;margin-top:10px}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);border:5px solid var(--dn);color:var(--dn);font:900 34px -apple-system,sans-serif;padding:4px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.pop{position:absolute;font:900 26px ui-monospace,Menlo,monospace;pointer-events:none;animation:popup .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="ticker"><span id="news"></span></div>
    <div class="row">
      <div><div class="ret" id="ret">+0.0%<small>이번 판 수익률</small></div><div class="acct">계좌 <b id="acct">1,000,000원</b> · <span id="ttl"></span></div></div>
      <div class="lev" id="lev">x1<small>레버리지</small></div>
    </div>
  </div>
  <div class="tip" id="tip">탭: 점프 (공중에서 한 번 더)</div>
  <button id="cash">💰 익절<small>수익 확정</small></button>
  <div class="stamp" id="stamp">강제 청산</div>
  <div class="ov on" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
// ───────── 상수 ─────────
const CW = 28, G = 1500, JV1 = 560, JV2 = 500, STEP = 12, HALF = 9, DT = 1 / 120;
const LEV_EVERY = 8, MAX_LEV = 10, START_GRACE = 3;
const TITLES = [[0, "개미"], [3e6, "동학개미"], [1e7, "슈퍼개미"], [1e8, "큰손"], [1e9, "고래"]];
const NEWS = ["[속보] 개미들, 오늘도 출근 전 차트 확인", "전문가 \"지금이 바닥… 아마도\"", "세력 등장설에 커뮤니티 술렁", "\"익절은 늘 옳다\" 오래된 격언 재조명",
  "레버리지 상품 인기… 개미 \"무섭지만 재밌어\"", "상장폐지 공포에 점프 연습 급증", "고래 출현? 거래량 급증", "※ 이 게임의 차트는 전부 가상입니다"];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const fmtWon = n => Math.round(n).toLocaleString("ko-KR") + "원";
const price = y => (Math.round(10000 * Math.exp(y / 500) / 10) * 10).toLocaleString();
const pct = r => (r >= 0 ? "+" : "") + (r * 100).toFixed(1) + "%";

// ───────── 저장 ─────────
const store = { get() { try { return JSON.parse(localStorage.getItem("g003") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g003", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ total: 1e6, bestRet: 0, bestLev: 1, runs: 0, cashouts: 0 }, store.get());
const titleOf = t => TITLES.filter(x => t >= x[0]).pop()[1];

// ───────── 소리 ─────────
let ac = null;
function beep(f, d = .06, type = "square", v = .045, w = 0, f2) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime + w, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const SFX = {
  jump(n) { beep(n ? 620 : 440, .09, "square", .04, 0, n ? 980 : 760); },
  land(h) { beep(110 + Math.random() * 20, .06 + Math.min(h, 200) / 2000, "triangle", .06 + Math.min(h, 200) / 2500); },
  coin(k) { const p = 1 + Math.min(k, 8) * .06; beep(988 * p, .06); beep(1319 * p, .1, "square", .04, .05); },
  bomb() { beep(140, .25, "sawtooth", .06, 0, 60); buzz(40); },
  lev(l) { [0, 1, 2].forEach(i => beep(330 * Math.pow(1.12, l) * (1 + i * .25), .07, "square", .035, i * .06)); },
  cash() { [523, 659, 784, 1046, 1319].forEach((f, i) => beep(f, .12, "square", .045, i * .07)); for (let i = 0; i < 8; i++) beep(2000 + Math.random() * 1500, .03, "square", .02, .4 + i * .05); },
  dead() { beep(300, .6, "sawtooth", .06, .1, 50); beep(80, .5, "triangle", .1, .1); buzz([60, 40, 120]); },
  tick() { beep(1400, .015, "square", .012); },
};

// ───────── 지형 생성 (시드 고정) ─────────
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeWorld(seed) {
  const R = rng(seed), C = [], items = [];
  let lvl = 0;
  const push = (top, n = 1) => { for (let k = 0; k < n; k++) C.push(top); };
  push(0, 14); // 출발 평지
  function gen() {
    const i = C.length, d = Math.min(1, i / 700);
    let r = R();
    // 평균 회귀: 너무 내려가면 상승 패턴(급등·계단 상승), 너무 오르면 하락 패턴(폭락·계단 하락) — 가격이 음수로 가지 않게
    if (lvl < -220 && R() < .6) r = R() < .6 ? .30 + R() * .159 : .80 + R() * .099;
    else if (lvl > 260 && R() < .6) r = R() < .6 ? .46 + R() * .159 : .90 + R() * .099;
    if (r < .30) { // 평지 + 잔물결 (+ 호재 위에)
      const n = 3 + Math.floor(R() * 5);
      for (let k = 0; k < n; k++) { lvl += Math.round((R() - .45) * 2 * 10); C.push(lvl); }
      if (R() < .45) items.push({ x: (i + 1 + R() * (n - 2)) * CW, y: lvl + 62 + R() * 26, kind: "up" });
      else if (R() < .25 + d * .3 && n >= 4) items.push({ x: (i + 2) * CW + CW / 2, y: lvl + 14, kind: "dn" });
    } else if (r < .46) { // 급등 벽
      lvl += Math.round(40 + R() * (45 + 60 * d)); push(lvl, 4 + Math.floor(R() * 3) + Math.floor(d * 3));
      if (R() < .4) items.push({ x: (C.length - 1) * CW, y: lvl + 70, kind: "up" });
    } else if (r < .62) { // 폭락
      lvl -= Math.round(60 + R() * (90 + 90 * d)); push(lvl, 4 + Math.floor(R() * 2) + Math.floor(d * 4));
    } else if (r < .80) { // 상장폐지 구멍
      push(lvl, 2); const g = 2 + Math.floor(R() * (1.6 + 2.2 * d)); for (let k = 0; k < g; k++) C.push(null);
      if (R() < .5) items.push({ x: (C.length - g / 2) * CW, y: lvl + 90, kind: "up" });
      lvl += Math.round((R() - .5) * 60); push(lvl, 5 + Math.floor(d * 4));
    } else if (r < .90) { // 계단 상승
      for (let k = 0; k < 4; k++) { lvl += 10; push(lvl, 1); } push(lvl, 2);
    } else { // 계단 하락
      for (let k = 0; k < 4; k++) { lvl -= 18; push(lvl, 1); } push(lvl, 2);
    }
  }
  return { C, items, ensure(x) { while (C.length * CW < x + 900) gen(); } };
}
function ground(W, x) { const i = Math.floor(x / CW); if (i < 0) return 0; W.ensure(x); const v = W.C[i]; return v === undefined ? null : v; }
function support(W, x) { const a = ground(W, x - HALF), b = ground(W, x + HALF); if (a === null && b === null) return null; return Math.max(a ?? -1e9, b ?? -1e9); }

// ───────── 물리 (순수 함수: 봇 시뮬레이션과 실제 플레이가 같다) ─────────
function newState(seed) { return { seed, W: makeWorld(seed), x: 2 * CW, y: 0, vy: 0, gnd: true, jumps: 0, lastG: 0, t: 0, dead: null, ret: 0, lastIdx: 2, landH: 0, got: new Set(), streak: 0 }; }
function lev(st) { return Math.min(MAX_LEV, 1 + Math.floor(st.t / LEV_EVERY)); }
function speed(st) { return 200 + 22 * (lev(st) - 1); }
function step(st, jump, ev) {
  if (st.dead) return;
  st.t += DT;
  if (jump && st.jumps < 2) { st.vy = st.jumps === 0 ? JV1 : JV2; st.jumps++; st.gnd = false; ev && ev("jump", st.jumps); }
  const nx = st.x + speed(st) * DT;
  // 앞쪽 벽
  const front = ground(st.W, nx + HALF);
  if (front !== null && front > st.y + STEP && !(st.gnd && front - st.y <= STEP)) { st.dead = "wall"; ev && ev("dead", "wall"); return; }
  st.x = nx;
  st.vy -= G * DT; let ny = st.y + st.vy * DT;
  const sup = support(st.W, st.x);
  if (sup !== null && ny <= sup && st.y >= sup - STEP - 1) {
    if (!st.gnd) { st.landH = Math.max(0, st.lastAir - sup); ev && ev("land", st.landH); }
    ny = sup; st.vy = 0; st.gnd = true; st.jumps = 0; st.lastG = sup;
  } else {
    if (st.gnd) { st.lastAir = st.y; }
    st.gnd = false; st.lastAir = Math.max(st.lastAir ?? ny, ny);
  }
  st.y = ny;
  // 상장폐지: 발밑에 땅이 없는 구멍 위에서 테두리보다 한참 아래로 떨어졌을 때만
  if ((sup === null && st.y < st.lastG - 140) || st.y < st.lastG - 2500) { st.dead = "delist"; ev && ev("dead", "delist"); return; }
  // 수익: 캔들 하나 지날 때마다
  const idx = Math.floor(st.x / CW);
  while (st.lastIdx < idx) { st.lastIdx++; st.ret += 0.0015 * lev(st); }
  // 아이템
  for (let k = 0; k < st.W.items.length; k++) {
    const it = st.W.items[k]; if (st.got.has(k) || Math.abs(it.x - st.x) > 24) continue;
    if (Math.abs(it.y - (st.y + 13)) < 26) { st.got.add(k); if (it.kind === "up") { st.ret += 0.02 * lev(st); st.streak++; } else { st.ret -= 0.15; st.streak = 0; } ev && ev(it.kind === "up" ? "coin" : "bomb", it); }
  }
}
function clone(st) { return { ...st, got: new Set(st.got) }; }

// ───────── 봇 (자체 검사·자동 플레이) ─────────
function lifeTicks(st, plan, maxTicks) {
  // 계획대로 점프하고 그 뒤는 점프 없이 달렸을 때 몇 틱 살아남나
  const s = clone(st);
  for (let k = 0; k < maxTicks; k++) { step(s, plan.includes(k)); if (s.dead) return k; }
  return maxTicks;
}
function survives(st, secs) { const n = Math.round(secs / DT); return lifeTicks(st, [], n) >= n; }
function landInfo(st, plan, maxTicks) {
  const s = clone(st), last = plan.length ? Math.max(...plan) : -1; let land = -1;
  for (let k = 0; k < maxTicks; k++) { step(s, plan.includes(k)); if (s.dead) return { dead: k, land }; if (land < 0 && k > last && s.gnd) land = k; }
  return { dead: maxTicks, land };
}
function botDecide(st, mem) {
  if (mem.plan && mem.plan.length) { if (mem.plan[0] <= mem.tick) { mem.plan.shift(); return true; } return false; }
  const H = Math.round(1.8 / DT), base = lifeTicks(st, [], H);
  if (base >= Math.round(.7 / DT)) return false;
  const plans = [[0]]; for (let k = 4; k <= 66; k += 2) plans.push([0, k]);
  let best = null, score = -1;
  for (const p of plans) {
    const r = landInfo(st, p, H);
    if (r.dead >= H) { best = p; break; }
    if (r.land >= 0 && r.dead > base + 10) { const sc = r.dead - r.land; if (sc > score) { score = sc; best = p; } }
  }
  if (!best) return false;
  mem.plan = best.slice(1).map(k => k + mem.tick); return true;
}

// ───────── 화면 ─────────
let VW = 400, VH = 700, SC = 1, DPR = 1;
function resize() {
  const r = $("game").getBoundingClientRect(); DPR = window.devicePixelRatio || 1; VW = r.width; VH = r.height;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); SC = VH / 640;
}
addEventListener("resize", resize);

// ───────── 손맛 ─────────
const JUICE = !new URLSearchParams(location.search).has("nojuice");
const fx = { parts: [], shake: 0, flash: null, squash: 0, slow: 1, edge: 0 };
function puff(x, y, n, o = {}) { if (!JUICE) return; for (let i = 0; i < n; i++) { const a = o.angle !== undefined ? o.angle + (Math.random() - .5) * (o.spread ?? 1.4) : Math.random() * 6.28, s = (o.speed || 80) * (.4 + Math.random()); fx.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: o.g ?? 0, life: (o.life || .5) * (.7 + Math.random() * .6), max: o.life || .5, r: (o.r || 3) * (.6 + Math.random() * .8), col: o.cols ? o.cols[i % o.cols.length] : o.col || "rgba(180,190,210,.5)", sq: !!o.sq }); } }
function popText(txt, col, xFrac = .5, yFrac = .32) { if (!JUICE) return; const d = document.createElement("div"); d.className = "pop"; d.textContent = txt; d.style.color = col; d.style.left = xFrac * 100 + "%"; d.style.top = yFrac * 100 + "%"; $("game").appendChild(d); setTimeout(() => d.remove(), 950); }

// ───────── 게임 진행 ─────────
let st = null, mode = "menu", acc = 0, lastT = 0, jumpQ = false, camY = 0, runPhase = 0, mem = {}, auto = false, lastLev = 1, deadAt = 0;
function emit(ev, data = {}) { try { if (parent !== window) parent.postMessage({ type: "nhc-game", game: "G003", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0;
function onEvent(kind, a) {
  const sx = VW * .3, sy = () => VH * .58;
  if (kind === "jump") { SFX.jump(a - 1); fx.squash = -.25; puff(st.x, st.y, a === 2 ? 8 : 4, { angle: Math.PI / 2 + Math.PI, spread: 1.2, speed: 70, life: .35, r: 3 }); }
  if (kind === "land") { SFX.land(a); fx.squash = Math.min(.45, .12 + a / 400); puff(st.x, st.y, 4 + Math.min(14, a / 12), { angle: -Math.PI / 2, spread: 2.6, speed: 60 + a / 2, life: .5, r: 4, g: -60 }); if (a > 120) { fx.shake = Math.min(14, a / 14); buzz(15); } }
  if (kind === "coin") { SFX.coin(st.streak); puff(a.x, a.y, 14, { speed: 160, life: .6, r: 3, cols: ["#26d07c", "#ffcc4d", "#fff"], sq: true }); popText("호재 +" + (2 * lev(st)) + "%", "#26d07c", .3, .4); }
  if (kind === "bomb") { SFX.bomb(); fx.flash = { t: 0, dur: .3, col: "#ff4d5e" }; fx.shake = 10; puff(a.x, a.y, 18, { speed: 200, life: .6, r: 4, cols: ["#ff4d5e", "#ff9a3d", "#333"] }); popText("악재 -15%", "#ff4d5e", .3, .4); }
  if (kind === "dead") die(a);
}
function startRun(seed) {
  st = newState(seed ?? (Date.now() % 100000)); mode = "run"; acc = 0; mem = { tick: 0 }; camY = 0; lastLev = 1; fx.parts = []; fx.slow = 1; fx.edge = 0;
  $("ov").classList.remove("on"); $("stamp").classList.remove("on"); $("cash").style.display = "block"; $("tip").style.display = "block";
  save.runs++; store.set(save); emit("level_start", { level: save.runs }); hud(true);
}
function die(why) {
  mode = "dying"; deadAt = performance.now(); fx.slow = .22; SFX.dead(); fx.shake = 16; fx.flash = { t: 0, dur: .6, col: "#ff2b3b" };
  puff(st.x, st.y + 10, 30, { speed: 220, life: .9, r: 4, cols: ["#ff4d5e", "#ffcc4d", "#e8a33d"], g: 300 });
  setTimeout(() => $("stamp").classList.add("on"), 250);
  const before = save.total; save.total = Math.max(1e5, Math.round(save.total * .9)); store.set(save);
  $("cash").style.display = "none";
  emit("fail", { ret: st.ret, lev: lev(st), why });
  setTimeout(() => result(false, why, before), 1300);
}
function cashOut() {
  if (mode !== "run" || st.t < START_GRACE) return;
  mode = "cashed"; const before = save.total, gain = save.total * st.ret;
  save.total = Math.max(1e5, Math.round(save.total * (1 + st.ret))); save.cashouts++;
  const best = st.ret > save.bestRet; if (best) save.bestRet = st.ret; save.bestLev = Math.max(save.bestLev, lev(st)); store.set(save);
  SFX.cash(); buzz([20, 40, 20]); fx.flash = { t: 0, dur: .35, col: "#ffe28a" };
  for (let i = 0; i < 5; i++) setTimeout(() => puff(st.x + (Math.random() - .3) * 300, st.y + 340, 14, { angle: Math.PI / 2 * 3, spread: 1, speed: 40, g: -500, life: 1.6, r: 5, cols: ["#ffcc4d", "#ffe28a", "#26d07c", "#fff"], sq: true }), i * 120);
  $("cash").style.display = "none"; emit("level_clear", { ret: st.ret, lev: lev(st) });
  setTimeout(() => result(true, best, before, gain), 900);
}
function result(ok, extra, before, gain) {
  mode = "over"; $("tip").style.display = "none";
  const box = ok ? `<h2 style="color:var(--up)">익절!</h2><div class="big" style="color:var(--up)">${pct(st.ret)}</div>${extra ? '<p style="color:var(--acc);font-weight:800">🏆 최고 수익률 갱신!</p>' : ""}`
    : `<h2 style="color:var(--dn)">강제 청산</h2><div class="big" style="color:var(--dn)">${pct(st.ret)} → 0%</div><p>${extra === "wall" ? "급등 벽에 부딪혔어요" : "상장폐지 구멍에 빠졌어요"} · 수수료 -10%</p>`;
  $("box").innerHTML = `${box}
    <div class="grid"><div>계좌<b>${fmtWon(save.total)}</b></div><div>변화<b style="color:${save.total >= before ? "var(--up)" : "var(--dn)"}">${save.total >= before ? "+" : ""}${fmtWon(save.total - before)}</b></div>
    <div>최고 레버리지<b>x${lev(st)} / 기록 x${save.bestLev}</b></div><div>최고 수익률<b>${pct(save.bestRet)}</b></div></div>
    <span class="title">${titleOf(save.total)}</span>
    <button class="btn" id="again">${ok ? "한 판 더" : "재도전"}</button><div class="disc">가상 차트 · 투자와 무관</div>`;
  $("ov").classList.add("on"); $("again").onclick = () => { $("stamp").classList.remove("on"); startRun(); };
  hud();
}
function menu() {
  $("box").innerHTML = `<h1>📉 폭락 러너</h1><p>차트가 곧 지형. 개미가 달린다.</p>
    <ul><li><b>탭</b> = 점프 · 공중에서 한 번 더 = 2단 점프</li><li>🟩 <b>급등 벽</b>은 넘고, 🕳 <b>상장폐지 구멍</b>은 건너뛰기</li><li>📈 호재 먹기 · 📉 악재 피하기</li><li>8초마다 <b>레버리지 +1</b> (빨라지고 더 번다)</li><li>💰 <b>익절</b>로 수익 확정 · 청산되면 이번 판 수익 0</li></ul>
    <div class="grid"><div>계좌<b>${fmtWon(save.total)}</b></div><div>칭호<b>${titleOf(save.total)}</b></div><div>최고 수익률<b>${pct(save.bestRet)}</b></div><div>최고 레버리지<b>x${save.bestLev}</b></div></div>
    <button class="btn" id="go">시작</button><div class="disc">가상 차트 · 투자와 무관</div>`;
  $("ov").classList.add("on"); $("go").onclick = () => startRun();
}
function hud(force) {
  const r = st ? st.ret : 0, L = st ? lev(st) : 1;
  const el = $("ret"); el.firstChild.nodeValue = pct(r); el.style.color = r >= 0 ? "var(--up)" : "var(--dn)";
  $("lev").firstChild.nodeValue = "x" + L; $("acct").textContent = fmtWon(save.total); $("ttl").textContent = titleOf(save.total);
  $("cash").disabled = !st || st.t < START_GRACE || mode !== "run";
  $("cash").querySelector("small").textContent = st && mode === "run" ? fmtWon(save.total * r * (r > 0 ? 1 : 1)).replace("원", "") + "원" : "수익 확정";
}

// 입력
function press(e) {
  if (e && (e.target.id === "cash" || e.target.closest(".box"))) return;
  if (mode === "run" && !auto) { jumpQ = true; const t = Date.now(); if (t - lastInputEmit > 4000) { lastInputEmit = t; emit("input"); } }
}
cv.addEventListener("pointerdown", e => { e.preventDefault(); press(e); });
$("cash").addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); cashOut(); });
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (mode === "run") press(); else if (mode !== "dying" && $("ov").classList.contains("on")) startRun(); } if (e.code === "Enter") cashOut(); });

// ───────── 그리기 ─────────
function draw(dt) {
  const W = VW, H = VH;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 배경
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0d1016"); g.addColorStop(1, "#121722"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (fx.shake > .3 && JUICE) ctx.translate((Math.random() - .5) * fx.shake, (Math.random() - .5) * fx.shake);
  const px = st ? st.x : 0, py = st ? st.y : 0;
  const camX = px - (W * .3) / SC;
  const targetY = py; camY += (targetY - camY) * Math.min(1, dt * 5);
  const sx = x => (x - camX) * SC, sy = y => H * .62 - (y - camY) * SC;
  // 격자 + 가격축
  ctx.strokeStyle = "rgba(255,255,255,.045)"; ctx.lineWidth = 1; ctx.fillStyle = "#4b5468"; ctx.font = "10px ui-monospace,Menlo,monospace"; ctx.textAlign = "right";
  const gy0 = Math.floor((camY - 400) / 50) * 50;
  for (let y = gy0; y < camY + 500; y += 50) { const Y = sy(y); if (Y < 0 || Y > H) continue; ctx.beginPath(); ctx.moveTo(0, Y); ctx.lineTo(W, Y); ctx.stroke(); ctx.fillText(price(y), W - 4, Y - 3); }
  const gx0 = Math.floor(camX / (CW * 5)) * CW * 5;
  for (let x = gx0; x < camX + W / SC + 50; x += CW * 5) { const X = sx(x); ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, H); ctx.stroke(); }
  if (!st) { ctx.restore(); return; }
  // 캔들 지형
  const i0 = Math.max(0, Math.floor(camX / CW) - 1), i1 = Math.floor((camX + W / SC) / CW) + 2;
  st.W.ensure(i1 * CW);
  const C = st.W.C;
  for (let i = i0; i <= i1; i++) {
    const top = C[i], prev = C[i - 1] ?? top;
    const X = sx(i * CW);
    if (top === null || top === undefined) {
      // 상장폐지 구멍 표시
      ctx.fillStyle = "rgba(255,77,94,.06)"; ctx.fillRect(X, sy(st.lastG + 40), CW * SC, H);
      if (C[i - 1] !== null && C[i - 1] !== undefined) { ctx.fillStyle = "#ff4d5e"; ctx.font = `800 ${11}px -apple-system,sans-serif`; ctx.textAlign = "left"; ctx.fillText("상폐", X + 3, sy(C[i - 1]) + 18); }
      continue;
    }
    const p = prev === null ? top : prev, up = top > p + 2, dn = top < p - 2;
    // 땅덩어리
    const grd = ctx.createLinearGradient(0, sy(top), 0, sy(top) + 260 * SC); grd.addColorStop(0, up ? "rgba(38,208,124,.22)" : dn ? "rgba(255,77,94,.2)" : "rgba(120,135,165,.16)"); grd.addColorStop(1, "rgba(18,23,34,0)");
    ctx.fillStyle = grd; ctx.fillRect(X, sy(top), CW * SC + .5, 260 * SC);
    // 캔들 몸통 (이전 높이 → 이번 높이)
    const col = up ? "#26d07c" : dn ? "#ff4d5e" : "#7d879c";
    const yA = sy(Math.max(top, p)), yB = sy(Math.min(top, p)), bw = (CW - 8) * SC;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X + CW * SC / 2, yA - 6 * SC); ctx.lineTo(X + CW * SC / 2, yB + 6 * SC); ctx.stroke();
    ctx.fillStyle = col; ctx.fillRect(X + 4 * SC, yA, bw, Math.max(3, yB - yA));
    // 윗면(밟는 곳)
    ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(X, sy(top) - 1, CW * SC + .5, 2);
  }
  // 아이템
  const T = performance.now() / 1000;
  st.W.items.forEach((it, k) => {
    if (st.got.has(k) || it.x < camX - 40 || it.x > camX + W / SC + 40) return;
    const X = sx(it.x), Y = sy(it.y) + Math.sin(T * 4 + k) * 3, R = 11 * SC;
    ctx.fillStyle = it.kind === "up" ? "#26d07c" : "#ff4d5e"; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(X, Y, R, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#0d1016"; ctx.beginPath();
    if (it.kind === "up") { ctx.moveTo(X, Y - R * .55); ctx.lineTo(X + R * .5, Y + R * .35); ctx.lineTo(X - R * .5, Y + R * .35); } else { ctx.moveTo(X, Y + R * .55); ctx.lineTo(X + R * .5, Y - R * .35); ctx.lineTo(X - R * .5, Y - R * .35); }
    ctx.fill();
  });
  // 먼지·꽃가루
  fx.parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; const X = sx(p.x), Y = sy(p.y); if (p.sq) { ctx.save(); ctx.translate(X, Y); ctx.rotate(p.life * 8); ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); } else { ctx.beginPath(); ctx.arc(X, Y, p.r * SC, 0, 7); ctx.fill(); } });
  ctx.globalAlpha = 1;
  // 현재가 표시
  ctx.fillStyle = "#ffcc4d"; ctx.font = "700 10px ui-monospace,Menlo,monospace"; ctx.textAlign = "right";
  const gy = sy(st.lastG); ctx.fillRect(W - 58, gy - 8, 58, 16); ctx.fillStyle = "#1b1b1b"; ctx.fillText(price(st.lastG), W - 4, gy + 4);
  // 개미
  drawAnt(sx(st.x), sy(st.y), SC);
  ctx.restore();
  // 화면 번쩍·테두리
  if (fx.flash && JUICE) { ctx.globalAlpha = .4 * Math.max(0, 1 - fx.flash.t / fx.flash.dur); ctx.fillStyle = fx.flash.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (fx.edge > 0 && JUICE) { ctx.strokeStyle = `rgba(255,204,77,${fx.edge})`; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8); }
}
function drawAnt(X, Y, s) {
  const sq = JUICE ? fx.squash : 0, w = 1 + sq * .6, h = 1 - sq;
  ctx.save(); ctx.translate(X, Y); ctx.scale(s * w, s * h);
  const run = st && st.gnd && mode === "run", ph = runPhase;
  // 다리
  ctx.strokeStyle = "#3b2414"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  for (let k = 0; k < 3; k++) { const a = run ? Math.sin(ph + k * 2.1) * 5 : (st && !st.gnd ? 3 : 0); ctx.beginPath(); ctx.moveTo(-6 + k * 6, -9); ctx.lineTo(-9 + k * 6 + a, 0); ctx.stroke(); }
  // 몸 (배·가슴·머리)
  ctx.fillStyle = "#e8a33d"; ctx.strokeStyle = "#3b2414"; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(-10, -15, 9, 7.5, -.2, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -14, 5, 4.5, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(9, -20, 6.5, 0, 7); ctx.fill(); ctx.stroke();
  // 눈·더듬이·넥타이(개미 직장인)
  ctx.fillStyle = "#1b1b1b"; ctx.beginPath(); ctx.arc(11.5, -21.5, 1.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(9, -26); ctx.quadraticCurveTo(12, -34, 17, -33); ctx.stroke(); ctx.beginPath(); ctx.moveTo(7, -26); ctx.quadraticCurveTo(7, -35, 3, -36); ctx.stroke();
  ctx.fillStyle = "#4d9dff"; ctx.beginPath(); ctx.moveTo(4, -15); ctx.lineTo(7, -13); ctx.lineTo(5, -7); ctx.lineTo(3, -13); ctx.fill();
  ctx.restore();
}

// ───────── 루프 ─────────
function loop(t) {
  const dtReal = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  const dt = dtReal * (mode === "dying" ? fx.slow : 1);
  if (mode === "run") {
    acc += dt;
    while (acc >= DT) {
      acc -= DT; mem.tick = (mem.tick || 0) + 1;
      let j = jumpQ; jumpQ = false;
      if (auto) { j = botDecide(st, mem); if (st.t > 40) { cashOut(); break; } }
      step(st, j, onEvent);
      if (mode !== "run") break;
    }
    const L = lev(st);
    if (L > lastLev) { lastLev = L; SFX.lev(L); fx.edge = .9; const el = $("lev"); el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 160); popText("x" + L + "!", "#ffcc4d", .78, .2); }
    runPhase += dt * speed(st) / 14;
    hud();
  }
  // 손맛 갱신
  fx.parts = fx.parts.filter(p => (p.life -= dt) > 0); fx.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= p.g * dt; p.vx *= .96; });
  fx.shake *= Math.pow(.02, dt); fx.squash *= Math.pow(.001, dt); fx.edge = Math.max(0, fx.edge - dt * 1.6);
  if (fx.flash) { fx.flash.t += dtReal; if (fx.flash.t > fx.flash.dur) fx.flash = null; }
  draw(dtReal);
  requestAnimationFrame(loop);
}

// ───────── 시작 ─────────
$("news").textContent = NEWS.join("   ·   ");
resize();
const q = new URLSearchParams(location.search);
if (q.has("selftest")) {
  const rows = []; let ok = 0;
  for (let seed = 1; seed <= 20; seed++) {
    const s = newState(seed), m = { tick: 0 }; let maxL = 1;
    for (let k = 0; k < 60 / DT; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; maxL = lev(s); }
    if (!s.dead) ok++;
    rows.push(`${seed}\t${s.dead ? "FAIL(" + s.dead + ")" : "OK"}\t${s.t.toFixed(1)}초\tx${maxL}\t${pct(s.ret)}\t구멍·벽 포함 ${s.W.C.length}캔들`);
  }
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px">${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/20`;
} else if (q.has("diag")) {
  const seed = Number(q.get("diag")), s = newState(seed), m = { tick: 0 };
  for (let k = 0; k < 60 / DT; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; }
  const i = Math.floor(s.x / CW), C = s.W.C;
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest">seed ${seed} dead=${s.dead} t=${s.t.toFixed(2)} x=${s.x.toFixed(0)} y=${s.y.toFixed(0)} vy=${s.vy.toFixed(0)} jumps=${s.jumps} gnd=${s.gnd} lastG=${s.lastG} speed=${speed(s)}\n` +
    C.slice(Math.max(0, i - 12), i + 8).map((v, k) => `${i - 12 + k}${i - 12 + k === i ? "*" : " "} ${v}`).join("\n") + "</pre>");
  document.title = "DIAG";
} else if (q.has("autoplay")) {
  auto = true; startRun(Number(q.get("autoplay")) || 1);
  if (q.has("warp")) { // QA 스크린샷용: 지정 초까지 미리 진행
    const until = Number(q.get("warp")); while (st.t < until && !st.dead) { mem.tick++; step(st, botDecide(st, mem), null); }
    camY = st.y; lastLev = lev(st); runPhase = st.t * 20; hud();
    for (let i = 0; i < 6; i++) puff(st.x - 10, st.y, 3, { angle: Math.PI, spread: .8, speed: 50, life: .5, r: 4 });
  }
} else menu();
window.__g003 = { newState, step, botDecide, lev };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
