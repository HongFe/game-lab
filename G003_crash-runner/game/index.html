<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>폭락 러너</title>
<style>
/* 게임 화면 색 (캔버스·팝업용) */
:root{--bg:#0d1016;--tx:#eef1f7;--sub:#8b93a7;--up:#ff4d5e;--dn:#3d8bff;--danger:#ff3b2f;--acc:#ffcc4d;--line:#2a3142}
/* 공용 UI 키트 색 맞춤: 키트 블록이 body 안에 뒤따라 들어가므로 :root 보다 한 단계 높은 선택자로 덮는다 */
html:root{--ui-accent:#ffcc4d;--ui-on-accent:#1b1b1b;--ui-bg:#0d1016}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui-font);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;word-break:keep-all}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ── HUD: 수익률(큰 숫자) · 레버리지 칩 / 깃발 막대 · 목표 칩 / 아이템 칩 ── 글자 30·14·12 */
.hud{position:absolute;left:0;right:0;top:0;padding:0 var(--ui-s3);padding-top:env(safe-area-inset-top);pointer-events:none;display:flex;flex-direction:column;gap:var(--ui-s2)}
.ticker{height:var(--ui-s5);overflow:hidden;white-space:nowrap;font-size:var(--ui-t1);color:var(--ui-muted);margin:0 calc(-1 * var(--ui-s3));background:color-mix(in srgb,var(--ui-bg) 80%,transparent);box-shadow:inset 0 -1px 0 var(--ui-line)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite;line-height:var(--ui-s5)}
@keyframes tick{to{transform:translateX(-100%)}}
.hrow{display:flex;align-items:center;gap:var(--ui-s2)}
.hrow .ui-meter{flex:1}
#goal.reach .ui-meter>i{background:var(--ui-accent)}
#goalbar{background:var(--ui-muted)}
.ret{font-size:var(--ui-t5);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .15s,transform 120ms var(--ui-in);transform-origin:left center}
.ret-l{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.5}
#lev{transition:transform 120ms var(--ui-in)}
#lev.bump{transform:scale(1.25)}
#lev .ui-icon,#goaltx .ui-icon{color:var(--ui-text)}
#goaltx .ui-stars .ui-icon{width:var(--ui-t2);height:var(--ui-t2);color:var(--ui-accent)}
#goaltx .ui-stars .off{color:var(--ui-muted);opacity:.4}
#buffs{display:flex;flex-wrap:wrap;gap:var(--ui-s1)}
#buffs .ui-chip{position:relative;overflow:hidden;height:var(--ui-s6);padding:0 var(--ui-s2);gap:var(--ui-s1)}
#buffs .ui-chip b{position:absolute;left:0;bottom:0;height:3px;background:currentColor;transition:width .1s linear}
#buffs .ui-chip .ui-icon{color:currentColor}
#buffs .ui-chip span{color:var(--ui-text)}

/* ── 익절 버튼 (판 중 주 버튼: 엄지 자리, 84px 원) ── */
#cash{position:absolute;right:var(--ui-s3);bottom:max(var(--ui-s3),env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:0;background:var(--ui-accent);color:var(--ui-on-accent);font:700 var(--ui-t3)/1.25 var(--ui-font);box-shadow:var(--ui-shadow1),inset 0 -4px 0 rgba(0,0,0,.18);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;transition:transform 90ms var(--ui-in),background .2s}
#cash small{display:block;font-size:var(--ui-t1);font-weight:400;font-variant-numeric:tabular-nums}
#cash:active{transform:scale(.94)}
#cash:disabled{filter:grayscale(.8) brightness(.6)}
#cash.pre{background:var(--ui-surface2);color:var(--ui-text);box-shadow:var(--ui-shadow1)}
#cash.pre small{color:var(--ui-muted)}
#cash.go{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:var(--ui-shadow1),0 0 30px 8px rgba(255,204,77,.75)}}

/* ── 첫 안내 한 줄 · 토스트 · 용어 카드 ── */
.tip{position:absolute;left:var(--ui-s4);bottom:max(var(--ui-s5),env(safe-area-inset-bottom));font-size:var(--ui-t1);color:var(--ui-muted);pointer-events:none;display:flex;align-items:center;gap:var(--ui-s1);transition:opacity .2s}
.sw{display:inline-block;width:var(--ui-s3);height:var(--ui-s3);border-radius:2px;vertical-align:-1px}
.sw.u{background:var(--up)}.sw.d{background:var(--dn)}.sw.h{background:transparent;box-shadow:inset 0 -3px 0 var(--danger)}
.toast{position:absolute;left:50%;top:27%;transform:translate(-50%,0);background:var(--ui-text);color:var(--ui-bg);border-radius:var(--ui-r1);padding:var(--ui-s2) var(--ui-s3);font:700 var(--ui-t2)/1.25 var(--ui-font);white-space:nowrap;pointer-events:none;animation:toast 2.4s var(--ui-in) forwards;max-width:94%;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--ui-shadow2)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
#card{position:absolute;left:var(--ui-s3);right:calc(84px + var(--ui-s5));bottom:max(var(--ui-s3),env(safe-area-inset-bottom));transform:translateY(8px);opacity:0;transition:opacity 195ms var(--ui-out),transform 195ms var(--ui-out);pointer-events:none;padding:var(--ui-s3)}
#card.on{opacity:1;transform:none;transition:opacity 225ms var(--ui-in),transform 225ms var(--ui-in)}
#card .ui-em{width:var(--ui-s6);height:var(--ui-s6);font-size:var(--ui-t5)}
#card .n{font-weight:700;font-size:var(--ui-t3);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
#card .n .ui-icon{color:var(--ui-muted)}
#card .f{font-size:var(--ui-t2);line-height:1.5;color:var(--ui-muted);margin-top:2px}
#card .ui-badge{background:var(--ui-surface2);color:var(--ui-text)}

/* ── 겹 화면 (시작·결과·상점·도감): 공용 키트 ui-screen 안의 한 기둥 ── */
#ov:not(.on){display:none}
#ov{padding-left:var(--ui-s4);padding-right:var(--ui-s4);justify-content:flex-start} /* 위쪽 잘림 없이 스크롤: 가운데 맞춤은 #box 의 auto 여백으로 */
#box{margin:auto 0}
.g-tag{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}
.g-line{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0;display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.g-line b{color:var(--ui-text)}
.g-line .ui-icon{color:var(--ui-muted)}
.g-up{color:var(--up)}.g-dn{color:var(--dn)}
.g-strike{text-decoration:line-through;text-decoration-thickness:3px;color:var(--ui-muted)}
#box .ui-btn.icon{position:relative}
.g-dot{position:absolute;top:0;right:0;transform:translate(25%,-25%)}
.g-head{display:flex;align-items:center;gap:var(--ui-s2)}
.g-head .ui-chip{box-shadow:none;background:var(--ui-surface2)}
.g-head .ui-chip .ui-icon{color:var(--ui-text)}
/* 단계 칸: 강조색은 주 버튼에만 → 지금 단계는 흰 테두리 */
#box .ui-level.cur{background:var(--ui-surface2);color:var(--ui-text);box-shadow:inset 0 0 0 2px var(--ui-text)}
#box .ui-level.cur .ui-stars{color:var(--ui-accent)}
#box .ui-level.cur .ui-stars .off,#box .ui-level .ui-stars .off{color:var(--ui-muted);opacity:.35}
#box .ui-level.lock .ui-icon{width:var(--ui-t4);height:var(--ui-t4)}
/* 결과: 금액 한 줄 카드 */
.g-acct{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);font-variant-numeric:tabular-nums;width:100%}
.g-acct .ui-icon{color:var(--ui-muted)}
.g-acct span{color:var(--ui-muted)}
.g-acct span{margin-right:auto}
.g-next{display:flex;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);line-height:1.5;width:100%;text-align:left}
.g-next .ui-cap{font-size:var(--ui-t3)}
/* 상점 줄 · 도감 줄 */
.g-item{display:flex;align-items:center;gap:var(--ui-s3);padding:var(--ui-s3);text-align:left}
.g-item .ui-em{width:var(--ui-s6);height:var(--ui-s6);font-size:var(--ui-t4)}
.g-txt{flex:1;min-width:0}
.g-txt b{font-size:var(--ui-t3);line-height:1.5;display:flex;align-items:center;gap:var(--ui-s2)}
.g-txt p{font-size:var(--ui-t2);line-height:1.5;color:var(--ui-muted);margin:0}
.g-pips{display:inline-flex;gap:2px}
.g-pips i{width:var(--ui-s3);height:var(--ui-s1);border-radius:2px;background:var(--ui-muted);opacity:.35}
.g-pips i.on{background:var(--ui-text);opacity:1}
.g-item .ui-btn{padding:0 var(--ui-s3);min-width:72px;font-variant-numeric:tabular-nums}
.g-item.no{box-shadow:none;background:transparent;outline:1px dashed var(--ui-line);outline-offset:-1px}
.g-item.no .ui-em{color:var(--ui-muted)}
.g-sec{font-size:var(--ui-t2);font-weight:700;color:var(--ui-muted);margin:var(--ui-s2) 0 0;text-align:left}
.g-stick{position:sticky;bottom:0;padding-top:var(--ui-s2);background:linear-gradient(transparent,color-mix(in srgb,var(--ui-bg) 92%,transparent) 40%)}
.g-stick .ui-btn{width:100%}
.g-ic{width:20px;height:20px;display:inline-grid;place-items:center;flex:none} /* 아이콘 칸과 같은 크기 */
.sw.ud{width:var(--ui-s4);height:var(--ui-s4);border-radius:var(--ui-s1);background:linear-gradient(90deg,var(--up) 50%,var(--dn) 50%)}
.g-rules li{color:var(--ui-text)}

/* ── 게임 화면 연출 (그대로) ── */
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);border:5px solid var(--danger);color:var(--danger);font:900 34px var(--ui-font);padding:4px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s;white-space:nowrap}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.pop{position:absolute;font:900 26px ui-monospace,Menlo,monospace;pointer-events:none;animation:popup .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap}
.pop.s{font:900 16px -apple-system,sans-serif}
.pop.l{font:900 30px -apple-system,sans-serif;animation-duration:1.2s}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}

/* ── 보상형 광고 · 코인 (파일럿, 2026-11-27) ── */
.g-coin .ui-icon{color:var(--ui-accent)}
.g-top{display:flex;justify-content:flex-end;width:100%}
#adCont{width:100%}
#adCont .ui-icon{color:var(--ui-accent)}
.g-slow{min-height:48px}
.g-slow .ui-icon{color:var(--ui-muted);flex:none}
.g-slow .ui-val{display:inline-flex;align-items:center;gap:var(--ui-s1)}
.g-slow .ui-val .ui-icon{color:var(--ui-accent)}
.g-slow[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ui-text)}
.g-slow[aria-pressed="true"]>.ui-icon{color:var(--ui-text)}
.g-slow:disabled{opacity:.38;pointer-events:none}
.g-flags{gap:var(--ui-s1)}
.g-flags .ui-badge{display:inline-flex;gap:var(--ui-s1);height:24px}
.g-flags .ui-badge .ui-icon{width:14px;height:14px;color:var(--ui-muted)}
</style>

<script data-shared="coin-system.js">
/* NHC game-lab 코인 시스템 v1 (2026-11-27) — 인앱 코인(현금화 없음, 이 브라우저에만 저장)
   - 저장: localStorage "gl_coins" = {n: 잔액, t: 저장 시각, c: 체크섬}. 오락실과 게임(iframe)이 같은 출처라 잔액을 같이 쓴다
   - 최대 보유 500. 체크섬이 안 맞으면(직접 고침) 0으로 리셋
   - 한계(정직하게): 브라우저 안 검증이라 코드를 읽은 사람은 우회할 수 있다. '그냥 숫자 바꾸기'를 막는 수준. 코인에 실제 가치가 생기면 서버 장부(Supabase)로 옮긴다
   쓰는 법: CoinSystem.getCoins() / addCoins(n) → 새 잔액 / spendCoins(n) → true|false
   바뀔 때마다 window 에 "gl-coins" 이벤트(detail=잔액). 다른 창(오락실↔게임)은 "storage" 이벤트로 알 수 있다 */
(function () {
  if (window.CoinSystem) return;
  var KEY = "gl_coins", MAX = 500, SALT = "nhc-game-lab|coins|v1";
  function sum(n, t) {   // FNV-1a 32bit 두 번 — 위조 방지가 아니라 손 편집 감지용
    var s = SALT + "|" + n + "|" + t + "|" + SALT.length, h = 2166136261, g = 5381;
    for (var i = 0; i < s.length; i++) { var ch = s.charCodeAt(i); h ^= ch; h = Math.imul(h, 16777619); g = (Math.imul(g, 33) + ch) | 0; }
    return (h >>> 0).toString(36) + "." + (g >>> 0).toString(36);
  }
  function write(n) {
    var t = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify({ n: n, t: t, c: sum(n, t) })); } catch (e) {}
    try { window.dispatchEvent(new CustomEvent("gl-coins", { detail: n })); } catch (e) {}
    return n;
  }
  function read() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return 0; }
    if (raw === null) return 0;
    try {
      var o = JSON.parse(raw);
      if (!o || typeof o.n !== "number" || typeof o.t !== "number" || o.n !== Math.floor(o.n) || o.n < 0 || o.n > MAX || o.c !== sum(o.n, o.t)) return write(0);
      return o.n;
    } catch (e) { return write(0); }
  }
  window.CoinSystem = {
    MAX: MAX,
    getCoins: read,
    addCoins: function (n) { n = Math.floor(+n || 0); if (n <= 0) return read(); return write(Math.min(MAX, read() + n)); },
    spendCoins: function (n) { n = Math.floor(+n || 0); var v = read(); if (n <= 0 || v < n) return false; write(v - n); return true; },
  };
})();
</script>
<script data-shared="rewarded-ad.js">
/* NHC game-lab 보상형 광고 모듈 v1.1 (2026-11-27) — 어댑터 방식
   - 기본 어댑터 "stub": 회색 박스 + 카운트다운(외부 스크립트 없음 — game-lab 오프라인 규칙 그대로). 개발·플레이테스트용
   - 플랫폼 출시 빌드에서만 그 플랫폼 SDK <script> 1줄과 window.NHC_AD_ADAPTER = "crazygames" | "poki" 를 이 모듈보다 앞에 넣는다
     (게임 본체 game/index.html 은 바꾸지 않는다. 출시용 사본은 build/<플랫폼>/ 에 따로 만든다)
   - SDK가 없거나 실패하면 보상 없이 onSkipped({reason:"unavailable"|"error"}) — 게임은 그대로 진행(우아한 실패). 출시 빌드에서 stub으로 몰래 보상하지 않는다
   - 한도(하루 5회)·쿨다운(60초)·코인 지급은 어댑터와 무관하게 이 모듈이 판정. 완료 여부는 stub은 두 시계, 실제 SDK는 SDK 콜백이 판정
   - 실제 SDK 함수 이름은 출시 직전에 각 플랫폼 최신 문서로 다시 확인할 것(아래 어댑터는 2026-11 기준 알려진 형태)

   쓰는 법 (coin-system.js 가 먼저 있어야 코인이 들어간다):
     RewardedAd.show({ coins: 5, onComplete: function (coins) {}, onSkipped: function (info) {} })
       → 끝까지 보고 '광고 종료'를 누르면 coins 지급 후 onComplete(coins)
       → 창 전환·ESC·한도 초과·쿨다운 중이면 지급 없이 onSkipped({reason}) — reason: "hidden" | "esc" | "limit" | "cooldown" | "busy" | "unavailable" | "error" | "skipped"
     RewardedAd.status() → { left: 오늘 남은 횟수, cooldown: 남은 쿨다운 초, canShow: bool, label: 버튼에 쓸 짧은 글 }

   규칙: 하루 5회(자정에 리셋), 직전 광고 완료 후 60초 쿨다운, 기본 15초
   스킵 방지: 닫기 버튼은 끝나기 전 비활성 / visibilitychange(hidden)·ESC 감지 시 즉시 실패
   시간 검증: 진행은 setInterval 횟수가 아니라 Date.now() 와 performance.now() 두 시계의 실제 경과로만 판정(둘 다 기준을 넘어야 완료)
   한계: 브라우저 안 판정이라 개발자 도구로 우회할 수 있다. 코인에 실제 가치가 생기면 광고 SDK의 서버 검증 콜백(SSV)으로 옮긴다 */
(function () {
  if (window.RewardedAd) return;
  var KEY = "gl_ad", PER_DAY = 5, COOLDOWN = 60, DURATION = 15;
  var busy = false;
  function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function load() {
    var o = null; try { o = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (!o || o.day !== today()) o = { day: today(), count: 0, last: (o && o.last) || 0 };
    return o;
  }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function status() {
    var o = load(), left = Math.max(0, PER_DAY - o.count);
    var cd = Math.max(0, Math.ceil(COOLDOWN - (Date.now() - (o.last || 0)) / 1000));
    if (o.last > Date.now()) cd = COOLDOWN;   // 시계를 뒤로 돌린 경우
    var av = adapter().a;
    return { left: left, cooldown: cd, canShow: !!av && left > 0 && cd === 0 && !busy, label: !av ? "광고 준비 안 됨" : left <= 0 ? "오늘 광고 한도 초과" : cd > 0 ? cd + "초 뒤 다시" : busy ? "광고 중" : "광고 보기" };
  }

  var CSS = ".gl-ad{position:fixed;inset:0;z-index:2147483000;background:#0b0d12;color:#f2f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;font:400 14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;animation:gl-ad-in 200ms cubic-bezier(0,0,.2,1)}" +
    "@keyframes gl-ad-in{from{opacity:0}}" +
    ".gl-ad-top{position:absolute;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9aa3b2}" +

<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;

  /* 반경 3단계 */

  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);

  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

.ui-num{font-variant-numeric:tabular-nums}

.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}

.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}

.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}

.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}

.ui-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:var(--ui-s2);align-items:center;padding:var(--ui-s3);padding-top:max(var(--ui-s3),env(safe-area-inset-top));pointer-events:none}

.ui-chip .ui-icon{width:16px;height:16px;color:var(--ui-muted)}

.ui-dock{position:sticky;bottom:0;padding-top:var(--ui-s3);background:linear-gradient(to bottom,transparent,var(--ui-bg) 40%)}
.ui-pips{display:inline-flex;gap:3px}.ui-pips>i{width:14px;height:6px;border-radius:999px;background:var(--ui-line)}.ui-pips>i.on{background:var(--ui-text)}
.ui-strike{text-decoration:line-through;text-decoration-thickness:3px;opacity:.6}
.ui-good{color:var(--ui-good)}.ui-bad{color:var(--ui-bad)}

/* 칩 보조 숫자(값/한도) · 첫 판 손짓 (v1.2) */
.ui-chip small{font-weight:400;color:var(--ui-muted);margin-left:-4px}
.ui-hand{position:absolute;z-index:40;width:44px;height:44px;margin:-6px 0 0 -14px;pointer-events:none;font-size:36px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));transition:left 600ms var(--ui-in),top 600ms var(--ui-in),opacity 150ms linear}
.ui-hand.tap{animation:ui-tap 900ms var(--ui-in) infinite}
@keyframes ui-tap{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(6px) scale(.9)}}
@media (prefers-reduced-motion:reduce){.ui-hand,.ui-hand.tap{animation:none;transition:opacity 150ms linear}}

/* v1.3 (G012 반영): 숨김, 줄 오른쪽 값, 작은 안내, 배지 색 */
.ui-screen[hidden],.ui-sheet[hidden],.ui-tip[hidden],.ui-screen.hide,.ui-screen.off{display:none}
.ui-item>.ui-val{font:700 var(--ui-t3)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.ui-tip.sm{font-size:var(--ui-t2);padding:var(--ui-s2) var(--ui-s3);gap:var(--ui-s2)}
.ui-tip.sm b{font-weight:700}
.ui-badge.good{background:var(--ui-good)}
.ui-badge.muted{background:var(--ui-surface2);color:var(--ui-muted)}

/* v1.4 (G021·G022 반영) */
.ui-light .ui-screen.dim{background:rgba(20,28,40,.45)}
.ui-levels.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.ui-btn.float{background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
.ui-chip .ui-stars .ui-icon{color:inherit}
.ui-chip .ui-stars .off{color:var(--ui-line)}

/* v1.5 (G002·G006 반영) */
[hidden].ui-badge,[hidden].ui-chip,[hidden].ui-btn,[hidden].ui-item,[hidden].ui-line{display:none}
button.ui-item{appearance:none;border:0;width:100%;text-align:left;color:var(--ui-text);font-family:var(--ui-font);cursor:pointer;transition:transform 90ms var(--ui-in)}
button.ui-item:active{transform:scale(.98)}
.ui-pips>i.bad{background:var(--ui-bad)}.ui-pips>i.good{background:var(--ui-good)}
.ui-hud.static{position:static;padding:0}

    const ok = dead === 0 && rate >= .6; total++; if (ok) pass++;
    out.push(`${c.n}단계 ${c.name.padEnd(6)}\t${ok ? "OK" : "FAIL"}\t통과 ${okB}/20 (${Math.round(rate * 100)}%)\t청산 ${dead}\t통과 시각 중앙 ${times.length ? times[times.length >> 1].toFixed(0) + "초" : "-"}\t수익 중앙 ${pct(rets[10])}\t★1/2/3 ${stars[1]}/${stars[2]}/${stars[3]}\t목표 ${pct(c.need)}\t깃발 시 수익 최소/중앙 ${gr.sort((a, b) => a - b).length ? pct(gr[0]) + "/" + pct(gr[gr.length >> 1]) : "-"} ${deadAt.join(" ")}`);
  }
  out.push("  곡선(8초 안 통과): " + rates.map(r => Math.round(r * 100) + "%").join(" → "), "  곡선(깃발 닿는 순간 이미 목표 이상): " + instant.map(r => Math.round(r * 100) + "%").join(" → "));
  // C. 피할 수 없는 배치: 몹마다 레버리지 x1·x10 속도, 곰은 위치 7가지로 시작해 지나갈 방법이 있는지 전수 탐색
  out.push("", "[C] 피할 수 없는 배치 (몹 구간마다 점프 시점 전수 탐색)");
  let checks = 0; const bad = [];
  worldsA.forEach((s, k) => { const r = fairness(s.W, s.x + 600, 0); checks += r.n; r.bad.forEach(b => bad.push(`A${k + 1}:${b}`)); });
  for (const c of STAGES) for (let seed = 1; seed <= 4; seed++) { const s = newState(seed, c); s.W.ensure((c.goal + 140) * CW); const r = fairness(s.W, (c.goal + 140) * CW, 0); checks += r.n; r.bad.forEach(b => bad.push(`S${c.n}-${seed}:${b}`)); }
  out.push(`  검사 ${checks}건 · 피할 수 없음 ${bad.length}건 ${bad.slice(0, 8).join(" ")}`);
  total++; if (!bad.length) pass++;
  // D. 손절매 구조: 구멍마다 빠진 상태에서 안전한 곳으로 옮겨지고 0.3초 버티는지
  let resc = 0, rescOk = 0;
  for (let seed = 1; seed <= 10; seed++) { const W = makeWorld(seed, ENDLESS); W.ensure(400 * CW);
    for (let i = 20; i < 380; i++) if (W.C[i] === null && W.C[i - 1] !== null && W.cat[i - 1] === undefined) { resc++; const s = blankState(W, 0); s.x = (i + .5) * CW; s.lastG = W.C[i - 1]; s.y = s.lastG - 150; s.vy = -300; s.gnd = false; s.lastIdx = i; s.buffs.stop = 5;
      step(s, false); if (!s.dead && s.buffs.stop === 0) { s.strict = true; let ok = true; for (let k = 0; k < .3 / DT; k++) { step(s, false); if (s.dead) { ok = false; break; } } if (ok) rescOk++; } } }
  out.push("", `[D] 손절매 구조 ${rescOk}/${resc}`); total++; if (resc && rescOk === resc) pass++;
  // E. 사람 근사 봇: 휴대폰 375×760 시야(카메라 줌 포함) + 반응 0.4초. 시드 301~320
  out.push("", "[E] 사람 근사 봇 (휴대폰 375×760 시야, 반응 0.4초, 탭 오차 15ms, 단계는 시드 301~340, 무한은 301~320)");
  const HO = { R: .4, W: 375, H: 760 };
  let e72 = 0; for (let seed = 301; seed <= 320; seed++) { const r = humanRun(seed, ENDLESS, { ...HO, after: 0, tmax: 72 }); if (!r.dead) e72++; }
  const okE = e72 >= 10; total++; if (okE) pass++;
  out.push(`  무한 장 72초(x10) 생존 ${e72}/20 (${Math.round(e72 / .2)}%) ${okE ? "OK" : "FAIL"} — 기준 50% 이상`);
  const base3 = [], base40 = [];
  for (const c of STAGES) {
    let p1 = 0, p2 = 0, p3 = 0, dead = 0; const tg = [];
    const b20 = []; for (let seed = 301; seed <= 340; seed++) { const r = humanRun(seed, c, { ...HO, after: 40, tmax: 160 }); if (seed <= 320) b20.push(r.T[3] !== null); if (r.T[1] !== null) p1++; if (r.T[2] !== null) p2++; if (r.T[3] !== null) p3++; if (r.dead && r.goalT === null) dead++; if (r.T[3] !== null) tg.push(r.T[3] - r.goalT); }
    tg.sort((a, b) => a - b); base3.push(b20.filter(Boolean).length); base40.push([p1, p3]); const ok = p1 >= 28 && p3 >= 6 && p3 <= 18; total++; if (ok) pass++;
    out.push(`  ${c.n}단계 ${ok ? "OK" : "FAIL"}\t통과 ${p1}/40\t깃발 전 청산 ${dead}\t★2 ${p2}/40\t★3 ${p3}/40 (${Math.round(p3 * 2.5)}%, 깃발 뒤 ${tg.length ? tg[tg.length >> 1].toFixed(0) + "초" : "-"})\t★ 배수 ×${starMult(c)[2]}·×${starMult(c)[3]} — 기준: 통과 70%+, ★3 15~45%`);
  }
  // F. 상점 최대 강화(버팀 +2, 아이템 +45%, 손절매 기본·비용 35%, 2단 점프 +6%)가 난이도를 무너뜨리지 않는가
  out.push("", "[F] 상점 최대 강화 vs 강화 없음 (같은 사람 근사 봇·시드) — 기준: 단계마다 ★3 증가 5판(25%p) 이하, ★3 60% 이하");
  let okF = true; const MAXUP = { grip: 2, dur: 3, stop: 2, jump: 2 };
  STAGES.forEach((c, k) => { let p1 = 0, p3 = 0; for (let seed = 301; seed <= 320; seed++) { const r = humanRun(seed, c, { ...HO, after: 40, tmax: 160, up: MAXUP }); if (r.T[1] !== null) p1++; if (r.T[3] !== null) p3++; }
    const ok = p3 - base3[k] <= 5 && p3 <= 12; if (!ok) okF = false; out.push(`  ${c.n}단계 ${ok ? "OK" : "FAIL"}\t통과 ${p1}/20\t★3 ${base3[k]} → ${p3}/20 (${p3 - base3[k] >= 0 ? "+" : ""}${(p3 - base3[k]) * 5}%p)`); });
  total++; if (okF) pass++;
  // H. 코인 소비 '느린 하락 1회'(파란 캔들 손실 ×SLOW_MUL)가 작은 도움에 그치는가 — 같은 사람 근사 봇·시드 301~340
  out.push("", `[H] 느린 하락(파란 캔들 손실 ×${SLOW_MUL}) vs 없음 (사람 근사 봇 시드 301~340) — 기준: 단계마다 ★3 증가 10%p(4판) 이하`);
  let okH = true, dH = 0;
  STAGES.forEach((c, k) => { let p1 = 0, p3 = 0; for (let seed = 301; seed <= 340; seed++) { const r = humanRun(seed, c, { ...HO, after: 40, tmax: 160, up: { slow: 1 } }); if (r.T[1] !== null) p1++; if (r.T[3] !== null) p3++; }
    const d = p3 - base40[k][1], ok = d <= 4; dH += d; if (!ok) okH = false;
    out.push(`  ${c.n}단계 ${ok ? "OK" : "FAIL"}\t통과 ${base40[k][0]} → ${p1}/40\t★3 ${base40[k][1]} → ${p3}/40 (${d >= 0 ? "+" : ""}${(d * 2.5).toFixed(1)}%p)`); });
  out.push(`  6단계 합계 ★3 ${dH >= 0 ? "+" : ""}${dH}판`);
  total++; if (okH) pass++;
  // G. FOMC 인상 구간을 점프 없이 그냥 지나가면 손해(기대값 음수)여야 익절 판단이 생긴다. 블랙스완 계단도 그냥 걸으면 손해
  out.push("", "[G] 이벤트 구간을 점프 없이 걸어서 지날 때 손익 (무한 장 시드 1~40, 레버리지 x1·x5·x10)");
  const ev = { hawk: [], dove: [], swan: [] };
  for (let seed = 1; seed <= 40; seed++) { const W = makeWorld(seed, ENDLESS); W.ensure(1400 * CW);
    for (const z of W.zones.filter(z => z.t === "fomc" || z.t === "swan")) for (const t of [0, 32, 72]) {
      const s = blankState(W, 0); s.x = z.i0 * CW + CW / 2; s.y = W.C[z.i0]; s.lastG = s.y; s.lastIdx = z.i0; s.t = t; s.strict = true; const r0 = s.ret;
      for (let k = 0; k < 3000 && s.x < (z.i1 + 1) * CW - 12 && !s.dead; k++) step(s, false);
      if (!s.dead) ev[z.t === "swan" ? "swan" : z.dove ? "dove" : "hawk"].push((s.ret - r0) / lev(s)); } }
  const avg = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
  const okG = ev.hawk.length > 5 && avg(ev.hawk) < 0 && ev.hawk.filter(d => d < 0).length / ev.hawk.length >= .9 && avg(ev.swan) < 0; total++; if (okG) pass++;
  out.push(`  ${okG ? "OK" : "FAIL"}\t인상: 평균 ${(avg(ev.hawk) * 100).toFixed(1)}%p×레버리지 (손해 ${ev.hawk.filter(d => d < 0).length}/${ev.hawk.length})\t동결: 평균 +${(avg(ev.dove) * 100).toFixed(1)}%p×레버리지\t블랙스완: 평균 ${(avg(ev.swan) * 100).toFixed(1)}%p×레버리지 (${ev.swan.length}건) — 기준: 인상·블랙스완 평균 음수, 인상 90% 이상 손해`);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;font-size:11px;overflow:auto;white-space:pre-wrap">${out.join("\n")}</pre>`);
  document.title = `SELFTEST ${pass}/${total}`;
}


// ───────── 시작 ─────────
$("news").textContent = NEWS.join("   ·   ");
resize();
const q = new URLSearchParams(location.search);
if (q.has("selftest")) selftest();
else if (q.has("diag")) {
  const seed = Number(q.get("diag")), c = q.has("stage") ? STAGES[Number(q.get("stage")) - 1] : ENDLESS, s = newState(seed, c), m = { tick: 0 }; s.strict = true;
  for (let k = 0; k < 60 / DT; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; }
  const i = Math.floor(s.x / CW), C = s.W.C;
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest">seed ${seed} dead=${s.dead} t=${s.t.toFixed(2)} x=${s.x.toFixed(0)} y=${s.y.toFixed(0)} vy=${s.vy.toFixed(0)} jumps=${s.jumps} gnd=${s.gnd} lastG=${s.lastG} speed=${speed(s)}\n` +
    C.slice(Math.max(0, i - 12), i + 8).map((v, k) => `${i - 12 + k}${i - 12 + k === i ? "*" : " "} ${v} ${(s.W.bk[i - 12 + k] || []).map(o => o.t).join(",")}`).join("\n") + "</pre>");
  document.title = "DIAG";
} else if (q.has("autoplay")) {
  auto = true; startRun(Number(q.get("stage")) || 7, Number(q.get("autoplay")) || 1);
  if (q.has("warp") || q.has("near")) { // QA 스크린샷용: 지정 초까지(또는 지정 몹·아이템·이벤트 바로 앞까지) 미리 진행
    let until = Number(q.get("warp")) || 0, nearX = 0;
    if (q.has("near")) { const k = q.get("near"), off = Number(q.get("off") || 230); st.W.ensure(9000 * CW); const o = st.W.mobs.find(m => m.t === k) || st.W.items.find(m => m.t === "pw" && m.p === k) || st.W.zones.find(z => z.t === k); if (o) nearX = (o.x ?? o.xa ?? o.i0 * CW) - off; }
    while ((st.t < until || st.x < nearX) && !st.dead) { mem.tick++; step(st, botDecide(st, mem), null); }
    camY = st.y; lastLev = lev(st); runPhase = st.t * 20; hud(true);
    const W = st.W; while (introPtr < W.intro.length && W.intro[introPtr].x < st.x - 200) introPtr++; while (zonePtr < W.zones.length && st.x >= W.zones[zonePtr].i0 * CW) zonePtr++;
  }
  if (q.has("buff")) { st.buffs[q.get("buff")] = 3; }
} else menu();
window.__g003 = { newState, step, botDecide, lev, STAGES, ENDLESS, startRun, get st() { return st; }, meet, showDex, cashOut, startEvolve, result, fx };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
