<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>폭락 러너</title>
<style>
:root{--bg:#0d1016;--tx:#eef1f7;--sub:#8b93a7;--up:#ff4d5e;--dn:#3d8bff;--danger:#ff3b2f;--acc:#ffcc4d;--panel:rgba(22,26,36,.86);--line:#2a3142}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.ticker{height:22px;overflow:hidden;white-space:nowrap;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);margin:0 -12px 6px;background:rgba(13,16,22,.7)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 28s linear infinite;line-height:22px}
@keyframes tick{to{transform:translateX(-100%)}}
.goal{position:relative;height:16px;border-radius:8px;background:rgba(22,26,36,.9);border:1px solid var(--line);margin-bottom:6px;overflow:hidden;font:800 10.5px/14px -apple-system,sans-serif;color:#cfd5e3;text-align:center}
.goal i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3a4a6b,#5d7bb5);transition:width .2s}
.goal.reach i{background:linear-gradient(90deg,#b8860b,#ffcc4d)}
.goal span{position:relative}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ret{font:800 32px/1 ui-monospace,Menlo,monospace;letter-spacing:-1px;transition:color .15s,transform .12s;transform-origin:left center}
.ret small{display:block;font:600 11px -apple-system,sans-serif;color:var(--sub);letter-spacing:0;margin-top:4px}
.lev{font:900 22px ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;min-width:66px;transition:transform .12s}
.lev small{display:block;font:600 10px -apple-system,sans-serif;color:var(--sub)}
.lev.pop{transform:scale(1.25)}
.acct{font-size:12px;color:var(--sub);margin-top:5px} .acct b{color:var(--tx)}
#buffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:0}
.chip{position:relative;height:24px;border-radius:8px;background:rgba(22,26,36,.92);border:1px solid var(--line);font:800 12px/22px -apple-system,sans-serif;padding:0 7px 0 5px;overflow:hidden;white-space:nowrap}
.chip b{position:absolute;left:0;bottom:0;height:3px;background:currentColor;transition:width .1s linear}
.chip span{color:var(--tx)}
#cash{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe28a,#ffb300 60%,#c98500);color:#2a1d00;font:900 17px -apple-system,sans-serif;box-shadow:0 6px 0 #8a5c00,0 10px 24px rgba(0,0,0,.45);display:none;touch-action:none;line-height:1.15}
#cash small{display:block;font-size:11px;font-weight:700}
#cash:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5c00}
#cash:disabled{filter:grayscale(.8) brightness(.6)}
#cash.pre{background:radial-gradient(circle at 35% 30%,#cfd5e3,#8b93a7 60%,#5d6578);box-shadow:0 6px 0 #3a4152,0 10px 24px rgba(0,0,0,.45)}
#cash.go{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #8a5c00,0 0 30px 8px rgba(255,204,77,.75)}}
.tip{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:12px;color:var(--sub);pointer-events:none;max-width:calc(100% - 130px)}
#card{position:absolute;left:50%;top:calc(168px + env(safe-area-inset-top));transform:translate(-50%,-8px);width:min(340px,92%);background:rgba(18,22,32,.95);border:1px solid #3a4358;border-radius:14px;padding:8px 12px 9px 54px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#card.on{opacity:1;transform:translate(-50%,0)}
#card .e{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:30px}
#card .n{font-weight:900;font-size:15px}
#card .nw{color:#1b1b1b;background:var(--acc);font-size:10px;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
#card .m{font-size:12px;color:var(--sub);margin-top:1px}
#card .f{font-size:12.5px;color:#fff;margin-top:2px;font-weight:600}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.72);padding:16px}
.ov.on{display:flex}
.box{background:#161a24;border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;width:min(370px,100%);max-height:calc(100% - 8px);overflow-y:auto;text-align:center;-webkit-overflow-scrolling:touch}
.box h1{margin:0;font-size:27px;letter-spacing:-.5px} .box h2{margin:0;font-size:24px} .box h3{margin:12px 0 6px;font-size:13px;color:var(--acc);text-align:left}
.box p{color:var(--sub);font-size:13.5px;line-height:1.55;margin:7px 0}
.box .big{font:900 38px ui-monospace,Menlo,monospace;margin:6px 0}
.box .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;text-align:left}
.box .grid div{background:#10131b;border-radius:10px;padding:7px 9px;font-size:11.5px;color:var(--sub)}
.box .grid b{display:block;font:800 15px ui-monospace,Menlo,monospace;color:var(--tx)}
.box ul{text-align:left;font-size:13px;color:#cfd5e3;padding-left:18px;margin:8px 0;line-height:1.65}
.btn{width:100%;min-height:46px;border:0;border-radius:12px;padding:12px;font:800 16px -apple-system,sans-serif;background:var(--acc);color:#1b1b1b;margin-top:8px;cursor:pointer}
.btn.ghost{background:#232a3a;color:var(--tx)}
.btn:active{transform:translateY(2px)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stg{min-height:64px;border:1px solid var(--line);border-radius:12px;background:#10131b;color:var(--tx);font:800 13px -apple-system,sans-serif;padding:6px 4px;cursor:pointer}
.stg small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;margin-top:2px}
.stg .st{color:var(--acc);font-size:11px;letter-spacing:1px}
.stg.lock{opacity:.4;cursor:default}
.stg.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.title{display:inline-block;background:#232a3a;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--acc);font-weight:800}
.disc{font-size:10.5px;color:#5d6578;margin-top:10px}
.stars{font-size:30px;letter-spacing:4px;color:var(--acc);margin:4px 0}
.stars .off{color:#3a4152}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.dex div{background:#10131b;border-radius:10px;padding:7px 8px;font-size:11px;color:var(--sub);line-height:1.4}
.dex div b{display:block;color:var(--tx);font-size:13px;margin-bottom:2px}
.dex div.no{opacity:.45}
.dex div i{font-style:normal;color:#cfd5e3}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);border:5px solid var(--danger);color:var(--danger);font:900 34px -apple-system,sans-serif;padding:4px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s;white-space:nowrap}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.pop{position:absolute;font:900 26px ui-monospace,Menlo,monospace;pointer-events:none;animation:popup .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap}
.pop.s{font:900 16px -apple-system,sans-serif}
.pop.l{font:900 30px -apple-system,sans-serif;animation-duration:1.2s}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="ticker"><span id="news"></span></div>
    <div class="goal" id="goal"><i id="goalbar"></i><span id="goaltx"></span></div>
    <div class="row">
      <div><div class="ret" id="ret">+0.0%<small>이번 판 수익률</small></div><div class="acct">계좌 <b id="acct">1,000,000원</b> · <span id="ttl"></span></div></div>
      <div class="lev" id="lev">x1<small>레버리지</small></div>
    </div>
    <div id="buffs"></div>
  </div>
  <div class="tip" id="tip">탭: 점프 · 🟥 밟으면 + 🟦 밟으면 −</div>
  <div id="card"></div>
  <button id="cash">💰 익절<small>수익 확정</small></button>
  <div class="stamp" id="stamp">강제 청산</div>
  <div class="ov on" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
// ───────── 상수 ─────────
const CW = 28, G = 1500, JV1 = 560, JV2 = 500, STEP = 12, HALF = 9, DT = 1 / 120;
const UP = "#ff4d5e", DN = "#3d8bff";
const LEV_EVERY = 8, MAX_LEV = 10, START_GRACE = 3;
// 강화 아이템(시간 제한): 지속 시간(초)
const DUR = { up: 4, stop: 8, water: 5, cb: 3, hold: 6 };
const PCOL = { up: "#ff4d5e", stop: "#5fe0a0", water: "#4fc3ff", cb: "#ffa24d", hold: "#c39bff" };
const CB_SLOW = .55, CAT_V = 640, BULL_V = 820, STOMP_V = 480, KNIFE_LEAD = .75, FORCE_LEAD = 1.25, FORCE_V = 170, BEAR_V = 45;
const TIERS = [
  { n: "개미", e: "🐜", ab: "기본 몸. 세력에게 털리면 수익 30%를 잃는다" },
  { n: "동학개미", e: "🐜", ab: "세력 털기 1번 버팀" },
  { n: "슈퍼개미", e: "🦸", ab: "세력 털기 2번 버팀 · 곰에 부딪혀도 손실 절반" },
  { n: "큰손", e: "🕶️", ab: "세력 털기 3번 버팀 · 곰 손실 절반 · 손절매 1회 기본 장착" },
  { n: "고래", e: "🐋", ab: "세력·곰에 닿으면 날려 버림 · 손절매 1회 기본 장착" },
];
const GRIP = [0, 1, 2, 3, 99];
// 단계: goal = 목표 지점(캔들 수), need = 통과 최소 수익률, ★★ = need×2, ★★★ = need×3
const ALLM = ["bear", "knife", "cat", "rumor", "bull", "force"], ALLP = ["up", "water", "cb", "stop", "hold"];
const STAGES = [
  { n: 1, name: "첫 출근", tier: 0, goal: 170, need: .50, d0: 0, seq: ["bear", "bear", "force"], mobs: ["bear", "force"], pseq: ["up"], pws: ["up"], fomc: 1e9, swan: 1e9 },
  { n: 2, name: "칼날 장", tier: 1, goal: 230, need: .90, d0: .05, seq: ["knife", "force", "bear", "knife"], mobs: ["bear", "knife", "force"], pseq: ["water"], pws: ["up", "water"], fomc: 1e9, swan: 1e9 },
  { n: 3, name: "반등의 함정", tier: 2, goal: 290, need: 1.30, d0: .12, seq: ["cat", "knife", "cat"], mobs: ["bear", "knife", "cat", "force"], pseq: ["cb"], pws: ["up", "water", "cb"], fomc: 150, swan: 1e9 },
  { n: 4, name: "소문의 시장", tier: 3, goal: 340, need: 1.95, d0: .2, seq: ["bull", "rumor", "force"], mobs: ALLM, pseq: ["stop"], pws: ["up", "water", "cb", "stop"], fomc: 140, swan: 1e9 },
  { n: 5, name: "검은 백조", tier: 3, goal: 400, need: 2.60, d0: .28, seq: [], mobs: ALLM, pseq: ["hold"], pws: ALLP, fomc: 110, swan: 220 },
  { n: 6, name: "고래의 바다", tier: 4, goal: 460, need: 3.60, d0: .4, seq: [], mobs: ALLM, pseq: [], pws: ALLP, fomc: 100, swan: 210, gap: 24 },
];
const ENDLESS = { n: 7, name: "무한 장", tier: 4, goal: 0, need: 0, d0: 0, seq: ["bear", "knife", "cat", "rumor", "bull", "force"], mobs: ALLM, pseq: ["up"], pws: ALLP, fomc: 140, swan: 320 };
// 주식 용어 (도감)
const TERMS = {
  good: { e: "📈", n: "호재 · 악재", g: "기본", m: "값에 좋은 소식과 나쁜 소식", f: "📈 먹으면 +, 📉 맞으면 −15%" },
  lev: { e: "⚡", n: "레버리지", g: "기본", m: "빌린 돈까지 얹어 크게 거는 것", f: "8초마다 x1씩 올라 빨라지고 손익도 커진다" },
  delist: { e: "🕳", n: "상장폐지", g: "기본", m: "시장에서 퇴출되는 것", f: "구멍에 빠지면 강제 청산" },
  cash: { e: "💰", n: "익절", g: "기본", m: "이익을 보고 파는 것", f: "수익을 확정하고 판을 끝낸다" },
  liq: { e: "💥", n: "강제 청산", g: "기본", m: "손실이 커져 강제로 정리되는 것", f: "이번 판 수익 0, 계좌 −10%" },
  up: { e: "🚀", n: "상한가", g: "아이템", m: "하루에 오를 수 있는 끝까지 오른 값", f: "4초: 캔들 수익 2배, 파란 캔들 손실 없음, 몹을 날려 버림" },
  water: { e: "💧", n: "물타기", g: "아이템", m: "값이 내릴 때 더 사서 평균 단가를 낮추는 것", f: "5초: 파란 캔들을 밟아도 +" },
  cb: { e: "🧯", n: "서킷브레이커", g: "아이템", m: "폭락 때 거래를 잠깐 멈추는 장치", f: "3초: 세상이 느려진다" },
  stop: { e: "🛡️", n: "손절매", g: "아이템", m: "더 잃기 전에 손해를 보고 파는 것", f: "8초 안에 청산 1번을 막아 앞쪽 안전한 곳으로. 대신 수익 절반을 잃음" },
  hold: { e: "💎", n: "존버", g: "아이템", m: "무슨 일이 있어도 버티며 들고 있는 것", f: "6초: 3단 점프" },
  bear: { e: "🐻", n: "곰 (약세장)", g: "몹", m: "값이 내리는 시장을 부르는 말", f: "밟으면 퇴치 +3%×레버리지, 부딪히면 −10%" },
  knife: { e: "🔪", n: "떨어지는 칼날", g: "몹", m: "급락하는 값을 섣불리 잡으면 다친다는 말", f: "하늘에서 꽂힌다. 넘어가기, 닿으면 −12%" },
  force: { e: "🕴️", n: "세력 (작전)", g: "몹", m: "값을 일부러 흔들어 개미를 털어 내는 큰 돈", f: "바닥을 쓸고 온다. 넘어가기, 털리면 수익 30% 잃음 (성장하면 버팀)" },
  cat: { e: "↗️", n: "데드캣 바운스", g: "몹", m: "폭락 뒤 잠깐 반짝 오르는 가짜 반등", f: "구멍 위 발판. 밟으면 한 번 튕겨 주고 무너진다" },
  rumor: { e: "📰", n: "찌라시", g: "몹", m: "출처 모를 소문", f: "닿으면 2초 동안 앞이 가려진다. 밑으로 지나가기" },
  bull: { e: "🐂", n: "황소 (강세장)", g: "몹", m: "값이 오르는 시장을 부르는 말", f: "등을 밟으면 높이 튀어 오르고 +2%×레버리지" },
  fomc: { e: "📢", n: "FOMC 발표", g: "이벤트", m: "금리를 정하는 회의 결과 발표", f: "화면이 흔들리고 캔들 손익 3배" },
  swan: { e: "🦢", n: "블랙스완", g: "이벤트", m: "아무도 예상 못 한 큰 사건", f: "검은 백조가 지나가면 계단식 대폭락. 건너뛰면 덜 잃는다" },
};
const TERM_KEYS = Object.keys(TERMS);
const NEWS = ["[속보] 개미들, 오늘도 출근 전 차트 확인", "전문가 \"지금이 바닥… 아마도\"", "세력 등장설에 커뮤니티 술렁", "\"익절은 늘 옳다\" 오래된 격언 재조명",
  "곰과 황소, 오늘도 차트 위에서 신경전", "상장폐지 공포에 점프 연습 급증", "고래 출현? 거래량 급증", "\"떨어지는 칼날은 잡지 마라\"", "※ 이 게임의 차트·뉴스는 전부 가상입니다"];
const RUMORS = ["[받은글] 내일 무조건 오른다던데…", "[찌라시] 개미 마을에 금광 발견?!", "[카더라] 출처: 친구의 친구", "[단독?] 확인 안 된 소문 확산 중"];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const fmtWon = n => Math.round(n).toLocaleString("ko-KR") + "원";
const price = y => (Math.round(10000 * Math.exp(y / 500) / 10) * 10).toLocaleString();
const pct = r => (r >= 0 ? "+" : "") + (r * 100).toFixed(1) + "%";

// ───────── 저장 ─────────
const store = { get() { try { return JSON.parse(localStorage.getItem("g003") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g003", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ total: 1e6, bestRet: 0, bestLev: 1, runs: 0, cashouts: 0, cleared: 0, stars: {}, dex: [], endlessBest: 0 }, store.get());
let dex = new Set(save.dex || []);
const tierNow = () => Math.min(4, save.cleared >= 5 ? 4 : save.cleared >= 3 ? 3 : save.cleared);
const persist = () => { if (auto) return; save.dex = [...dex]; store.set(save); }; // 자동 플레이(녹화·QA)는 저장하지 않는다

// ───────── 소리 ─────────
let ac = null;
function beep(f, d = .06, type = "square", v = .045, w = 0, f2) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime + w, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
}
const vary = () => 1 + (Math.random() - .5) * .14;
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const SFX = {

      if (candleT > .45) { candleT = 0; if (Math.abs(candleAcc) >= .0015) { popText((candleAcc > 0 ? "+" : "") + (candleAcc * 100).toFixed(1) + "%", candleAcc > 0 ? UP : DN, .34, .5); const el = $("ret"); el.style.transform = "scale(1.08)"; setTimeout(() => el.style.transform = "", 120); } candleAcc = 0; }
      hud();
    }
  }
  // 안내 카드
  if (cardT > 0) { cardT -= dtReal; if (cardT <= 0) $("card").classList.remove("on"); }
  else if (cardQ.length && mode === "run") showCard(cardQ.shift());
  if (mode !== "run" && mode !== "dying") { $("card").classList.remove("on"); cardT = 0; }
  // 손맛 갱신
  fx.parts = fx.parts.filter(p => (p.life -= dt) > 0); fx.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= p.g * dt; p.vx *= .96; });
  fx.shake *= Math.pow(.02, dt); fx.squash *= Math.pow(.001, dt); fx.edge = Math.max(0, fx.edge - dt * 1.6);
  if (fx.flash) { fx.flash.t += dtReal; if (fx.flash.t > fx.flash.dur) fx.flash = null; }
  if (fx.banner) { fx.banner.t += dtReal; if (fx.banner.t > fx.banner.dur) fx.banner = null; }
  if (fx.swan) { fx.swan.t += dtReal; if (fx.swan.t > 3.2) fx.swan = null; }
  draw(dtReal);
  requestAnimationFrame(loop);
}

// ───────── 자체 검사 ─────────
function runBot(seed, c, untilT) { // 엄격 모드: 몹에 맞으면 실패, 손절매 구조 없음
  const s = newState(seed, c), m = { tick: 0 }; s.strict = true; let goalRet = null, bestAfter = -1e9;
  for (let k = 0; k < untilT / DT / CB_SLOW + 10 && s.t < untilT; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; if (c.goal && s.x >= c.goal * CW) { if (goalRet === null) goalRet = s.ret; bestAfter = Math.max(bestAfter, s.ret); if (s.ret >= c.need * 3 || s.t > (goalRet !== null ? untilT : 0)) {} } }
  return { s, goalRet, bestAfter };
}
function stateAt(W, i, t, tier) { const s = blankState(W, tier); s.x = i * CW + CW / 2; s.y = W.C[i]; s.lastG = s.y; s.lastIdx = i; s.t = t; s.strict = true; s.buffs.stop = 0; return s; }
function passZone(W, o, t, tier) { // 이 몹 구간을 지나갈 방법이 하나라도 있나 (점프 시점·2단 점프 간격 전수)
  const endX = o.ze * CW + CW / 2, maxTicks = 700;
  const tryPlan = plan => { const s = stateAt(W, o.zs, t, tier); for (let k = 0; k < maxTicks; k++) { step(s, plan.includes(k)); if (s.dead) return false; if (s.x >= endX && s.gnd) return true; } return false; };
  if (tryPlan([])) return true;
  const dmax = Math.ceil((o.ze - o.zs) * CW / speed({ t }) / DT);
  for (let d = 0; d <= dmax; d += 3) { if (tryPlan([d])) return true; for (let k = 4; k <= 64; k += 4) if (tryPlan([d, d + k])) return true; }
  return false;
}
function fairness(W, maxX, tier) {
  let n = 0; const bad = [];
  for (const o of W.mobs) {
    if (o.ze * CW > maxX) continue;
    const ts = o.t === "bear" ? [0, 1.1, 2.3, 3.4, 4.6, 5.8, 6.9] : [0];
    for (const base of [0, 72]) for (const ph of ts) { n++; if (!passZone(W, o, base + ph, tier)) bad.push(`${o.t}@${o.zs}(t${(base + ph).toFixed(1)})`); }
  }
  return { n, bad };
}
function selftest() {
  const out = []; let pass = 0, total = 0;
  // A. 무한 장: 새 요소 전부 포함, 시드 20개 × 60초 생존
  let okA = 0; const statA = { mobs: 0, kills: 0, pw: 0, zones: 0 };
  out.push("[A] 무한 장 60초 생존 (엄격: 몹에 맞으면 실패)");
  const worldsA = [];
  for (let seed = 1; seed <= 20; seed++) {
    const { s } = runBot(seed, ENDLESS, 60); worldsA.push(s);
    const mobsMet = s.W.mobs.filter(o => o.ze * CW < s.x).length, pw = s.W.items.filter(o => o.t === "pw" && s.done.has(o.id)).length, zn = s.W.zones.filter(z => z.i0 * CW < s.x).length;
    statA.mobs += mobsMet; statA.kills += s.kills; statA.pw += pw; statA.zones += zn;
    if (!s.dead) okA++;
    out.push(`${seed}\t${s.dead ? "FAIL(" + s.dead + ")" : "OK"}\t${s.t.toFixed(1)}초\tx${lev(s)}\t${pct(s.ret)}\t몹 ${mobsMet} · 밟기 ${s.kills} · 아이템 ${pw} · 이벤트 ${zn}`);
  }
  out.push(`  → ${okA}/20 생존 · 만난 몹 ${statA.mobs} · 밟아 처치 ${statA.kills} · 아이템 ${statA.pw} · 이벤트 ${statA.zones}`);
  total += 20; pass += okA;
  // B. 단계별 봇 통과율: 깃발 도달 + 목표 수익률 이상 (70초 안)
  out.push("", "[B] 단계별 봇 통과율 (시드 20) — 통과 = 깃발 넘고 8초 안에 목표 이상, 봇은 수익을 노리지 않는 생존 봇");
  const rates = [], instant = [];
  for (const c of STAGES) {
    let okB = 0, dead = 0, stars = [0, 0, 0, 0], times = [], rets = [], gr = [], deadAt = [];
    for (let seed = 1; seed <= 20; seed++) {
      const s = newState(seed, c), m = { tick: 0 }; s.strict = true; let cleared = false, best = -1e9, tGoal = null;
      for (let k = 0; k < 80 / DT && s.t < 70; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; if (s.x >= c.goal * CW) { if (tGoal === null) { tGoal = s.t; gr.push(s.ret); } best = Math.max(best, s.ret); if (best >= c.need && !cleared) { cleared = true; times.push(s.t); } if (s.t > tGoal + 8) break; } }
      if (s.dead) { dead++; deadAt.push(seed + ":" + s.dead + "@" + Math.floor(s.x / CW)); } if (cleared) { okB++; stars[starsOfC(c, best)]++; } rets.push(tGoal !== null ? best : s.ret);
    }
    rets.sort((a, b) => a - b); times.sort((a, b) => a - b);
    const rate = okB / 20; rates.push(rate); instant.push(gr.filter(r => r >= c.need).length / 20);
    const ok = dead === 0 && rate >= .6; total++; if (ok) pass++;
    out.push(`${c.n}단계 ${c.name.padEnd(6)}\t${ok ? "OK" : "FAIL"}\t통과 ${okB}/20 (${Math.round(rate * 100)}%)\t청산 ${dead}\t통과 시각 중앙 ${times.length ? times[times.length >> 1].toFixed(0) + "초" : "-"}\t수익 중앙 ${pct(rets[10])}\t★1/2/3 ${stars[1]}/${stars[2]}/${stars[3]}\t목표 ${pct(c.need)}\t깃발 시 수익 최소/중앙 ${gr.sort((a, b) => a - b).length ? pct(gr[0]) + "/" + pct(gr[gr.length >> 1]) : "-"} ${deadAt.join(" ")}`);
  }
  out.push("  곡선(8초 안 통과): " + rates.map(r => Math.round(r * 100) + "%").join(" → "), "  곡선(깃발 닿는 순간 이미 목표 이상): " + instant.map(r => Math.round(r * 100) + "%").join(" → "));
  // C. 피할 수 없는 배치: 몹마다 레버리지 x1·x10 속도, 곰은 위치 7가지로 시작해 지나갈 방법이 있는지 전수 탐색
  out.push("", "[C] 피할 수 없는 배치 (몹 구간마다 점프 시점 전수 탐색)");
  let checks = 0; const bad = [];
  worldsA.forEach((s, k) => { const r = fairness(s.W, s.x + 600, 0); checks += r.n; r.bad.forEach(b => bad.push(`A${k + 1}:${b}`)); });
  for (const c of STAGES) for (let seed = 1; seed <= 4; seed++) { const s = newState(seed, c); s.W.ensure((c.goal + 140) * CW); const r = fairness(s.W, (c.goal + 140) * CW, 0); checks += r.n; r.bad.forEach(b => bad.push(`S${c.n}-${seed}:${b}`)); }
  out.push(`  검사 ${checks}건 · 피할 수 없음 ${bad.length}건 ${bad.slice(0, 8).join(" ")}`);
  total++; if (!bad.length) pass++;
  // D. 손절매 구조: 구멍마다 빠진 상태에서 안전한 곳으로 옮겨지고 0.3초 버티는지
  let resc = 0, rescOk = 0;
  for (let seed = 1; seed <= 10; seed++) { const W = makeWorld(seed, ENDLESS); W.ensure(400 * CW);
    for (let i = 20; i < 380; i++) if (W.C[i] === null && W.C[i - 1] !== null && W.cat[i - 1] === undefined) { resc++; const s = blankState(W, 0); s.x = (i + .5) * CW; s.lastG = W.C[i - 1]; s.y = s.lastG - 150; s.vy = -300; s.gnd = false; s.lastIdx = i; s.buffs.stop = 5;
      step(s, false); if (!s.dead && s.buffs.stop === 0) { s.strict = true; let ok = true; for (let k = 0; k < .3 / DT; k++) { step(s, false); if (s.dead) { ok = false; break; } } if (ok) rescOk++; } } }
  out.push("", `[D] 손절매 구조 ${rescOk}/${resc}`); total++; if (resc && rescOk === resc) pass++;
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;font-size:11px;overflow:auto;white-space:pre-wrap">${out.join("\n")}</pre>`);
  document.title = `SELFTEST ${pass}/${total}`;
}
function starsOfC(c, r) { return r >= c.need * 3 ? 3 : r >= c.need * 2 ? 2 : r >= c.need ? 1 : 0; }

// ───────── 시작 ─────────
$("news").textContent = NEWS.join("   ·   ");
resize();
const q = new URLSearchParams(location.search);
if (q.has("selftest")) selftest();
else if (q.has("diag")) {
  const seed = Number(q.get("diag")), c = q.has("stage") ? STAGES[Number(q.get("stage")) - 1] : ENDLESS, s = newState(seed, c), m = { tick: 0 }; s.strict = true;
  for (let k = 0; k < 60 / DT; k++) { m.tick = k; step(s, botDecide(s, m)); if (s.dead) break; }
  const i = Math.floor(s.x / CW), C = s.W.C;
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest">seed ${seed} dead=${s.dead} t=${s.t.toFixed(2)} x=${s.x.toFixed(0)} y=${s.y.toFixed(0)} vy=${s.vy.toFixed(0)} jumps=${s.jumps} gnd=${s.gnd} lastG=${s.lastG} speed=${speed(s)}\n` +
    C.slice(Math.max(0, i - 12), i + 8).map((v, k) => `${i - 12 + k}${i - 12 + k === i ? "*" : " "} ${v} ${(s.W.bk[i - 12 + k] || []).map(o => o.t).join(",")}`).join("\n") + "</pre>");
  document.title = "DIAG";
} else if (q.has("autoplay")) {
  auto = true; startRun(Number(q.get("stage")) || 7, Number(q.get("autoplay")) || 1);
  if (q.has("warp") || q.has("near")) { // QA 스크린샷용: 지정 초까지(또는 지정 몹·아이템·이벤트 바로 앞까지) 미리 진행
    let until = Number(q.get("warp")) || 0, nearX = 0;
    if (q.has("near")) { const k = q.get("near"), off = Number(q.get("off") || 230); st.W.ensure(9000 * CW); const o = st.W.mobs.find(m => m.t === k) || st.W.items.find(m => m.t === "pw" && m.p === k) || st.W.zones.find(z => z.t === k); if (o) nearX = (o.x ?? o.xa ?? o.i0 * CW) - off; }
    while ((st.t < until || st.x < nearX) && !st.dead) { mem.tick++; step(st, botDecide(st, mem), null); }
    camY = st.y; lastLev = lev(st); runPhase = st.t * 20; hud(true);
    const W = st.W; while (introPtr < W.intro.length && W.intro[introPtr].x < st.x - 200) introPtr++; while (zonePtr < W.zones.length && st.x >= W.zones[zonePtr].i0 * CW) zonePtr++;
  }
  if (q.has("buff")) { st.buffs[q.get("buff")] = 3; }
} else menu();
window.__g003 = { newState, step, botDecide, lev, STAGES, ENDLESS, startRun, get st() { return st; }, meet, showDex, cashOut, startEvolve, result, fx };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
