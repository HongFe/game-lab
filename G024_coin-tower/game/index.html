<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>밈코인 탑쌓기</title>
<style>
/* 게임 화면 색 (캔버스·팝업용) */
:root{--bg:#0b0e1a;--tx:#eef1f7;--up:#34c77b;--dn:#ff4d5e;--gold:#ffb020}
/* 공용 UI 키트 색 맞춤 (games.json color) */
html:root{--ui-accent:#ffb020;--ui-on-accent:#1b1406;--ui-bg:#0b0e1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui-font);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;word-break:keep-all}
#game{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ── HUD: 단계 칩 · 시총 큰 숫자 · 배수 칩 / 목표 막대 ── 글자 30·14·12 */
.hud{position:absolute;left:0;right:0;top:0;padding:var(--ui-s2) var(--ui-s3) 0;padding-top:max(var(--ui-s2),env(safe-area-inset-top));pointer-events:none;display:flex;flex-direction:column;gap:var(--ui-s2);z-index:5}
.hud[hidden]{display:none}
.hrow{display:flex;align-items:center;gap:var(--ui-s2)}
.cap{flex:1;text-align:center;min-width:0}
.cap b{display:inline-block;font-size:var(--ui-t5);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform 140ms var(--ui-in),color .2s}
.cap b.pong{transform:scale(1.22)}
.cap b.zero{color:var(--dn)}
.cap small{display:block;font-size:var(--ui-t2);color:var(--ui-muted);line-height:1.5}
#stg .ui-icon,#mul .ui-icon{color:var(--ui-text)}
#mul{transition:transform 120ms var(--ui-in)}
#mul.bump{transform:scale(1.2)}
#mul.up .ui-icon{color:var(--up)}
.goal{position:relative;height:var(--ui-s5);display:flex;align-items:center;gap:var(--ui-s2)}
.gbar{position:relative;flex:1;height:8px;border-radius:999px;background:var(--ui-surface2)}
.gbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--ui-muted);transition:width 200ms var(--ui-in)}
.gbar.reach>i{background:var(--gold)}
.gbar>em{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:var(--ui-text);opacity:.45;border-radius:1px}
.gbar>em.on{opacity:1;background:var(--gold)}
.gbar>em.flash{animation:gflash .5s ease-in-out 4}
@keyframes gflash{50%{transform:scaleY(1.8);background:#fff;opacity:1}}
#goaltx{height:28px;padding:0 var(--ui-s2)}
#goaltx .ui-icon{color:var(--ui-text)}
#goaltx .ui-stars .ui-icon{width:var(--ui-t2);height:var(--ui-t2);color:var(--gold)}
#goaltx .ui-stars .off{color:var(--ui-muted);opacity:.4}

/* ── 아래: 일시정지(왼쪽) · 매도(오른쪽, 64px) ── */
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 var(--ui-s3) max(var(--ui-s3),env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;z-index:6}
.bar[hidden]{display:none}
.bar>*{pointer-events:auto}
#pause{background:color-mix(in srgb,var(--ui-surface) 86%,transparent);box-shadow:var(--ui-shadow1)}
#sell{min-height:64px;min-width:176px;padding:0 var(--ui-s4);border-radius:var(--ui-r3);flex-direction:row;gap:var(--ui-s2);touch-action:none;transition:transform 90ms var(--ui-in),background .2s,color .2s}
#sell .sv{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
#sell .sv span{font-size:var(--ui-t4);font-weight:700}
#sell .sv small{font-size:var(--ui-t2);font-weight:700;font-variant-numeric:tabular-nums;opacity:.8}
#sell.pre{background:var(--ui-surface2);color:var(--ui-text);box-shadow:var(--ui-shadow1)}
#sell.go{animation:breathe 1.1s ease-in-out infinite}
#sell:disabled{opacity:.45}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:var(--ui-shadow1),0 0 28px 6px rgba(255,176,32,.6)}}

/* ── 안내 카드(처음 보는 것 1장) ── */
#card{position:absolute;left:44px;right:72px;top:calc(104px + env(safe-area-inset-top));transform:translateY(-8px);opacity:0;transition:opacity 195ms var(--ui-out),transform 195ms var(--ui-out);pointer-events:none;padding:var(--ui-s3);z-index:7}
#card.on{opacity:1;transform:none;transition:opacity 225ms var(--ui-in),transform 225ms var(--ui-in)}
#card .ui-em{width:var(--ui-s6);height:var(--ui-s6);font-size:var(--ui-t5)}
#card .n{font-weight:700;font-size:var(--ui-t3);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
#card .f{font-size:var(--ui-t2);line-height:1.5;color:var(--ui-muted);margin-top:2px}
#hand{left:-99px;top:-99px;opacity:0}
#hand.on{opacity:1}

/* ── 겹 화면 (시작·단계·결과·도감): 공용 키트 ui-screen 안의 한 기둥 ── */
#ov{padding-left:var(--ui-s4);padding-right:var(--ui-s4)}
.g-line{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0;display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.g-line b{color:var(--ui-text)}
.g-line .ui-icon{color:var(--ui-muted)}
.g-up{color:var(--up)}.g-dn{color:var(--dn)}
.g-strike{text-decoration:line-through;text-decoration-thickness:3px;color:var(--ui-muted)}
.g-head{display:flex;align-items:center;gap:var(--ui-s2)}
.g-head .ui-chip{box-shadow:none;background:var(--ui-surface2)}
.g-head .ui-chip .ui-icon{color:var(--ui-text)}
#box .ui-level.cur{background:var(--ui-surface2);color:var(--ui-text);box-shadow:inset 0 0 0 2px var(--ui-text)}
#box .ui-level .ui-stars .off{color:var(--ui-muted);opacity:.35}
#box .ui-level .ui-em{width:auto;height:auto;font-size:var(--ui-t2)}
#box .ui-level.lock .ui-icon{width:var(--ui-t4);height:var(--ui-t4)}
.g-next{display:flex;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);line-height:1.5;width:100%}
.g-next .ui-em{font-size:var(--ui-t4)}
.g-next b{font-variant-numeric:tabular-nums}
.g-next .ui-icon{color:var(--ui-muted)}
.g-item{display:flex;align-items:center;gap:var(--ui-s3);padding:var(--ui-s3);text-align:left}
.g-item .ui-em{width:var(--ui-s6);height:var(--ui-s6);font-size:var(--ui-t4)}
.g-txt{flex:1;min-width:0}
.g-txt b{font-size:var(--ui-t3);line-height:1.5;display:block}
.g-txt p{font-size:var(--ui-t2);line-height:1.5;color:var(--ui-muted);margin:0}
.g-item.no{box-shadow:none;background:transparent;outline:1px dashed var(--ui-line);outline-offset:-1px}
.g-item.no .ui-em{color:var(--ui-muted)}
#box .ui-badge{font-size:var(--ui-t2);height:24px}
#box .ui-level .ui-stars .ui-icon{width:12px;height:12px}
.g-sec{font-size:var(--ui-t2);font-weight:700;color:var(--ui-muted);margin:var(--ui-s2) 0 0;text-align:left}
/* 대표 그림: 흔들리는 코인 탑 */
.g-hero{width:112px;height:112px;border-radius:var(--ui-r3);background:radial-gradient(circle at 50% 30%,#1f2a52,#121731);position:relative;overflow:hidden;box-shadow:var(--ui-shadow1)}
.g-hero i{position:absolute;left:50%;height:13px;border-radius:3px;background:linear-gradient(#ffd36a,#e0961c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.g-hero .t{transform-origin:50% 100%;position:absolute;inset:0;animation:sway 1.8s ease-in-out infinite}
.g-hero i.g{background:linear-gradient(#5fe39a,#23a15d)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.g-hero .t{animation:none}}

/* ── 게임 화면 연출 ── */
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);border:5px solid var(--gold);color:var(--gold);font:700 36px var(--ui-font);padding:4px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.6,1),opacity .2s;white-space:nowrap;z-index:8;background:rgba(11,14,26,.35)}
.stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.stamp.bad{border-color:var(--dn);color:var(--dn)}
.ui-toast.top{top:max(132px,env(safe-area-inset-top))}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}
.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}
.ui-btn:active{transform:scale(.96)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.ui-level:active{transform:scale(.94)}
.ui-level.cur{box-shadow:inset 0 0 0 2px var(--ui-text)}   /* 강조색은 주 버튼에만 → 지금 칸은 테두리로 */
.ui-level.lock{color:var(--ui-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line);pointer-events:none}
.ui-level .ui-stars .ui-icon{width:10px;height:10px}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}
.ui-stars .off{color:var(--ui-line);opacity:1}
.ui-light .ui-stars .off{color:rgba(15,20,30,.15)}
.ui-stars.big .ui-icon{width:40px;height:40px}
.ui-stars.big{gap:var(--ui-s2)}

/* HUD: 위쪽 칩 줄 */
.ui-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:var(--ui-s2);align-items:center;padding:var(--ui-s3);padding-top:max(var(--ui-s3),env(safe-area-inset-top));pointer-events:none}
.ui-hud>*{pointer-events:auto}
.ui-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--ui-s3);border-radius:999px;background:color-mix(in srgb,var(--ui-surface) 86%,transparent);box-shadow:var(--ui-shadow1);font:700 var(--ui-t2)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ui-text)}
.ui-chip .ui-icon{width:16px;height:16px;color:var(--ui-muted)}
.ui-chip.accent .ui-icon{color:var(--ui-accent)}
.ui-meter{height:6px;border-radius:999px;background:var(--ui-surface2);overflow:hidden}
.ui-meter>i{display:block;height:100%;background:var(--ui-accent);border-radius:inherit;transition:width 200ms var(--ui-in)}

/* 안내 카드(한 번에 하나) · 토스트 · 시트 */
.ui-tip{display:flex;align-items:center;gap:var(--ui-s3);background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s3) var(--ui-s4);box-shadow:var(--ui-shadow2);font-size:var(--ui-t3);line-height:1.5;color:var(--ui-text);font-family:var(--ui-font)}
.ui-tip .ui-icon{color:var(--ui-accent)}
.ui-toast{position:fixed;left:50%;bottom:max(var(--ui-s6),env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--ui-text);color:var(--ui-bg);padding:var(--ui-s3) var(--ui-s4);border-radius:var(--ui-r1);font:700 var(--ui-t2)/1.25 var(--ui-font);max-width:calc(100vw - 32px);width:max-content;text-align:center;transition:opacity 180ms var(--ui-in),transform 180ms var(--ui-in)}
.ui-toast.on{opacity:1;transform:translate(-50%,0)}
.ui-toast.top{bottom:auto;top:max(25%,env(safe-area-inset-top))}
.ui-sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ui-surface);border-radius:var(--ui-r3) var(--ui-r3) 0 0;padding:var(--ui-s5);padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));box-shadow:var(--ui-shadow2);transform:translateY(100%);transition:transform 195ms var(--ui-out)}
.ui-sheet.on{transform:none;transition:transform 225ms var(--ui-in)}

    });
  }

  // 완벽 봇: ★★★ 불가능한 판 0
  let perfBad = []; const perfF = [];
  for (const n of SN) for (let seed = 1; seed <= 40; seed++) { const r = botPlay(seed, n, PERFECT); if (r.stars < 3) perfBad.push(n + ":" + seed + ":" + r.s.over + "@" + r.s.floors); else perfF.push(r.s.floors); }
  chk(perfBad.length === 0, `완벽 봇 240판 ★★★ 도달 ${240 - perfBad.length}/240 (층 중앙 ${med(perfF)}) ${perfBad.slice(0, 6).join(" ")}`);
  // 헛매수 뒤 폭 그대로 · 폭은 늘 처음의 20% 이상

    chk(bad === 0 && minW >= .2 * W0 - 1e-9, `헛매수 뒤 폭이 준 경우 ${bad} · 가장 좁은 탑 ${minW.toFixed(1)}px (기준 ≥ ${(.2 * W0).toFixed(0)}px → 막다른 판 없음)`); }
  // 탭 판정: 최고 속도에서 15ms 오차로도 딱
  { const thr = perfThr(.2 * W0, VMAX); let okAll = true; for (const n of [...SN, 7]) { const v = Math.min(VMAX, cfgOf(n).v * Math.pow(1.02, 60)); if (perfThr(.2 * W0, v) < v * .015) okAll = false; }
    chk(okAll && thr >= VMAX * .015, `딱 기준 ${thr.toFixed(2)}px ≥ 최고 속도 ${VMAX}px/초 × 15ms = ${(VMAX * .015).toFixed(2)}px`); }

  // 사건 위치: 목표 뒤 고민 · 배치 다양성 · 2·3단계 작은 고래로 존버가 쓰임
  { const rows = []; let ok = true; for (const n of [2, 3, 4, 5, 6]) { let pre = 0, all = 0; for (let seed = 301; seed <= 340; seed++) { const r = botPlay(seed, n, HUMAN); for (const e of r.s.plan.ev) { if (e.warnAt === undefined) continue; all++; if (r.goalF === null || e.warn < r.goalF) pre++; } } rows.push(`${n}단계 ${pre}/${all}`); if (pre > all * .5) ok = false; }

  { let ok = true; const rows = []; for (const n of [4, 5, 6]) { const lay = new Map(); for (let seed = 1; seed <= 100; seed++) { const k = makePlan(seed, cfgOf(n), bodyOf(n)).ev.map(e => e.t + e.hit).join(","); lay.set(k, (lay.get(k) || 0) + 1); } const mx = Math.max(...lay.values()); rows.push(`${n}단계 ${lay.size}가지·최다 ${mx}%`); if (mx > 10) ok = false; }
    chk(ok, `사건 배치 다양성(시드 1~100, 같은 배치 ≤ 10%): ${rows.join(" · ")}`); }

    const small = [2, 3].every(n => makePlan(1, cfgOf(n), bodyOf(n)).ev.some(e => e.t === "whale" && e.val === 20));
    chk(small && used > 0, `2·3단계 작은 고래(+20) 있음 ${small} · 안 파는 보통 손 ${n2}판 중 존버 발동 ${used}판`); }

  // [D] 사람 근사 봇
  out.push("", "[D] 사람 근사 봇 — 보통 손(전 단계 같은 손: 탭 σ 25ms + 10%는 +60ms, 흔들림 보정 70%, 반응 0.35초, 자리 눈대중 σ " + HUMAN.sx + "px) · 매도: ★★★ / 위험(흔들림+다음 기본+예고 사건) ≥ 88 / 미달이면 95까지");
  const E = [];
  for (const n of SN) {
    const c = cfgOf(n); const row = { n, A: null, B: null };
    for (const [a, b, k] of [[301, 340, "A"], [401, 440, "B"]]) { let p = 0, s3 = 0, col = 0; const st = [0, 0, 0, 0], gf = [], secs = [], sellS = [];
      for (let seed = a; seed <= b; seed++) { const r = botPlay(seed, n, HUMAN); if (r.stars) p++; if (r.stars >= 3) s3++; if (r.collapsed) col++; st[r.stars]++; gf.push(r.goalF); secs.push(r.s.t); if (r.sold && r.s.mult >= c.goal) sellS.push(Math.round(r.s.S)); }

    for (const [k, B] of [["S", SKILLED], ["C", CLUMSY]]) { let p = 0, s3 = 0, pf = 0, fl = 0; for (let seed = 301; seed <= 340; seed++) { const r = botPlay(seed, n, B); if (r.stars) p++; if (r.stars >= 3) s3++; pf += r.s.perfects; fl += r.s.floors + r.s.misses; } row[k] = { p, s3, pf: Math.round(pf / fl * 100) }; }
    { let pf = 0, fl = 0; for (let seed = 301; seed <= 340; seed++) { const r = botPlay(seed, n, HUMAN); pf += r.s.perfects; fl += r.s.floors + r.s.misses; } row.pf = Math.round(pf / fl * 100); }
    E.push(row);
    const A = row.A, B = row.B, ok = A.p >= 28 && A.s3 >= 6 && A.s3 <= 16 && B.s3 >= 6 && B.s3 <= 16;

  }

    const bS = resS.slice(0, 6).reduce((a, b) => b[1] > a[1] ? b : a), x40 = resS[0][1], bx2 = Number(bS[0]);

    const j = [1, 2, 3, 4, 5, 6].map(k => bodyOf(k).jon).join("·");
    const sk = newRun(3, 4, 4); const r = botPlay(3, 4, { ...PERFECT, policy: s => s.floors >= 5 }, 4); const lockOk = Math.abs(r.s.locked - .3 * r.s.mult * 1000) < 1e-6 && r.s.locked > 0;
    const rNo = botPlay(3, 4, { ...PERFECT, policy: s => s.floors >= 5 }, 3);
    chk(a === 2 * b && wh4 === 35 && wh5 === 10 && m4 === 0 && m5 === 1 && rg5 === 45 && rg6 === 20 && j === "0·1·1·1·1·2" && lockOk && rNo.s.locked === 0,
      `펌핑 기본 흔들림 ${a.toFixed(1)} → ${b.toFixed(1)} · 고래 +${wh4} → +${wh5}(저가 매수 ×1.3 ${m5}번) · 러그풀 +${rg5} → +${rg6} · 존버 횟수 ${j} · 스테이킹 5층 잠금 ${Math.round(r.s.locked)}P = 시총 30% ${lockOk} (몸 3은 ${rNo.s.locked})`); }

  // [I] 첫 성공
  out.push("", "[I] 첫 성공: 1단계 첫 판, 처음 2층은 유령 자리에 탭(반응 0.6초), 목표 넘으면 매도");
  { const ts = []; let fail = 0; for (let seed = 1; seed <= 20; seed++) { const r = botPlay(seed, 1, { ...HUMAN, react: .6, ghost: 2, policy: s => s.mult >= s.c.goal || humanPolicy(s) }); if (!(r.stars >= 1 && r.s.t <= 30)) fail++; ts.push(r.s.t); }
    chk(fail === 0, `20판 중 30초 안 통과 ${20 - fail}/20 · 매도까지 중앙 ${med(ts).toFixed(1)}초 · 최장 ${Math.max(...ts).toFixed(1)}초`); }
  if (extra) extra(chk, out);
  return { out, pass, total };
}

  fx.parts = fx.parts.filter(p => (p.life -= dt) > 0); fx.parts.forEach(p => { if (p.to && p.life < p.max * .7) { p.x += (p.to.x - p.x) * Math.min(1, dt * 6); p.y += (p.to.y - p.y) * Math.min(1, dt * 6); } else { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .97; p.vy += p.coin ? 300 * dt : 0; } });
  fx.rings = fx.rings.filter(r => (r.t += dt) < .45);
  fx.pieces = fx.pieces.filter(p => { if (p.delay > 0) { p.delay -= dt; return true; } p.vy -= 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt; return p.life > 0 && p.y > -600; });
  fx.shake *= Math.pow(.015, dt); if (fx.pop) { fx.pop.t += dtReal; if (fx.pop.t > .9) fx.pop = null; }
  if (fx.flash) { fx.flash.t += dtReal; if (fx.flash.t > fx.flash.dur) fx.flash = null; }
  fx.wind = Math.max(0, fx.wind - dtReal); fx.rugPull = Math.max(0, fx.rugPull - dtReal * 1.6); fx.gaugeBlink = Math.max(0, fx.gaugeBlink - dtReal / 1.0); if (fx.plunge) fx.plunge.t += dtReal;
  if (mode === "evolve" && fx.evo) drawEvolve(dtReal, T); else draw(dt, T);
  requestAnimationFrame(loop);
}

// ───────── 자체 검사 [J] (화면 흐름 · 오락실 신호) ─────────
function selftestJ(chk, out) {
  out.push("", "[J] 오락실 신호: 자동 플레이 중 0건 · 사람 입력 흉내 판에서 fail 한 판 1번 · ev 4종만");
  const sent = [], realPost = post; post = m => sent.push(m);
  testing = true; const saved = JSON.stringify(save);
  // 1) 자동 플레이(autoplay와 같은 길): 신호 0
  auto = true; startRun(3, 11); for (let k = 0; k < 60 / DT && mode === "run"; k++) { acc = DT; advance(DT); }
  const autoN = sent.length; auto = false;
  // 2) 사람 입력 흉내: 붕괴 판 · 미달 매도 · 판 중 나가기 · 통과 매도 · 0층 나가기
  const runs = []; const ALLOW = new Set(["input", "level_start", "level_clear", "fail"]);
  const playAs = (n, seed, pol, quitAt) => { const k0 = sent.length; startRun(n, seed); const M = botMem(seed, { ...HUMAN, policy: pol });
    for (let k = 0; k < 120 / DT && mode === "run"; k++) { if (quitAt !== undefined && st.floors >= quitAt) { quitRun(); break; } const d = botTick(st, M); if (d === "sell") { doSell(); break; } if (d) press(); tickRun(); }
    const evs = sent.slice(k0).map(m => m.ev); runs.push({ n, evs, fails: evs.filter(e => e === "fail").length, clear: evs.filter(e => e === "level_clear").length, whys: sent.slice(k0).filter(m => m.ev === "fail").map(m => m.data.why) }); };
  playAs(1, 21, null); playAs(1, 22, s => s.floors >= 2); playAs(2, 23, null, 3); playAs(1, 24, s => s.mult >= s.c.goal); playAs(1, 25, null, 0);
  const shape = sent.every(m => m.type === "nhc-game" && m.game === "G024" && ALLOW.has(m.ev));
  const failsOk = runs.slice(0, 3).every(r => r.fails === 1) && runs[3].fails === 0 && runs[3].clear === 1 && runs[4].fails === 0;
  const whyOk = runs[0].whys[0] === "collapse" && runs[1].whys[0] === "short" && runs[2].whys[0] === "quit";
  const inputs = sent.filter(m => m.ev === "input").length;
  const lc = sent.find(m => m.ev === "level_clear"); const lcOk = lc && lc.data.level === 1 && typeof lc.data.score === "number" && lc.data.stars >= 1;
  chk(autoN === 0, `자동 플레이 60초 신호 ${autoN}건`);
  chk(shape && failsOk && whyOk && lcOk && inputs <= 2, `사람 흉내 5판: ${runs.map(r => r.evs.filter(e => e !== "input").join(">") || "(없음)").join(" | ")} · input ${inputs}번(4초에 1번) · level_clear ${lc ? JSON.stringify(lc.data) : "-"}`);
  post = realPost; clearLater(); testing = false; save = JSON.parse(saved); mode = "menu"; st = null;
}
function runSelftest() {
  const r = selftestCore(selftestJ);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:999;margin:0;padding:10px;font:11px/1.45 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre-wrap">${r.out.join("\n").replace(/</g, "&lt;")}\n\nSELFTEST ${r.pass}/${r.total}</pre>`);
  document.title = `SELFTEST ${r.pass}/${r.total}`;
}

// ───────── 시작 ─────────
resize();
if (Q.has("selftest")) { auto = true; runSelftest(); auto = false; }
else if (Q.has("autoplay")) { auto = true; startRun(Number(Q.get("stage")) || 1, Number(Q.get("autoplay")) || 1); }
else if (Q.has("stage")) startRun(Math.max(1, Math.min(7, Number(Q.get("stage")))));
else menu();
window.__g024 = { get st() { return st; }, get mode() { return mode; }, startRun, doSell, result, menu, stages, showDex, fx, save: () => save };
requestAnimationFrame(t => { lastT = t; loop(t); });
