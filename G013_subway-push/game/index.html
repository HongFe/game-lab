<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2233">
<title>지옥철 밀어넣기</title>
<style>
:root{--bg:#1b2233;--tx:#fff8ee;--sub:#b9c2d3;--acc:#ffc542;--red:#ff5a4f;--ok:#4fd18b;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#10141f;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:calc(6px + env(safe-area-inset-top));height:44px;display:flex;gap:5px;align-items:center;z-index:2;pointer-events:none}
.chip{height:44px;border-radius:14px;background:rgba(10,14,24,.78);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 8px;font:900 16px ui-monospace,Menlo,monospace;white-space:nowrap}
#hSt{background:#ffc542;color:#3a2600;font:900 15px -apple-system,sans-serif;padding:0 9px}
#hT{min-width:70px} #hT.hot{color:var(--red)}
#hP{flex:1;min-width:0} #hP.ok{color:var(--ok)}
#hS{min-width:58px;font-size:14px}
.hb{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(10,14,24,.78);color:var(--tx);font:900 18px sans-serif;padding:0;cursor:pointer}
.hb svg{width:22px;height:22px;display:block;margin:auto}
#act{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.2);background:radial-gradient(circle at 35% 30%,#3a4766,#1c2438);color:#fff;font:900 34px sans-serif;z-index:3;touch-action:none;padding:0;cursor:pointer;box-shadow:0 6px 0 #0c111c,0 10px 22px rgba(0,0,0,.4);display:none}
#act.on{display:block}
#act.dim{opacity:.45}
#act.hot{border-color:#fff;background:radial-gradient(circle at 35% 30%,#ffd76a,#e79a12);box-shadow:0 6px 0 #8a5600,0 0 0 5px rgba(255,197,66,.35);animation:pu .6s ease-in-out infinite alternate}
#act.care{background:radial-gradient(circle at 35% 30%,#ffb4d0,#e0558f);box-shadow:0 6px 0 #8c2253,0 0 0 5px rgba(255,140,190,.4)}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 #0c111c}
#act small{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);white-space:nowrap;font:800 14px -apple-system,sans-serif;text-shadow:0 1px 2px #000}
@keyframes pu{to{transform:scale(1.07)}}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,11,18,.66);padding:14px;z-index:5}
.ov.on{display:flex}
.box{background:#263149;border:1px solid var(--line);border-radius:20px;padding:16px;width:min(360px,100%);text-align:center;animation:rise .22s ease-out;max-height:100%;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.45)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:.4}}
.box h1{margin:2px 0 4px;font-size:26px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:14px;line-height:1.5;margin:6px 0}
.box button{width:100%;border:0;border-radius:14px;padding:10px;min-height:48px;font:900 16px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--acc);color:#3a2600;box-shadow:0 4px 0 #a86f00}
.box button.sec{background:#3b4862;color:var(--tx);box-shadow:0 4px 0 #222a3c}
.box button:active{transform:translateY(3px);box-shadow:none}
.row2{display:flex;gap:8px} .row2 button{flex:1}
.stars{font-size:38px;color:var(--acc);letter-spacing:6px;line-height:1.1}
.stars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.8,.6,1) both}
.stars .no{color:#4b5672}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.big{font:900 30px ui-monospace,Menlo,monospace;margin:4px 0}
.score{font:900 22px ui-monospace,Menlo,monospace;color:#fff8ee}
.line{font-size:14px;font-weight:800;margin:6px 0;color:#eef2f8}
.line.gold{color:#ffd76a} .line.dim{color:var(--sub);font-weight:700}
.next{background:#1c2539;border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px;font-weight:800;color:#dfe6f5}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.list button{margin:0;min-height:52px;padding:6px 4px;font-size:14px;background:#3b4862;color:var(--tx);box-shadow:0 3px 0 #222a3c;line-height:1.2}
.list button small{display:block;font-size:14px;color:var(--acc);font-weight:800}
.list button:disabled{opacity:.35}
.list button.inf{grid-column:span 2;background:#4a3a6a}
.rank{background:#1c2539;border-radius:12px;padding:8px;font-size:14px;font-weight:800;margin-top:6px}
.rank small{display:block;color:var(--sub);font-size:14px;margin-top:2px}
.card .ic{font-size:72px;line-height:1.1;margin:6px 0;animation:pop .5s cubic-bezier(.3,1.8,.6,1)}
.card .nm{font-size:24px;font-weight:900}
.card .ln{font-size:16px;font-weight:800;color:#dfe6f5;margin-top:4px}
.dex{display:grid;grid-template-columns:1fr;gap:6px;text-align:left;margin-top:8px}
.dex div{background:#1c2539;border-radius:12px;padding:8px 10px;font-size:14px;display:flex;gap:10px;align-items:center}
.dex b{font-size:26px;width:40px;text-align:center;flex:none}
.dex .no{opacity:.45}
.dex small{display:block;color:var(--sub);font-size:14px;line-height:1.35}
.dex canvas{position:static;width:44px;height:44px;flex:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="chip" id="hSt">1역</div>
    <div class="chip" id="hT">⏱ <span id="hTv">20.0</span></div>
    <div class="chip" id="hP">👥 <span id="hPv">0/5</span></div>
    <div class="chip" id="hS">0</div>
    <button class="hb" id="snd" aria-label="소리"></button>
    <button class="hb" id="mnb" aria-label="메뉴">☰</button>
  </div>
  <button id="act" aria-label="행동"><span id="actE">🎒</span><small id="actN"></small></button>
  <div id="sat" style="position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-top);pointer-events:none"></div>
  <div class="ov" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
//<LOGIC>
// ───────── 로직 (고정 틱 · 봇·자체 검사·실제 플레이 공통 · DOM 없음) ─────────
const DT = 1 / 60, STEP = .35, UNDER_BACK = .45, BOUNCE_BACK = .65, WOBBLE = .35, FLIP_T = .4, EFF_T = 2;

const RUN_WARN = 5, RUN_GO = 3, RUN_ARRIVE = 2.4;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// 승객 종류: size = 차 안에서 차지하는 칸, need = 더 필요한 힘, wm = 초록 칸 폭 배수, entry = 문턱 지나는 시간
const TYPES = {
  o: { name: "직장인", e: "💼", size: 1, need: 0, wm: 1, entry: .35, col: "#7a9cf0", sq: 1 },
  b: { name: "백팩", e: "🎒", size: 1.35, sizeF: 1.05, need: .05, wm: 1, entry: .35, col: "#4cc493", sq: 1 },
  c: { name: "캐리어", e: "🧳", size: 1.2, need: .13, wm: .72, entry: .6, col: "#eaa64e", sq: .9 },
  p: { name: "임산부", e: "🤰", care: 1, size: 0, col: "#f394bb" },
  g: { name: "어르신", e: "👵", care: 1, size: 0, col: "#b7a0ee" },
  f: { name: "꽃다발", e: "💐", size: 1, need: 0, wm: 1, entry: .35, col: "#f6cb52", sq: 1 },
  a: { name: "운동선수", e: "🏋️", size: 1.3, ath: 1, wm: .62, entry: .35, col: "#ee6f5f", sq: .35 },
  r: { name: "막차 질주", e: "🏃", size: 1, run: 1, entry: .25, col: "#58cbe9", sq: 1 },
};
const ITEMS = { m: { e: "📢", name: "안쪽으로!" }, h: { e: "🫧", name: "흡!" } };
// 역: q = 승강장 줄(고정 순서), it = 아이템 든 승객 위치, wmin = 꽉 찼을 때 초록 칸 최소 폭, slack = 여유 칸
const STATIONS = [
  { name: "첫차", q: "oooooooo", open: 0, goal: 5, door: 20, it: {}, first: 1, neu: null, ch: "튕김 0번", wmin: 0.06, wk: 1.2, chain: 0.65, slack: .3 },
  { name: "환승역", q: "ooooooooo", open: 1, goal: 6, door: 20, it: {}, neu: "open", ch: "튀어나감 0명", wmin: 0.1, wk: 0.4, chain: 0.55, slack: .3 },
  { name: "대학가", q: "oobooobooo", open: 1, goal: 7, door: 19, it: {}, neu: "b", ch: "🎒 전부 앞으로", wmin: 0.1, wk: 1, chain: 0.55, slack: .3 },
  { name: "업무지구", q: "ooooboooooo", open: 0, goal: 8, door: 18, it: { 1: "m", 6: "m" }, neu: "m", ch: "📢 없이 ★★", wmin: 0.06, wk: 1, chain: 0.65, slack: .3 },
  { name: "공항철도", q: "oocobooocoo", open: 1, goal: 8, door: 18, it: { 4: "m" }, neu: "c", ch: "🧳 끼임 0번", wmin: 0.1, wk: 1, chain: 0.55, slack: .3 },
  { name: "병원 앞", q: "opocoogoboo", open: 0, goal: 8, door: 18, it: { 2: "m" }, neu: "care", ch: "🙏 배려석 전원", wmin: 0.08, wk: 1.4, chain: 0.5, slack: .3 },
  { name: "퇴근길", q: "oobooco goooo".replace(/ /g, ""), open: 1, goal: 9, door: 17, it: { 1: "h", 6: "h" }, neu: "h", ch: "🫧 흡! 중 2명", wmin: 0.12, wk: 0.3, chain: 0.4, slack: .3 },
  { name: "꽃시장", q: "ofobooc ogooo".replace(/ /g, ""), open: 1, goal: 9, door: 17, it: { 3: "h", 5: "m" }, neu: "f", ch: "💐 꽃잎 0장", wmin: 0.12, wk: 0.2, chain: 0.4, slack: .3 },
  { name: "경기장", q: "aogoboocoaooo", open: 1, goal: 10, door: 16, it: { 3: "h", 7: "m" }, neu: "a", ch: "🏋️ 첫 탑승 ★★", wmin: 0.14, wk: 0.7, chain: 0.4, slack: .3 },
  { name: "월요일 아침", q: "oaogbocofooor", open: 1, goal: 11, door: 16, it: { 2: "h", 7: "m", 10: "h" }, neu: "r", ch: "싹쓸이 + 튀어나감 0", wmin: 0.11, wk: 0.3, chain: 0.45, slack: .3 },
];
// 무한 출근 k번째 역(1부터): 승강장 +1, 문 −0.5초(최소 12초), 반대편 문 번갈아
const ENDLESS = { base: 8, door: 19, goalR: .64, wmin: .1, wk: .6, chain: .55, slack: .3 };
function endlessStation(k) {
  const R = rng(k * 977 + 31), n = ENDLESS.base + k, pool = "ooooobbcfapg";
  let q = "o"; for (let i = 1; i < n - (k % 3 === 0 ? 1 : 0); i++) q += pool[Math.floor(R() * pool.length)];
  if (k % 3 === 0) q += "r";
  const it = {}; for (let i = 2; i < n - 1; i += 4) it[i] = (i / 4 | 0) % 2 ? "h" : "m";
  return { name: `무한 ${k}역`, q, open: k % 2 === 0 ? 1 : 0, goal: Math.round(n * ENDLESS.goalR), door: Math.max(12, ENDLESS.door - .5 * k), it, neu: null, ch: null, wmin: ENDLESS.wmin, wk: ENDLESS.wk, chain: ENDLESS.chain, slack: ENDLESS.slack, endless: k };
}
const psize = p => { const T = TYPES[p.t]; return T.care ? 0 : p.t === "b" && p.flipped ? T.sizeF : T.size; };
// rank: 0 수습 · 1 정식(📢 기본) · 2 베테랑(🧤 되돌리기) · 3 전설(콤보 2.0초)
function newLevel(S, seed, rank = 0) {
  const R = rng(seed || 1), ps = [...S.q].map((t, i) => ({ id: i, t, item: S.it[i] || null, flipped: 0, flipping: 0, jx: (R() * 2 - 1) * 4, petals: 0 }));
  let C = S.slack; ps.forEach(p => { const T = TYPES[p.t]; if (!T.care) C += p.t === "b" ? T.sizeF : T.size; });
  const L = { S, C, rank, t: 0, over: 0, queue: ps.filter(p => p.t !== "r"), runner: null, front: null, readyAt: .2, nextAt: .2, aboard: [], fillU: 0, charge: 0, wasHold: false,
    item: null, itemFrom: -1, eff: { m: 0, h: 0 }, pending: [], walk: null, closeAt: 0, combo: 0, lastRel: -9, lastPerfect: false, score: 0, undoUsed: 0, nope: 0, popped: [], ver: 0,
    st: { pushes: 0, perfect: 0, under: 0, over: 0, bounce: 0, pops: 0, stuck: 0, stuckC: 0, care: 0, flips: 0, bags: ps.filter(p => p.t === "b").length, cares: ps.filter(p => TYPES[p.t].care).length,
      mUse: 0, hUse: 0, hBoard: 0, squeezed: 0, petals: 0, safe: 0, firstT: -1, goalT: -1, maxFill: 0, chainMax: 0, popLeadMin: 9, unwarned: 0, careHarm: 0, inGreen: 0, inGreenOk: 0, firstAth: 0, undo: 0, runWarnRem: -1, runArriveRem: -1, items: 0, comboMax: 0, carriers: 0, flowers: 0, aths: 0 } };
  const r = ps.find(p => p.t === "r"); if (r) L.runner = { p: r, st: "wait" };
  if (rank >= 1 && (S.endless || STATIONS.indexOf(S) >= 3)) { L.item = "m"; L.itemFrom = -1; }
  return L;
}
const rem = L => L.S.door - L.t;
const frontReady = L => !!L.front && L.t >= L.readyAt && !(L.front.flipping > L.t) && !L.walk;
// 초록 칸: 지금 칸 상태로 계산 (판정에 그대로 쓰는 값)
function zone(L, p) {
  if (!p || TYPES[p.t].care) return null;
  const T = TYPES[p.t], S = L.S;
  if (S.first && L.st.pushes === 0) return { need: 0, hi: 1.31, fp: 0 };
  let fp = (L.fillU + psize(p)) / L.C;
  if (L.eff.m > 0) fp = Math.max(0, fp - .22);
  if (L.eff.h > 0) fp *= .8;
  if (fp > 1.0001) return { full: 1, need: 1.31, hi: 1.31, fp };
  let need, w;
  if (T.run) { need = .05; w = .6; }
  else if (T.ath) { need = .1 + .28 * fp ** 1.6; w = (K.W0 * .8 * (S.wk || 1) * (1 - fp) ** K.WEXP + S.wmin) * T.wm; }
  else { need = .18 + T.need + .62 * fp ** 1.6; w = (K.W0 * (S.wk || 1) * (1 - fp) ** K.WEXP + S.wmin) * T.wm; }
  return { need, hi: Math.min(1.3, need + w), fp };
}
function judge(L, p, F) {
  const z = zone(L, p); if (!z) return null;
  if (z.full || F < z.need) return { k: "under", z };
  if (F <= z.hi) return { k: "in", z };
  let n = 1 + Math.floor((F - z.hi) / K.POPDIV) + Math.floor(Math.max(0, z.fp - (L.S.chain ?? K.CHAINF)) / K.CHAINS); if (TYPES[p.t].ath && z.fp > .4) n += 1;
  return { k: L.S.open ? "pop" : "bounce", n, z };
}
const noop = () => {};
function flowerHit(L) { L.aboard.forEach(q => { if (q.t === "f" && !q.wob) { q.petals++; L.st.petals++; } }); }
function schedulePop(L, n, exclude, on) {
  const cand = L.aboard.filter(q => !TYPES[q.t].care && !q.wob && q !== exclude);
  const vs = cand.slice(0, n); if (vs.length < n && exclude && !exclude.wob) vs.push(exclude);
  vs.forEach(v => { v.wob = L.t; v.wobAt = L.t; L.pending.push({ at: L.t + WOBBLE, v }); on("wobble", v); });
  L.st.chainMax = Math.max(L.st.chainMax, vs.length);
  return vs.length;
}
function doRelease(L, F, on) {
  const p = L.front, r = judge(L, p, F), st = L.st; L.charge = 0; if (!r) return;
  st.pushes++; const z = r.z, inG = !z.full && F >= z.need && F <= z.hi;
  const win = L.rank >= 3 ? 2 : 1.5, chained = L.t - L.lastRel <= win;
  L.lastRel = L.t; L.ver++;
  if (r.k === "under") { st.under++; L.readyAt = L.t + K.UNDER; on("under", { p, F, z }); if (inG) st.inGreen++; return; }
  if (r.k === "bounce") {   // 닫힌 문에 퉁: 민 사람 + (연쇄 수 − 1)명의 문 앞 사람이 승강장으로 밀려 나옴
    st.over++; st.bounce++; L.combo = 0; L.lastPerfect = false; L.readyAt = L.t + BOUNCE_BACK; flowerHit(L);
    const out = []; for (let i = L.aboard.length - 1; i >= 0 && out.length < r.n - 1; i--) { const q = L.aboard[i]; if (TYPES[q.t].care || q.wob) continue; L.aboard.splice(i, 1); L.fillU -= psize(q); out.push(q); if (q.t === "r") { st.safe--; L.score -= 300; L.runner.st = "front"; } }
    for (let i = out.length - 1; i >= 0; i--) L.queue.unshift(out[i]);   // 문 앞 순서 유지 (가장 바깥 사람이 맨 앞)
    st.bounceOut = (st.bounceOut || 0) + out.length; st.chainMax = Math.max(st.chainMax, out.length + 1);
    on("bounce", { p, F, z, out }); return; }
  // 탑승
  L.front = null; p.inUntil = L.t + TYPES[p.t].entry; p.boardT = L.t; p.boardFp = z.fp; L.aboard.push(p); L.fillU += psize(p); L.nextAt = L.t + K.STEP;
  if (st.firstT < 0) { st.firstT = L.t; if (p.t === "a") st.firstAth = 1; }
  if (L.eff.h > 0) st.hBoard++;
  if (p.t === "c") st.carriers++; if (p.t === "a") st.aths++; if (p.t === "f") st.flowers++;
  if (p.t === "r") { st.safe++; L.score += 300; L.runner.st = "done"; }
  if (p.item) { L.item = p.item; L.itemFrom = p.id; st.items++; }
  st.maxFill = Math.max(st.maxFill, L.fillU / L.C);
  if (r.k === "in") {
    st.perfect++; if (inG) { st.inGreen++; st.inGreenOk++; }
    L.combo = chained && L.lastPerfect ? L.combo + 1 : 1; st.comboMax = Math.max(st.comboMax, L.combo);
    const mult = Math.min(5, L.combo); L.score += 100 * mult + 50; L.lastPerfect = true;
    if (L.aboard.some(q => q.t === "f" && q !== p && q.boardFp >= .6)) flowerHit(L);
    on("in", { p, F, z, mult });
  } else {
    st.over++; L.combo = 0; L.lastPerfect = false; L.score += 100; flowerHit(L);
    const n = schedulePop(L, r.n, p, on); on("over", { p, F, z, n });
  }
  if (r.k !== "in") L.lastPerfect = false;
  if (st.goalT < 0 && L.aboard.length >= L.S.goal) st.goalT = L.t;
}
function useItem(L, on = noop) {
  if (L.over || !L.item || L.eff.m > 0 || L.eff.h > 0) return false;
  const k = L.item; L.item = null; L.itemFrom = -1; L.eff[k] = EFF_T; L.ver++;
  if (k === "m") { L.st.mUse++; if (L.S.open && L.fillU / L.C > .55) schedulePop(L, 1, null, on); }
  else L.st.hUse++;
  on("item", { k }); return true;
}
function doAct(L, on) {   // 오른쪽 아래 버튼
  if (L.over) return false;
  const p = L.front;
  if (p && frontReady(L) && TYPES[p.t].care) {
    const walkT = 1.2 + 1.3 * Math.min(1, L.fillU / L.C);

}
// HUD

  if (key !== hudCache) { hudCache = key; $("hTv").textContent = R.toFixed(1); $("hT").classList.toggle("hot", R <= 3); $("hPv").textContent = `${n}/${L.S.goal}`; $("hP").classList.toggle("ok", n >= L.S.goal); $("hS").textContent = Math.max(0, L.score); hudIdle(cur); }

// ───────── 루프 ─────────
let lastT = 0;

  if (mode === "intro") { introT += dt; if (introT >= .9) { mode = "play"; } }
  if (mode === "play" && L) {

    acc += ldt;
    while (acc >= DT && mode === "play") {

      const R0 = Math.ceil(rem(L));

      B.gone.forEach(b => { if (!L.popped.includes(b.p) && !L.over) fx.back.push({ p: b.p, x: b.x, y: b.y, t: 0 }); });
      const R1 = Math.ceil(rem(L)); if (R1 !== R0 && R1 <= 3 && R1 >= 1) SFX.beep3(R1);
      if (L.over) { finish(); break; }
    }
    if (holding && frontReady(L) && L.charge > 0) { fx.chargeT -= dt; if (fx.chargeT <= 0) { fx.chargeT = .07; SFX.charge(L.charge); } }

  if (mode === "depart") { departT += dt; if (B && L) stepBodies(B, L, dt, lastF); if (departT > 1.0 && !resultShown) { if (auto) { mode = "result"; setTimeout(() => { if (auto) start(cur, true); }, 1500); } else showResult(); } }
  if (mode === "result") departT += dt;
  if (mode !== "play") $("act").classList.toggle("on", false);
  // 연출 진행
  fx.parts = fx.parts.filter(p => (p.t += dt) < p.life); fx.parts.forEach(p => { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
  fx.fly.forEach(f => f.t += dt); fx.fly = fx.fly.filter(f => f.t < 3.5); fx.back.forEach(f => f.t += dt); fx.back = fx.back.filter(f => f.t < .35);

  fx.shake *= Math.pow(.01, dt); fx.flash = Math.max(0, fx.flash - dt * 2); fx.glove = Math.max(0, fx.glove - dt * 5); fx.nudge = Math.max(0, fx.nudge - dt * 3);

}
function resize() {
  const r = $("app").getBoundingClientRect(); DPR = Math.min(2.5, window.devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR;
  const st = $("sat").getBoundingClientRect().height || 0; geo = mkGeo(W, H, st); if (L && B) B.g = geo;

addEventListener("resize", resize);

// ───────── 자체 검사 (?selftest) ─────────
function selftest() {
  const rows = []; let ok = 0, total = 0; const add = (pass, txt) => { total++; if (pass) ok++; rows.push(`${pass ? "OK  " : "FAIL"} ${txt}`); };
  const TGT = { pass: [98, 92, 88, 84, 80, 76, 72, 68, 62, 55], s3: [50, 42, 36, 32, 28, 24, 20, 16, 13, 10] };
  const t0 = performance.now();
  // [A] 풀림: 최적 봇 × 시드 20 싹쓸이
  STATIONS.forEach((S, i) => { let sw = 0, minR = 99; for (let s = 1; s <= 20; s++) { const L = runBot(S, s * 101 + i, { opt: true }); sw += L.res.sweep; minR = Math.min(minR, rem(L)); } add(sw === 20, `[A${i + 1}] ${S.name} 최적 봇 싹쓸이 ${sw}/20 · 남은 문 최소 ${minR.toFixed(1)}초`); });
  // [B] 곡선: 사람 근사 봇 (반응 0.3초, 힘 오차 ±8%) × 시드 100
  const curve = rank => STATIONS.map((S, i) => { const a = { pass: 0, s3: 0, pops: 0, stuck: 0, under: 0, bounce: 0, dist: [0, 0, 0, 0], inG: 0, inGOk: 0, unwarned: 0, careHarm: 0, leadMin: 9, firstT: 0, goalT: 0, n: 0, el: {} };
    for (let s = 1; s <= 100; s++) { const L = runBot(S, s * 7919 + i, { rank }); const st = L.st; a.pass += L.res.pass; a.s3 += L.res.stars === 3; a.dist[L.res.stars]++; a.pops += st.pops; a.stuck += st.stuck; a.under += st.under; a.bounce += st.bounce; a.inG += st.inGreen; a.inGOk += st.inGreenOk; a.unwarned += st.unwarned; a.careHarm += st.careHarm; a.leadMin = Math.min(a.leadMin, st.popLeadMin); a.firstT = Math.max(a.firstT, st.firstT); if (st.goalT >= 0) a.goalT = Math.max(a.goalT, st.goalT);
      ["perfect", "pops", "flips", "mUse", "carriers", "care", "hUse", "flowers", "aths", "safe"].forEach(k => a.el[k] = (a.el[k] || 0) + st[k]); }
    return a; });
  const cv0 = curve(0), cv3 = curve(3);
  let bOk = true, inv = 0;
  cv0.forEach((a, i) => { const dp = Math.abs(a.pass - TGT.pass[i]), d3 = Math.abs(a.s3 - TGT.s3[i]); if (dp > 8 || d3 > 8) bOk = false; if (i && (a.pass > cv0[i - 1].pass || a.s3 > cv0[i - 1].s3)) inv++; });
  add(bOk && inv === 0, `[B] 곡선 (사람 근사 봇 ×100, 목표 ±8%p, 역전 ${inv})`);
  cv0.forEach((a, i) => rows.push(`     ${String(i + 1).padStart(2)} ${STATIONS[i].name.padEnd(6, "　")} 통과 ${String(a.pass).padStart(3)}% (${TGT.pass[i]}) ★★★ ${String(a.s3).padStart(3)}% (${TGT.s3[i]}) · 튀어나감 ${(a.pops / 100).toFixed(2)} 끼임 ${(a.stuck / 100).toFixed(2)} 모자람 ${(a.under / 100).toFixed(1)} 튕김 ${(a.bounce / 100).toFixed(1)} · ★0/1/2/3 ${a.dist.join("/")}`));
  // [C] 초록 칸 정직성
  const inG = cv0.reduce((s, a) => s + a.inG, 0), inGOk = cv0.reduce((s, a) => s + a.inGOk, 0); add(inGOk / inG >= .9, `[C] 초록 칸에서 뗀 밀기 ${inG}번 중 탑승·튀어나감 0: ${(inGOk / inG * 100).toFixed(1)}% (90% 이상)`);
  // [D] 공정성

  add(firstAll, `[D1] 1역 첫 밀기 0~130% 어떤 힘이든 탑승`);
  const unw = cv0.reduce((s, a) => s + a.unwarned, 0) + cv3.reduce((s, a) => s + a.unwarned, 0), pops = cv0.reduce((s, a) => s + a.pops, 0), lead = Math.min(...cv0.map(a => a.leadMin));
  add(unw === 0 && pops > 0, `[D2] 예고 없는 튀어나감 ${unw}건 / 튀어나감 ${pops}건 · 휘청→튀어나감 최소 ${lead.toFixed(2)}초 (0.3 이상)`);

  let careStuck = 0; STATIONS.forEach((S, i) => { if (!S.q.includes("p") && !S.q.includes("g")) return; for (let s = 1; s <= 30; s++) { const L = runBot(S, s * 17 + i, { react: .6, err: .2 }); careStuck += L.popped.filter(p => TYPES[p.t].care).length + L.st.careHarm; } });
  add(harm === 0 && careStuck === 0, `[D3] 배려 승객 눌림·튀어나감·끼임 ${harm + careStuck}건 (거친 봇 포함)`);
  let runOk = true, runN0 = 0; const S10 = STATIONS[9]; for (let s = 1; s <= 30; s++) { const L = runBot(S10, s * 3 + 1); runN0++; if (Math.abs(L.st.runWarnRem - 5) > DT * 1.5 || L.st.runArriveRem > 3 - .5) runOk = false; }
  add(runOk, `[D4] 막차 질주 ❗ 예고 = 닫히기 5초 전, 도착은 그 뒤 2.6초 (${runN0}판)`);
  // [E] 물리 안정 (몸 배치 600판)

    while (!L.over && k++ < 3600) { stepLevel(L, botInput(L, bot)); stepBodies(Bb, L, DT, L.charge || .6); if (k % 6 === 0) { const c = bodyCheck(Bb, L); e.nan += c.nan; e.wall += c.wall; e.over += c.over; } maxB = Math.max(maxB, Bb.map.size); } }

  L30.queue.forEach((p, i) => { p.inUntil = 0; L30.aboard.push(p); L30.fillU += 1; }); L30.queue = []; for (let k = 0; k < 120; k++) stepBodies(B30, L30, DT);

  // [F] 계급 영향
  const up = cv0.map((a, i) => cv3[i].s3 - a.s3), upMax = Math.max(...up); add(upMax <= 20, `[F] 👑 전설 vs 🔰 수습 ★★★ 증가 최대 ${upMax}%p (20 이하) · ${up.map((u, i) => `${i + 1}:${u >= 0 ? "+" : ""}${u}`).join(" ")}`);
  // [G] 요소 발생

  const gm = need.map(([k, i]) => [k, i, cv0[i].el[k]]); add(gm.every(x => x[2] > 0), `[G] 역마다 새 요소 등장·사용 · ${gm.map(([k, i, v]) => `${i + 1}:${k} ${v}`).join(" ")}`);
  // [H] 첫 성공 · 무한 출근
  const h1 = cv0[0]; add(h1.firstT <= 5 && h1.goalT <= 30, `[H1] 1역 첫 탑승 최대 ${h1.firstT.toFixed(2)}초 (5 이하) · 목표 달성 최대 ${h1.goalT.toFixed(1)}초 (30 이하)`);
  let endTot = 0; const endArr = []; for (let s = 1; s <= 100; s++) { let k = 1; for (; k < 60; k++) { const L = runBot(endlessStation(k), s * 131 + k); if (!L.res.pass) break; } endTot += k - 1; endArr.push(k - 1); }
  add(endTot / 100 >= 6, `[H2] 무한 출근 봇 평균 ${(endTot / 100).toFixed(2)}역 (6 이상) · 중앙값 ${endArr.sort((a, b) => a - b)[50]}`);

  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto">SELFTEST ${ok}/${total}\n${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/${total}`;
  window.__selftest = { ok, total, rows };
}
