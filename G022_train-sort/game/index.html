<!doctype html>
<html lang="ko" class="ui-light ui-kid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc8f5">
<title>기차 칸 줄 세우기</title>
<style>
:root{
  --font-sans:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"D2Coding",Consolas,monospace;
  --ink:#24304a;--card:#fffdf6;--acc:#ffb703;--sh:0 4px 0 rgba(36,48,74,.18),0 8px 18px rgba(36,48,74,.14);
  /* 공용 UI 키트 강조색(주 버튼·별에만). 게임 밖 UI는 키트 부품(ui-*)으로 */
  --ui-accent:#ffb703;--ui-on-accent:#24304a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
body{font-family:var(--font-sans);color:var(--ink);background:linear-gradient(#7cc8f5 0%,#bfe7ff 45%,#d9f2c4 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all;letter-spacing:-.01em;
  display:flex;flex-direction:column;align-items:center;
  padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
/* 위: 메뉴 · 레벨 · 이동 · 별 목표 · 소리 (칩은 아이콘 + 숫자) */
header{width:100%;max-width:480px;display:flex;align-items:center;gap:var(--ui-s2);height:var(--ui-touch);flex:none}
header .ui-chip{height:40px;gap:var(--ui-s1);padding:0 var(--ui-s3) 0 var(--ui-s2);font-size:var(--ui-t4)}
header .ui-chip .ui-icon{width:20px;height:20px}
header .ui-btn{flex:none}
#lvl{min-width:40px;justify-content:center;padding:0 var(--ui-s2);background:var(--ui-text);color:var(--ui-surface)}   /* 레벨 번호: 진한 칩 */
#goal .ui-stars .ui-icon{width:14px;height:14px;color:var(--ui-muted);opacity:.45}
#goal.got .ui-stars .ui-icon{color:var(--ui-accent);opacity:1}
#goal .ui-stars{gap:1px;margin-right:2px}
@media (max-width:359px){body{padding-left:var(--ui-s2);padding-right:var(--ui-s2)}header{gap:var(--ui-s1)}header .ui-chip{font-size:var(--ui-t3);padding:0 var(--ui-s2)}#goal .ui-stars .ui-icon{width:12px;height:12px}}
.g-sky{background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
#wrap{position:relative;flex:none;margin-top:auto}
canvas{display:block;touch-action:none;border-radius:var(--ui-r3);box-shadow:0 6px 20px rgba(36,48,74,.18)}
/* 아래: 되돌리기 · 처음부터 · 힌트 (56px 둥근 아이콘 버튼, 사이 24px) */
nav{width:100%;max-width:480px;display:flex;justify-content:center;gap:var(--ui-s5);margin-top:var(--ui-s4);margin-bottom:auto;flex:none}
nav .ui-btn .ui-icon,header .ui-btn .ui-icon{width:24px;height:24px}
/* 겹 화면: 키트 ui-screen(dim) + 카드. 켜고 끄기는 .on */
.ov.ui-screen{display:none}.ov.ui-screen.on{display:flex}
.ov.ui-screen.dim{background:color-mix(in srgb,var(--ink) 40%,transparent)}   /* 판이 비쳐 보이게 어둡게(밝은 키트 dim은 판이 하얗게 바램) */
.ov .ui-card{width:100%}
#resbox,#cardbox{animation:pop .3s var(--ui-in) both}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.04)}100%{transform:none}}
#resbox .ui-stars .ui-icon{width:48px;height:48px}
#resbox .ui-stars .ui-icon:not(.off){animation:spin .5s cubic-bezier(.2,1.6,.4,1) both}
#resbox .ui-stars .ui-icon:nth-child(1){animation-delay:.15s}#resbox .ui-stars .ui-icon:nth-child(2){animation-delay:.37s}#resbox .ui-stars .ui-icon:nth-child(3){animation-delay:.59s}
@keyframes spin{from{transform:scale(.35) rotate(-90deg)}to{transform:none}}
.g-moves{display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);font-size:var(--ui-t5);font-weight:700;line-height:1}
.g-moves .ui-icon{color:var(--ui-muted)}
.g-gain{display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);font-size:var(--ui-t4);font-weight:700;line-height:1;background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3) var(--ui-s4)}
.g-gain .ui-icon{color:var(--ui-muted)}
.g-gain .ui-icon.fill{color:var(--ui-accent)}
#resbox .ui-row{gap:var(--ui-s5)}
#resbox .ui-btn.primary{flex:1;font-size:var(--ui-t5);font-variant-numeric:tabular-nums}
#resbox .ui-btn .ui-icon{width:24px;height:24px}
#resbox .ui-em{width:36px;height:36px;font-size:24px;background:var(--ui-surface);border-radius:var(--ui-r1)}
.newcar{height:96px;display:flex;align-items:center;justify-content:center}
.newcar span{font-size:80px;line-height:1;display:inline-block;animation:drop .7s cubic-bezier(.2,1.6,.4,1) .9s both,wig 1.6s ease-in-out 1.7s infinite;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25))}
@keyframes drop{from{transform:translateY(-20px) scale(.6)}to{transform:none}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}
/* 규칙 카드: 그림 시연(글 없음) */
.slot{display:inline-block;width:34px;height:26px;border:3px dashed #8c96a8;border-radius:7px;margin:0 2px}
.row{display:flex;gap:var(--ui-s3);justify-content:center}
.scene{font-size:44px;line-height:1.2;position:relative;height:120px;display:flex;align-items:center;justify-content:center;gap:4px;width:100%}
.scene .h{position:absolute;font-size:40px;animation:hd 1.8s ease-in-out infinite;left:46%;top:42%}
@keyframes hd{0%,15%{transform:translate(-40px,-30px)}55%,70%{transform:translate(30px,26px)}100%{transform:translate(-40px,-30px)}}
.scene .bo{display:inline-block;animation:bo 1.4s ease-in-out infinite}
@keyframes bo{0%,30%{transform:translateX(30px)}50%{transform:translateX(0)}65%{transform:translateX(22px)}100%{transform:translateX(30px)}}
.scene .sm{font-size:30px}
.tapme{font-size:26px;animation:pl 1s ease-in-out infinite;display:inline-block}
@keyframes pl{50%{transform:scale(1.18)}}
/* 레벨 고르기: 5칸 격자, 별, 자물쇠 */
#menu.ui-screen{padding-left:var(--ui-s3);padding-right:var(--ui-s3)}
#grid{grid-template-columns:repeat(5,1fr)}
#grid .ui-level .ui-stars .ui-icon{width:12px;height:12px}
#grid .ui-level.lock .ui-icon{width:20px;height:20px}
#menu .ui-head .ui-chip{box-shadow:none;background:var(--ui-surface2);height:40px;font-size:var(--ui-t4)}
#menu .ui-head .ui-chip .ui-icon{width:20px;height:20px;color:var(--ui-accent)}
#hand{position:fixed;left:0;top:0;font-size:44px;pointer-events:none;z-index:30;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));transform-origin:30% 10%}
#selftest{position:fixed;inset:0;margin:0;overflow:auto;background:#fff;color:#111;font:12px/1.45 var(--font-mono);padding:10px;z-index:90;white-space:pre-wrap}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}
.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}
.ui-btn:active{transform:scale(.96)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.ui-level:active{transform:scale(.94)}
.ui-level.cur{box-shadow:inset 0 0 0 2px var(--ui-text)}   /* 강조색은 주 버튼에만 → 지금 칸은 테두리로 */
.ui-level.lock{color:var(--ui-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line);pointer-events:none}
.ui-level .ui-stars .ui-icon{width:10px;height:10px}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}
.ui-stars .off{color:var(--ui-line);opacity:1}
.ui-light .ui-stars .off{color:rgba(15,20,30,.15)}
.ui-stars.big .ui-icon{width:40px;height:40px}
.ui-stars.big{gap:var(--ui-s2)}

/* HUD: 위쪽 칩 줄 */
.ui-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:var(--ui-s2);align-items:center;padding:var(--ui-s3);padding-top:max(var(--ui-s3),env(safe-area-inset-top));pointer-events:none}
.ui-hud>*{pointer-events:auto}
.ui-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--ui-s3);border-radius:999px;background:color-mix(in srgb,var(--ui-surface) 86%,transparent);box-shadow:var(--ui-shadow1);font:700 var(--ui-t2)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ui-text)}
.ui-chip .ui-icon{width:16px;height:16px;color:var(--ui-muted)}
.ui-chip.accent .ui-icon{color:var(--ui-accent)}
.ui-meter{height:6px;border-radius:999px;background:var(--ui-surface2);overflow:hidden}
.ui-meter>i{display:block;height:100%;background:var(--ui-accent);border-radius:inherit;transition:width 200ms var(--ui-in)}

/* 안내 카드(한 번에 하나) · 토스트 · 시트 */
.ui-tip{display:flex;align-items:center;gap:var(--ui-s3);background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s3) var(--ui-s4);box-shadow:var(--ui-shadow2);font-size:var(--ui-t3);line-height:1.5;color:var(--ui-text);font-family:var(--ui-font)}
.ui-tip .ui-icon{color:var(--ui-accent)}
.ui-toast{position:fixed;left:50%;bottom:max(var(--ui-s6),env(safe-area-inset-bottom));z-index:80;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--ui-text);color:var(--ui-bg);padding:var(--ui-s3) var(--ui-s4);border-radius:var(--ui-r1);font:700 var(--ui-t2)/1.25 var(--ui-font);max-width:calc(100vw - 32px);width:max-content;text-align:center;transition:opacity 180ms var(--ui-in),transform 180ms var(--ui-in)}
.ui-toast.on{opacity:1;transform:translate(-50%,0)}
.ui-toast.top{bottom:auto;top:max(25%,env(safe-area-inset-top))}
.ui-sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--ui-surface);border-radius:var(--ui-r3) var(--ui-r3) 0 0;padding:var(--ui-s5);padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));box-shadow:var(--ui-shadow2);transform:translateY(100%);transition:transform 195ms var(--ui-out)}
.ui-sheet.on{transform:none;transition:transform 225ms var(--ui-in)}
.ui-sheet:not(.on){box-shadow:none}
.ui-scrim{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity 195ms var(--ui-out)}
.ui-scrim.on{opacity:1;pointer-events:auto;transition:opacity 225ms var(--ui-in)}
.ui-list{display:flex;flex-direction:column;gap:var(--ui-s2)}
.ui-list li{display:flex;align-items:center;gap:var(--ui-s3);font-size:var(--ui-t2);line-height:1.5}
.ui-list li .ui-icon{color:var(--ui-muted)}
.ui-em{width:28px;height:28px;display:inline-grid;place-items:center;font-size:20px;line-height:1;flex:none}

/* 등장 모션 */
.ui-enter{animation:ui-enter 225ms var(--ui-in) both}
.ui-enter-2{animation:ui-enter 225ms var(--ui-in) 60ms both}
.ui-enter-3{animation:ui-enter 225ms var(--ui-in) 120ms both}
.ui-pop{animation:ui-pop 300ms var(--ui-in) both}
@keyframes ui-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ui-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ui-enter,.ui-enter-2,.ui-enter-3,.ui-pop{animation:ui-fade 150ms linear both}.ui-btn,.ui-level{transition:none}}
@keyframes ui-fade{from{opacity:0}to{opacity:1}}

/* 화면 머리 · 목록 줄 · 아래 고정 · 단계 막대 · 한 줄 카드 (2026-11-27 G003 시범에서 추가) */

    ctx.globalAlpha = a; ctx.fillStyle = COLORS[c]; rr(-CW / 2, -18, CW, 27, 8); ctx.fill();
    ctx.globalAlpha = Math.min(1, a + .25); ctx.setLineDash([5, 3]); ctx.lineWidth = 2.5; ctx.strokeStyle = shade(COLORS[c], -.3); rr(-CW / 2, -18, CW, 27, 8); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1; emoji(FRUIT[c], 0, -3, 17, Math.min(1, a + .3));
    ctx.restore();
  }
  if (hover === ST || canDrop(ST)) { ctx.fillStyle = hover === ST ? "rgba(255,240,150,.6)" : "rgba(255,240,150,.3)"; rr(ST_X0 - 26, Y_ST - 26, W - ST_X0 + 22, 54, 14); ctx.fill(); }
  drawLoco(20 + dx, Y_ST);
}
function drawBear() {
  const x = 328, y = 28 - (bear.hop > 0 ? Math.abs(Math.sin(bear.hop * .3)) * 8 : 0);
  ctx.save(); ctx.translate(x, y + 12); ctx.rotate(bear.tilt + (guide && guide.type === "stuck" ? Math.sin(tick * .08) * .06 : 0)); emoji("🐻", 0, -12, 28);
  ctx.fillStyle = "#2b59c3"; rr(-9, -27, 18, 5, 2); ctx.fill();  // 역장 모자(곰과 같이 기운다)
  ctx.restore();
  if (guide && guide.type === "stuck") {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x - 40, y - 4, 17, 14, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(x - 22, y + 6, 3, 0, 7); ctx.fill();
    emoji("🤔", x - 40, y - 4, 18);
  }
}
function render() {
  if (!S) return;
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  drawBG(); drawTracks(); drawStation(); drawBear();
  const dx = departX();
  // 칸: 끌고 있는 칸·움직이는 칸은 맨 위에
  const order = cars.map((c, id) => id).sort((a, b) => (cars[a].path || drag && drag.id === a ? 1 : 0) - (cars[b].path || drag && drag.id === b ? 1 : 0));
  const canMove = new Set();
  if (phase === "play") { if (S.s.r < S.lv.train.length) canMove.add(S.s.r); S.s.sd.forEach(a => a.length && canMove.add(a[a.length - 1])); }
  for (const id of order) {
    const c = cars[id], col = COLORS[S.lv.train[id]], fr = FRUIT[S.lv.train[id]];
    let x = c.x, y = c.y, ring = null;
    const atSt = !c.path && whereOf(id) === ST;
    if (atSt) x += dx;
    if (canMove.has(id) && !c.path && !(drag && drag.id === id)) { y += -2 - 2 * Math.abs(Math.sin(tick * .09 + id)); ring = "rgba(255,255,255,.8)"; }
    if (selected && selected.id === id) { y -= 5; ring = "#ffd23f"; }
    if (drag && drag.id === id) ring = "#ffd23f";
    drawCar(x, y, col, fr, { sq: c.sq, ring });
  }
  // 손짓 유령 칸
  if (guide && guide.type === "hand" && guide.gx !== undefined) { const id = guide.id; drawCar(guide.gx, guide.gy, COLORS[S.lv.train[id]], FRUIT[S.lv.train[id]], { alpha: Math.max(0, guide.ga) }); }
  // 파티클
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * (p.kind === "smoke" ? .8 : 1)));
    ctx.fillStyle = p.col;
    if (p.kind === "conf") { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-3, -2, 6, 4); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
let acc = 0, lastT = performance.now();
function pump(t) {
  acc += Math.min(250, Math.max(0, t - lastT)); lastT = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
}
function frame() { pump(performance.now()); requestAnimationFrame(frame); }
// rAF 가 멈춘 환경(백그라운드·헤드리스 녹화)에서도 고정 틱이 돌게
setInterval(() => { if (performance.now() - lastT > 120) pump(performance.now()); }, 50);

// ───────────────────────── 자동 플레이 (?autoplay=N, 녹화용): 손짓을 보인 뒤 실제로 옮긴다 ─────────────────────────
function startAutoplay(i) {
  load(i); let wait = 40;
  bot = () => {
    if (phase !== "play" || S.done) return;
    if (moving()) return;
    if (guide && guide.type === "hand") { if (guide.t >= 80) { const [src, dst] = guide.mv; setGuide(null); doMove(src, dst); wait = 24; } return; }
    if (--wait > 0) return;
    const h = S.hint(); if (h.kind !== "move") return;
    const [src, dst] = h.mv, id = topOf(S.s, src);
    const to = dst === ST ? slotPos(ST, S.s.st.length) : slotPos(dst, S.s.sd[dst].length);
    setGuide({ type: "hand", id, from: homeOf(id), to, reps: 1, mv: h.mv });
  };
}

// ───────────────────────── 자체 검사 (?selftest) ─────────────────────────
function runSelftest() {
  const rows = [], fails = [];
  let pass = 0, total = 0;
  const ck = (ok, what) => { total++; if (ok) pass++; else fails.push(what); return ok; };
  const T0 = performance.now();
  const sols = LEVELS.map(lv => solveFrom(startState(lv), lv));
  const solveMs = performance.now() - T0;
  let maxCheckMs = 0;
  const timed = f => { const t = performance.now(); const r = f(); maxCheckMs = Math.max(maxCheckMs, performance.now() - t); return r; };
  const firstAt = { two: 0, short: 0, dup: 0, custom: 0 };
  LEVELS.forEach((lv, i) => {
    const L = i + 1, tag = "L" + String(L).padStart(2, "0"), marks = [];
    if (!firstAt.two && lv.sidings === 2) firstAt.two = L;
    if (!firstAt.short && lv.sidings && lv.cap === 2) firstAt.short = L;
    if (!firstAt.dup && new Set(lv.order).size < lv.order.length) firstAt.dup = L;
    if (!firstAt.custom && lv.order.some((c, k) => k && c < lv.order[k - 1])) firstAt.custom = L;
    // [A] 풀림
    const sol = sols[i];
    marks.push(ck(!!sol, tag + " A 풀림") ? "A" : "a");
    // [B] 최소 수 = opt_moves, 실제 Session 으로 재생
    let bOk = !!sol && sol.length === lv.opt_moves;
    if (bOk) { const s = new Session(i); for (const [a, b] of sol) if (!s.tryMove(a, b).ok) bOk = false; bOk = bOk && s.done && s.moves === lv.opt_moves && s.s.st.every((id, q) => lv.train[id] === lv.order[q]); }
    marks.push(ck(bOk, tag + " B 최소 수·재생") ? "B" : "b");
    // [C] 곡선: 고친 곡선 ±1, 상태 수·막힌 판 비율·무작위 봇 풀림률
    marks.push(ck(Math.abs(lv.opt_moves - CURVE[i]) <= 1, tag + " C 곡선") ? "C" : "c");
    // 도달 가능 상태 전부 + 거꾸로 퍼뜨려 '풀 수 있음' 계산(봇과 다른 방법)
    const st0 = startState(lv), all = new Map([[keyOf(st0, lv), st0]]), edges = new Map(), qq = [st0];
    while (qq.length) { const s = qq.pop(), k = keyOf(s, lv), out = []; for (const mv of movesOf(s, lv)) { const n = apply(s, mv), nk = keyOf(n, lv); out.push(nk); if (!all.has(nk)) { all.set(nk, n); qq.push(n); } } edges.set(k, out); }
    const good = new Set([...all.entries()].filter(([, s]) => isDone(s, lv)).map(([k]) => k));
    let grew = true; while (grew) { grew = false; for (const [k, out] of edges) if (!good.has(k) && out.some(o => good.has(o))) { good.add(k); grew = true; } }
    const dead = all.size - good.size;
    const R = rng(1000 + L); let rOk = 0;
    for (let run = 0; run < 50; run++) { let s = startState(lv); for (let m = 0; m < 300 && !isDone(s, lv); m++) { const mv = movesOf(s, lv); if (!mv.length) break; s = apply(s, mv[Math.floor(R() * mv.length)]); } if (isDone(s, lv)) rOk++; }
    // [E] 막힘 판정 = 봇 '해 없음' (모든 도달 가능 상태)
    let eOk = true; for (const [k, s] of all) if (timed(() => isStuck(s, lv)) !== !good.has(k)) eOk = false;
    if (L === 1) eOk = eOk && dead === 0;
    marks.push(ck(eOk, tag + " E 막힘 판정") ? "E" : "e");
    // [E2] 막힌 판에서 💡는 ↩️, 손짓 횟수만큼 ↩️ 누르면 풀 수 있는 상태(그보다 적으면 아직 막힘)
    let e2 = true, stuckSeen = 0; const R2 = rng(77 + L);
    for (let run = 0; run < 40; run++) {
      const s = new Session(i);
      for (let m = 0; m < 40 && !s.done; m++) {
        const mv = movesOf(s.s, lv); if (!mv.length) break;
        const [a, b] = mv[Math.floor(R2() * mv.length)]; s.tryMove(a, b);
        if (s.stuckNow) {
          stuckSeen++;
          const h = timed(() => s.hint());
          if (h.kind !== "undo") { e2 = false; break; }
          for (let u = 0; u < h.n; u++) { if (!s.stuckNow) e2 = false; s.undo(); }
          if (s.stuckNow || isStuck(s.s, lv)) e2 = false;
          break;
        }
      }
    }
    marks.push(ck(e2, tag + " E 막힘→↩️") ? "U" : "u");
    // [F] 역 거절: 순서 아닌 색을 역에 놓으면 상태·이동 수 그대로 (100번)
    let fOk = true, tries = 0; const R3 = rng(500 + L);
    for (let g = 0; g < 2000 && tries < 100; g++) {
      const s = new Session(i); const k0 = Math.floor(R3() * 6);
      for (let m = 0; m < k0 && !s.done; m++) { const mv = movesOf(s.s, lv); if (!mv.length) break; const [a, b] = mv[Math.floor(R3() * mv.length)]; s.tryMove(a, b); }
      if (s.done) continue;
      const srcs = [-1, ...s.s.sd.map((_, j) => j)].filter(src => (src === -1 ? s.s.r < lv.train.length : s.s.sd[src].length) && lv.train[topOf(s.s, src)] !== lv.order[s.s.st.length]);
      if (!srcs.length) continue;
      const src = srcs[Math.floor(R3() * srcs.length)], key = keyOf(s.s, lv), mv0 = s.moves, h0 = s.hist.length;
      const r = s.tryMove(src, ST); tries++;
      if (r.ok || keyOf(s.s, lv) !== key || s.moves !== mv0 || s.hist.length !== h0) fOk = false;
    }
    if (L === 1) fOk = fOk && tries === 0 || fOk;   // 1레벨은 틀린 색이 나올 수 없을 수도 있다
    marks.push(ck(fOk, tag + " F 역 거절") ? "F" : "f");
    // [G] 힌트 정직성: 풀 수 있는 상태에서 무작위 5수 뒤 💡를 따라가면 남은 최소 수만큼으로 풀림
    let gOk = true; const R4 = rng(900 + L);
    for (let run = 0; run < 5; run++) {
      const s = new Session(i);
      for (let m = 0; m < 5 && !s.done; m++) { const mv = movesOf(s.s, lv).filter(x => !isStuck(apply(s.s, x), lv)); if (!mv.length) break; const [a, b] = mv[Math.floor(R4() * mv.length)]; s.tryMove(a, b); }
      const left = (solveFrom(s.s, lv) || []).length; let used = 0;
      while (!s.done && used < 99) { const h = timed(() => s.hint()); if (h.kind !== "move") { gOk = false; break; } s.tryMove(...h.mv); used++; }
      if (!s.done || used !== left) gOk = false;
    }
    marks.push(ck(gOk, tag + " G 힌트") ? "G" : "g");
    rows.push(`${tag} ${marks.join("")}  최소 ${lv.opt_moves} (곡선 ${CURVE[i]} · 기획표 ${lv.brief})  칸 ${lv.train.length} 옆 ${lv.sidings}×${lv.cap || "-"}  상태 ${all.size} 막힌 판 ${(dead / all.size * 100).toFixed(0)}%  무작위 봇 ${rOk * 2}%  막힘 만남 ${stuckSeen}`);
  });
  // [D] 규칙 일치
  const D = [];
  D.push(ck(firstAt.two === 6, "D 옆 선로 2개 6") ? "옆2=6" : "옆2≠6(" + firstAt.two + ")");
  D.push(ck(firstAt.short === 11, "D 짧은 선로 11") ? "짧은=11" : "짧은≠11(" + firstAt.short + ")");
  D.push(ck(firstAt.dup === 21, "D 같은 색 21") ? "같은색=21" : "같은색≠21(" + firstAt.dup + ")");
  D.push(ck(firstAt.custom === 26, "D 순서표 26") ? "순서표=26" : "순서표≠26(" + firstAt.custom + ")");
  const l16 = LEVELS[15], noSS = solveFrom(startState(l16), l16, false);
  D.push(ck(!noSS || noSS.length > l16.opt_moves, "D 16 옆→옆 필수") ? "16옆→옆필수" : "16옆→옆없이도됨");
  let early = true; LEVELS.slice(0, 15).forEach(lv => { if (lv.sidings === 2) { const p = solveFrom(startState(lv), lv, false); if (!p || p.length !== lv.opt_moves) early = false; } });
  D.push(ck(early, "D 1~15 옆→옆 없이 최소") ? "1~15옆→옆불필요" : "1~15옆→옆필요있음");
  // [H] 첫 성공·속도
  const H1 = ck(sols[0] && sols[0].length === 3, "H 1레벨 3수");
  const H2 = ck(solveMs <= 1000, "H 전체 풀이 1초");
  const H3 = ck(maxCheckMs <= 50, "H 힌트·막힘 50ms");
  rows.push(`[D] ${D.join(" · ")}`);
  rows.push(`[H] 1레벨 3수 ${H1 ? "✓" : "✗"} · 30레벨 풀이 ${solveMs.toFixed(1)}ms ${H2 ? "✓" : "✗"} · 💡·막힘 최대 ${maxCheckMs.toFixed(1)}ms ${H3 ? "✓" : "✗"}`);
  rows.push(`검사 ${pass}/${total}${fails.length ? "  실패: " + fails.join(", ") : ""}`);
  rows.push(`표시: A 풀림 B 최소 수·재생 C 곡선 E 막힘 판정 U 막힘→↩️ F 역 거절 G 힌트 (소문자 = 실패)`);
  const pre = document.createElement("pre"); pre.id = "selftest"; pre.textContent = rows.join("\n"); document.body.appendChild(pre);
  document.title = `SELFTEST ${pass}/${total}`;
}

// ───────────────────────── 시작 ─────────────────────────
resize();
// ?level=N·?autoplay=N 이 있을 때만 그 레벨. 없으면 저장된 마지막 판(해금 범위 안)
const qRaw = parseInt(Q.get("level") || Q.get("autoplay") || "", 10);
const qLevel = Number.isFinite(qRaw) ? Math.max(1, Math.min(LEVELS.length, qRaw)) : 0;
if (SELFTEST) { load(0); runSelftest(); }
else if (AUTOPLAY) startAutoplay((qLevel || 1) - 1);
else load(qLevel ? qLevel - 1 : Math.max(1, Math.min(save.last || save.unlocked, save.unlocked, LEVELS.length)) - 1);
requestAnimationFrame(frame);
</script>
