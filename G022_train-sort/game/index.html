{"n":20,"train":[1,3,2,4,0,5],"order":[0,1,2,3,4,5],"sidings":2,"cap":2,"opt_moves":13,"target":13,"brief":16},{"n":21,"train":[1,0,4,2,3,0],"order":[0,0,1,2,3,4],"sidings":2,"cap":2,"opt_moves":12,"target":12,"brief":15},{"n":22,"train":[1,3,2,4,0,2],"order":[0,1,2,2,3,4],"sidings":2,"cap":2,"opt_moves":13,"target":13,"brief":16},{"n":23,"train":[1,2,4,0,5,3,1],"order":[0,1,1,2,3,4,5],"sidings":2,"cap":2,"opt_moves":13,"target":13,"brief":17},{"n":24,"train":[1,3,2,4,0,3,5],"order":[0,1,2,3,3,4,5],"sidings":2,"cap":2,"opt_moves":14,"target":14,"brief":18},{"n":25,"train":[2,4,0,3,5,1,4],"order":[0,1,2,3,4,4,5],"sidings":2,"cap":2,"opt_moves":14,"target":14,"brief":19},{"n":26,"train":[1,4,5,2,0,3,3],"order":[5,3,1,2,0,4,3],"sidings":2,"cap":2,"opt_moves":13,"target":13,"brief":18},{"n":27,"train":[4,5,3,3,1,0,2],"order":[3,0,4,5,2,3,1],"sidings":2,"cap":2,"opt_moves":13,"target":13,"brief":19},{"n":28,"train":[2,4,5,0,1,3,1],"order":[1,2,4,5,1,0,3],"sidings":2,"cap":2,"opt_moves":14,"target":14,"brief":20},{"n":29,"train":[2,0,3,4,1,0,5],"order":[1,2,3,0,0,5,4],"sidings":2,"cap":2,"opt_moves":14,"target":14,"brief":21},{"n":30,"train":[2,4,1,3,0,5,5],"order":[1,5,2,3,5,4,0],"sidings":2,"cap":2,"opt_moves":14,"target":14,"brief":22}]/*LEVELS_END*/;
// 기획 표(brief.md)에서 이 규칙으로 만들 수 없는 값을 고친 곡선 (gen_levels.py CURVE 와 같다)
const CURVE = [3,4,5,6,7,6,7,8,9,9,8,9,9,10,10,10,11,12,13,13,12,13,13,14,14,13,13,14,14,14];
const COLORS = ["#ff5a5f","#ff9f1c","#ffd23f","#3ccf6e","#2f9bff","#5b5fe0","#b45cf0"];
const FRUIT = ["🍎","🍊","🍋","🥦","🐟","🫐","🍇"];
const CARGO = [null,"🐄","🪵","🧸","🎪","🐧"];       // 5레벨마다 새 화물 칸 (그림만 바뀜)
const RULE_ICON = {2:"⤵️",6:"✌️",11:"🤏",16:"↔️",21:"👯",26:"🔀"};
const ST = 9; // 목적지: 역
const Q = new URLSearchParams(location.search);
const SELFTEST = Q.has("selftest"), AUTOPLAY = Q.has("autoplay"), BOT = SELFTEST || AUTOPLAY;
const JUICE = !Q.has("nojuice");

// ───────────────────────── 규칙 (게임·봇·검사가 같이 쓰는 순수 함수) ─────────────────────────
// 상태 = { r: 들어오는 선로에서 빠진 칸 수, sd: [옆 선로별 칸 id 목록(끝이 입구)], st: [역에 붙은 칸 id] }
// 칸 id = train 배열 번호. train[0] 이 맨 앞(갈림길 쪽) 칸
function startState(lv) { return { r: 0, sd: Array.from({ length: lv.sidings }, () => []), st: [] }; }
function clone(s) { return { r: s.r, sd: s.sd.map(a => a.slice()), st: s.st.slice() }; }
function keyOf(s, lv) { let k = s.r + "|"; for (const a of s.sd) { for (const id of a) k += lv.train[id]; k += "|"; } return k + s.st.length; }
function isDone(s, lv) { return s.st.length === lv.train.length; }
function topOf(s, src) { return src === -1 ? s.r : s.sd[src][s.sd[src].length - 1]; }
function movesOf(s, lv, allowSS = true) {
  const out = [], n = lv.train.length, need = lv.order[s.st.length];
  const srcs = [];
  if (s.r < n) srcs.push(-1);
  for (let j = 0; j < s.sd.length; j++) if (s.sd[j].length) srcs.push(j);
  for (const src of srcs) {
    const c = lv.train[topOf(s, src)];
    if (c === need) out.push([src, ST]);
    for (let k = 0; k < s.sd.length; k++) {
      if (k === src || s.sd[k].length >= lv.cap) continue;
      if (src >= 0 && !allowSS) continue;
      out.push([src, k]);
    }
  }
  return out;
}
// 옮기기 검사: 되면 null, 안 되면 이유
function illegal(s, lv, src, dst) {
  if (src === -1 ? s.r >= lv.train.length : !(s.sd[src] && s.sd[src].length)) return "empty";
  if (src === dst) return "same";
  if (dst === ST) return lv.train[topOf(s, src)] === lv.order[s.st.length] ? null : "wrong";
  if (!s.sd[dst]) return "nope";
  return s.sd[dst].length >= lv.cap ? "full" : null;
}
function apply(s, mv) {
  const n = clone(s), [src, dst] = mv;
  const id = src === -1 ? n.r++ : n.sd[src].pop();
  if (dst === ST) n.st.push(id); else n.sd[dst].push(id);
  return n;
}
// 풀이 봇: 너비 우선 탐색. 지금 상태에서 최소 풀이(옮기기 목록) 또는 null(막힌 판)
function solveFrom(s0, lv, allowSS = true) {
  if (isDone(s0, lv)) return [];
  const seen = new Map([[keyOf(s0, lv), null]]);
  let frontier = [s0], keys = [keyOf(s0, lv)];
  while (frontier.length) {
    const nf = [], nk = [];
    for (let i = 0; i < frontier.length; i++) {
      const s = frontier[i];
      for (const mv of movesOf(s, lv, allowSS)) {
        const ns = apply(s, mv), k = keyOf(ns, lv);
        if (seen.has(k)) continue;
        seen.set(k, [keys[i], mv]);
        if (isDone(ns, lv)) {
          const path = []; let cur = k;
          while (seen.get(cur)) { const [pk, m] = seen.get(cur); path.push(m); cur = pk; }
          return path.reverse();
        }
        nf.push(ns); nk.push(k);
      }
    }
    frontier = nf; keys = nk;
  }
  return null;
}
const isStuck = (s, lv) => solveFrom(s, lv) === null;
function starsFor(moves, opt) { return moves <= opt ? 3 : moves <= opt + Math.max(2, Math.ceil(opt / 2)) ? 2 : 1; }

// 한 판 기록: 화면·봇·검사가 이 객체 하나로 움직인다
class Session {
  constructor(i) { this.i = i; this.lv = LEVELS[i]; this.reset(); }
  reset() { this.s = startState(this.lv); this.hist = []; this.moves = 0; this.acts = 0; this.hints = 0; this.undos = 0; this.stuck = 0; this.stuckNow = false; this.done = false; this.failed = false; this.t0 = Date.now(); }
  tryMove(src, dst) {
    if (this.done) return { ok: false, why: "done" };
    const why = illegal(this.s, this.lv, src, dst);
    if (why) return { ok: false, why };               // 역 거절·꽉 참: 상태·이동 수 그대로
    const id = topOf(this.s, src);
    this.hist.push(this.s); this.s = apply(this.s, [src, dst]); this.moves++; this.acts++;
    this.done = isDone(this.s, this.lv);
    const was = this.stuckNow; this.stuckNow = !this.done && isStuck(this.s, this.lv);

  }
  undo() {
    if (!this.hist.length || this.done) return false;
    this.s = this.hist.pop(); this.moves--; this.undos++;
    this.stuckNow = isStuck(this.s, this.lv);

  }
  // 막힌 판에서 풀 수 있는 상태까지 ↩️ 몇 번
  undoNeed() { for (let k = 1; k <= this.hist.length; k++) if (!isStuck(this.hist[this.hist.length - k], this.lv)) return k; return this.hist.length; }
  hint() {
    if (this.done) return { kind: "done" };
    const p = solveFrom(this.s, this.lv);
    if (!p) return { kind: "undo", n: this.undoNeed() };
    return { kind: "move", mv: p[0], left: p.length };
  }
}

// 시드 고정 난수
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ───────────────────────── 저장 (막혀도 게임은 돈다) ─────────────────────────
const SAVE_KEY = "g022";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "{}") || {}; } catch (e) { return {}; } },
  set(v) { if (BOT) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let save = BOT ? {} : store.get();
save.stars = save.stars || {}; save.best = save.best || {}; save.seen = save.seen || {}; save.card = save.card || {};
save.unlocked = save.unlocked || 1; save.mute = !!save.mute;
const totalStars = () => Object.values(save.stars).reduce((a, b) => a + b, 0);

// ───────────────────────── 오락실 신호 (input · level_start · level_clear · fail) ─────────────────────────
function emit(ev, data = {}) { if (BOT) return; try { if (window.parent !== window) window.parent.postMessage({ type: "nhc-game", game: "G022", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0, pendingStart = false;
addEventListener("pointerdown", () => {
  const t = Date.now(); if (t - lastInputEmit >= 4000) { lastInputEmit = t; emit("input"); }
  if (pendingStart) { pendingStart = false; emit("level_start", { level: S.i + 1 }); }

// ───────────────────────── 효과음 (Web Audio 합성, 첫 터치 뒤) ─────────────────────────
let ac = null, noiseBuf = null;
function audio() {
  if (save.mute || BOT && !AUTOPLAY) return null;
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); const len = ac.sampleRate * .5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }

  } catch (e) { return null; }
}
function tone(f, dur, type = "triangle", vol = .06, when = 0, f2 = null) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, freq, vol = .05, when = 0, q = 1.2) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t, Math.random() * .3); src.stop(t + dur + .02);
}
const pv = () => 1 + (Math.random() * .1 - .05);

      const srcs = [-1, ...s.s.sd.map((_, j) => j)].filter(src => (src === -1 ? s.s.r < lv.train.length : s.s.sd[src].length) && lv.train[topOf(s.s, src)] !== lv.order[s.s.st.length]);
      if (!srcs.length) continue;
      const src = srcs[Math.floor(R3() * srcs.length)], key = keyOf(s.s, lv), mv0 = s.moves, h0 = s.hist.length;
      const r = s.tryMove(src, ST); tries++;
      if (r.ok || keyOf(s.s, lv) !== key || s.moves !== mv0 || s.hist.length !== h0) fOk = false;
    }
    if (L === 1) fOk = fOk && tries === 0 || fOk;   // 1레벨은 틀린 색이 나올 수 없을 수도 있다
    marks.push(ck(fOk, tag + " F 역 거절") ? "F" : "f");
    // [G] 힌트 정직성: 풀 수 있는 상태에서 무작위 5수 뒤 💡를 따라가면 남은 최소 수만큼으로 풀림
    let gOk = true; const R4 = rng(900 + L);
    for (let run = 0; run < 5; run++) {
      const s = new Session(i);
      for (let m = 0; m < 5 && !s.done; m++) { const mv = movesOf(s.s, lv).filter(x => !isStuck(apply(s.s, x), lv)); if (!mv.length) break; const [a, b] = mv[Math.floor(R4() * mv.length)]; s.tryMove(a, b); }
      const left = (solveFrom(s.s, lv) || []).length; let used = 0;
      while (!s.done && used < 99) { const h = timed(() => s.hint()); if (h.kind !== "move") { gOk = false; break; } s.tryMove(...h.mv); used++; }
      if (!s.done || used !== left) gOk = false;
    }
    marks.push(ck(gOk, tag + " G 힌트") ? "G" : "g");
    rows.push(`${tag} ${marks.join("")}  최소 ${lv.opt_moves} (곡선 ${CURVE[i]} · 기획표 ${lv.brief})  칸 ${lv.train.length} 옆 ${lv.sidings}×${lv.cap || "-"}  상태 ${all.size} 막힌 판 ${(dead / all.size * 100).toFixed(0)}%  무작위 봇 ${rOk * 2}%  막힘 만남 ${stuckSeen}`);
  });
  // [D] 규칙 일치
  const D = [];
  D.push(ck(firstAt.two === 6, "D 옆 선로 2개 6") ? "옆2=6" : "옆2≠6(" + firstAt.two + ")");
  D.push(ck(firstAt.short === 11, "D 짧은 선로 11") ? "짧은=11" : "짧은≠11(" + firstAt.short + ")");
  D.push(ck(firstAt.dup === 21, "D 같은 색 21") ? "같은색=21" : "같은색≠21(" + firstAt.dup + ")");
  D.push(ck(firstAt.custom === 26, "D 순서표 26") ? "순서표=26" : "순서표≠26(" + firstAt.custom + ")");
  const l16 = LEVELS[15], noSS = solveFrom(startState(l16), l16, false);
  D.push(ck(!noSS || noSS.length > l16.opt_moves, "D 16 옆→옆 필수") ? "16옆→옆필수" : "16옆→옆없이도됨");
  let early = true; LEVELS.slice(0, 15).forEach(lv => { if (lv.sidings === 2) { const p = solveFrom(startState(lv), lv, false); if (!p || p.length !== lv.opt_moves) early = false; } });
  D.push(ck(early, "D 1~15 옆→옆 없이 최소") ? "1~15옆→옆불필요" : "1~15옆→옆필요있음");
  // [H] 첫 성공·속도
  const H1 = ck(sols[0] && sols[0].length === 3, "H 1레벨 3수");
  const H2 = ck(solveMs <= 1000, "H 전체 풀이 1초");
  const H3 = ck(maxCheckMs <= 50, "H 힌트·막힘 50ms");
  rows.push(`[D] ${D.join(" · ")}`);
  rows.push(`[H] 1레벨 3수 ${H1 ? "✓" : "✗"} · 30레벨 풀이 ${solveMs.toFixed(1)}ms ${H2 ? "✓" : "✗"} · 💡·막힘 최대 ${maxCheckMs.toFixed(1)}ms ${H3 ? "✓" : "✗"}`);
  rows.push(`검사 ${pass}/${total}${fails.length ? "  실패: " + fails.join(", ") : ""}`);
  rows.push(`표시: A 풀림 B 최소 수·재생 C 곡선 E 막힘 판정 U 막힘→↩️ F 역 거절 G 힌트 (소문자 = 실패)`);
  const pre = document.createElement("pre"); pre.id = "selftest"; pre.textContent = rows.join("\n"); document.body.appendChild(pre);
  document.title = `SELFTEST ${pass}/${total}`;
}

// ───────────────────────── 시작 ─────────────────────────
resize();
const qLevel = Math.max(1, Math.min(LEVELS.length, parseInt(Q.get("level") || Q.get("autoplay") || "0", 10) || 0));
if (SELFTEST) { load(0); runSelftest(); }
else if (AUTOPLAY) startAutoplay((qLevel || 1) - 1);
else load(qLevel ? qLevel - 1 : Math.min(save.unlocked, LEVELS.length) - 1);
requestAnimationFrame(frame);
</script>
</body>
</html>
