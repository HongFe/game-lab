<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11151d">
<title>연봉 줄다리기</title>
<style>
/* 게임 화면 색 (캔버스·팝업용) */
:root{--bg:#11151d;--tx:#eef1f7;--gold:#ffc94d;--red:#ff4d4d;--yel:#ffd34d}
/* 공용 UI 키트 색 맞춤 (강조색은 주 버튼에만) */
html:root{--ui-accent:#4d9dff;--ui-on-accent:#fff;--ui-bg:#11151d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui-font);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;word-break:keep-all;-webkit-touch-callout:none}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ── HUD: 회의 시간 · 목표 · 다음 별 · 일시정지 / 시간 막대 ── */
#hud{flex-direction:column;align-items:stretch;gap:var(--ui-s2);pointer-events:none}
#hud .hrow{display:flex;align-items:center;gap:var(--ui-s2)}
#hud .ui-chip{pointer-events:none}
#hud .ui-btn{pointer-events:auto}
#tchip.warn{color:var(--red)}
#tchip.warn .ui-icon{color:var(--red)}
#tchip.bump,#gchip.bump{animation:bump 260ms var(--ui-in)}
@keyframes bump{40%{transform:scale(1.18)}}
#schip .ui-stars .ui-icon{width:14px;height:14px;color:var(--gold)}
#schip .ui-stars .off{color:var(--ui-muted);opacity:.4}
#tbar{height:4px}
#tbarI{background:var(--ui-text)}
#tbar.warn #tbarI{background:var(--red)}

/* ── 계약서 위 큰 연봉 숫자 + 인상률 + 깃발 막대 ── */
#money{position:absolute;left:0;right:0;top:calc(92px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
#sal{font-size:var(--ui-t5);font-weight:700;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:transform 140ms var(--ui-in),color .15s;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#sal.hot{color:var(--gold);text-shadow:0 0 18px rgba(255,201,77,.55)}
#sal.big{transform:scale(1.35)}
#rz{font-size:var(--ui-t3);font-weight:700;color:var(--ui-muted);font-variant-numeric:tabular-nums}
#rz.up{color:var(--gold)}
#track{position:relative;width:min(280px,76%);height:8px;border-radius:999px;background:var(--ui-surface2);margin-top:var(--ui-s2)}
#trackI{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ui-text);transition:width 80ms linear}
#track.reach #trackI{background:var(--gold)}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:16px;background:var(--ui-muted);border-radius:1px}
.mk .ui-icon{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:14px;height:14px;color:var(--ui-muted)}
.mk.on{background:var(--gold)}.mk.on .ui-icon{color:var(--gold)}
.mk.flag .ui-icon{width:16px;height:16px;color:var(--ui-text)}
.mk.flag.on .ui-icon{color:var(--gold)}

/* ── 아래: 카드 버튼(왼쪽) · 도장 버튼(오른쪽, 판 중 주 버튼) ── */
#stampBtn{position:absolute;right:var(--ui-s4);bottom:max(var(--ui-s4),env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;border:0;background:var(--ui-surface2);color:var(--ui-text);font:700 var(--ui-t3)/1.2 var(--ui-font);box-shadow:var(--ui-shadow1),inset 0 -4px 0 rgba(0,0,0,.2);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;transition:transform 90ms var(--ui-in),background .2s,color .2s;z-index:30}
#stampBtn small{font-size:var(--ui-t2);font-weight:400;color:var(--ui-muted);font-variant-numeric:tabular-nums}
#stampBtn:active{transform:scale(.92)}
#stampBtn.go{background:var(--ui-accent);color:var(--ui-on-accent);animation:pulse 1s var(--ui-in) infinite}
#stampBtn.go small{color:var(--ui-on-accent);opacity:.85}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:var(--ui-shadow1)}50%{transform:scale(1.08);box-shadow:var(--ui-shadow1),0 0 0 10px rgba(77,157,255,.25)}}
#cards{position:absolute;left:var(--ui-s4);bottom:max(var(--ui-s4),env(safe-area-inset-bottom));display:none;gap:var(--ui-s2);z-index:30}
.cbtn{position:relative;width:64px;height:64px;border-radius:var(--ui-r2);border:0;background:var(--ui-surface2);color:var(--ui-text);box-shadow:var(--ui-shadow1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 var(--ui-t2)/1 var(--ui-font);touch-action:none;transition:transform 90ms var(--ui-in),opacity .2s}
.cbtn .ui-icon{width:24px;height:24px}
.cbtn:active{transform:scale(.92)}
.cbtn.used{opacity:.25;pointer-events:none}
.cbtn.hint{box-shadow:var(--ui-shadow1),inset 0 0 0 2px var(--ui-text)}

/* ── 안내 카드 한 줄 · 팝업 숫자 ── */
#tip{position:absolute;left:var(--ui-s3);right:var(--ui-s3);bottom:calc(max(var(--ui-s4),env(safe-area-inset-bottom)) + 100px);transform:translateY(8px);opacity:0;transition:opacity 195ms var(--ui-out),transform 195ms var(--ui-out);pointer-events:none;z-index:31}
#tip.on{opacity:1;transform:none;transition:opacity 225ms var(--ui-in),transform 225ms var(--ui-in)}
#tip .ui-em{width:32px;height:32px;font-size:var(--ui-t5)}
#tip img{width:36px;height:36px;border-radius:var(--ui-r1);background:var(--ui-surface2);flex:none}
#tip .n{font-weight:700;font-size:var(--ui-t3);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s2)}
#tip .f{font-size:var(--ui-t2);line-height:1.4;color:var(--ui-muted)}
#tip .ui-badge{background:var(--ui-surface2);color:var(--ui-text)}
.pop{position:absolute;font:700 var(--ui-t3) var(--ui-font);font-variant-numeric:tabular-nums;pointer-events:none;animation:popup .9s var(--ui-in) forwards;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap;z-index:25}
.pop.s{animation-duration:.8s}
.pop.l{font-size:var(--ui-t5);animation-duration:1.2s}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
#hand{display:none}
#hand.up{animation:lift 1s var(--ui-in) infinite}
@keyframes lift{0%,30%{transform:translateY(6px) scale(.92)}70%,100%{transform:translateY(-22px) scale(1);opacity:.4}}

/* ── 겹 화면 (시작·단계·카드·결과·도감): 키트 ui-screen 한 기둥 ── */
#ov:not(.on){display:none}
.g-line{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0;display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.g-line b{color:var(--ui-text)}
.g-line .ui-icon{color:var(--ui-muted)}
.g-gold{color:var(--gold)!important}
.g-strike{text-decoration:line-through;text-decoration-thickness:3px;color:var(--ui-muted)}
#box .ui-level.cur{background:var(--ui-surface2);color:var(--ui-text);box-shadow:inset 0 0 0 2px var(--ui-text)}
#box .ui-level .ui-stars{color:var(--gold)}
#box .ui-level .ui-stars .off{color:var(--ui-muted);opacity:.35}
.g-pv{display:flex;align-items:center;gap:var(--ui-s3);text-align:left}
.g-pv img,.g-por{width:48px;height:48px;border-radius:var(--ui-r2);background:var(--ui-surface2);flex:none}
.g-pv .ui-grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--ui-s1)}
.g-pv b{font-size:var(--ui-t3)}
.g-pv small{font-size:var(--ui-t2);color:var(--ui-muted);display:flex;align-items:center;gap:var(--ui-s1);flex-wrap:wrap}
.g-pv small .ui-stars .ui-icon{width:12px;height:12px;color:var(--gold)}
button.ui-item small{font-size:var(--ui-t2)}
button.ui-item.pick{box-shadow:inset 0 0 0 2px var(--ui-text)}
button.ui-item .ui-val .ui-icon{color:var(--ui-text)}
button.ui-item:not(.pick) .ui-val{opacity:0}
.g-cic{width:40px;height:40px;border-radius:var(--ui-r1);background:var(--ui-surface);display:grid;place-items:center;flex:none}
.g-rank{display:inline-flex;align-items:center;gap:var(--ui-s2);background:var(--ui-surface2);border-radius:999px;padding:var(--ui-s1) var(--ui-s3) var(--ui-s1) var(--ui-s1);font:700 var(--ui-t2)/1 var(--ui-font)}
.g-rank img{width:28px;height:28px;border-radius:50%;background:var(--ui-surface)}
.g-sec{font-size:var(--ui-t2);font-weight:700;color:var(--ui-muted);margin:var(--ui-s2) 0 0;text-align:left}
.g-dex .ui-item .ui-em{font-size:22px}
.g-dex .ui-item p{margin:0;font-size:var(--ui-t2);line-height:1.4;color:var(--ui-muted)}
.g-dex .ui-item.no{background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line)}
.g-hero svg{display:block}
#hud[hidden],#money[hidden]{display:none}
#game .ui-stars{color:var(--gold)}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}
.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}
.ui-btn:active{transform:scale(.96)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.ui-level:active{transform:scale(.94)}
.ui-level.cur{box-shadow:inset 0 0 0 2px var(--ui-text)}   /* 강조색은 주 버튼에만 → 지금 칸은 테두리로 */
.ui-level.lock{color:var(--ui-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line);pointer-events:none}
.ui-level .ui-stars .ui-icon{width:10px;height:10px}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}
.ui-stars .off{color:var(--ui-line);opacity:1}
.ui-light .ui-stars .off{color:rgba(15,20,30,.15)}
.ui-stars.big .ui-icon{width:40px;height:40px}
.ui-stars.big{gap:var(--ui-s2)}

/* HUD: 위쪽 칩 줄 */
.ui-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:var(--ui-s2);align-items:center;padding:var(--ui-s3);padding-top:max(var(--ui-s3),env(safe-area-inset-top));pointer-events:none}
.ui-hud>*{pointer-events:auto}
.ui-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--ui-s3);border-radius:999px;background:color-mix(in srgb,var(--ui-surface) 86%,transparent);box-shadow:var(--ui-shadow1);font:700 var(--ui-t2)/1 var(--ui-font);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ui-text)}
.ui-chip .ui-icon{width:16px;height:16px;color:var(--ui-muted)}
.ui-chip.accent .ui-icon{color:var(--ui-accent)}
.ui-meter{height:6px;border-radius:999px;background:var(--ui-surface2);overflow:hidden}
.ui-meter>i{display:block;height:100%;background:var(--ui-accent);border-radius:inherit;transition:width 200ms var(--ui-in)}

/* 안내 카드(한 번에 하나) · 토스트 · 시트 */
.ui-tip{display:flex;align-items:center;gap:var(--ui-s3);background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s3) var(--ui-s4);box-shadow:var(--ui-shadow2);font-size:var(--ui-t3);line-height:1.5;color:var(--ui-text);font-family:var(--ui-font)}
.ui-tip .ui-icon{color:var(--ui-accent)}

// ───────── 자체 검사 (순수 함수: 브라우저 ?selftest 와 노드에서 같은 결과) ─────────
function selfChecks() {

  const agg = (c, o, s0, n) => { const A = { p: 0, s3: 0, sn: 0, sum: 0, ft: [], st: [0, 0, 0, 0], n };
    for (let s = s0; s < s0 + n; s++) { const { st, r } = playRun(s, c, o); if (r.type === "clear") { A.p++; A.sum += r.raise; } if (r.stars === 3) A.s3++; A.st[r.stars]++; if (r.type === "snap") A.sn++; if (st.flagT !== null) A.ft.push(st.flagT); }

  out.push("[A] 단계별 사람 근사 봇 (반응 0.65초 · 누르기 오차 60ms · 욕심 ★1/2/3 무작위 · 시드 301~340)");

    add(ok, `${c.n}단계 ${RANKS[c.rank].n}·${OPPS[c.opp]}  통과 ${pct(A.p)} (기준 ${pct(t[0])}↑) · ★3 ${pct(A.s3)} (${pct(t[1])}~${pct(t[2])}) · ★0/1/2/3 ${A.st.join("/")} · 끊김 ${pct(A.sn)} · 깃발 중앙 ${A.fm.toFixed(1)}초 · 평균 인상 +${A.avg.toFixed(1)}%`); return A; });
  out.push("  곡선 통과: " + H.map(a => pct(a.p)).join(" → ") + " · ★3: " + H.map(a => pct(a.s3)).join(" → ") + " · 깃발: " + H.map(a => a.fm.toFixed(0) + "초").join(" → "));
  out.push("", "[B] 새 시드 401~440 (과적합 방지, ★3 범위 ±5%p)");
  { let ok = true; const ls = STAGES.map((c, i) => { const A = agg(c, {}, 401, 40), t = TGT[i]; if (!(A.p >= t[0] - .05 && A.s3 >= t[1] - .05 && A.s3 <= t[2] + .05)) ok = false; return `${c.n}:${pct(A.p)}/★3 ${pct(A.s3)}`; });
    add(ok, ls.join(" · ")); }
  out.push("", "[C] 예고가 중요하다: 사람 근사 봇 vs 예고 무시 봇 (평균 인상 +6%p 이상, 끊김 2배 이상)");
  { let ok = true; const ls = STAGES.map((c, i) => { const g = agg(c, { ignore: true }, 301, 40), h = H[i], o1 = h.avg >= g.avg + 6 && g.sn >= Math.max(2 * h.sn, .05); if (!o1) ok = false;
      return `${c.n}:${h.avg.toFixed(1)} vs ${g.avg.toFixed(1)} 끊김 ${pct(h.sn)}/${pct(g.sn)}${o1 ? "" : "✗"}`; }); add(ok, ls.join(" · ")); }
  out.push("", "[D] 같은 반응이 다르게: 1~3단계는 버럭 때 놓기 > 버티기, 4~6단계는 줄 40↑에서 맞받아치기가 놓기보다 +4%p 이상(★3 노리고 끝까지 올리는 봇)");
  { let ok = true; const ls = STAGES.map((c, i) => { let a, b2;

      const o1 = i < 3 ? a > b2 : a >= b2 + 4; if (!o1) ok = false; return `${c.n}:${i < 3 ? "놓기" : "맞받기"} ${a.toFixed(1)} vs ${i < 3 ? "버티기" : "놓기"} ${b2.toFixed(1)}${o1 ? "" : "✗"}`; }); add(ok, ls.join(" · ")); }

  { let ok = true; const ls = [];

    add(ok, ls.join(" · ")); }
  out.push("", "[F] 외우면 끝나지 않음: 시드 1~20 첫 예고 3개 시각 표준편차 ≥1.5초, 사건 조합 ≥3가지");
  { let ok = true; const ls = [];
    for (const c of [STAGES[1], STAGES[3], STAGES[5]]) { const T = [[], [], []], combos = new Set();
      for (let s = 1; s <= 20; s++) { const st = newState(s, c, {}); combos.add(st.evs.map(e => e.k + (e.k === "mood" ? e.dir : "")).join("+") + "@" + st.evs.map(e => Math.round(e.at / 5)).join(","));
        for (let k = 0; k < 60 / DT && st.warns.length < 3 && !st.result; k++) step(st, { press: false, stamp: false, card: -1 }); st.warns.slice(0, 3).forEach((w, j) => T[j].push(w.t)); }
      const sd = a => { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((x, y) => x + (y - m) * (y - m), 0) / a.length); };

      ls.push(`${c.n}단계 σ ${sds.map(x => x.toFixed(1)).join("/")}초 · 조합 ${combos.size}`); }
    add(ok, ls.join(" · ")); }
  out.push("", "[G] 공정성: 예고 없는 줄 피해 0건, 줄이 넉넉할 때 0.65초 뒤 놓으면 버럭 피해 ≤25 (장력 100에서 시작)");
  { let ok = true, unw = 0; const ls = [];
    STAGES.forEach(c => { for (let s = 301; s <= 320; s++) { const { st } = playRun(s, c, {}); unw += st.log.filter(l => !l.warned).length; } });
    STAGES.forEach(c => { let mx = 0; for (const k of c.reacts.filter(k => k === "cough" || k === "slam")) {
        const st = newState(1, c, {}); st.ten = 100; st.nextR = 1e9; st.evs = []; st.react = { k, t0: 0, w: c.W + WARN_PAD + (k === "slam" ? .4 : 0), phase: "warn" }; const r0 = st.rope;

        mx = Math.max(mx, st.log.reduce((x, l) => x + l.d, 0)); }
      if (mx > 25) ok = false; ls.push(`${c.n}:${mx.toFixed(0)}`); });
    if (unw) ok = false; add(ok, `예고 없는 피해 ${unw}건 · 놓았을 때 최대 피해 ${ls.join(" ")}`); }
  out.push("", "[H] 판마다 결과 하나, fail 최대 1번, 회의 끝 자동 도장");
  { let ok = true, auto = 0, n = 0; STAGES.forEach(c => { for (let s = 1; s <= 20; s++) for (const kind of ["idle", "human", "press"]) { const { st } = playRun(s, c, { kind }); n++;

  // 줄(인내심) 막대 + 예상 피해 그림자 (정직한 정보)
  const bw = 150 * s, bx = cx - bw / 2, by = cY + ph / 2 + 16 * s;
  ctx.fillStyle = "rgba(255,255,255,.1)"; rr(bx, by, bw, 6, 3); ctx.fill();
  const low = S.rope < LOW, rw = bw * Math.max(0, S.rope) / S.ropeMax;
  if (low && run) { ctx.fillStyle = `rgba(255,60,50,${.18 + .14 * Math.sin(T * 8)})`; rr(bx - 3, by - 3, bw + 6, 12, 5); ctx.fill(); }
  ctx.fillStyle = low ? "#ff6b5e" : "#e9edf5"; rr(bx, by, Math.max(0, rw), 6, 3); ctx.fill();
  drawIcon("heart", low ? "#ff6b5e" : "#cfd6e4", bx - 22, by - 6, 18); // 줄 = 상대 인내심
  if (rc && rc.phase === "warn" && (rc.k === "cough" || rc.k === "slam") && run) {
    const ctrOk = RANKS[cfg.rank].ctr && (rc.k === "cough" || RANKS[cfg.rank].ctr.slam) && S.press && ten >= redS;
    const mul = RANKS[cfg.rank].dmg * (cfg.hit || 1) * (rc.k === "slam" ? 2 : 1);
    const pred = S.silence > 0 ? 0 : ctrOk ? ten * mul * RANKS[cfg.rank].ctr.dm : low ? Math.max(ten * mul, LOW_DMG * (rc.k === "slam" ? 2 : 1)) : ten * mul;
    const pw2 = Math.min(rw, bw * pred / S.ropeMax); ctx.fillStyle = `rgba(255,50,40,${.55 + .4 * Math.sin(T * 18)})`; rr(bx + rw - pw2, by - 1, pw2, 8, 3); ctx.fill();
    if (pred > 1) { ctx.fillStyle = "#ff8a80"; ctx.font = `700 14px ${FONT}`; ctx.textAlign = "center"; ctx.fillText("−" + Math.round(pred), bx + rw - pw2 / 2, by + 20); }
  }
  if (S.b.proof > 0) { ctx.strokeStyle = "#8fd0ff"; ctx.lineWidth = 2; rr(bx - 3, by - 3, bw + 6, 12, 5); ctx.stroke(); }
  // 상대 머리 위 말풍선 (예고 아이콘 1개)
  if (rc && run) {
    const k = rc.phase === "warn" ? rc.k : rc.k === "chin" && S.b.chance > 0 ? "chance" : null;
    if (k) { const age = S.t - rc.t0, pop = Math.min(1, age / .12), wob = rc.phase === "warn" ? Math.sin(T * 26) * 2 : 0;
      const X = opX - 18 * s, Y = L.headY - 50 * s; ctx.save(); ctx.translate(X + wob, Y); ctx.scale(pop * s, pop * s);
      ctx.fillStyle = k === "chance" ? "#ffc94d" : "#fff"; rr(-24, -22, 48, 40, 14); ctx.fill(); ctx.beginPath(); ctx.moveTo(4, 16); ctx.lineTo(14, 28); ctx.lineTo(14, 14); ctx.fill();
      if (rc.phase === "warn") { const p = Math.min(1, age / rc.w); ctx.strokeStyle = rc.k === "cough" || rc.k === "slam" ? "#ff4d4d" : "#4d9dff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -2, 27, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1; ctx.fillStyle = "#fff"; ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(k === "chance" ? "❓" : TERMS[k].e, 0, -1); ctx.textBaseline = "alphabetic";
      ctx.restore(); }
  }
  // 파티클 · 고리
  for (const p of fx.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.strokeStyle = p.col;
    if (p.line) { ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.rot) * 7, p.y + Math.sin(p.rot) * 7); ctx.stroke(); }
    else if (p.sq) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.restore(); } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); } }
  ctx.globalAlpha = 1;
  for (const r of fx.rings) { const k = r.t / .5; ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = r.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, 10 + k * r.max, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 사건 띠 배너 (화면 위쪽)
  const bn = fx.banner;
  if (bn) { const a = Math.min(1, bn.t / .15, (bn.dur - bn.t) / .2), y = L.bannerY; ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = bn.bg; ctx.fillRect(0, y, W, 34); ctx.fillStyle = bn.col; ctx.font = `700 16px ${FONT}`; ctx.textBaseline = "middle";
    const tw = ctx.measureText(bn.text).width, ix = W / 2 - (tw + (bn.ic ? 26 : 0)) / 2; if (bn.ic) drawIcon(bn.ic, bn.col, ix, y + 7, 20);
    ctx.textAlign = "left"; ctx.fillText(bn.text, ix + (bn.ic ? 26 : 0), y + 17); ctx.textBaseline = "alphabetic";
    if (bn.bar) { const left = S.b[bn.bar] / bn.max; ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(0, y + 30, W * Math.max(0, left), 4); }
    ctx.globalAlpha = 1; }
  if (fx.flash && JUICE) { ctx.globalAlpha = Math.max(0, 1 - fx.flash.t / fx.flash.dur); ctx.fillStyle = fx.flash.col; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ───────── 루프 (고정 틱) ─────────
function loop(t) {
  const dtR = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (mode === "run") {
    if (fx.stop > 0) fx.stop -= dtR;
    else if (stampHold > 0) { stampHold -= dtR; if (stampHold <= 0) step(st, { press: held, stamp: true, card: -1 }, onEv); }
    else {
      acc += dtR;
      while (acc >= DT && mode === "run") {
        acc -= DT; let inp;
        if (auto) inp = botInput(st, botM);
        else { inp = { press: held, stamp: false, card: cardQ }; cardQ = -1; if (stampQ) { stampQ = false; if (st.t - st.t0 >= .5) inp.stamp = true; } }
        if (inp.stamp && JUICE) { stampHold = .2; SFX.pre(); acc = 0; if (inp.card >= 0) step(st, { press: inp.press, stamp: false, card: inp.card }, onEv); break; } // 도장 직전 0.2초 멈춤
        step(st, inp, onEv);
        if (fx.stop > 0) break;
      }
    }
    if (st && mode === "run") {
      creakSet(st.press && st.b.phone <= 0, st.ten, st.zone === 2);
      // 떠오르는 숫자: 오른 만큼 +28만P
      fx.gainT += dtR; const sal = salaryOf(st); if (fx.lastSal === undefined) fx.lastSal = sal;
      if (fx.gainT > .5 && !(st.b.chance > 0)) { const d = sal - fx.lastSal; if (d >= 1) popText("+" + Math.round(d) + "만P", st.zone === 2 ? "#ffc94d" : "#e9edf5", .5, (L.ropeY - 60 * L.s) / VH, "s"); fx.gainT = 0; fx.lastSal = sal; }
      if (sal - dispSal > 1 && t - lastTick > 70) { lastTick = t; SFX.tick(st.zone === 2 ? 1 : 0); }
      // 올 풀림 틱
      const rf = Math.ceil(st.rope / 10); if (rf < fx.lastRope) { SFX.fray(); puff(L.cx + (Math.random() - .5) * 120, L.ropeY, 3, { speed: 40, life: .9, r: 2, cols: ["#e9edf5"], line: true, g: 260 }); } fx.lastRope = rf;
      if (st.ten >= 99.5 && st.zone === 2) meet("maxed");
      if (st.rope < LOW && !fx.lowSeen) { fx.lowSeen = true; meet("low"); SFX.banner(); if (!fx.banner || fx.banner.t > 1.5) fx.banner = { ic: "triangle-alert", text: "줄 바닥 · 버럭 한 방에 끊김", t: 0, dur: 2.2, bg: "rgba(120,20,24,.94)", col: "#ffffff" }; }
      if (st.rope >= LOW + 8) fx.lowSeen = false;
      if (st.left < 5 && !fx.warnT) { fx.warnT = true; meet("timeout"); SFX.banner(); fx.banner = { ic: "clock", text: "5초 뒤 결렬 · 인상 절반", t: 0, dur: 2.4, bg: "rgba(20,24,34,.94)", col: "#ffffff" }; }
      // 첫 판 손짓: 줄이 빨개진 채 0.8초 넘게 누르면 '떼기' 한 번 보여 준다
      if (!auto && cfg.n === 1 && !save.tut.red && st.zone === 2 && held) { fx.redT = (fx.redT || 0) + dtR; if (fx.redT > .8) { save.tut.red = 1; persist(); handSet("release"); setTimeout(() => { if (hand.mode === "release") handSet(""); }, 1500); } }
    }
  } else creakSet(false, 0);
  // 안내 카드
  if (tipT > 0) { tipT -= dtR; if (tipT <= 0 || (tipQ.length && tipCur && !tipCur.custom && tipT < 1.6)) hideTip(); }
  if (fx.banner && fx.banner.t < .05 && tipCur && !tipCur.custom) hideTip();
  if (tipT <= 0 && tipQ.length && mode === "run") { showTip(tipQ.shift()); }
  if (mode !== "run" && mode !== "pause" && tipCur) hideTip();
  // 손맛 갱신
  const dt = dtR * (fx.snap ? .45 : 1);
  fx.parts = fx.parts.filter(p => (p.life -= dt) > 0); fx.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .97; p.rot += dt * 4; });
  fx.rings = fx.rings.filter(r => (r.t += dt) < .5);
  fx.shake *= Math.pow(.015, dtR); fx.wob = Math.max(0, fx.wob - dtR * 2.2); fx.push = Math.max(0, fx.push - dtR * 1.4);
  if (fx.flash) { fx.flash.t += dtR; if (fx.flash.t > fx.flash.dur) fx.flash = null; }
  if (fx.banner) { fx.banner.t += dtR; if (fx.banner.t > fx.banner.dur) fx.banner = null; }
  if (fx.seal) fx.seal.t += dtR; if (fx.snap) fx.snap.t += dt; if (fx.face) fx.face.t += dtR;
  if (hand.mode === "stamp") { hand.t += dtR; $("hand").style.opacity = (hand.t % 3) < 1.4 ? 1 : 0; }
  if (st) hud();
  drawScene(dtR);
  requestAnimationFrame(loop);
}

// ───────── 자체 검사 · 자동 플레이 · 시작 ─────────
FONT = getComputedStyle(document.body).fontFamily || FONT;
resize();
if (Q.has("selftest")) {
  auto = true;
  const r = selfChecks();
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:99;margin:0;padding:10px;font-size:11px;overflow:auto;white-space:pre-wrap">${r.out.join("\n")}\n\nSELFTEST ${r.pass}/${r.total}</pre>`);
  document.title = `SELFTEST ${r.pass}/${r.total}`;
} else if (Q.has("autoplay")) {
  auto = true; const n = Number(Q.get("stage")) || 1, seed = Number(Q.get("autoplay")) || 1, c = stageCfg(n);
  botM = botNew(seed, c, {}); const d = deal(seed, c, Math.min(5, n - 1));
  startRun(n, botPick(botM, d.offer, d.pick), seed);
  const warp = Number(Q.get("warp")) || 0; while (st.t < warp && !st.result) { const inp = botInput(st, botM); if (inp.stamp) break; step(st, inp, null); } // 도장은 화면에서 찍는다
  dispSal = salaryOf(st); fx.lastRope = Math.ceil(st.rope / 10);
} else if (Q.has("stage")) { menu(); prep(Math.max(1, Math.min(7, Number(Q.get("stage")) || 1))); }
else menu();
window.__g025 = { get st() { return st; }, STAGES, step, botInput, newState, playRun, selfChecks, result, menu, prep };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
