<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213a">
<title>집 갈아타기</title>
<style>
/* 게임별 값은 이 두 개만 (공용 UI 키트) */
:root{--ui-accent:#ffd166;--ui-on-accent:#2b1f00}
/* 게임 화면 색 (지도·하늘 그림용) */
:root{--ok:#34c77b;--bad:#ff5a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:var(--ui-font);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:var(--ui-s2);padding:max(var(--ui-s2),env(safe-area-inset-top)) var(--ui-s3) max(var(--ui-s3),env(safe-area-inset-bottom));overflow-y:auto}
#app.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

/* ── 위쪽 수치 3칸 (키트 ui-stat) ── */
.g-hud{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--ui-s2);flex:none}
.g-hud .ui-stat{padding:var(--ui-s2) var(--ui-s3);background:var(--ui-surface)}
.g-hud .ui-stat b{font-size:var(--ui-t3)}

/* ── 집 그림 (게임 화면, 그대로) ── */
.scene{position:relative;flex:none;height:128px;border-radius:var(--ui-r3);overflow:hidden;background:linear-gradient(#6aa8ff,#bfe0ff 72%,#7fc47f 72%,#5fa85f);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14);transition:background 1.2s}
.scene.up{background:linear-gradient(#ff9f5a,#ffe3a3 72%,#86c979 72%,#5fa85f)}
.scene.adj{background:linear-gradient(#7c6fd6,#d4c8ff 72%,#7aa77a 72%,#557d55)}
.scene.crash{background:linear-gradient(#2c3047,#7d6574 72%,#4d5e4d 72%,#394739)}
.sun{position:absolute;right:var(--ui-s4);top:var(--ui-s7);width:32px;height:32px;border-radius:50%;background:radial-gradient(#fff6c2,#ffd166);box-shadow:0 0 24px #ffd16699;transition:.8s}
.scene.crash .sun{background:radial-gradient(#ccc,#888);box-shadow:none}
.cloud{position:absolute;font-size:24px;opacity:.8;animation:drift 28s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(520px)}}
.house{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);font-size:52px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.house.up{animation:hup .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes hup{0%{transform:translateX(-50%) scale(.3) translateY(50px)}100%{transform:translateX(-50%) scale(1)}}
.house.crack{animation:crack .5s}
@keyframes crack{20%{transform:translateX(calc(-50% - 9px)) rotate(-4deg)}40%{transform:translateX(calc(-50% + 9px)) rotate(4deg)}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
.name{position:absolute;left:0;right:0;bottom:var(--ui-s4);text-align:center;font:700 var(--ui-t3)/1.25 var(--ui-font);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:2px}
.name small{font-size:var(--ui-t1);font-weight:400;display:inline-flex;align-items:center;gap:var(--ui-s1)}
/* 그림 위 칩 2개: 시장 단계 · 연차 */
.scene .ui-chip{position:absolute;top:var(--ui-s2);height:28px;padding:0 var(--ui-s2);background:rgba(10,12,20,.55);box-shadow:none;font-size:var(--ui-t1);color:#fff}
#phase{left:var(--ui-s2)} #yr{right:var(--ui-s2)}
.g-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
#phase .g-dot{color:inherit}
/* 진행 막대 (대기·재개발) */
.pbar{position:absolute;left:var(--ui-s2);right:var(--ui-s2);bottom:var(--ui-s1);height:var(--ui-s4);border-radius:999px;background:rgba(10,12,20,.55);overflow:hidden;display:none;font:700 var(--ui-t1)/16px var(--ui-font);text-align:center;z-index:3;color:#fff}
.pbar.on{display:block} .pbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3);transition:width 200ms var(--ui-in)} .pbar span{position:relative;display:inline-flex;align-items:center;gap:var(--ui-s1)}
.pbar .ui-icon{width:12px;height:12px}
.scene.pb .name{bottom:var(--ui-s5)}
/* 사건 안내: 키트 ui-tip 하나씩, 그림 위에 뜬다 */
#news{position:absolute;left:var(--ui-s2);right:var(--ui-s2);top:var(--ui-s2);z-index:4;padding:var(--ui-s2) var(--ui-s3);gap:var(--ui-s2);font-size:var(--ui-t2);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity 195ms var(--ui-out),transform 195ms var(--ui-out)}
#news.on{opacity:1;transform:none;pointer-events:auto;transition:opacity 225ms var(--ui-in),transform 225ms var(--ui-in)}
#news.good .ui-icon{color:var(--ui-good)} #news.bad .ui-icon{color:var(--ui-bad)} #news.ne .ui-icon{color:var(--ui-muted)}
.g-tt{display:flex;flex-direction:column;min-width:0;line-height:1.25;gap:2px}
.g-tt small{font-size:var(--ui-t1);color:var(--ui-muted);display:flex;align-items:center;gap:var(--ui-s1)}
.g-tt .ui-icon{width:12px;height:12px}

/* 지금 걸린 효과 줄 */
.fxrow{display:flex;gap:var(--ui-s1);overflow-x:auto;min-height:24px;flex:none;scrollbar-width:none;align-items:center}
.fxrow::-webkit-scrollbar{display:none}
.fxrow .ui-chip{height:24px;padding:0 var(--ui-s2);font-size:var(--ui-t1);box-shadow:none;background:var(--ui-surface);flex:none;gap:var(--ui-s1)}
.fxrow .ui-chip .ui-icon{width:12px;height:12px}
.fxrow .ui-chip.bad .ui-icon{color:var(--ui-bad)} .fxrow .ui-chip.good .ui-icon{color:var(--ui-good)}
.fxrow .ui-cap{padding:0 var(--ui-s1)}

/* ── 지도 (게임 화면, 그대로) ── */
.map{flex:1 1 auto;min-height:160px;background:radial-gradient(ellipse at 50% 0%,#232c45,var(--ui-surface));border-radius:var(--ui-r3);position:relative;overflow:hidden;pointer-events:none}
.map svg{width:100%;height:100%;display:block}
.map .nd circle.b{stroke:rgba(255,255,255,.25);stroke-width:1.2}
.map .nd.dim{opacity:.4}
.map .nd.can circle.b{stroke:#fff;stroke-width:2}
.map .nd.sel circle.b{stroke:var(--ui-accent);stroke-width:3}
.map .nd.cur circle.ring{animation:pulse 1.4s infinite}
@keyframes pulse{0%{r:15;opacity:.9}100%{r:24;opacity:0}}
.map .eg{stroke:rgba(255,255,255,.12);stroke-width:1.4}
.map .eg.hot{stroke:rgba(255,209,102,.8);stroke-width:2.4;stroke-dasharray:5 4;animation:dash 1s linear infinite}
.map .eg.sub{stroke:rgba(192,132,252,.85);stroke-width:2;stroke-dasharray:2 4}
@keyframes dash{to{stroke-dashoffset:-18}}
.map .lb{font:700 15px var(--ui-font);fill:#dfe6ff;text-anchor:middle;pointer-events:none}

/* ── 갈 곳 (가로 목록) ── */
.dests{display:flex;gap:var(--ui-s2);overflow-x:auto;flex:none;scrollbar-width:none}
.dests::-webkit-scrollbar{display:none}
.g-dest{appearance:none;border:0;margin:0;flex:none;min-height:var(--ui-touch);display:flex;align-items:center;gap:var(--ui-s2);padding:var(--ui-s1) var(--ui-s3) var(--ui-s1) var(--ui-s2);border-radius:var(--ui-r2);background:var(--ui-surface);color:var(--ui-text);cursor:pointer;touch-action:manipulation;text-align:left;transition:transform 90ms var(--ui-in)}
.g-dest:active{transform:scale(.96)}
.g-dest.on{box-shadow:inset 0 0 0 2px var(--ui-text);background:var(--ui-surface2)}
.g-dest .ui-em{width:24px;height:24px;font-size:18px}
.g-dest b{display:block;font-size:var(--ui-t2);line-height:1.25;white-space:nowrap}
.g-dest small{display:flex;align-items:center;gap:2px;font-size:var(--ui-t1);line-height:1.25;color:var(--ui-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-dest small .ui-icon{width:12px;height:12px}
.g-dest.ok small{color:var(--ui-good)}

/* ── 고른 집 카드 · 가는 방법 ── */
.panel{flex:none;padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s2)}
.g-ph{display:flex;align-items:center;gap:var(--ui-s2);min-width:0}
.g-ph b{font-size:var(--ui-t3);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-ph>.ui-num{margin-left:auto;font-weight:700;font-size:var(--ui-t3);white-space:nowrap;display:inline-flex;align-items:center;gap:var(--ui-s1)}
.g-ph .ui-em{width:24px;height:24px;font-size:18px}
.meths{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-s2)}
.g-m{flex-direction:column;align-items:flex-start;gap:var(--ui-s1);padding:var(--ui-s2) var(--ui-s3);min-height:56px;text-align:left}
.g-m>span{display:flex;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);white-space:nowrap}
.g-m small{font:400 var(--ui-t1)/1.25 var(--ui-font);color:var(--ui-muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.g-m small .ui-icon{width:12px;height:12px}
.g-m.ok{box-shadow:inset 0 0 0 2px var(--ui-text)}
.g-m.ok small{color:var(--ui-good)}
.g-m.lock{color:var(--ui-muted)}
.g-wait{display:flex;align-items:center;gap:var(--ui-s3)}
.g-wait .ui-em{width:40px;height:40px;font-size:28px}
.g-wait .ui-grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--ui-s1)}
.g-wait b{font-size:var(--ui-t3);line-height:1.25}
.g-wait small{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25}
.g-wait>.ui-num{font-weight:700;font-size:var(--ui-t3);white-space:nowrap}

/* ── 아래 버튼 줄 ── */
.btns{display:flex;gap:var(--ui-s2);flex:none}
#smalls{display:flex;gap:var(--ui-s2)}
.g-sm{flex-direction:column;gap:2px;padding:0;width:56px;min-height:56px;flex:none}
.g-sm small{font:400 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums;color:var(--ui-muted)}
.g-sm.lock{color:var(--ui-muted);opacity:.5}
#work{flex:1;min-height:56px;flex-direction:column;gap:2px;font-size:var(--ui-t3)}
#work>span{display:flex;align-items:center;gap:var(--ui-s2)}
#work small{font:400 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums;opacity:.8}
#dexb{width:56px;min-height:56px}
#dexn[hidden]{display:none}

/* ── 시도 연출 (확률 굴림) ── */
#roll{z-index:60}
#roll:not(.on){display:none}
.roll .ui-col{gap:var(--ui-s3)}
.g-rt{display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);font-size:var(--ui-t3);font-weight:700}
.g-rt .ui-icon{color:var(--ui-muted)}
.g-rm{display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);color:var(--ui-muted);font-size:var(--ui-t3)}
.roll .st{opacity:.35;transition:opacity 180ms var(--ui-in);display:flex;flex-direction:column;gap:var(--ui-s2);padding:var(--ui-s3) var(--ui-s4)}
.roll .st.on{opacity:1}
.roll .st .row{display:flex;justify-content:space-between;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);line-height:1.25}
.roll .st .row>span:first-child{min-width:0}
.roll .st .n{font-weight:700;min-width:56px;text-align:right;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--ui-s1)}
.roll .g{height:8px;border-radius:999px;background:var(--ui-bg);overflow:hidden;position:relative}
.roll .g i{position:absolute;left:0;top:0;bottom:0;background:var(--ui-text);opacity:.8;width:0}
.roll .g em{position:absolute;top:0;bottom:0;width:2px;background:var(--ui-text)}
.roll .g u{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--ui-good) 35%,transparent)}
.roll .msg{min-height:38px;text-align:center}
.roll .sub{min-height:24px;text-align:center}
.roll .bids{display:flex;flex-direction:column;gap:var(--ui-s1)}
.roll .bids .ui-line{opacity:0;transform:translateX(-8px);transition:opacity 225ms var(--ui-in),transform 225ms var(--ui-in)}
.roll .bids .ui-line.on{opacity:1;transform:none}
.roll .bids .ui-line.me{box-shadow:inset 0 0 0 2px var(--ui-text)}
.roll .bids .ui-line.win{background:color-mix(in srgb,var(--ui-good) 22%,var(--ui-surface2))}
.roll .bids .ui-cap{text-align:center}

/* ── 겹 화면 (시작·경매·보상·도착·도감): 키트 ui-screen 한 기둥 ── */
#ov:not(.on){display:none}
#ov{padding-left:var(--ui-s4);padding-right:var(--ui-s4)}
.g-line{display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.g-line b{color:var(--ui-text)}
.g-path{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px}
.g-path .ui-icon{width:12px;height:12px;color:var(--ui-muted)}
.g-path .ui-em{width:28px;height:28px;font-size:20px}
.g-sec{font-size:var(--ui-t2);font-weight:700;color:var(--ui-muted);margin:var(--ui-s3) 0 0;display:flex;align-items:center;gap:var(--ui-s2)}
.g-sec .ui-num{margin-left:auto;font-weight:400}
.g-btn-item{appearance:none;border:0;margin:0;width:100%;text-align:left;color:var(--ui-text);font:inherit;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.g-btn-item:active{transform:scale(.97)}
.g-btn-item.lock{pointer-events:none}
.ui-item>.ui-num{font-weight:700;font-size:var(--ui-t3);white-space:nowrap}
.ui-item .ui-em{width:32px;height:32px;font-size:22px}
.ui-item.no{background:transparent;outline:1px dashed var(--ui-line);outline-offset:-1px}
.g-routes{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-s2)}
.g-routes .ui-item{padding:var(--ui-s2) var(--ui-s3)}
.g-routes .ui-item b{font-size:var(--ui-t2)}
.g-routes .ui-item.no b{color:var(--ui-muted);font-weight:400}
.g-routes .ui-em{width:24px;height:24px;font-size:16px}
.g-houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:var(--ui-s1)}
.g-houses span{height:40px;display:grid;place-items:center;border-radius:var(--ui-r1);background:var(--ui-surface2);font-size:22px}
.g-houses span.no{background:transparent;outline:1px dashed var(--ui-line);outline-offset:-1px;color:var(--ui-muted)}
.g-houses .ui-icon{width:12px;height:12px}
.g-ev small{display:block}
.g-ev .ui-icon{color:var(--ui-muted)} .g-ev.bad .ui-grow>b .ui-icon{color:var(--ui-bad)} .g-ev.good .ui-grow>b .ui-icon{color:var(--ui-good)}
.g-ev .ui-grow>b{display:flex;align-items:center;gap:var(--ui-s2)}
.g-arm{background:color-mix(in srgb,var(--ui-bad) 30%,var(--ui-surface2))!important}
.g-disc{text-align:center}

/* ── 손맛 (그대로) ── */
.coin{position:fixed;font:700 15px var(--ui-font);color:var(--ui-accent);pointer-events:none;animation:coin .8s ease-out forwards;z-index:4;text-shadow:0 2px 4px #000;font-variant-numeric:tabular-nums}
@keyframes coin{to{transform:translateY(-34px);opacity:0}}
.conf{position:fixed;width:9px;height:6px;z-index:70;pointer-events:none;animation:conf 1.4s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:65}
@media (max-height:640px){.scene{height:96px}.house{font-size:40px;bottom:40px}.map{min-height:96px}.name{bottom:var(--ui-s2)}}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */

const routeRow = (k, n) => { const got = save.routes.includes(k); return `<div class="ui-item ${got ? "" : "no"}"><span class="ui-em">${got ? ROUTE_E[k] : I("lock", "sm")}</span><b>${n}</b></div>`; };
// 도착(목표 달성) 화면
function cleared() {
  const r = routeOf(G), min = Math.round(G.doneT / 6) / 10, firstRoute = !save.routes.includes(r); save.clears++; if (!save.routes.includes(r)) save.routes.push(r); const best = !save.bestMin || min < save.bestMin; if (best) save.bestMin = min; store.set(save); SFX.clear(); confetti(120);

// 도감: 하는 법 · 용어 · 갈래 · 가 본 집 · 사건 + 면책 · 처음부터

    <li>${I("zap")}부업을 누르면 돈</li><li>${I("triangle-alert")}사건이 길을 막으면 돌아가기</li><li>${I("trophy")}위기를 버티면 보상</li></ul>`;

    <div class="ui-col ui-enter-2" style="gap:var(--ui-s2)">

      <p class="ui-cap g-disc" style="margin-top:var(--ui-s3)">${DISC}</p>
      <button class="ui-btn ghost" id="dexr">${I("rotate-ccw")}처음부터 다시</button>
    </div>`);
  $("dexc").onclick = () => back ? back() : closeOv();
  $("dexr").onclick = () => { const b = $("dexr"); if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.classList.add("g-arm"); b.innerHTML = `${I("triangle-alert")}한 번 더 누르면 이번 판 삭제`; return; } closeOv(); newRun(); };
}
function onNotice(f) {
  if (!f) return;
  if (f.boss) return showBoss(f.boss);
  if (f.ev) {
    const e = f.ev; G.log.push(`${Math.floor(G.t / YEAR) + 1}년차 ${e.ic} ${e.t}`); if (e.term) learn(e.term);
    if (!save.evs) save.evs = []; if (!save.evs.includes(e.id)) save.evs.push(e.id);
    banner(`<b>${e.t}</b><small>${e.s}${e.d ? ` · <span class="ui-num">${e.d}초</span>` : ""}</small>`, evTone(e), 4500, evIcon(e));
    if (JUICE) (e.bad ? SFX.bad : SFX.good)(); if (e.bad && (e.id === "rateUp" || e.id === "loanTight")) shake();
    render(); return;
  }
  if (f.phase) {
    const P = PHASES[f.phase]; G.log.push(`${Math.floor(G.t / YEAR) + 1}년차 ${P.ic} ${P.n}`); learn("cycle");
    const tip = { rec: "집값 오름세 · 성사 85%", up: "집값 급등 · 성사 70%", adj: "집값 보합 · 성사 90%", crash: "집값 급락 · 버티면 보상" }[f.phase];
    banner(`<b>${P.n}</b><small>${tip}</small>`, f.phase === "crash" ? "bad" : "good", 3500, "gauge");
    if (f.phase === "crash") { SFX.rumble(); shake(); flash("#ff6b6b"); } else if (JUICE) SFX.good();
    render(); return;
  }
  if (f.t) { if (f.term) learn(f.term); if (f.term2) learn(f.term2); if (f.end) return; banner(`<b>${clean(f.t)}</b>`, f.good ? "good" : f.bad ? "bad" : "", 3500); if (f.good) { SFX.ok(3); if (f.big) { flash(); confetti(60); } } else if (f.bad) SFX.bad();
    if (G.h === GOAL && G.done && !$("ov").classList.contains("on")) setTimeout(cleared, 600);
    if (!save.seen.includes(G.h)) save.seen.push(G.h); render(f.good ? "up" : null); persist(); }
}
function persist() { const c = Object.assign({}, G); delete c.R; delete c.hist; save.cur = G.done ? null : c; store.set(save); }
function newRun(seed) { G = newGame(seed ?? (Date.now() % 1e6)); sel = null; showMoney = G.cash; persist(); render(); emit("level_start", { level: 1 }); learn("wolse");
  if (!save.clears) setTimeout(() => { if (G.moves === 0 && !paused()) banner(`<b>부업을 눌러 돈 모으기</b><small>모이면 이사 버튼</small>`, "", 4000, "hand"); }, 400); }
// 시작 화면: 대표 그림 + 제목 + 한 줄 + 주 버튼 하나 + 보조 2개 (규칙·면책은 도감 안)

  const c = save.cur;
  openOv(`<div class="ui-col ui-center ui-enter"><div class="ui-hero" aria-hidden="true">${N(GOAL).e}</div><h1 class="ui-title">집 갈아타기</h1><p class="ui-sub">월세 원룸에서 펜트하우스까지</p></div>

    <div class="ui-row">${c ? `<button class="ui-btn" id="fresh">${I("rotate-ccw")}처음부터</button>` : ""}<button class="ui-btn" id="dexBtn">${I("book-open")}도감</button></div></div>`);

$("work").addEventListener("pointerdown", e => { e.preventDefault(); if (!auto) work(e); });
$("dexb").addEventListener("pointerdown", e => { e.preventDefault(); openDex(); });
$("smalls").addEventListener("click", e => { const b = e.target.closest("button[data-s]"); if (!b || auto) return; const S = SMALL.find(x => x.id === b.dataset.s), q = smallQuote(G, S.id);
  if (b.dataset.arm !== "1" && q.ok) { document.querySelectorAll("#smalls button").forEach(x => x.dataset.arm = ""); b.dataset.arm = "1"; banner(`<b>${S.n} · ${S.d(G)}</b><small><span class="ui-num">${fmt(q.cost)}</span> · 한 번 더 누르면 실행</small>`, "", 2500, SI[S.id]); setTimeout(() => { b.dataset.arm = ""; }, 2500); return; }
  b.dataset.arm = ""; doSmall(S.id); });
$("dests").addEventListener("pointerdown", e => { const b = e.target.closest("button[data-to]"); if (!b || auto) return; sel = b.dataset.to; beep(700, .03, "square", .03); render(); });

addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); work(); } if (e.key >= "1" && e.key <= "5") { const b = $("panel").querySelectorAll("button[data-m]")[+e.key - 1]; if (b) tryMethod(b.dataset.m); } });

let lastT = performance.now(), saveT = 0, panelT = 0, autoT = 0, bannerFree = 0;
const noticeQ = [];
function pumpNotice() { // 한 번에 하나: 창이 열려 있으면 기다리고, 배너는 1.6초 안에 덮지 않는다
  while (noticeQ.length && !paused()) {
    const f = noticeQ[0], quiet = f.end && !f.boss;
    if (!quiet && !f.boss && Date.now() < bannerFree) return;
    noticeQ.shift(); onNotice(f); if (!quiet) bannerFree = Date.now() + 1600;
  }
}
function loop(t) {
  const dt = Math.min(.25, (t - lastT) / 1000); lastT = t;
  if (G && !paused() && !(G.done && G.h === GOAL)) {
    const sp = auto ? 3 : 1;
    for (const f of tick(G, dt * sp)) if (f) noticeQ.push(f);
    saveT += dt; panelT += dt;
    if (auto && !paused()) { autoT += dt; if (Math.random() < .3) work(); if (autoT > .5) { autoT = 0; const c = botChoose(G, STRATS[autoStrat]); if (c) { sel = c.to; run(c.to, c.m, c.arg); } else if (botSmall(G, autoStrat)) render(); } }
    if (panelT > .5) { panelT = 0; const prev = $("dests").innerHTML; render(); }
    if (saveT > 3) { saveT = 0; persist(); }
  }
  pumpNotice(); if (G) hud();
  requestAnimationFrame(loop);

// ───────── 자체 검사 ─────────
// 갈래별 전략 봇 6개 × 시드 20 = 120판 (초당 1.5탭, 사람 근사) + 균형(중앙값 ±30%) + 갇힘(아무렇게나 20분 다닌 뒤에도 끝까지 갈 수 있나 20판)
// + 현금 음수 0건 + 화면 확률 = 실제 (매매·경매·청약)
function probCheck() {
  const N = 4000, out = []; let ok = true;
  const base = (i, ph) => { const G = newGame(i + 1); G.ph = ph; G.cash = 1e7; G.h = "a1"; G.owned = 1; G.buy = 15000; G.held = 100; return G; };
  const cases = [["매매 회복", "rec", G => [G, "k1", "m"]], ["매매 상승", "up", G => [G, "k1", "m"]], ["경매 회복 85", "rec", G => [G, "k1", "a", .85]], ["경매 조정 95", "adj", G => [G, "k1", "a", .95]],
    ["청약 서울", "rec", G => { G.h = "r2"; G.owned = 0; return [G, "s2", "c"]; }], ["청약 가점충족", "rec", G => { G.h = "r2"; G.owned = 0; G.noHome = 30 * YEAR; G.acct = 16 * YEAR; G.fam = 3; return [G, "s2", "c"]; }], ["청약 1주택", "rec", G => [G, "k2", "c"]]];
  for (const [nm, ph, f] of cases) { let win = 0, shown = 0; for (let i = 0; i < N; i++) { const [G, to, m, b] = f(base(i, ph)); const q = quote(G, to, m, b); shown = q.pt; const r = act(G, to, m, b); if (r && r.ok) win++; } const real = win / N, good = Math.abs(real - shown) <= .025; if (!good) ok = false; out.push(`${nm} ${Math.round(shown * 100)}/${Math.round(real * 100)}%`); }
  return { ok, rows: out };
}
function selftest() {
  const t0 = performance.now(), rows = [], meds = {}; let ok = 0, total = 0; const allT = [];
  for (const s in STRATS) {
    const ts = []; let pass = 0;
    for (let seed = 1; seed <= 20; seed++) { const o = runBot(seed, s, 60 * 60); const good = o.done && o.min >= 5 && o.min <= 30; total++; if (good) { ok++; pass++; } ts.push(o.min); allT.push(o.min); if (!good) rows.push(`  FAIL ${s} seed ${seed}: ${o.min.toFixed(1)}분 · ${o.G.path.join(">")}`); }
    ts.sort((a, b) => a - b); meds[s] = ts[10];
    rows.push(`${STRATS[s].n.padEnd(7, "　")} ${pass}/20 도달 · 중앙 ${ts[10].toFixed(1)}분 · 최소 ${ts[0].toFixed(1)} · 최대 ${ts[19].toFixed(1)}`);
  }
  allT.sort((a, b) => a - b); const mAll = allT[allT.length >> 1], vals = Object.values(meds).sort((a, b) => a - b), mMed = vals[vals.length >> 1];
  const bal = Object.values(meds).every(v => Math.abs(v / mMed - 1) <= .3); total++; if (bal) ok++;
  rows.push(`균형: 전략별 중앙값 / 전체 = ${Object.entries(meds).map(([k, v]) => k + " " + (v / mMed).toFixed(2)).join(" · ")} → ${bal ? "OK (±30% 안)" : "FAIL"}`);
  let stuck = 0; for (let seed = 1; seed <= 20; seed++) { const o = runBot(500 + seed, "metro", 90 * 60, 20 * 60); if (!o.done) stuck++; }
  total++; if (!stuck) ok++;
  rows.push(`갇힘: 20분 무작위로 돌아다닌 뒤 끝까지 가기 20판 → 못 간 판 ${stuck}건 ${stuck ? "FAIL" : "OK"}`);
  // 현금 음수: 위 판들 + 갇힘 판 전부의 최저 현금
  let neg = 0; for (const s in STRATS) for (let seed = 1; seed <= 20; seed++) { const o = runBot(seed, s, 60 * 60); if (o.G.minCash < -1) neg++; }
  for (let seed = 1; seed <= 40; seed++) { const o = runBot(900 + seed, "auction", 90 * 60, 30 * 60); if (o.G.minCash < -1) neg++; }
  total++; if (!neg) ok++; rows.push(`현금 음수: 160판 중 ${neg}건 ${neg ? "FAIL" : "OK"}`);

  const pr = probCheck(); total++; if (pr.ok) ok++; rows.push(`화면 확률 = 실제: ${pr.rows.join(" · ")} → ${pr.ok ? "OK" : "FAIL"}`);
  rows.push(`전체 중앙 시간 ${mAll.toFixed(1)}분 (120판) · 검사 ${(performance.now() - t0 | 0)}ms`);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;overflow:auto;font-size:11px;white-space:pre-wrap">SELFTEST ${ok}/${total}\n${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/${total}`;
  window.__selftest = { ok, total, meds, mAll, stuck };
}

buildMap();
if (Q.has("selftest")) { G = newGame(1); render(); selftest(); }
else if (Q.has("autoplay")) { auto = true; const n = Number(Q.get("autoplay")) || 1; autoStrat = Object.keys(STRATS)[n % 6]; G = newGame(n); showMoney = G.cash; render(); emit("level_start", { level: 1 }); }
else { G = newGame(Date.now() % 1e6); render(); menu(); }
window.__g012 = { newGame, act, tick, quote, runBot, STRATS, NODES, get G() { return G; } };
requestAnimationFrame(loop);
</script>
