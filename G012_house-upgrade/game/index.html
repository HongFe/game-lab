<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16213a">
<title>집 갈아타기</title>
<style>
:root{--bg:#141c33;--tx:#f5f7ff;--sub:#a9b4d0;--acc:#ffd166;--ok:#4ade80;--bad:#ff6b6b;--blue:#60a5fa;--pur:#c084fc;--panel:rgba(255,255,255,.065);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));overflow-y:auto}
#app.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.hud{display:flex;gap:5px;flex:none}
.hud div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px 4px;text-align:center;font-size:12px;color:var(--sub);min-width:0}
.hud b{display:block;font:900 16px ui-monospace,Menlo,monospace;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .money b{color:var(--acc)} .hud .nw b{color:#a5f3fc}
.scene{position:relative;flex:none;height:134px;border-radius:18px;overflow:hidden;background:linear-gradient(#6aa8ff,#bfe0ff 72%,#7fc47f 72%,#5fa85f);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 4px 14px rgba(0,0,0,.25);transition:background 1.2s}
.scene.up{background:linear-gradient(#ff9f5a,#ffe3a3 72%,#86c979 72%,#5fa85f)}
.scene.adj{background:linear-gradient(#7c6fd6,#d4c8ff 72%,#7aa77a 72%,#557d55)}
.scene.crash{background:linear-gradient(#2c3047,#7d6574 72%,#4d5e4d 72%,#394739)}
.sun{position:absolute;right:14px;top:30px;width:34px;height:34px;border-radius:50%;background:radial-gradient(#fff6c2,#ffd166);box-shadow:0 0 26px #ffd16699;transition:.8s}
.scene.crash .sun{background:radial-gradient(#ccc,#888);box-shadow:none}
.cloud{position:absolute;font-size:26px;opacity:.8;animation:drift 28s linear infinite}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(520px)}}
.house{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);font-size:54px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.house.up{animation:hup .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes hup{0%{transform:translateX(-50%) scale(.3) translateY(50px)}100%{transform:translateX(-50%) scale(1)}}
.house.crack{animation:crack .5s}
@keyframes crack{20%{transform:translateX(calc(-50% - 9px)) rotate(-4deg)}40%{transform:translateX(calc(-50% + 9px)) rotate(4deg)}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 3px))}}
.name{position:absolute;left:0;right:0;bottom:20px;text-align:center;font:900 16px -apple-system,sans-serif;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.55);line-height:1.25}
.name small{display:block;font-size:12px;font-weight:700;opacity:.95}
.chip{position:absolute;top:7px;background:rgba(0,0,0,.42);border-radius:999px;padding:3px 9px;font:800 11.5px -apple-system,sans-serif;white-space:nowrap}
#phase{left:7px} #yr{right:7px}
.pbar{position:absolute;left:8px;right:8px;bottom:3px;height:16px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;display:none;font:800 12px -apple-system,sans-serif;text-align:center;line-height:16px;z-index:3}
.pbar.on{display:block} .pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c084fc,#60a5fa);opacity:.85} .pbar span{position:relative}
.news{position:absolute;left:7px;right:7px;top:32px;background:rgba(10,14,30,.9);border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-size:11.5px;line-height:1.42;opacity:0;transform:translateY(-8px);transition:.3s;pointer-events:none;z-index:2}
.news.on{opacity:1;transform:none;pointer-events:auto}
.news.good{border-color:#4ade80} .news.bad{border-color:#ff6b6b} .news.ph{border-width:2px}
.news b{font-size:13px} .news .c{color:var(--sub)} .news .r{color:var(--acc)}
.fxrow{display:flex;gap:4px;overflow-x:auto;min-height:20px;flex:none;scrollbar-width:none}
.fxrow::-webkit-scrollbar{display:none}
.fxrow span{flex:none;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.fxrow span.bad{border-color:#ff6b6b88;color:#ffc2c2} .fxrow span.good{border-color:#4ade8088;color:#c6f6d5}
.map{flex:1 1 auto;min-height:170px;background:radial-gradient(ellipse at 50% 0%,#24305a,#172042);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.map{pointer-events:none}
.map .nd circle.b{stroke:rgba(255,255,255,.25);stroke-width:1.2}
.map .nd.dim{opacity:.4}
.map .nd.can circle.b{stroke:#fff;stroke-width:2}
.map .nd.sel circle.b{stroke:var(--acc);stroke-width:3}
.map .nd.cur circle.ring{animation:pulse 1.4s infinite}
@keyframes pulse{0%{r:15;opacity:.9}100%{r:24;opacity:0}}
.map .eg{stroke:rgba(255,255,255,.12);stroke-width:1.4}
.map .eg.hot{stroke:rgba(255,209,102,.8);stroke-width:2.4;stroke-dasharray:5 4;animation:dash 1s linear infinite}
.map .eg.sub{stroke:rgba(192,132,252,.85);stroke-width:2;stroke-dasharray:2 4}
@keyframes dash{to{stroke-dashoffset:-18}}
.map .lb{font:900 15px -apple-system,sans-serif;fill:#dfe6ff;text-anchor:middle;pointer-events:none}
.map .lb.dim{fill:#7c88aa}
.map .disc{position:absolute;left:9px;bottom:5px;font-size:12px;color:#8892b0;pointer-events:none}
.map .leg{position:absolute;left:8px;bottom:4px;font-size:9px;color:#8892b0;pointer-events:none}
.dests{display:flex;gap:5px;overflow-x:auto;flex:none;scrollbar-width:none;padding-bottom:1px}
.dests::-webkit-scrollbar{display:none}
.dests button{flex:none;min-height:46px;min-width:64px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:3px 9px;font:800 12px -apple-system,sans-serif;line-height:1.25;cursor:pointer}
.dests button small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.dests button.ok small{color:var(--ok)}
.dests button.on{border-color:var(--acc);background:rgba(255,209,102,.16);box-shadow:0 0 0 1px var(--acc) inset}
.panel{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 8px}
.panel .hd{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.panel .hd span{color:var(--sub);font-weight:700;font-size:11px;white-space:nowrap}
.meths{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.meths button{min-height:50px;border:0;border-radius:12px;padding:4px 7px;text-align:left;font:900 13.5px -apple-system,sans-serif;cursor:pointer;background:linear-gradient(#ffe08a,#ffb703);color:#3b2a00;box-shadow:0 4px 0 #b07d00;line-height:1.2}
.meths button small{display:block;font-size:12.5px;font-weight:700;opacity:.88}
.meths button.lock{background:#2b3553;color:#c3cbe3;box-shadow:0 4px 0 #1b2238}
.meths button.lock small{color:#ff9b9b;opacity:1}
.meths button.c{background:linear-gradient(#e9d5ff,#c084fc);box-shadow:0 4px 0 #7e3fb8;color:#2a0b45}
.meths button.a{background:linear-gradient(#bae6fd,#38bdf8);box-shadow:0 4px 0 #0e6a99;color:#06283d}
.meths button.g{background:linear-gradient(#bbf7d0,#4ade80);box-shadow:0 4px 0 #15803d;color:#062b14}
.meths button:active{transform:translateY(3px);box-shadow:none}
.panel .info{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.4}
.panel .wait{font-size:13px;line-height:1.5;text-align:center;padding:4px 0}
.btns{display:flex;gap:7px;flex:none}
.btns button{border:0;border-radius:16px;padding:10px 0;font:900 16px -apple-system,sans-serif;cursor:pointer;touch-action:manipulation;min-height:50px}
.btns small{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:1px}
#work{flex:1;background:#334155;color:#fff;box-shadow:0 5px 0 #1e293b}
.sm{width:48px;flex:none;background:#24456b;color:#fff;box-shadow:0 5px 0 #132a45;font-size:20px!important;padding:6px 0!important;line-height:1.05}
.sm small{font-size:12px!important;font-weight:800}
.sm.lock{filter:grayscale(.85) brightness(.7)}
#smalls{display:flex;gap:6px}
#dexb{width:56px;background:#3b2f63;color:#fff;box-shadow:0 5px 0 #231a40;font-size:20px;position:relative}
#dexb i{position:absolute;right:4px;top:3px;font:900 10px ui-monospace,monospace;font-style:normal;background:var(--acc);color:#3b2a00;border-radius:999px;padding:1px 5px}
.btns button:active{transform:translateY(4px);box-shadow:none}
.roll{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,8,20,.8);z-index:5;gap:8px;padding:20px}
.roll.on{display:flex}
.roll .ttl{font:900 17px -apple-system,sans-serif;text-align:center;line-height:1.4}
.roll .steps{width:min(330px,88vw);display:flex;flex-direction:column;gap:9px;margin:6px 0}
.roll .st{background:#1f2a44;border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:13px;font-weight:700;opacity:.35;transition:opacity .2s}
.roll .st.on{opacity:1}
.roll .st .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.roll .st .n{font:900 20px ui-monospace,Menlo,monospace;min-width:44px;text-align:right}
.roll .g{height:12px;border-radius:999px;background:#0f172a;overflow:hidden;position:relative;margin-top:5px}
.roll .g i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd166,#ff8c42);width:0}
.roll .g em{position:absolute;top:0;bottom:0;width:3px;background:#fff}
.roll .g u{position:absolute;left:0;top:0;bottom:0;background:rgba(74,222,128,.25)}
.roll .msg{font:900 25px -apple-system,sans-serif;min-height:32px;text-align:center}
.roll .sub{font-size:13px;color:var(--sub);min-height:18px;text-align:center;max-width:330px;line-height:1.5}
.roll .bids{width:min(330px,88vw);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.roll .bids div{display:flex;justify-content:space-between;background:#1f2a44;border-radius:8px;padding:4px 9px;opacity:0;transform:translateX(-10px);transition:.25s}
.roll .bids div.on{opacity:1;transform:none} .roll .bids div.me{border:1px solid var(--acc)} .roll .bids div.win{background:#14532d}
.coin{position:fixed;font:900 15px -apple-system,sans-serif;color:var(--acc);pointer-events:none;animation:coin .8s ease-out forwards;z-index:4;text-shadow:0 2px 4px #000}
@keyframes coin{to{transform:translateY(-34px);opacity:0}}
.conf{position:fixed;width:9px;height:6px;z-index:6;pointer-events:none;animation:conf 1.4s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.75);padding:14px;z-index:7}
.ov.on{display:flex}
.box{background:#1f2a44;border:1px solid var(--line);border-radius:18px;padding:16px;width:min(380px,100%);max-height:calc(100% - 10px);overflow-y:auto;text-align:center}
.box h1{margin:0;font-size:24px} .box h2{margin:0 0 6px;font-size:19px} .box h3{margin:12px 0 4px;font-size:14px;text-align:left}
.box p{color:var(--sub);font-size:13px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:12.8px;line-height:1.7;padding-left:18px;margin:8px 0}
.box button{width:100%;border:0;border-radius:12px;padding:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--acc);color:#3b2a00;min-height:44px}
.box button.sec{background:#334155;color:#fff}
.box .bidb{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#38bdf8;color:#06283d;font-size:16px}
.box .bidb.lock{background:#2b3553;color:#9aa6c6}
.box .bidb small{display:block;font-size:11px;font-weight:700}
.box .tbl{font-size:12px;text-align:left;color:var(--sub);line-height:1.6;background:#172038;border-radius:10px;padding:7px 10px;margin:6px 0}
.box .terms div{text-align:left;font-size:12.3px;line-height:1.45;padding:5px 0;border-bottom:1px solid var(--line)}
.box .terms div.no{color:#59658a}
.box .badges span{display:inline-block;margin:3px;padding:4px 9px;border-radius:999px;background:#172038;font-size:12px;font-weight:800;opacity:.4}
.box .badges span.got{opacity:1;background:#3b2f63}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);width:min(440px,calc(100% - 24px));background:#2a1f4d;border:1px solid #c084fc;border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.45;opacity:0;transition:.3s;pointer-events:none;z-index:4}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast b{color:#e9d5ff}
@media (max-height:600px){.scene{height:104px}.house{font-size:44px}.map{min-height:140px}}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><div class="money">💰 현금<b id="money">0</b></div><div>⏱ 수입<b id="inc">0</b></div><div class="nw">🏠 순자산<b id="nw">0</b></div></div>
  <div class="scene" id="scene"><div class="sun"></div><div class="cloud" style="top:30%">☁️</div><div class="cloud" style="top:12%;animation-delay:-14s;font-size:20px">☁️</div>
    <div class="chip" id="phase"></div><div class="chip" id="yr"></div><div class="news" id="news"></div>
    <div class="house" id="house">🛏️</div><div class="pbar" id="pbar"><i id="pbi"></i><span id="pbt"></span></div><div class="name" id="name"></div></div>
  <div class="fxrow" id="fx"></div>
  <div class="map" id="map"></div>
  <div class="dests" id="dests"></div>
  <div class="panel" id="panel"></div>
  <div class="btns"><div id="smalls"></div><button id="work">🔨 부업<small id="workAmt">+10만</small></button><button id="dexb">📖<i id="dexn">0</i></button></div>
</div>
<div class="roll" id="roll"><div class="ttl" id="rttl"></div><div class="bids" id="rbids"></div><div class="steps" id="rsteps"></div><div class="msg" id="rmsg"></div><div class="sub" id="rsub"></div></div>
<div class="flash" id="flash"></div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>
"use strict";
// ═════════ LOGIC START (DOM 없음 · 봇과 화면이 같이 쓴다) ═════════
// 게임용 단순화 · 실제 제도·시세와 다를 수 있음. 금액 단위 = 만원. YEAR초 = 1년 (지금 30초)
const YEAR = 30, TAP_RATE = 1.5, SAVE = .75, YG = .08;
const yrs = y => `${y}년(${Math.round(y * YEAR)}초)`; // 화면 시간 문구는 항상 YEAR에서 계산
// 집 지도. p = 시작 시세(만원, 2025~26년 84㎡ 안팎을 크게 어림한 게임용 숫자, 특정 단지와 무관)
// g = 가격 묶음, t = 층(지도 세로), x = 지도 가로, seoul = 규제지역, th = 토지거래허가 대상
const NODES = {
  r0: { n: "원룸 월세", r: "지방 소도시", e: "🛏️", p: 1000, g: "rent", t: 0, x: 200, rent: 1, s: "월세" },
  r1: { n: "원룸 전세", r: "지방 소도시", e: "🏠", p: 5000, g: "rent", t: 1, x: 105, rent: 1, s: "지방전세" },
  v1: { n: "구축 빌라", r: "지방 소도시", e: "🏘️", p: 8000, g: "local", t: 1, x: 295, s: "빌라" },
  a1: { n: "구축 아파트", r: "지방 소도시", e: "🏢", p: 15000, g: "local", t: 2, x: 120, s: "지방구축" },
  r2: { n: "빌라 전세", r: "서울", e: "🏡", p: 25000, g: "rent", t: 2, x: 350, rent: 1, seoulRes: 1, s: "서울전세" },
  g1: { n: "외곽 아파트", r: "지방 광역시", e: "🏬", p: 25000, g: "local", t: 3, x: 40, s: "광역시" },
  k1: { n: "외곽 아파트", r: "경기 외곽", e: "🚌", p: 35000, g: "metro", t: 3, x: 190, s: "경기외곽" },
  rd: { n: "재개발구역 빌라", r: "서울 · 몸테크", e: "🏚️", p: 40000, g: "seoul", t: 3, x: 335, redev: 1, seoul: 1, th: 1, s: "재개발" },
  g2: { n: "신축 대단지", r: "지방 광역시", e: "🏙️", p: 50000, g: "local", t: 4, x: 45, s: "광역신축" },
  k2: { n: "신도시 아파트", r: "2기 신도시", e: "🚆", p: 70000, g: "metro", t: 4, x: 160, s: "신도시" },
  s1: { n: "구축 아파트", r: "서울 외곽", e: "🧱", p: 65000, g: "seoul", t: 4, x: 270, seoul: 1, s: "서울외곽" },
  g3: { n: "바다뷰 아파트", r: "부산 해운대", e: "🌊", p: 90000, g: "top", t: 5, x: 25, s: "해운대" },
  g4: { n: "학군지 아파트", r: "대구 수성구", e: "📖", p: 110000, g: "top", t: 5, x: 95, s: "수성구" },
  k3: { n: "재건축 기대 단지", r: "1기 신도시", e: "🌳", p: 130000, g: "metro", t: 5, x: 180, recon: 1, s: "1기재건축" },
  s2: { n: "신축 아파트", r: "서울 마포·성동", e: "🌉", p: 170000, g: "seoul", t: 5, x: 275, seoul: 1, th: 1, s: "마포성동" },
  s4: { n: "학원가 아파트", r: "서울 대치동", e: "📚", p: 260000, g: "seoul", t: 6, x: 125, seoul: 1, th: 1, s: "대치" },
  s3: { n: "대단지 아파트", r: "서울 송파", e: "🏟️", p: 220000, g: "seoul", t: 6, x: 230, seoul: 1, th: 1, s: "송파" },
  rdn: { n: "뉴타운 신축", r: "서울 · 재개발 입주", e: "🌇", p: 200000, g: "seoul", t: 6, x: 345, seoul: 1, s: "뉴타운" },
  PH: { n: "한강뷰 펜트하우스", r: "서울 한강변", e: "🌆", p: 340000, g: "lux", t: 7, x: 200, seoul: 1, th: 1, s: "펜트" },
};
const GOAL = "PH";

function openBid(to) {

  const rows = BIDS.map(b => { const q = quote(G, to, "a", b); const pc = Math.round((q.pt || 0) * 100); return `<button class="bidb ${q.ok ? "" : "lock"}" data-b="${b}"><span>${fmt(q.bid)}${q.bid > P ? " ⚠️" : ""}</span><span>${q.ok ? `낙찰 ${pc}%` : q.zero ? "낙찰 0%" : `🔒 ${fmt(q.short)} 부족`}</span></button>`; }).join("");

  <p style="font-size:12px">낙찰 뒤 🧹60% · 🚚지연 25% · 🔧수리 15%</p><button class="sec" id="bidx">그만두기</button>`;
  $("ov").classList.add("on");

function showBoss(b) {

function cleared() {

  <p style="font-size:12px">루트 도감 ${save.routes.length}/6 · 최단 ${save.bestMin}분 · 용어 ${save.terms.length}/${Object.keys(TERMS).length}</p>

function openDex() {

  <h3>🏠 가 본 집 ${save.seen.length}/${Object.keys(NODES).length}</h3><p style="font-size:20px;text-align:left;letter-spacing:2px">${Object.keys(NODES).map(id => save.seen.includes(id) ? N(id).e : "▫️").join("")}</p>
  <h3>📰 사건 사전 ${(save.evs || []).length}/${EVENTS.length}</h3><div class="terms">${EVENTS.map(e => (save.evs || []).includes(e.id) ? `<div><b>${e.ic} ${e.t}</b> · ${e.s}<br><span style="color:var(--sub)">원인: ${e.cause}<br>결과: ${e.eff}<br>💡 ${e.resp}</span></div>` : `<div class="no">??? 사건</div>`).join("")}</div>
  <button id="dexc">닫기</button><button class="sec" id="dexr">처음부터 다시</button>`;
  $("ov").classList.add("on"); $("dexc").onclick = () => $("ov").classList.remove("on"); $("dexr").onclick = () => { const b = $("dexr"); if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "한 번 더 누르면 이번 판을 지워요"; b.style.background = "#7f1d1d"; return; } $("ov").classList.remove("on"); newRun(); };
}
function onNotice(f) {
  if (!f) return;
  if (f.boss) return showBoss(f.boss);
  if (f.ev) {
    const e = f.ev; G.log.push(`${Math.floor(G.t / YEAR) + 1}년차 ${e.ic} ${e.t}`); if (e.term) learn(e.term);
    if (!save.evs) save.evs = []; if (!save.evs.includes(e.id)) save.evs.push(e.id);
    banner(`<b>${e.ic} ${e.t}</b> · ${e.s}${e.d ? ` <span class="c">${e.d}초</span>` : ""}`, e.bad ? "bad" : "good", 4500);
    if (JUICE) (e.bad ? SFX.bad : SFX.good)(); if (e.bad && (e.id === "rateUp" || e.id === "loanTight")) shake();
    render(); return;
  }
  if (f.phase) {
    const P = PHASES[f.phase]; G.log.push(`${Math.floor(G.t / YEAR) + 1}년차 ${P.ic} ${P.n}`); learn("cycle");
    const tip = { rec: "집값 ↗ · 성사 85%", up: "집값 ⬆ · 성사 70%", adj: "집값 → · 성사 90%", crash: "집값 ⬇ · 버티면 🏆" }[f.phase];
    banner(`<b style="color:${P.c}">${P.ic} ${P.n}</b> · ${tip}`, "ph " + (f.phase === "crash" ? "bad" : "good"), 3500);
    if (f.phase === "crash") { SFX.rumble(); shake(); flash("#ff6b6b"); } else if (JUICE) SFX.good();
    render(); return;
  }
  if (f.t) { if (f.term) learn(f.term); if (f.term2) learn(f.term2); if (f.end) return; banner(f.t, f.good ? "good" : f.bad ? "bad" : "", 3500); if (f.good) { SFX.ok(3); if (f.big) { flash(); confetti(60); } } else if (f.bad) SFX.bad();
    if (G.h === GOAL && G.done && !$("ov").classList.contains("on")) setTimeout(cleared, 600);
    if (!save.seen.includes(G.h)) save.seen.push(G.h); render(f.good ? "up" : null); persist(); }
}
function persist() { const c = Object.assign({}, G); delete c.R; delete c.hist; save.cur = G.done ? null : c; store.set(save); }
function newRun(seed) { G = newGame(seed ?? (Date.now() % 1e6)); sel = null; showMoney = G.cash; persist(); render(); emit("level_start", { level: 1 }); learn("wolse"); }
function menu() {
  const c = save.cur;
  $("box").innerHTML = `<h1>🏠 집 갈아타기</h1><p style="margin:2px 0 0">지방 원룸 월세에서 🌆 한강뷰 펜트하우스까지</p><ul>
  <li>🗺️ 지도에서 다음 집 고르기</li>
  <li>🤝매매 📝청약 🔨경매 🧳갭 🏚️재개발</li>
  <li>📰 사건이 길을 막으면 우회</li>

  ${c ? `<button id="resume">이어 하기 (${N(c.h).e} ${N(c.h).s})</button><button class="sec" id="go">처음부터</button>` : '<button id="go">시작</button>'}
  <p style="font-size:10.5px;line-height:1.5">게임용 단순화 · 실제와 다를 수 있음<br>실제 돈 없음 · 확률 공개 · 투자 권유 아님</p>`;

  if (c) $("resume").onclick = () => { G = newGame(c.seed || 1); Object.assign(G, c); G.R = rng((c.seed || 1) + Math.floor(c.t * 7)); G.hist = []; showMoney = G.cash; $("ov").classList.remove("on"); render(); emit("level_start", { level: N(G.h).t + 1 }); };
}

$("work").addEventListener("pointerdown", e => { e.preventDefault(); if (!auto) work(e); });
$("dexb").addEventListener("pointerdown", e => { e.preventDefault(); openDex(); });
$("smalls").addEventListener("click", e => { const b = e.target.closest("button[data-s]"); if (!b || auto) return; const S = SMALL.find(x => x.id === b.dataset.s), q = smallQuote(G, S.id);
  if (b.dataset.arm !== "1" && q.ok) { document.querySelectorAll("#smalls button").forEach(x => x.dataset.arm = ""); b.dataset.arm = "1"; banner(`${S.ic} <b>${S.n}</b> · ${S.d(G)} · ${fmt(q.cost)} — 한 번 더 누르면 실행`, "", 2500); setTimeout(() => { b.dataset.arm = ""; }, 2500); return; }
  b.dataset.arm = ""; doSmall(S.id); });
$("dests").addEventListener("pointerdown", e => { const b = e.target.closest("button[data-to]"); if (!b || auto) return; sel = b.dataset.to; beep(700, .03, "square", .03); render(); });

let lastT = performance.now(), saveT = 0, panelT = 0, autoT = 0, bannerFree = 0;
const noticeQ = [];
function pumpNotice() { // 한 번에 하나: 창이 열려 있으면 기다리고, 배너는 1.6초 안에 덮지 않는다
  while (noticeQ.length && !paused()) {
    const f = noticeQ[0], quiet = f.end && !f.boss;
    if (!quiet && !f.boss && Date.now() < bannerFree) return;
    noticeQ.shift(); onNotice(f); if (!quiet) bannerFree = Date.now() + 1600;
  }
}
function loop(t) {
  const dt = Math.min(.25, (t - lastT) / 1000); lastT = t;
  if (G && !paused() && !(G.done && G.h === GOAL)) {
    const sp = auto ? 3 : 1;
    for (const f of tick(G, dt * sp)) if (f) noticeQ.push(f);
    saveT += dt; panelT += dt;
    if (auto && !paused()) { autoT += dt; if (Math.random() < .3) work(); if (autoT > .5) { autoT = 0; const c = botChoose(G, STRATS[autoStrat]); if (c) { sel = c.to; run(c.to, c.m, c.arg); } else if (botSmall(G, autoStrat)) render(); } }
    if (panelT > .5) { panelT = 0; const prev = $("dests").innerHTML; render(); }
    if (saveT > 3) { saveT = 0; persist(); }
  }

// ───────── 자체 검사 ─────────
// 갈래별 전략 봇 6개 × 시드 20 = 120판 (초당 1.5탭, 사람 근사) + 균형(중앙값 ±30%) + 갇힘(아무렇게나 20분 다닌 뒤에도 끝까지 갈 수 있나 20판)
// + 현금 음수 0건 + 화면 확률 = 실제 (매매·경매·청약)
function probCheck() {
  const N = 4000, out = []; let ok = true;
  const base = (i, ph) => { const G = newGame(i + 1); G.ph = ph; G.cash = 1e7; G.h = "a1"; G.owned = 1; G.buy = 15000; G.held = 100; return G; };
  const cases = [["매매 회복", "rec", G => [G, "k1", "m"]], ["매매 상승", "up", G => [G, "k1", "m"]], ["경매 회복 85", "rec", G => [G, "k1", "a", .85]], ["경매 조정 95", "adj", G => [G, "k1", "a", .95]],
    ["청약 서울", "rec", G => { G.h = "r2"; G.owned = 0; return [G, "s2", "c"]; }], ["청약 가점충족", "rec", G => { G.h = "r2"; G.owned = 0; G.noHome = 30 * YEAR; G.acct = 16 * YEAR; G.fam = 3; return [G, "s2", "c"]; }], ["청약 1주택", "rec", G => [G, "k2", "c"]]];
  for (const [nm, ph, f] of cases) { let win = 0, shown = 0; for (let i = 0; i < N; i++) { const [G, to, m, b] = f(base(i, ph)); const q = quote(G, to, m, b); shown = q.pt; const r = act(G, to, m, b); if (r && r.ok) win++; } const real = win / N, good = Math.abs(real - shown) <= .025; if (!good) ok = false; out.push(`${nm} ${Math.round(shown * 100)}/${Math.round(real * 100)}%`); }
  return { ok, rows: out };
}
function selftest() {
  const t0 = performance.now(), rows = [], meds = {}; let ok = 0, total = 0; const allT = [];
  for (const s in STRATS) {
    const ts = []; let pass = 0;
    for (let seed = 1; seed <= 20; seed++) { const o = runBot(seed, s, 60 * 60); const good = o.done && o.min >= 5 && o.min <= 30; total++; if (good) { ok++; pass++; } ts.push(o.min); allT.push(o.min); if (!good) rows.push(`  FAIL ${s} seed ${seed}: ${o.min.toFixed(1)}분 · ${o.G.path.join(">")}`); }
    ts.sort((a, b) => a - b); meds[s] = ts[10];
    rows.push(`${STRATS[s].n.padEnd(7, "　")} ${pass}/20 도달 · 중앙 ${ts[10].toFixed(1)}분 · 최소 ${ts[0].toFixed(1)} · 최대 ${ts[19].toFixed(1)}`);
  }
  allT.sort((a, b) => a - b); const mAll = allT[allT.length >> 1], vals = Object.values(meds).sort((a, b) => a - b), mMed = vals[vals.length >> 1];
  const bal = Object.values(meds).every(v => Math.abs(v / mMed - 1) <= .3); total++; if (bal) ok++;
  rows.push(`균형: 전략별 중앙값 / 전체 = ${Object.entries(meds).map(([k, v]) => k + " " + (v / mMed).toFixed(2)).join(" · ")} → ${bal ? "OK (±30% 안)" : "FAIL"}`);
  let stuck = 0; for (let seed = 1; seed <= 20; seed++) { const o = runBot(500 + seed, "metro", 90 * 60, 20 * 60); if (!o.done) stuck++; }
  total++; if (!stuck) ok++;
  rows.push(`갇힘: 20분 무작위로 돌아다닌 뒤 끝까지 가기 20판 → 못 간 판 ${stuck}건 ${stuck ? "FAIL" : "OK"}`);
  // 현금 음수: 위 판들 + 갇힘 판 전부의 최저 현금
  let neg = 0; for (const s in STRATS) for (let seed = 1; seed <= 20; seed++) { const o = runBot(seed, s, 60 * 60); if (o.G.minCash < -1) neg++; }
  for (let seed = 1; seed <= 40; seed++) { const o = runBot(900 + seed, "auction", 90 * 60, 30 * 60); if (o.G.minCash < -1) neg++; }
  total++; if (!neg) ok++; rows.push(`현금 음수: 160판 중 ${neg}건 ${neg ? "FAIL" : "OK"}`);
  // 화면 확률 = 실제 (몬테카를로 4천 회, ±2.5%p)
  const pr = probCheck(); total++; if (pr.ok) ok++; rows.push(`화면 확률 = 실제: ${pr.rows.join(" · ")} → ${pr.ok ? "OK" : "FAIL"}`);
  rows.push(`전체 중앙 시간 ${mAll.toFixed(1)}분 (120판) · 검사 ${(performance.now() - t0 | 0)}ms`);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;overflow:auto;font-size:11px;white-space:pre-wrap">SELFTEST ${ok}/${total}\n${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/${total}`;
  window.__selftest = { ok, total, meds, mAll, stuck };
}

buildMap();
if (Q.has("selftest")) { G = newGame(1); render(); selftest(); }
else if (Q.has("autoplay")) { auto = true; const n = Number(Q.get("autoplay")) || 1; autoStrat = Object.keys(STRATS)[n % 6]; G = newGame(n); showMoney = G.cash; render(); emit("level_start", { level: 1 }); }
else { G = newGame(Date.now() % 1e6); render(); menu(); }
$("dexn").textContent = save.terms.length;
window.__g012 = { newGame, act, tick, quote, runBot, STRATS, NODES, get G() { return G; } };
requestAnimationFrame(loop);
</script>
