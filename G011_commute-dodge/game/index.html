<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12151d">
<title>출근길 피하기</title>
<style>
:root{--bg:#12151d;--tx:#f4f6fb;--sub:#a3abc0;--acc:#ffcf3f;--red:#ff5a5a;--ok:#4ade80;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:none;align-items:stretch}
.hud div{background:rgba(12,14,20,.78);border:1px solid var(--line);border-radius:12px;padding:5px 9px;font-size:12px;color:var(--sub);text-align:center;min-width:58px;white-space:nowrap}
.hud b{display:block;font:900 18px ui-monospace,Menlo,monospace;color:var(--tx)}
.hud .clock{flex:1.4} .hud .clock b{color:var(--acc);font-size:22px;transition:color .2s}
.hud .clock.rush b{color:var(--red)}
.hud .life b{color:var(--red);letter-spacing:1px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,16,.72);padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));z-index:5}
.ov.on{display:flex}
.box{background:#262c3b;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);max-height:100%;overflow:auto;text-align:center;animation:rise .25s ease-out;box-shadow:0 18px 40px rgba(0,0,0,.45)}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h1{margin:0;font-size:25px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:13px;line-height:1.7;padding-left:18px;margin:10px 0}
.box button{width:100%;min-height:44px;border:0;border-radius:12px;padding:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--acc);color:#2a2000}
.box button.sec{background:#3a4256;color:var(--tx)}
.box .stars{font-size:30px;color:var(--acc);letter-spacing:4px}
.stamp{font:900 30px -apple-system,sans-serif;color:var(--ok);border:4px solid var(--ok);display:inline-block;padding:2px 14px;border-radius:10px;transform:rotate(-8deg);margin:6px 0;animation:stamp .4s cubic-bezier(.3,1.7,.6,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}}
.lines{display:grid;gap:6px;margin-top:8px}
.lines button{margin:0;text-align:left;padding:10px 12px;background:#3a4256;color:var(--tx);display:flex;justify-content:space-between;align-items:center}
.lines button:disabled{opacity:.35} .lines small{color:var(--acc)}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;color:#fff;font:900 11px/18px -apple-system,sans-serif;text-align:center;margin-right:6px;vertical-align:-3px}
.logo{display:inline-block;width:34px;height:34px;border-radius:50%;border:5px solid var(--acc);vertical-align:-8px;margin-right:6px;position:relative}
.logo:after{content:"";position:absolute;left:4px;right:4px;top:9px;height:6px;background:var(--acc);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="clock" id="clockBox">지금<b id="clock">8:59:00</b></div><div class="life">셔츠<b id="life">♥♥♥</b></div><div>휙!<b id="near">0</b></div></div>
  <div class="ov" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
// ───────── 설정 ─────────
const LW = 360, LH = 640, PR = 10, DT = 1 / 120, DUR = 60, TOP_Y = 150, BOT_Y = 610, WALL = 22, FL = WALL, FR = LW - WALL;
const VMAX = 290, VDASH = 460, GAIN = 13, ACC = 11;   // 최대 속도(px/s), 손가락 추종 세기, 관성(작을수록 더 미끄러짐)
// kinds: 낱개 장애물 비율, forms: 대형 비율, formEvery: 대형 간격(초), gap: 벽 틈(px), zigRows: 지그재그 줄 수
const LINES = [
  { name: "2호선 아침", no: "2", col: "#3cb44b", dens: .5, speed: .95, gap: 90, formEvery: 8, first: 6,
    kinds: { bag: 4, umb: 2, coffee: 1 }, forms: { wall: 3, swarm: 1, stairs: 1 } },
  { name: "9호선 급행", no: "9", col: "#bfa14a", dens: .95, speed: 1.12, gap: 70, formEvery: 6.5, first: 5,
    kinds: { bag: 3, umb: 2, scoot: 2, flyer: 1, coffee: 1 }, forms: { wall: 2, zig: 2, swarm: 1, stairs: 1 } },
  { name: "신도림 환승", no: "1", col: "#2a6ad8", dens: 1.1, speed: 1.2, gap: 62, formEvery: 5.2, first: 4, zigRows: 3,
    kinds: { bag: 3, umb: 3, scoot: 2, flyer: 2, coffee: 1 }, forms: { wall: 2, zig: 2, pincer: 2, swarm: 1, esc: 1, stairs: 1 } },
  { name: "강남역 출구", no: "2", col: "#e0457b", dens: 1.15, speed: 1.25, gap: 60, formEvery: 4.6, first: 4, zigRows: 4,
    kinds: { bag: 3, umb: 2, scoot: 3, flyer: 2, coffee: 1 }, forms: { wall: 2, zig: 2, pincer: 2, swarm: 2, esc: 1, stairs: 1 } },
  { name: "월요일 아침", no: "M", col: "#ff8a3d", dens: 1.5, speed: 1.38, gap: 56, formEvery: 4, first: 3.5, zigRows: 4,
    kinds: { bag: 3, umb: 3, scoot: 3, flyer: 2, coffee: 1 }, forms: { wall: 2, zig: 3, pincer: 2, swarm: 2, esc: 2, stairs: 1 } },
];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const store = { get() { try { return JSON.parse(localStorage.getItem("g011") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g011", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ stars: {}, unlocked: 1, bestNear: {} }, store.get());

// ───────── 소리 ─────────
let ac = null;
function beep(f, d = .06, type = "square", v = .04, w = 0, f2) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime + w, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {} }
function noise(d = .12, v = .05, hp = 800) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.value = v; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(); } catch (e) {} }
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const q = new URLSearchParams(location.search);
const JUICE = !q.has("nojuice"), HITBOX = q.has("hitbox");
let nearCombo = 0;
const SFX = {
  near() { nearCombo = Math.min(nearCombo + 1, 8); beep(800 + nearCombo * 90, .08, "sine", .04, 0, 1400 + nearCombo * 120); noise(.07, .025, 2500); },
  hit() { beep(160, .25, "sawtooth", .07, 0, 70); noise(.18, .06, 400); buzz([40, 30, 40]); nearCombo = 0; },
  coffee() { [784, 988, 1319].forEach((f, i) => beep(f, .07, "square", .04, i * .05)); },
  warn() { beep(1400, .04, "square", .025); beep(1400, .04, "square", .025, .08); },
  form() { beep(520, .1, "triangle", .035, 0, 380); },
  tick(fast) { beep(fast ? 1600 : 1200, .02, "square", .02); },
  half() { [659, 880].forEach((f, i) => beep(f, .1, "triangle", .045, i * .09)); },
  win() { [523, 659, 784, 1046, 1319].forEach((f, i) => beep(f, .12, "square", .045, i * .08)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => beep(f, .2, "triangle", .06, i * .15)); },
};
function emit(ev, data = {}) { try { if (parent !== window) parent.postMessage({ type: "nhc-game", game: "G011", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0;
addEventListener("pointerdown", () => { const t = Date.now(); if (t - lastInputEmit > 4000) { lastInputEmit = t; emit("input"); } }, true);

// ───────── 로직 (고정 틱, 사람·봇 공통 — DOM 없음) ─────────
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pick(R, kinds) { const pool = []; Object.entries(kinds).forEach(([k, n]) => { for (let i = 0; i < n; i++) pool.push(k); }); return pool[Math.floor(R() * pool.length)]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function newRun(li, seed) {
  const L = LINES[li];
  return { li, L, R: rng(seed), t: 0, px: LW / 2, py: 520, vx: 0, vy: 0, lives: 3, inv: 0, dash: 0, near: 0, obs: [], zones: [],
    nextSpawn: 1.2, formT: L.first, quiet: 0, over: null, hits: 0, scroll: 0, zoneHit: 0, zoneNear: 0, lastForm: null, formN: 0, overlaps: 0 };
}
// 9시에 가까울수록 빨라짐: 시작 1.0배 → 끝 1.6배 (곡선)
const speedMul = G => G.L.speed * (1 + .6 * Math.pow(G.t / DUR, 1.6));
// 에스컬레이터: 레인 윗변이 나를 지나가기 전까지만 새 대형·낱개를 멈춤 (접근 중엔 레인 밖 킥보드만)
const escBlock = G => G.zones.find(z => z.k === "esc" && z.y < G.py);
// 대형 겹침 방지: 이전 대형의 맨 위 줄이 '새 줄 위치 + 세로 간격' 아래로 내려온 뒤에만 다음 대형
const formSep = vy => Math.max(150, vy * 1.4);
function formBlocked(G, vy) {
  const need = -20 + formSep(vy);
  for (const o of G.obs) if (o.fid && o.k !== "stand" && (o.k === "orb" ? o.cy - o.R : o.y) < need) return true;
  return false;
}
// 생성 직후 기하 검사: 아직 나를 안 지난 인파 줄끼리, 열린 칸 사이를 최대 속도의 80% 안에서 옮겨 갈 수 있는가
function rowsOf(G) {
  const m = new Map();
  for (const o of G.obs) if (o.k === "crowd" && o.y < 520) { const key = o.fid + ":" + Math.round(o.y); if (!m.has(key)) m.set(key, { fid: o.fid, y: o.y, vy: o.vy, xs: [] }); m.get(key).xs.push(o.tx !== undefined ? o.tx : o.x); }
  return [...m.values()].map(r => { r.xs.sort((a, b) => a - b); const open = []; let lo = FL + PR; for (const x of r.xs) { const a = x - 14 - PR; if (a > lo) open.push([lo, a]); lo = Math.max(lo, x + 14 + PR); } if (FR - PR > lo) open.push([lo, FR - PR]); r.open = open; return r; }).sort((a, b) => b.y - a.y);
}
function checkOverlap(G, fid) {
  const rows = rowsOf(G); let bad = 0;
  for (const r of rows) if (r.fid === fid && !r.open.length) bad++;
  for (let i = 0; i + 1 < rows.length; i++) {
    const A = rows[i], B = rows[i + 1]; if (A.fid !== fid && B.fid !== fid) continue;
    const tA = (520 - A.y) / A.vy, dyEff = (A.y - B.y) - Math.max(0, B.vy - A.vy) * tA, time = Math.max(0, dyEff) / B.vy;
    let lat = 1e9; for (const [a0, a1] of A.open) for (const [b0, b1] of B.open) lat = Math.min(lat, Math.max(0, a0 - b1, b0 - a1));
    if (lat > .8 * VMAX * time) bad++;
  }
  return bad;
}
const look = R => Math.floor(R() * 6);   // 사람 옷·머리 색 번호
function spawnOne(G, k, sp) {
  const R = G.R, x = FL + 16 + R() * (FR - FL - 32);
  if (k === "bag") G.obs.push({ k, x, y: -20, vy: (70 + R() * 50) * sp, vx: (R() - .5) * 30, r: 13, ang: R() * 6.28, w: (R() < .5 ? -1 : 1) * (2.2 + R()), arm: 23, ar: 9, c: look(R) });
  else if (k === "umb") G.obs.push({ k, x, y: -24, vy: (60 + R() * 40) * sp, r: 12, ph: R() * 6.28, per: 1.6 + R() * .8, c: look(R) });
  else if (k === "scoot") G.obs.push({ k, x, y: -60, vy: 360 * sp, r: 9, hl: 14, warn: .8, c: look(R) });
  else if (k === "flyer") G.obs.push({ k, x, y: -20, vy: 45 * sp, r: 14, home: 36, c: look(R) });
  else if (k === "coffee") G.obs.push({ k, x, y: -20, vy: 90 * sp, r: 12 });
}
function person(x, y, vy, R, extra) { return Object.assign({ k: "crowd", x, y, vy, r: 14, c: look(R) }, extra); }
function spawnForm(G, sp) {
  const R = G.R, L = G.L; let f = pick(R, L.forms);
  if (f === G.lastForm && R() < .6) f = pick(R, L.forms);   // 같은 대형 연속은 줄임
  G.lastForm = f; const fid = ++G.formN;
  const gap = L.gap, vy = 92 * sp, n0 = G.obs.length;
  if (f === "wall") {   // 벽: 틈 1개
    const gx = FL + 10 + R() * (FR - FL - 20 - gap);
    for (let x = FL + 14; x <= FR - 14; x += 30) if (x + 14 < gx || x - 14 > gx + gap) G.obs.push(person(x, -20, vy, R));
    G.quiet = 1.3;
  } else if (f === "zig") {   // 지그재그: 반쪽 벽이 좌우 번갈아 3~4줄
    const rows = L.zigRows || 3, gw = gap + 34, dy = Math.max(150, vy * 1.15); let side = R() < .5 ? 0 : 1;
    for (let r = 0; r < rows; r++, side ^= 1) {
      const y = -20 - r * dy;
      for (let x = FL + 14; x <= FR - 14; x += 30) { const inGap = side ? x - 14 < FL + gw : x + 14 > FR - gw; if (!inGap) G.obs.push(person(x, y, vy, R)); }
    }
    G.quiet = 1.2 + rows * dy / vy;
  } else if (f === "pincer") {   // 양쪽 협공: 양옆에서 인파가 몰려와 틈 하나만 남음
    const gx = FL + 40 + R() * (FR - FL - 80 - gap), y0 = -30;   // 화면 위에서 시작, 옆 통로(벽 안쪽)에서 밀려 나옴
    for (let row = 0; row < 2; row++) {
      const y = y0 - row * 30, off = row * 15;
      for (let tx = gx - 14 - off; tx >= FL + 14; tx -= 30) G.obs.push(person(tx - 150, y, vy * .9, R, { tx, conv: 2.2 }));
      for (let tx = gx + gap + 14 + off; tx <= FR - 14; tx += 30) G.obs.push(person(tx + 150, y, vy * .9, R, { tx, conv: 2.2 }));
    }
    G.quiet = 1.6;
  } else if (f === "swarm") {   // 회전하는 백팩 무리: 고리 모양으로 돌며 나를 향해 살짝 따라옴
    const n = 6, rad = 50, cx = FL + 70 + R() * (FR - FL - 140), w = (R() < .5 ? -1 : 1) * (1.5 + R() * .5), a0 = R() * 6.28;
    for (let i = 0; i < n; i++) G.obs.push({ k: "orb", cx, cy: -70, vy: 78 * sp, R: rad, ang: a0 + i / n * 6.28, w, r: 10, x: cx, y: -70, home: 22, spin: R() * 6.28 });
    G.quiet = .9;
  } else if (f === "esc") {   // 에스컬레이터: 좁은 레인으로 들어가야 함 + 서 있는 사람 지그재그
    const lw = Math.max(118, gap + 58), x0 = FL + 10 + R() * (FR - FL - 20 - lw), len = 320, zvy = 88 * sp;
    G.obs = G.obs.filter(o => o.y > 0);   // 화면 밖에서 대기 중인 것은 정리(레인 안 겹침 방지)
    const z = { k: "esc", x0, x1: x0 + lw, y: -len, len, vy: zvy, inside: false };
    G.zones.push(z);
    let side = R() < .5 ? 0 : 1;
    for (let yy = 70; yy < len - 40; yy += 88) { G.obs.push(person(side ? z.x1 - 20 : z.x0 + 20, z.y + yy, zvy, R, { k: "stand", r: 13, f })); if (R() < .8) side ^= 1; }
  } else if (f === "stairs") {   // 계단: 띠 안에서 내 속도 0.55배
    G.zones.push({ k: "stairs", y: -230, len: 230, vy: 92 * sp });
    G.quiet = .3;
  }
  if (f !== "esc") for (let k = n0; k < G.obs.length; k++) { G.obs[k].f = f; G.obs[k].fid = fid; }   // 어느 대형인지 표시(겹침 방지·검사용)
  G.overlaps += checkOverlap(G, fid);
  return f;
}
function obsR(o) { return o.k === "umb" ? o.r + Math.max(0, Math.sin(o.ph)) * 20 : o.r; }
function moveObs(o, dt, px) {
  if (o.k === "scoot" && o.warn > 0) { o.warn -= dt; return; }
  if (o.k === "orb") { o.cy += o.vy * dt; o.cx += Math.sign(px - o.cx) * Math.min(Math.abs(px - o.cx), o.home * dt); o.cx = clamp(o.cx, FL + o.R, FR - o.R); o.ang += o.w * dt; o.spin += dt * 5; o.x = o.cx + Math.cos(o.ang) * o.R; o.y = o.cy + Math.sin(o.ang) * o.R; return; }
  o.y += o.vy * dt;
  if (o.k === "crowd" || o.k === "stand") { if (o.tx !== undefined) o.x += (o.tx - o.x) * Math.min(1, o.conv * dt); return; }
  if (o.vx) o.x += o.vx * dt;
  if (o.k === "bag") o.ang += o.w * dt;
  else if (o.k === "umb") o.ph += dt * 6.28 / o.per;
  else if (o.k === "flyer") o.x += Math.sign(px - o.x) * Math.min(Math.abs(px - o.x), o.home * dt);
  o.x = clamp(o.x, FL + 10, FR - 10);
}
// 반환: 겉면 사이 거리(음수면 닿음). 그림과 같은 모양: 원 / 몸+가방 두 원 / 킥보드 캡슐
function odist(o, x, y) {
  if (o.k === "scoot") { if (o.warn > 0) return 99; return Math.hypot(o.x - x, clamp(y, o.y - o.hl, o.y + o.hl) - y) - (o.r + PR); }
  let d = Math.hypot(o.x - x, o.y - y) - (obsR(o) + PR);
  if (o.k === "bag") { const ax = o.x + Math.cos(o.ang) * o.arm, ay = o.y + Math.sin(o.ang) * o.arm; d = Math.min(d, Math.hypot(ax - x, ay - y) - (o.ar + PR)); }
  return d;
}
// 내 이동(관성) + 장애물·구간 이동. 사람·봇·봇의 예측이 모두 이 함수를 쓴다
function stepPhys(S, tx, ty, dt) {
  let slow = 1;
  for (const z of S.zones) if (z.k === "stairs" && S.py >= z.y && S.py <= z.y + z.len) slow = .55;
  const vm = (S.dash > 0 ? VDASH : VMAX) * slow;
  let dvx = (tx - S.px) * GAIN, dvy = (ty - S.py) * GAIN; const dl = Math.hypot(dvx, dvy);
  if (dl > vm) { dvx *= vm / dl; dvy *= vm / dl; }
  const a = Math.min(1, ACC * dt); S.vx += (dvx - S.vx) * a; S.vy += (dvy - S.vy) * a;
  S.px += S.vx * dt; S.py += S.vy * dt;
  if (S.px < FL + PR) { S.px = FL + PR; S.vx = 0; } if (S.px > FR - PR) { S.px = FR - PR; S.vx = 0; }
  if (S.py < TOP_Y) { S.py = TOP_Y; S.vy = 0; } if (S.py > BOT_Y) { S.py = BOT_Y; S.vy = 0; }
  S.zoneHit = 0; S.zoneNear = 0;
  for (const z of S.zones) {

    if (i < LINES.length) setTimeout(chunk, 0); else document.title = `SELFTEST ${ok}/${N}`;
  };
  setTimeout(chunk, 0);
} else if (q.has("autoplay")) { auto = true; start(clamp((Number(q.get("autoplay")) || 1) - 1, 0, LINES.length - 1), Number(q.get("seed")) || 7); }
else menu();
window.__g011 = { newRun, stepRun, botTarget, botRun, LINES };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
