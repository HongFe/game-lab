<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12151d">
<title>출근길 피하기</title>
<style>
:root{--bg:#12151d;--tx:#f4f6fb;--sub:#a3abc0;--acc:#ffcf3f;--red:#ff5a5a;--ok:#4ade80;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:none;align-items:stretch}
.hud div{background:rgba(12,14,20,.78);border:1px solid var(--line);border-radius:12px;padding:5px 9px;font-size:12px;color:var(--sub);text-align:center;min-width:58px;white-space:nowrap}
.hud b{display:block;font:900 18px ui-monospace,Menlo,monospace;color:var(--tx)}
.hud .clock{flex:1.2} .hud .clock b{color:var(--acc);font-size:21px;transition:color .2s}
.hud .clock.rush b{color:var(--red)}
.hud .life b{color:var(--red);letter-spacing:1px}
.hud .score{flex:1.1} .hud .score b{font-size:17px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,16,.72);padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));z-index:5}
.ov.on{display:flex}
.box{background:#262c3b;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);max-height:100%;overflow:auto;text-align:center;animation:rise .25s ease-out;box-shadow:0 18px 40px rgba(0,0,0,.45)}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h1{margin:0;font-size:25px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:13px;line-height:1.7;padding-left:18px;margin:10px 0}
.box button{width:100%;min-height:44px;border:0;border-radius:12px;padding:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--acc);color:#2a2000}
.box button.sec{background:#3a4256;color:var(--tx)}
.box .stars{font-size:30px;color:var(--acc);letter-spacing:4px}
.box .big{font:900 28px ui-monospace,Menlo,monospace;color:var(--tx);margin:4px 0}
.stamp{font:900 30px -apple-system,sans-serif;color:var(--ok);border:4px solid var(--ok);display:inline-block;padding:2px 14px;border-radius:10px;transform:rotate(-8deg);margin:6px 0;animation:stamp .4s cubic-bezier(.3,1.7,.6,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}}
.lines{display:grid;gap:6px;margin-top:8px}
.lines button{margin:0;text-align:left;padding:10px 12px;background:#3a4256;color:var(--tx);display:flex;justify-content:space-between;align-items:center}
.lines button:disabled{opacity:.35} .lines small{color:var(--acc);font-size:12px}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;color:#fff;font:900 11px/18px -apple-system,sans-serif;text-align:center;margin-right:6px;vertical-align:-3px}
.logo{display:inline-block;width:34px;height:34px;border-radius:50%;border:5px solid var(--acc);vertical-align:-8px;margin-right:6px;position:relative}
.logo:after{content:"";position:absolute;left:4px;right:4px;top:9px;height:6px;background:var(--acc);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="clock" id="clockBox">지금<b id="clock">8:59:00</b></div><div class="life">셔츠<b id="life">♥♥♥</b></div><div class="score">점수<b id="score">0</b></div></div>
  <div class="ov" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
// ───────── 설정 ─────────
// 세로 스크롤 탄막 슈팅: 웨이브 → 중간 보스 → 웨이브 → 보스. 내 발사체는 "잠시만요!" 말풍선(사람은 옆으로 비켜 주고, 물건은 치워짐)
const LW = 360, LH = 640, PR = 4, GRAZE = 13, DT = 1 / 120, TOP_Y = 190, BOT_Y = 610, WALL = 22, FL = WALL, FR = LW - WALL;
const VMAX = 290, GAIN = 13, ACC = 12;   // 최대 속도(px/s), 손가락 추종 세기, 관성
const GAPNEED = 2 * PR + 8;               // 탄 사이 최소 틈(내 판정 지름 + 여유) — 생성 시 기하 검사 기준
// 노선 = 스테이지. 스테이지마다 '이름 붙은 새 패턴' 1개를 소개(중간 보스가 처음 보여 줌) → 보스와 다음 스테이지에서 섞음
// d: 난도(탄 수·적 체력·탄 속도), bs: 탄 속도 배수, bpm: 배경음 박자(모든 탄막이 이 박자에 맞춰 나감), gap: 웨이브 간격(박), seed: 패턴 뼈대 고정 시드
const STAGES = [
  { name: "2호선 아침", no: "2", col: "#3cb44b", d: 1.1, bs: 1, bpm: 104, gap: 6, w1: 14, w2: 12, seed: 11, mid: "booth", boss: "gate",
    pat: "조준 전단지", hint: "옆으로 한 칸 비키기", pool: { walk: 3, flyer: 3, pigeon: 2, wall: 1 }, intro: "flyer" },
  { name: "9호선 급행", no: "9", col: "#bfa14a", d: 2.15, bs: 1.8, bpm: 118, gap: 3, w1: 14, w2: 12, seed: 23, mid: "umbStall", boss: "door",
    pat: "물방울 고리", hint: "고리 틈으로 빠지기", pool: { walk: 2, flyer: 3, pigeon: 2, umb: 3, wall: 1 }, intro: "umb" },
  { name: "신도림 환승", no: "1", col: "#2a6ad8", d: 2.35, bs: 1.25, bpm: 120, gap: 3, w1: 14, w2: 12, seed: 37, mid: "cart", boss: "board",
    pat: "커피 부채", hint: "쓸고 간 쪽으로", pool: { walk: 2, flyer: 3, pigeon: 2, umb: 2, cup: 3, wall: 1 }, intro: "cup" },
  { name: "강남역 출구", no: "2", col: "#e0457b", d: 2.6, bs: 1.12, bpm: 128, gap: 3, w1: 14, w2: 12, seed: 41, mid: "pigeonKing", boss: "elev",
    pat: "소용돌이", hint: "같은 방향으로 돌기", pool: { walk: 1, flyer: 3, pigeon: 2, umb: 2, cup: 3, scoot: 2, wall: 1 }, intro: "scoot" },
  { name: "월요일 아침", no: "M", col: "#ff8a3d", d: 2.45, bs: 1.3, bpm: 136, gap: 3, w1: 14, w2: 12, seed: 53, mid: "rush", boss: "clock",
    pat: "9시 역회전", hint: "4박마다 방향 바뀜", pool: { walk: 1, flyer: 3, pigeon: 2, umb: 3, cup: 3, scoot: 2, wall: 1 }, intro: "umb" },
  { name: "무한 출근", no: "∞", col: "#a78bfa", d: 1.6, bpm: 116, gap: 5, w1: 14, w2: 12, seed: 71, endless: true,
    pat: "전부 섞기", hint: "바퀴마다 빨라짐", pool: { walk: 2, flyer: 3, pigeon: 2, umb: 2, cup: 3, scoot: 2, wall: 1 } },
];
const NSTAGE = 5;
const TUNE = { ehp: 6, bhp: .6, bsp: 1.35 };   // 적 체력 배수, 보스 체력 배수, 탄 속도 배수
// 보스: w·h = 말풍선이 맞는 상자, hp = 기본 체력, pats = 차례로 도는 탄막(한 패턴 = 8박 + 1박 쉼)
const BOSSES = {
  booth: { name: "전단지 부스", w: 96, h: 46, hp: 45, pats: ["aim3", "aim5"] },
  gate: { name: "고장 난 개찰구", w: 160, h: 52, hp: 110, pats: ["aim3", "fanDown", "aim5"] },
  umbStall: { name: "우산 노점", w: 104, h: 52, hp: 60, pats: ["ring", "ringRot"] },
  door: { name: "만원 열차 문", w: 180, h: 70, hp: 130, pats: ["crowd", "ring", "aim5", "ringRot"] },
  cart: { name: "커피 카트", w: 112, h: 52, hp: 75, pats: ["fanSweep", "stream"] },
  board: { name: "고장 난 안내 전광판", w: 190, h: 56, hp: 150, pats: ["fanSweep", "ringRot", "aim5", "rain"] },
  pigeonKing: { name: "비둘기 대장", w: 80, h: 56, hp: 85, pats: ["spiral", "pigeons"] },
  elev: { name: "지각 직전 엘리베이터", w: 112, h: 84, hp: 170, pats: ["spiral", "fanSweep", "ring", "aim5"] },
  rush: { name: "출근 인파 물결", w: 200, h: 52, hp: 100, pats: ["crowd", "spiral2", "aim3"] },
  clock: { name: "9시 시계", w: 112, h: 112, hp: 200, pats: ["spiral2", "ringBurst", "fanSweep", "aim5"] },
};
// 패턴 발사 간격(16분음표 단위, 4 = 1박)
const PAT_EVERY = { aim3: 1, aim5: 2, fanDown: 2, fanSweep: 1, ring: 2, ringBurst: 1, ringRot: 1, spiral: 1, spiral2: 1, stream: 1, rain: 1, crowd: 32, pigeons: 32 };
const FE = { flyer: 2, umb: 4, cup: 2 };   // 길거리 적 발사 간격(16분음표)
const ENDLESS_MIDS = ["booth", "umbStall", "cart", "pigeonKing", "rush"], ENDLESS_BOSSES = ["gate", "door", "board", "elev", "clock"];
// 배경음: 노선마다 베이스 음 진행(박자에 맞춰 탄이 나감)
const BASS = [[110, 110, 147, 131], [98, 98, 131, 147], [110, 131, 147, 165], [123, 110, 98, 147], [131, 131, 98, 117], [110, 147, 131, 98]];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const store = { get() { try { return JSON.parse(localStorage.getItem("g011b") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g011b", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ stars: {}, unlocked: 1, best: {} }, store.get());

// ───────── 소리 ─────────
let ac = null;
function beep(f, d = .06, type = "square", v = .04, w = 0, f2) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime + w, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {} }
function noise(d = .12, v = .05, hp = 800) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.value = v; s.connect(f); f.connect(g); g.connect(ac.destination); s.start(); } catch (e) {} }
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const q = new URLSearchParams(location.search);
const JUICE = !q.has("nojuice"), HITBOX = q.has("hitbox");
let sndShot = 0, sndGraze = 0;
const SFX = {
  shot() { const n = performance.now(); if (n - sndShot < 90) return; sndShot = n; beep(1500, .025, "square", .008, 0, 1100); },
  pop(c) { beep(500 + Math.min(c, 30) * 25, .07, "triangle", .045, 0, 900 + Math.min(c, 30) * 30); },
  graze(c) { const n = performance.now(); if (n - sndGraze < 50) return; sndGraze = n; beep(1800 + Math.min(c, 40) * 20, .03, "sine", .025); },
  hit() { beep(160, .25, "sawtooth", .07, 0, 70); noise(.18, .06, 400); buzz([40, 30, 40]); },
  shield() { beep(700, .12, "triangle", .06, 0, 300); noise(.1, .04, 1500); },
  item() { [784, 988, 1319].forEach((f, i) => beep(f, .07, "square", .04, i * .05)); },
  warn() { beep(1400, .04, "square", .025); beep(1400, .04, "square", .025, .08); },
  boss() { [220, 196, 220, 165].forEach((f, i) => beep(f, .16, "sawtooth", .045, i * .17)); },
  solved() { [523, 659, 784, 1046].forEach((f, i) => beep(f, .1, "square", .05, i * .06)); noise(.3, .05, 1200); },
  win() { [523, 659, 784, 1046, 1319].forEach((f, i) => beep(f, .12, "square", .045, i * .08)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => beep(f, .2, "triangle", .06, i * .15)); },
};
function emit(ev, data = {}) { try { if (parent !== window) parent.postMessage({ type: "nhc-game", game: "G011", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0;
addEventListener("pointerdown", () => { const t = Date.now(); if (t - lastInputEmit > 4000) { lastInputEmit = t; emit("input"); } }, true);

// ───────── 로직 (고정 틱, 사람·봇 공통 — DOM 없음) ─────────
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pick(R, kinds) { const pool = []; Object.entries(kinds).forEach(([k, n]) => { for (let i = 0; i < n; i++) pool.push(k); }); return pool[Math.floor(R() * pool.length)]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const look = R => Math.floor(R() * 6);
// 한 노선 = 구간 4개(웨이브 → 중간 보스 → 웨이브 → 보스). 구간 시작점이 체크포인트
function phasesOf(St) { return [{ k: "waves", dur: St.w1 }, { k: "mid" }, { k: "waves", dur: St.w2 }, { k: "boss" }]; }
const NOMINAL = St => [St.w1, 16, St.w2, 30];
const PH_NAME = ["통로 1", "중간 보스", "통로 2", "보스"];
const bpmOf = G => G.St.bpm + G.loop * 6;
function cpTime(St, ph) { let t = 0; for (let i = 0; i < ph; i++) t += NOMINAL(St)[i]; const bar = 240 / St.bpm; return Math.round(t / bar) * bar; }
function newRun(si, seed, cp) {
  const St = STAGES[si];
  const G = { si, St, R: rng(seed), seed0: seed, t: 0, q: 0, ph: 0, phT: 0, phQ: 0, script: [], phases: phasesOf(St), loop: 0, px: LW / 2, py: 540, vx: 0, vy: 0, lives: 3, inv: 0, shield: 0, slowT: 0, boostT: 0, power: 1,
    score: 0, combo: 0, comboT: 0, maxCombo: 0, grazes: 0, kills: 0, solved: 0, ens: [], buls: [], shots: [], items: [], boss: null, fireT: 0,
    over: null, endT: 0, hits: 0, scroll: 0, pats: 0, viol: 0, blocked: 0, checks: 0, auditT: 0, audit: false, fromCp: 0 };
  if (cp && cp.ph > 0 && !St.endless) { G.ph = cp.ph; G.t = cpTime(St, cp.ph); G.score = cp.score; G.power = Math.max(1, cp.power); G.fromCp = cp.ph; }
  G.q = Math.floor(G.t * bpmOf(G) / 15);
  startPhase(G);
  return G;
}
// 패턴 뼈대 고정: 웨이브 순서·시각·위치는 노선 시드로 정해짐(외울 수 있음). 판마다 다른 건 위치 ±8px·고리 회전 정도
function startPhase(G) {
  const P = G.phases[G.ph]; G.phT = 0; G.phQ = Math.ceil((G.q + 1) / 16) * 16; G.script = [];
  if (!G.St.endless) G.cp = { ph: G.ph, score: G.score, power: G.power };
  if (!P || P.k !== "waves") return;
  const S = rng(G.St.seed * 100 + G.ph * 7 + G.loop * 1009), beats = Math.round(P.dur * bpmOf(G) / 60), gap = Math.max(3, G.St.gap - Math.floor(G.loop / 2));
  for (let b = 2, i = 0; b < beats; b += gap, i++) G.script.push({ q: G.phQ + b * 4, kind: i === 0 && G.ph === 0 && G.St.intro ? G.St.intro : pick(S, G.St.pool), s: Math.floor(S() * 1e9) });
}
// 난도: 노선 기본값 × (9시에 가까울수록 최대 +30%) + 무한 모드는 한 바퀴마다 +0.3
const dEff = G => (G.St.d + G.loop * .3) * (1 + .3 * Math.min(1, G.t / 70));
const bspd = G => (.85 + .15 * dEff(G)) * TUNE.bsp * (G.St.bs || 1);
const mult = G => 1 + Math.min(3, Math.floor(G.combo / 10) * .5);
function addScore(G, n) { G.score += Math.round(n * mult(G)); }
function bump(G) { G.combo++; G.comboT = 2.5; if (G.combo > G.maxCombo) G.maxCombo = G.combo; }
// ── 탄 만들기 + 생성 시 기하 검사: 내가 갈 수 있는 곳까지의 거리에서 탄 사이 틈이 판정 지름+여유 이상인가
function bul(G, x, y, ang, sp, kind, r = 4.5) { G.buls.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r, kind, a: ang, age: 0 }); }
const reachD = y => Math.max(50, TOP_Y - y);
function maxN(y, span, r = 4.5) { return Math.max(1, Math.floor(span * reachD(y) / (2 * r + GAPNEED)) + (span < 6.28 ? 1 : 0)); }
function checkSpacing(G, y, dAng, r) { G.pats++; if (dAng * reachD(y) - 2 * r < GAPNEED - 1e-6) G.viol++; }
function ring(G, x, y, n, sp, off, kind, r = 4.5) { n = Math.min(n, maxN(y, 6.283, r)); checkSpacing(G, y, 6.283 / n, r); for (let i = 0; i < n; i++) bul(G, x, y, off + i / n * 6.283, sp, kind, r); }
function fan(G, x, y, ang, n, spread, sp, kind, r = 4.5) {
  if (n <= 1) { G.pats++; return bul(G, x, y, ang, sp, kind, r); }
  n = Math.min(n, maxN(y, spread, r)); if (n <= 1) { G.pats++; return bul(G, x, y, ang, sp, kind, r); }
  checkSpacing(G, y, spread / (n - 1), r); for (let i = 0; i < n; i++) bul(G, x, y, ang - spread / 2 + spread * i / (n - 1), sp, kind, r);
}
const aimAt = (G, x, y) => Math.atan2(G.py - y, G.px - x);
// ── 적
function mkE(G, k, x, y, o) { const e = Object.assign({ k, x, y, vx: 0, vy: 0, r: 13, hp: 1, t: 0, c: look(G.R), body: true, sc: 50, shoot: true, q0: G.q }, o); if (k !== "boss" && e.hp < 1e8) e.hp = Math.ceil(e.hp * TUNE.ehp); e.maxhp = e.hp; G.ens.push(e); return e; }
function spawnWave(G, kind, s) {
  const S = rng(s || 1), J = () => (G.R() - .5) * 16, d = dEff(G), sp = bspd(G);
  if (kind === "walk") { const n = 2 + Math.floor(d); for (let i = 0; i < n; i++) mkE(G, "walk", clamp(FL + 20 + S() * (FR - FL - 40) + J(), FL + 14, FR - 14), -20 - i * 46, { vy: (55 + S() * 30) * sp, hp: 2, sc: 50 }); }

  const rows = [], rates = [], hitAvg = [], N = NSTAGE + 5; let ok = 0, i = 0, s = 0, win = 0, hitsT = 0, viol = 0, pats = 0, blocked = 0, checks = 0, timeT = 0, scoreT = 0;
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;font-size:11px;white-space:pre-wrap">SELFTEST 진행 중…</pre>`);
  const out = $("selftest"); let endlessRow = null;
  const chunk = () => {
    const t0 = performance.now();
    while (i < NSTAGE && performance.now() - t0 < 50) {
      const T = botRun(i, 1000 + s * 131 + i * 7); if (T.over === "arrive") win++; hitsT += T.hits; viol += T.viol; pats += T.pats; blocked += T.blocked; checks += T.checks; timeT += T.t; scoreT += T.score; s++;
      if (s === SELF_SEEDS) {
        const r = win / SELF_SEEDS, [lo, hi] = BANDS[i], pass = r >= lo - 1e-9 && r <= hi + 1e-9; if (pass) ok++; rates.push(r); hitAvg.push(hitsT / SELF_SEEDS);
        rows.push(`${i + 1}\t${pass ? "OK" : "FAIL"}\t${STAGES[i].name}\t봇 출근 ${win}/${SELF_SEEDS} (${Math.round(r * 100)}%)\t목표 ${Math.round(lo * 100)}~${Math.round(hi * 100)}%\t평균 얼룩 ${(hitsT / SELF_SEEDS).toFixed(2)}\t평균 ${Math.round(timeT / SELF_SEEDS)}초 · ${Math.round(scoreT / SELF_SEEDS)}점`);
        i++; s = 0; win = 0; hitsT = 0; timeT = 0; scoreT = 0;
      }
    }
    if (i >= NSTAGE && !endlessRow) {
      let tt = 0, loops = 0; const n = 6; for (let k = 0; k < n; k++) { const T = botRun(5, 7000 + k * 31, 400); tt += T.t; loops += T.loop; viol += T.viol; pats += T.pats; blocked += T.blocked; checks += T.checks; }
      const p = tt / n >= 60; if (p) ok++; endlessRow = `${NSTAGE + 1}\t${p ? "OK" : "FAIL"}\t무한 출근\t봇 평균 ${Math.round(tt / n)}초 버팀 · 평균 ${(loops / n).toFixed(1)}바퀴 (목표 60초 이상)`;
            // 패턴 뼈대 고정: 판(시드)이 달라도 같은 노선은 웨이브 순서·시각이 같아야 함
      let same = 0, tot = 0; for (let k = 0; k < NSTAGE; k++) for (const ph of [0, 2]) { const A = newRun(k, 1, { ph, score: 0, power: 1 }), Bq = newRun(k, 999, { ph, score: 0, power: 1 }); tot++; if (JSON.stringify(A.script.map(e => [e.q, e.kind, e.s])) === JSON.stringify(Bq.script.map(e => [e.q, e.kind, e.s])) && A.script.length) same++; }
      const p3 = same === tot; if (p3) ok++;
      // 체크포인트: 구간 2·3·4에서 다시 시작해도 끝까지 진행되는가
      let cpOk = 0, cpTot = 0; for (let k = 0; k < NSTAGE; k++) for (const ph of [1, 2, 3]) { const T = botRun(k, 4242 + k, 200, { ph, score: 0, power: 2 }); cpTot++; if (T.over && (T.over === "arrive" || T.ph >= ph) && T.fromCp === ph) cpOk++; viol += T.viol; pats += T.pats; blocked += T.blocked; checks += T.checks; }
      const p4 = cpOk === cpTot; if (p4) ok++;
      const p1 = viol === 0; if (p1) ok++; const p2 = blocked === 0; if (p2) ok++;
      rows.push(`${NSTAGE + 4}\t${p3 ? "OK" : "FAIL"}\t패턴 뼈대 고정(다른 판 같은 순서)\t${same}/${tot}`, `${NSTAGE + 5}\t${p4 ? "OK" : "FAIL"}\t체크포인트 재시작(구간 2~4)\t${cpOk}/${cpTot}`);
      rows.push(endlessRow, `${NSTAGE + 2}\t${p1 ? "OK" : "FAIL"}\t탄 사이 틈 위반(생성 시 기하 검사)\t${viol}회 / 탄막 ${pats}개`, `${NSTAGE + 3}\t${p2 ? "OK" : "FAIL"}\t피할 곳이 하나도 없는 순간(0.5초마다 88칸 감사)\t${blocked}회 / 검사 ${checks}번`);
    }
    out.textContent = rows.join("\n") + (i < NSTAGE ? `\n노선 ${i + 1} 검사 중… ${s}/${SELF_SEEDS}` : `\n출근률: ${rates.map(r => Math.round(r * 100) + "%").join(" / ")}\n평균 얼룩: ${hitAvg.map(h => h.toFixed(2)).join(" / ")}`);
    if (i < NSTAGE) setTimeout(chunk, 0); else document.title = `SELFTEST ${ok}/${N}`;
  };
  setTimeout(chunk, 0);
} else if (q.has("autoplay")) { auto = true; start(clamp((Number(q.get("autoplay")) || 1) - 1, 0, STAGES.length - 1), Number(q.get("seed")) || 7); }
else menu();
window.__g011 = { newRun, stepRun, botTarget, botRun, STAGES };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
