<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b26">
<title>NHC POCKET — 프로토타입 오락실</title>
<style>
:root{
  --bg:#1d1b26; --tx:#f3f1ea; --sub:#a9a6b8; --line:#34313f; --panel:#26232f;
  --shell:#d9d5cb; --shell2:#c4bfb3; --shell-dark:#9a9588; --bezel:#4a4b63; --ink:#3a3a52;
  --lcd0:#0f380f; --lcd1:#306230; --lcd2:#8bac0f; --lcd3:#9bbc0f;
  --a:#b3264f; --acc:#ffcc4d; --grn:#5fd39a; --red:#ff5d5d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}

/* ── 배치 ── */
#app{position:fixed;inset:0;display:flex;gap:24px;align-items:stretch;justify-content:center;padding:16px}
#menuCol{flex:0 0 auto;display:flex;width:100%;max-width:420px}
#stage{flex:1;display:none;gap:18px;align-items:center;justify-content:center;min-width:0}
@media (min-width:980px){
  body.play #stage{display:flex} #menuCol{width:400px}
  body.play #menuCol{display:flex}
}
@media (max-width:979px){
  #app{padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  body.play #menuCol{display:none}
  body.play #stage{display:flex;position:fixed;inset:0;padding:0}
}

/* ── 메뉴: 휴대용 게임기 (LCD 화면에 목록 + 설명, 아래는 얇은 A·B 줄) ── */
.menu{width:100%;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--shell),var(--shell2));border-radius:22px 22px 56px 22px;padding:16px 16px 0;box-shadow:inset -4px -6px 0 rgba(0,0,0,.08),inset 3px 3px 0 rgba(255,255,255,.5),0 20px 40px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
.bezel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bezel);border-radius:12px 12px 34px 12px;padding:10px 16px 18px 22px;position:relative;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.bezel .led{position:absolute;left:7px;top:46%;width:7px;height:7px;border-radius:50%;background:#ff3348;box-shadow:0 0 8px #ff3348}
.bezel .cap{font:700 8px var(--mono);letter-spacing:1.5px;color:#9fa0bf;text-align:center;margin-bottom:6px}
.lcd{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--lcd3);color:var(--lcd0);border-radius:4px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),inset 0 0 24px rgba(15,56,15,.22);overflow:hidden;position:relative}
.lcd:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(15,56,15,.045) 0 1px,transparent 1px 3px);pointer-events:none}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;border-bottom:2px solid var(--lcd0)}
.logo{font:900 14px/1 var(--mono);flex:1}
.me{border:1.5px solid var(--lcd0);background:transparent;color:var(--lcd0);border-radius:4px;padding:3px 7px;font:800 12px var(--mono)}
.me.coin{display:inline-flex;align-items:center;gap:3px;margin-right:6px;font-variant-numeric:tabular-nums}
.cost{font:800 11px/1 var(--mono);flex:none;border:1.5px solid currentColor;border-radius:3px;padding:2px 4px;display:inline-flex;align-items:center;gap:2px}
.go:disabled{opacity:.45}
.go2{display:block;width:100%;margin-top:4px;border:1.5px solid var(--lcd0);border-radius:3px;background:transparent;color:var(--lcd0);padding:6px;font:900 13px var(--mono)}
.go2:disabled{opacity:.45}
.news{margin:6px 8px 0;padding:5px 8px;border-radius:3px;background:var(--lcd0);color:var(--lcd3);font:800 12.5px var(--mono)}
.sec{font:900 11.5px/1 var(--mono);color:var(--lcd0);padding:7px 4px 3px;letter-spacing:.5px}
.rk{font:900 15px/1 var(--mono);color:var(--lcd0);width:16px;text-align:center;flex:none}
.pop{font:800 10.5px/1.2 var(--mono);color:var(--lcd0);opacity:.8;flex:none;text-align:right}
.list{flex:1;overflow:auto;padding:0 6px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.gm{display:flex;gap:8px;align-items:center;padding:6px;border-radius:3px;cursor:pointer}
.gm.sel{background:var(--lcd0);color:var(--lcd3)}
.gm .ic{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:var(--lcd2)!important}
.gm.sel .ic{background:var(--lcd1)!important}
.gm.sel .rk,.gm.sel .pop{color:var(--lcd3)}
.gm .w{min-width:0;flex:1}
.gm .t{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.gm .m{font-size:12px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{font:900 10.5px/1 var(--mono);padding:2px 4px;border-radius:3px;flex:none;border:1.5px solid currentColor}
.bd.hot{background:var(--a);color:#fff;border-color:var(--a)}
.rt{font:800 12px var(--mono);flex:none;text-align:right}
.rt small{display:block;font-size:10.5px;font-weight:700;opacity:.8}
.detail{border-top:2px solid var(--lcd0);padding:7px 10px 8px}
.detail h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.detail p{margin:3px 0 0;font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detail .upd{font:800 12px var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{display:block;width:100%;margin-top:6px;border:0;border-radius:3px;background:var(--lcd0);color:var(--lcd3);padding:8px;font:900 14px var(--mono)}
.empty{color:var(--lcd1)}
.base{flex:none;height:84px;position:relative;display:flex;align-items:center;padding:0 4px}
.brand{font:italic 900 15px/1 var(--mono);color:var(--ink);letter-spacing:.5px;flex:1}
.brand b{font-style:normal;color:var(--a)}
.ab{display:flex;gap:14px;align-items:center;transform:rotate(-18deg) translateY(-6px);margin-right:58px}
.ab div{display:flex;flex-direction:column;align-items:center;gap:3px}
.ab button{width:46px;height:46px;border-radius:50%;border:0;background:var(--a);box-shadow:0 4px 0 #6d1530,inset 0 -3px 0 rgba(0,0,0,.18);color:#fff;font:900 16px var(--mono)}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #6d1530}
.ab span{font:900 10px var(--mono);color:var(--ink);transform:rotate(18deg)}
.speaker{position:absolute;right:10px;bottom:14px;display:flex;gap:5px;transform:rotate(-28deg)}
.speaker i{width:5px;height:34px;border-radius:4px;background:var(--shell-dark);box-shadow:inset 1px 1px 2px rgba(0,0,0,.35)}
@media (max-width:979px){.menu{border-radius:18px 18px 44px 18px}}

/* ── 플레이 무대 ── */
.slot{position:relative;display:flex;flex-direction:column;background:#000;border-radius:28px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 2px #2c2a36;width:400px;height:min(820px,calc(100vh - 32px))}
.slot.off{display:none}
.slot .bar{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;color:#fff}
.slot .bar .tt{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .bar .tt small{display:block;font-weight:500;font-size:10.5px;color:var(--sub)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.on{background:#ff4d7a;border-color:#ff4d7a;color:#fff}
.pill.pri{background:var(--acc);border-color:var(--acc);color:#1b1b1b}
.slot iframe{flex:1;width:100%;border:0;border-radius:20px;background:#12141c}
.slot .tag{position:absolute;left:-10px;top:-10px;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#111;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.stats{font:600 11px var(--mono);color:var(--sub);padding:6px 8px 0;display:flex;justify-content:space-between}
.tabs{display:none}
@media (max-width:979px){
  .slot{width:100%;height:100%;border-radius:0;padding:calc(6px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);box-shadow:none}
  .slot iframe{border-radius:0}
  .slot .tag{display:none}
  .tabs{display:flex;gap:4px;margin:0 6px 6px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;font-size:12.5px;font-weight:800}
  .tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
}

/* ── 시트 (피드백·비교·결과) ── */
.sheet{position:fixed;inset:0;display:none;z-index:20;background:rgba(8,8,12,.55);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .card{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media (min-width:980px){.sheet{align-items:center}.sheet .card{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.card h3{margin:0 0 2px;font-size:18px} .card .sub{color:var(--sub);font-size:12.5px;margin:0 0 12px}
.q{margin:14px 0 6px;font-size:13.5px;font-weight:700}
.stars{display:flex;gap:6px} .stars button{flex:1;font-size:26px;background:none;border:0;color:#4b4858;padding:2px 0;transition:transform .1s}
.stars button.on{color:var(--acc)} .stars button:active{transform:scale(1.25)}
.yn{display:flex;gap:8px} .yn button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#1f1d28;font-weight:800}
.yn button.on{background:var(--acc);color:#111;border-color:var(--acc)}
textarea,input[type=text]{width:100%;background:#1a1822;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px}
textarea{min-height:84px;resize:vertical}
.auto{background:#1a1822;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font:12px var(--mono);color:var(--sub);margin-top:12px}
.row{display:flex;gap:8px;margin-top:14px} .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#1f1d28;font-weight:800}
.row button.pri{background:var(--acc);color:#111;border-color:var(--acc)}
pre.out{white-space:pre-wrap;background:#14131a;border-radius:10px;padding:10px;font-size:12px;color:#d9d6e6;user-select:text;-webkit-user-select:text}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.res h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between}
.res .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--sub)}
.res .nums b{display:block;font:800 17px var(--mono);color:var(--tx)}
.res ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#d9d6e6} .res li{margin:4px 0}
.big-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw}
.big-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.burst{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.empty{color:var(--sub);text-align:center;font-size:14px;line-height:1.7}

/* ── 키트 정돈 (2026-11-27): 플레이 막대·시트·토스트를 공용 UI 키트 값으로. LCD 메뉴(게임보이)는 그대로 ── */
:root{--ui-accent:var(--acc);--ui-on-accent:#1b1b1b}
.slot .bar{gap:var(--ui-s2);padding:var(--ui-s1) var(--ui-s1) var(--ui-s2)}
.slot .bar .tt{font:700 var(--ui-t3)/1.25 var(--ui-font)}
.slot .bar .tt small{font:400 var(--ui-t1)/1.5 var(--ui-font);color:var(--ui-muted)}
.pill{appearance:none;border:0;height:40px;min-width:40px;padding:0 var(--ui-s3);border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);font:700 var(--ui-t2)/1 var(--ui-font);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s1);transition:transform 90ms var(--ui-in)}
.pill:active{transform:scale(.94)}
.pill.ic{padding:0;width:40px}
.pill.on{background:var(--ui-bad);color:#fff}.pill.on .ui-icon{fill:currentColor}
.pill.pri{background:var(--ui-accent);color:var(--ui-on-accent)}
.stats{font:400 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums;color:var(--ui-muted);padding:var(--ui-s2) var(--ui-s2) 0}
.sheet{background:rgba(0,0,0,.5)}
.sheet .card{font-family:var(--ui-font);background:var(--ui-surface);border:0;border-radius:var(--ui-r3) var(--ui-r3) 0 0;padding:var(--ui-s5) var(--ui-s5) calc(var(--ui-s5) + env(safe-area-inset-bottom));box-shadow:var(--ui-shadow2);animation:ui-enter 225ms var(--ui-in) both;word-break:keep-all}
@media (min-width:980px){.sheet .card{border-radius:var(--ui-r3)}}
.card h3{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0 0 var(--ui-s1)}
.card .sub{font-size:var(--ui-t2);line-height:1.5;color:var(--ui-muted);margin:0 0 var(--ui-s4)}
.q{margin:var(--ui-s4) 0 var(--ui-s2);font-size:var(--ui-t2);font-weight:700}
.stars{gap:var(--ui-s2)}.stars button{color:var(--ui-surface2);min-height:48px;display:grid;place-items:center}.stars button.on{color:var(--ui-accent)}
.yn{gap:var(--ui-s2)}.yn button,.row button{appearance:none;min-height:48px;padding:0 var(--ui-s4);border-radius:var(--ui-r2);border:0;background:var(--ui-surface2);color:var(--ui-text);font:700 var(--ui-t3)/1.25 var(--ui-font);transition:transform 90ms var(--ui-in)}
.yn button:active,.row button:active{transform:scale(.96)}
.yn button.on{background:var(--ui-text);color:var(--ui-surface)}
.row{gap:var(--ui-s2);margin-top:var(--ui-s4)}.row button.pri{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1)}
textarea,input[type=text]{background:var(--ui-surface2);border:1px solid transparent;border-radius:var(--ui-r2);padding:var(--ui-s3);font:400 var(--ui-t3)/1.5 var(--ui-font);color:var(--ui-text)}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ui-accent)}
.auto{background:var(--ui-surface2);border:0;border-radius:var(--ui-r2);padding:var(--ui-s2) var(--ui-s3);font:400 var(--ui-t1)/1.5 var(--ui-font);color:var(--ui-muted);margin-top:var(--ui-s3)}
pre.out{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);font:400 var(--ui-t1)/1.5 var(--ui-font);color:var(--ui-text)}
.big-toast{background:var(--ui-text);color:var(--ui-bg);border-radius:var(--ui-r1);padding:var(--ui-s3) var(--ui-s4);font:700 var(--ui-t2)/1.25 var(--ui-font);box-shadow:var(--ui-shadow2);transition:opacity 180ms var(--ui-in),transform 180ms var(--ui-in)}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}

    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); } catch (e) {}
}

  back() { beep(523, .05, "square", .035); buzz(8); },

const DB = {

  headers() { return { apikey: CFG.supabaseAnonKey, Authorization: "Bearer " + CFG.supabaseAnonKey, "Content-Type": "application/json" }; },
  async add(table, row) {

    try {
      const r = await fetch(`${CFG.supabaseUrl}/rest/v1/${table}`, { method: "POST", headers: { ...this.headers(), Prefer: "return=minimal" }, body: JSON.stringify(row) });

    } catch (e) { return { ok: false, local: false, error: String(e) }; }
  },
  async all(table) {
    if (!this.remote) return LS.get(table, []);

let summary = {};   // game_id → {n, likes, rating, again, ...}

      if (r.ok) { const s = {}; (await r.json()).forEach(x => s[x.game_id] = { n: x.rn, likes: x.likes, rsum: x.rsum, rn: x.rn, pop: x.users ? { users: x.users, back: x.back } : null }); summary = s; if (view === "menu") renderMenu(); }

function burst(x, y, ch) {

// 게임이 보내는 신호(postMessage): start / level_start / level_clear / fail / input

  x.fillStyle = "#fff"; x.font = F(400, 120); x.fillText(g.icon || "🎮", W / 2, 290);   // 이모지는 불투명 색으로 (반투명 fillStyle 버그 방지)
  x.fillStyle = "#0f380f"; x.font = F(900, 52); x.fillText(g.title, W / 2, 380);
  x.fillRect(130, 412, W - 260, 4);
  fit(x, main, W / 2, 492, W - 200, 900, 58);
  x.font = F(800, 34); x.fillText(sub || " ", W / 2, 556);
  x.font = F(700, 28); x.fillText(nick, W / 2, 640);
  x.fillStyle = "#3a3a52"; x.font = F(900, 36); x.fillText("너도 해 볼래? ▶", W / 2, 790);
  x.font = F(600, 22); x.fillText(playUrl(g.id).replace(/^https?:\/\//, ""), W / 2, 836);
  return c;
  function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
  function fit(x, t, cx, y, maxW, w, z) { do { x.font = F(w, z); z -= 2; } while (x.measureText(t).width > maxW && z > 24); x.fillText(t, cx, y); }
}
function cardText(g, d) { const { main, sub } = resultLines(g.id, d); return `[NHC POCKET] ${g.icon} ${g.title}\n${main}${sub ? " · " + sub : ""}\n너도 해 볼래? ${playUrl(g.id)}`; }
function openShare(i) {
  const sl = slots[i]; if (!sl.best) { toast("한 판 깨면 결과 카드가 생겨요"); return; }
  const g = sl.g, d = sl.best, c = drawCard(g, d), text = cardText(g, d), url = c.toDataURL("image/png");
  sheet(`<h3>결과 카드</h3><p class="sub">이번에 플레이한 최고 기록이에요</p>
    <img src="${url}" alt="결과 카드" style="width:100%;border-radius:14px;display:block">
    <div class="row">${navigator.share ? '<button class="pri" id="cShare">공유하기</button>' : ""}<button id="cCopy">문구 복사</button></div>
    <div class="row"><button id="cSave">이미지 저장</button><button id="cDone">닫기</button></div>`);
  $("cDone").onclick = closeSheet;
  $("cSave").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = `nhc-pocket-${g.id}.png`; document.body.appendChild(a); a.click(); a.remove(); toast("이미지를 저장했어요"); };
  $("cCopy").onclick = async () => { try { await navigator.clipboard.writeText(text); toast("복사했어요 — 카톡에 붙여 넣어 주세요"); } catch (e) { toast("복사가 막혔어요 — 이미지 저장을 써 주세요"); } };
  if ($("cShare")) $("cShare").onclick = () => c.toBlob(async blob => {
    try {
      const file = new File([blob], `nhc-pocket-${g.id}.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text });
      else await navigator.share({ text });
      SND.like();
    } catch (e) { /* 사용자가 닫음 */ }
  }, "image/png");
  SND.ok();
}

// ── 피드백 시트 ──
function sheet(html) { $("sheetCard").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); }
$("sheet").addEventListener("pointerdown", e => { if (e.target.id === "sheet") closeSheet(); });
function openFeedback(i, leaving) {
  const sl = slots[i], g = sl.g, f = { liked: !!likes[g.id], rating: 0, again: null, understood: null };
  sheet(`<h3>${esc(g.title)} 어땠나요?</h3><p class="sub">${leaving ? "나가기 전에 10초만! " : ""}${esc(g.one_liner)}</p>
    <div class="q">재미 점수</div><div class="stars" id="fStars">${[1, 2, 3, 4, 5].map(n => `<button data-n="${n}" aria-label="${n}점">${UI.icon("star","xl fill")}</button>`).join("")}</div>
    <div class="q">시키지 않아도 한 판 더 하고 싶었나요?</div><div class="yn" data-f="again"><button data-v="1">네, 더 하고 싶어요</button><button data-v="0">아니요</button></div>
    <div class="q">처음 설명 한 줄로 바로 이해됐나요?</div><div class="yn" data-f="understood"><button data-v="1">네</button><button data-v="0">헷갈렸어요</button></div>
    <div class="q">좋았던 점 · 답답했던 점 · 바라는 점</div><textarea id="fCom" placeholder="예) 전화 걸 때 대사가 웃겼어요 / 차를 끌 때 손가락에 가려요"></textarea>
    <div class="q">닉네임 (선택 · 실명은 적지 마세요)</div><input type="text" id="fNick" maxlength="20" value="${esc(LS.get("nick", ""))}">
    <div class="auto">자동 첨부: 플레이 ${fmt(sl.s.activeMs)} · 클리어 ${sl.s.levels} · 실패 ${sl.s.fails} · ${isDesk() ? "desktop" : "mobile"}</div>
    <div class="row"><button id="fCancel">${leaving ? "그냥 나가기" : "닫기"}</button><button class="pri" id="fSend">보내기</button></div>`);
  const st = $("fStars");
  st.querySelectorAll("button").forEach(b => b.onclick = () => { f.rating = +b.dataset.n; st.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n <= f.rating)); beep(600 + f.rating * 120, .05); buzz(6); });
  $("sheetCard").querySelectorAll(".yn").forEach(row => row.querySelectorAll("button").forEach(b => b.onclick = () => { f[row.dataset.f] = b.dataset.v === "1"; row.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); SND.nav(); }));
  $("fCancel").onclick = () => { closeSheet(); if (leaving) { sl.sent = true; toMenu(); } };
  $("fSend").onclick = async () => {
    const nick = $("fNick").value.trim().slice(0, 20); LS.set("nick", nick);
    const row = { game_id: g.id, version: g.version, tester: nick || null, anon_id: anon, liked: f.liked, rating: f.rating || null, again: f.again, understood: f.understood,
      comment: $("fCom").value.trim().slice(0, 2000) || null, play_seconds: Math.round(sl.s.activeMs / 1000), levels_cleared: sl.s.levels, fails: sl.s.fails, device: isDesk() ? "desktop" : "mobile" };
    const r = await DB.add("feedback", row); sl.sent = true; SND.like();
    if (r.local) shareText(feedbackText(g, row), leaving);
    else { closeSheet(); toast(r.ok ? "고마워요! 의견이 저장됐어요" : "저장 실패 — 이 기기에는 남겨 뒀어요"); refreshSummary(); if (leaving) toMenu(); }
  };
}
const yn = v => v === true ? "예" : v === false ? "아니오" : "-";
function feedbackText(g, r) {
  return `[NHC POCKET 피드백] ${g.id} ${g.title} (빌드 ${g.version})
테스터: ${anon}${r.tester ? " (" + r.tester + ")" : ""}
좋아요: ${r.liked ? "♥" : "-"} / 별점: ${r.rating ? "★" + r.rating : "-"} / 한 판 더: ${yn(r.again)} / 바로 이해: ${yn(r.understood)}
플레이: ${fmt(r.play_seconds * 1000)} · 클리어 ${r.levels_cleared} · 실패 ${r.fails} · ${r.device}
의견: ${r.comment || "-"}`;
}
async function shareText(text, leaving) {
  sheet(`<h3>고마워요!</h3><p class="sub">아래 내용을 만든 사람에게 보내 주세요. ${esc(CFG.contact || "")}</p><pre class="out" id="out">${esc(text)}</pre>
    <div class="row"><button id="sCopy">복사</button>${navigator.share ? '<button class="pri" id="sShare">공유하기</button>' : ""}</div><div class="row"><button id="sDone">완료</button></div>`);
  $("sCopy").onclick = async () => { try { await navigator.clipboard.writeText(text); toast("복사했어요 — 카톡에 붙여 넣어 주세요"); } catch (e) { const r = document.createRange(); r.selectNodeContents($("out")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("글자를 길게 눌러 복사해 주세요"); } };
  if ($("sShare")) $("sShare").onclick = () => navigator.share({ text }).catch(() => {});
  $("sDone").onclick = () => { closeSheet(); if (leaving) toMenu(); };
}
function openCompare() {
  const [A, B] = slots.map(s => s.g); let w = null;
  sheet(`<h3>둘 중 어느 쪽이 더 "한 판 더"?</h3><p class="sub">A ${esc(A.title)} vs B ${esc(B.title)}</p>
    <div class="yn" id="cv"><button data-v="${A.id}">A</button><button data-v="tie">비슷</button><button data-v="${B.id}">B</button></div>
    <div class="q">이유 한 줄 (선택)</div><input type="text" id="cReason" maxlength="200">
    <div class="row"><button id="cSkip">건너뛰기</button><button class="pri" id="cSend">보내기</button></div>`);
  $("cv").querySelectorAll("button").forEach(b => b.onclick = () => { w = b.dataset.v; $("cv").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); SND.nav(); });
  $("cSkip").onclick = () => { slots.voted = true; closeSheet(); toMenu(); };
  $("cSend").onclick = async () => {
    if (!w) { toast("A · 비슷 · B 중 하나를 골라 주세요"); return; }
    const row = { anon_id: anon, tester: LS.get("nick", "") || null, game_a: A.id, game_b: B.id, winner: w, reason: $("cReason").value.trim() || null };
    const r = await DB.add("compare_votes", row); slots.voted = true; SND.like();
    if (r.local) shareText(`[NHC POCKET 비교] 테스터 ${anon}\nA ${A.id} ${A.title} vs B ${B.id} ${B.title}\n더 하고 싶은 쪽: ${w === "tie" ? "비슷" : w}\n이유: ${row.reason || "-"}`, true);
    else { closeSheet(); toast("고마워요!"); toMenu(); }
  };
}

// ── 내 기록 (B) — 사용자용. 전체 결과는 관리자 화면(admin.html) ──
function openMine() {
  const mine = LS.get("sessions", []).filter(x => x.anon_id === anon), fbs = LS.get("feedback", []).filter(x => x.anon_id === anon);
  const per = {}; mine.forEach(x => { const g = per[x.game_id] || (per[x.game_id] = { n: 0, sec: 0, lv: 0 }); g.n++; g.sec += x.play_seconds || 0; g.lv += x.levels_cleared || 0; });
  const rows = CAT.map(g => { const p = per[g.id]; const f = fbs.filter(x => x.game_id === g.id).length;
    return `<div class="res"><h4><span>${esc(g.icon)} ${esc(g.title)}</span><span style="font-size:12.5px">${likes[g.id] ? "♥" : ""}</span></h4>
      <div class="nums"><div>플레이<b>${p ? p.n : 0}회</b></div><div>총 시간<b>${p ? fmt(p.sec * 1000).replace(" ", "") : "-"}</b></div><div>의견<b>${f}개</b></div></div></div>`; }).join("");
  sheet(`<h3>내 기록</h3><p class="sub">테스터 번호 <b style="color:var(--acc);font-family:var(--mono)">${esc(anon)}</b> · 이 브라우저에 저장돼요. 다른 기기에서는 아래에 이 번호를 입력하면 이어서 기록돼요.</p>
    <div class="q">닉네임 (선택 · 실명은 적지 마세요)</div><input type="text" id="mNick" maxlength="20" value="${esc(LS.get("nick", ""))}">
    ${rows || '<p class="empty">아직 기록이 없어요</p>'}
    <div class="q">다른 기기에서 쓰던 번호로 이어 가기</div><input type="text" id="mCode" placeholder="T-XXXXX" maxlength="7" style="text-transform:uppercase">
    <div class="row"><button id="mCodeBtn">번호 바꾸기</button><button class="pri" id="mDone">저장</button></div>`);
  $("mDone").onclick = () => { LS.set("nick", $("mNick").value.trim().slice(0, 20)); closeSheet(); renderMenu(); toast("저장했어요"); };
  $("mCodeBtn").onclick = () => { const c = $("mCode").value.trim().toUpperCase(); if (!validCode(c)) { toast("T-로 시작하는 7자리 번호를 넣어 주세요"); return; } anon = c; LS.set("anon", c); closeSheet(); renderMenu(); toast(`${c} 번호로 이어서 기록해요`); };
}
function welcome() {
  sheet(`<h3>환영해요</h3><p class="sub">테스터 번호가 이 브라우저에 저장돼요. 개인정보는 받지 않아요.</p>
    <div style="font:900 28px var(--mono);letter-spacing:2px;color:var(--acc);text-align:center;margin:14px 0">${esc(anon)}</div>
    <div class="row"><button class="pri" id="wGo">시작</button></div>`);
  $("wGo").onclick = () => { closeSheet(); SND.ok(); };
}

// ── 시작 ──
addEventListener("resize", () => { if (view === "play") renderStage(); });
renderMenu(); refreshSummary();
const q = new URLSearchParams(location.search);
if (firstVisit && !q.has("play")) welcome();
if (q.has("play")) { const g = q.get("play").split(",").filter(id => CAT.some(c => c.id === id)); if (g.length && payFor(g)) { g.forEach(id => { seen[id] = CAT.find(c => c.id === id).version; }); LS.set("seen", seen); play(g); } }
</script>
