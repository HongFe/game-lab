<!doctype html>
<html lang="ko" class="ui-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<title>져주기 골프</title>
<style>
/* 공용 UI 키트 색 맞춤 (잔디 초록) — 키트 블록이 body 안 뒤쪽에 들어가므로 한 단계 높은 선택자 */
html:root{--ui-accent:#3cc98a;--ui-on-accent:#06281a}
:root{--gold:#ffc23a;--org:#ff9440;--lime:#9bd85a;--gray:#c4ccd6;--red:#ff5a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cdeefd;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all}
#game{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:#cdeefd}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;transition:filter .5s}
#cv.cold{filter:saturate(.18) brightness(1.04);transition:filter .1s}

/* HUD: 두 줄 칩 */
.ui-hud[hidden]{display:none}
.ui-hud.g-hud{flex-direction:column;align-items:stretch;gap:var(--ui-s2);padding-bottom:0}
.ui-hud.g-hud>*{pointer-events:none}
.g-row{display:flex;align-items:center;gap:var(--ui-s1)}
.g-row .ui-chip{height:32px;padding:0 10px;gap:var(--ui-s1)}
.g-row:nth-child(2){flex-wrap:nowrap;overflow:hidden}
.g-row:nth-child(2) .ui-chip{padding:0 8px}
.g-row .ui-chip .ui-icon{color:var(--ui-muted)}
#scoreChip{flex:1;justify-content:flex-start;gap:var(--ui-s2)}
#scoreChip .ui-meter{flex:1;min-width:40px}
#scoreChip .ui-meter>i{background:var(--ui-text)}
#scoreChip.reach .ui-meter>i{background:var(--gold)}
#scoreChip .ui-stars .off{color:rgba(15,20,30,.15)}
#scoreChip .ui-stars .ui-icon{width:12px;height:12px}
#scoreN{min-width:44px;text-align:right}
#goalTx{display:inline-flex;align-items:center;gap:2px}
#goalTx small{font-size:var(--ui-t2);color:var(--ui-muted);margin:0}
#pauseBtn{pointer-events:auto;width:44px;height:44px;min-height:44px;box-shadow:var(--ui-shadow1)}
.ui-hud.g-hud #pauseBtn{pointer-events:auto}
#nunChip .ui-pips>i{width:10px;height:8px}
#nunChip.hot{animation:hot .5s ease-out}
@keyframes hot{30%{transform:scale(1.18)}}
#nunChip .ui-icon{color:var(--ui-bad)}
#favChip{color:#a35c00}
#favChip .ui-icon{color:var(--gold)}
#evChip .ui-icon{color:var(--ui-text)}
.g-wind .ui-icon.flip{transform:scaleX(-1)}

/* 큰 배수 숫자 */
#bigm{paint-order:stroke fill;-webkit-text-stroke:6px rgba(255,255,255,.92);position:absolute;left:0;right:0;top:21%;text-align:center;pointer-events:none;font-size:56px;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(0,0,0,.18),0 0 18px rgba(0,0,0,.18);opacity:0;transition:opacity .15s;font-weight:700}
#bigm.on{opacity:1}
#bigm.b10{color:var(--gold)}#bigm.b5{color:var(--org)}#bigm.b2{color:#7cc63a}#bigm.b1{color:#8f9aa8}#bigm.bw{color:var(--red)}
#bigm.pulse{animation:bpulse .22s ease-out}
@keyframes bpulse{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#bigm.shiver{animation:shiver .09s linear infinite}
@keyframes shiver{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,0)}}
#bigm small{display:block;font-size:var(--ui-t2);font-weight:700;color:var(--ui-text);text-shadow:none;opacity:.7}

/* 판정 도장 */
.g-stamp{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-10deg) scale(2);border:4px solid currentColor;border-radius:12px;padding:6px 16px;font:700 26px/1.2 var(--ui-font);white-space:nowrap;opacity:0;pointer-events:none;background:rgba(255,255,255,.92);box-shadow:var(--ui-shadow2)}
.g-stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1);transition:transform .22s cubic-bezier(.3,1.6,.6,1),opacity .12s}
.g-stamp.s10{color:#d99a00}.g-stamp.s5{color:#e8711a}.g-stamp.s2{color:#4f9d1e}.g-stamp.s1{color:#6b7684}.g-stamp.sbad{color:#e5383f}
/* 상사 말풍선 · 시선 */
.g-bubble{position:absolute;left:84px;bottom:calc(env(safe-area-inset-bottom) + 92px);background:#fff;border-radius:var(--ui-r2);padding:var(--ui-s2) var(--ui-s3);font:700 var(--ui-t2)/1.3 var(--ui-font);box-shadow:var(--ui-shadow1);opacity:0;transform:translateY(6px) scale(.9);transform-origin:left bottom;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis}
.g-bubble.on{opacity:1;transform:none}
.g-bubble::after{content:"";position:absolute;left:-6px;bottom:10px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.g-eye{position:absolute;left:30px;bottom:calc(env(safe-area-inset-bottom) + 102px);width:32px;height:32px;border-radius:50%;background:#fff;display:none;place-items:center;box-shadow:var(--ui-shadow1);pointer-events:none;color:var(--ui-muted)}
.g-eye.show{display:grid}
.g-eye.look{background:var(--ui-bad);color:#fff}
.g-eye.twitch{animation:twitch .12s linear infinite}
.g-eye.big{animation:eyebig .6s ease-in-out 3}
@keyframes twitch{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes eyebig{50%{transform:scale(1.7)}}

/* 홀 카드 · 배너 */
#card{position:absolute;left:50%;top:38%;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;flex-direction:column;align-items:flex-start;gap:var(--ui-s1);padding:var(--ui-s3) var(--ui-s5)}
#card.on{opacity:1;transform:translate(-50%,0)}
#card b{font-size:var(--ui-t4);display:flex;align-items:center;gap:var(--ui-s2)}
#card span{display:flex;align-items:center;gap:var(--ui-s2);color:var(--ui-muted);font-size:var(--ui-t3)}
#card .ui-icon{color:var(--ui-text)}
#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;background:var(--ui-text);color:#fff}
#banner .ui-icon{color:#fff}
#banner.on{opacity:1;transform:translate(-50%,0)}

/* 발 웨지 버튼 */
#wedge{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);width:64px;height:64px;min-height:64px;padding:0;border-radius:50%;background:#fff;color:var(--ui-text);box-shadow:var(--ui-shadow1),inset 0 -3px 0 rgba(0,0,0,.08);display:none;flex-direction:column;gap:0;font-size:var(--ui-t1);touch-action:none}
#wedge.show{display:flex}
#wedge .ui-icon{width:26px;height:26px}
#wedge.ui-btn.dim{opacity:.38}
#wedge.ui-btn.look{background:var(--ui-bad);color:#fff}
#wedge:active{transform:translateX(-50%) scale(.92)}
#wedge .ui-badge{position:absolute;top:-6px;right:-6px;background:var(--ui-text);font-size:var(--ui-t2);min-width:24px;height:24px}
.g-sheet .ui-badge{font-size:var(--ui-t2);height:24px}
#sheet{left:max(0px,calc(50% - 260px));right:max(0px,calc(50% - 260px))}
#hand{display:none}
#hand.on{display:block}

/* 점수 팝 */
.g-pop{position:absolute;font:700 22px/1 var(--ui-font);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap;color:#1b2a12;text-shadow:0 2px 0 #fff,0 0 8px #fff;transform:translate(-50%,0);transition:left .55s cubic-bezier(.5,0,.8,.4),top .55s cubic-bezier(.5,0,.8,.4),opacity .2s .45s,transform .55s}
/* 시트 */
.g-sheet h3{margin:0 0 var(--ui-s1)}
.g-sheet .ui-col{max-width:420px;margin:0 auto}
.g-sline{display:flex;align-items:center;gap:var(--ui-s2);font-size:var(--ui-t3);color:var(--ui-muted)}
.g-sline b{color:var(--ui-text)}
.g-heat{display:inline-flex;color:var(--ui-bad)}
.g-sline .ui-icon{color:var(--ui-muted)}

/* 겹 화면 */
#ov.ui-screen{display:none}
#ov.ui-screen.on{display:flex}
#ov.ui-screen.dim{background:rgba(16,40,28,.42)}
#ov .ui-card{width:100%}
.g-hero{width:100%;height:150px;border-radius:var(--ui-r3);overflow:hidden;background:#cdeefd;box-shadow:var(--ui-shadow1)}
.g-hero canvas{width:100%;height:100%;display:block}
.g-line{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0;display:flex;align-items:center;justify-content:center;gap:var(--ui-s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.g-line b{color:var(--ui-text)}
.g-next{display:flex;align-items:center;gap:var(--ui-s3);text-align:left;width:100%}
.g-next img{width:40px;height:40px;flex:none}
.g-next .ui-grow{flex:1;display:flex;flex-direction:column;gap:2px}
.g-next b{font-size:var(--ui-t3)}
.g-next small{font-size:var(--ui-t2);color:var(--ui-muted);display:flex;align-items:center;gap:var(--ui-s1)}
.g-next small .ui-icon{width:16px;height:16px}
.ui-level img{width:30px;height:30px}
#ov .ui-level.cur{background:var(--ui-surface);box-shadow:inset 0 0 0 2px var(--ui-text)}
#ov .ui-level{background:var(--ui-surface);box-shadow:var(--ui-shadow1)}
#ov .ui-level{aspect-ratio:auto;min-height:56px}
#ov .ui-level.lock{background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line)}
#ov .ui-level .ui-stars .off{color:rgba(15,20,30,.15)}
.g-exic{color:var(--ui-bad)}
.g-strike{text-decoration:line-through;text-decoration-thickness:4px;color:var(--ui-muted)}
.g-big{font-size:48px}
/* 승진 명함 */
#promo{position:absolute;inset:0;z-index:60;display:none;place-items:center;background:rgba(16,40,28,.42);perspective:900px}
#promo.on{display:grid}
.g-flip{width:260px;height:150px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.g-flip.turn{transform:rotateY(180deg)}
.g-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--ui-r2);background:#fff;box-shadow:var(--ui-shadow2);display:flex;flex-direction:column;justify-content:center;padding:var(--ui-s5);gap:var(--ui-s1)}
.g-face.back{transform:rotateY(180deg)}
.g-face i{display:block;width:36px;height:6px;border-radius:3px;background:var(--ui-accent)}
.g-face small{font-size:var(--ui-t1);color:var(--ui-muted)}
.g-face b{font-size:var(--ui-t5)}
.g-face .ui-icon{position:absolute;right:var(--ui-s5);top:var(--ui-s5);color:var(--gold);width:32px;height:32px}
html .ui-stars,html .ui-chip .ui-stars .ui-icon,#ov .ui-level .ui-stars{color:var(--gold)}
.g-sline .ui-stars .ui-icon{color:var(--gold)}
.g-sline .ui-stars .off{color:rgba(15,20,30,.15)}
</style>
</head>
<body>
<!-- nhc-ui-kit:start -->
<style id="nhc-ui-kit">
/* NHC game-lab UI kit v1 (2026-11-27) — 게임 '밖' UI(시작·레벨·HUD·결과·안내·버튼·토스트) 공용 스타일
   기준: research/2026-11-27_게임UI_정돈_기준.md 의 15규칙. 모든 클래스는 ui- 로 시작해 게임 자체 스타일과 섞이지 않는다
   게임별로 바꿀 것은 :root 의 --ui-accent / --ui-on-accent 두 개뿐(게임 쪽 :root 가 항상 이긴다 — 키트 기본값은 :where 로 0점). 밝은 화면 게임은 <html class="ui-light"> */
:where(:root){
  /* 간격 4의 배수 7단계 */
  --ui-s1:4px;--ui-s2:8px;--ui-s3:12px;--ui-s4:16px;--ui-s5:24px;--ui-s6:32px;--ui-s7:48px;
  /* 글자 5단계 · 굵기 2개 */
  --ui-t1:12px;--ui-t2:14px;--ui-t3:16px;--ui-t4:20px;--ui-t5:30px;
  /* 반경 3단계 */
  --ui-r1:8px;--ui-r2:12px;--ui-r3:20px;
  /* 색 역할 (어두운 화면 기본) */
  --ui-bg:#0f1218;--ui-surface:#1a1f29;--ui-surface2:#242a36;--ui-line:rgba(255,255,255,.08);
  --ui-text:#f2f4f8;--ui-muted:#9aa3b2;--ui-accent:#ffc83d;--ui-on-accent:#1a1406;
  --ui-good:#34c77b;--ui-bad:#ff5a5f;
  --ui-shadow1:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18);
  --ui-shadow2:0 8px 32px rgba(0,0,0,.35);
  --ui-in:cubic-bezier(0,0,.2,1);--ui-out:cubic-bezier(.4,0,1,1);
  --ui-font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  --ui-touch:48px;
}
.ui-light{
  --ui-bg:#f4f6f9;--ui-surface:#ffffff;--ui-surface2:#eef1f5;--ui-line:rgba(15,20,30,.08);
  --ui-text:#161a22;--ui-muted:#5f6878;
  --ui-shadow1:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.08);
  --ui-shadow2:0 12px 32px rgba(15,20,30,.16);
}
.ui-warm{--ui-bg:#f7f1e8;--ui-surface:#fffdf9;--ui-surface2:#f0e8dc;--ui-line:rgba(60,40,20,.10);--ui-text:#2a2118;--ui-muted:#76695a}   /* 따뜻한 밝은 화면: ui-light 와 함께 */
.ui-kid{--ui-touch:56px}
.ui-kid .ui-btn,.ui-kid .ui-level{min-height:56px}

/* 기본 스타일 지우기 (ui- 요소 안에서만) */
.ui-screen,.ui-card,.ui-hud,.ui-toast,.ui-sheet{font-family:var(--ui-font);color:var(--ui-text);word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.ui-screen *,.ui-hud *,.ui-sheet *{box-sizing:border-box}
.ui-screen ul,.ui-sheet ul{list-style:none;margin:0;padding:0}
.ui-num{font-variant-numeric:tabular-nums}

/* 아이콘: <svg class="ui-icon"><use href="#i-play"/></svg> 또는 UI.icon("play") */
.ui-icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ui-icon.lg{width:24px;height:24px}.ui-icon.xl{width:32px;height:32px}.ui-icon.sm{width:16px;height:16px;vertical-align:-3px}
.ui-icon.fill{fill:currentColor}

/* 화면(시작·결과·일시정지): 가운데 한 줄 기둥 */
.ui-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:var(--ui-s5);padding-top:max(var(--ui-s5),env(safe-area-inset-top));padding-bottom:max(var(--ui-s5),env(safe-area-inset-bottom));background:var(--ui-bg);overflow:auto}
.ui-screen.dim{background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ui-col{width:100%;max-width:360px;display:flex;flex-direction:column;gap:var(--ui-s4)}
.ui-screen>.ui-col{margin-block:auto}   /* 짧으면 가운데, 길면 위에서부터 스크롤(위 잘림 없음) */
.ui-center{text-align:center;align-items:center}
.ui-hero{font-size:56px;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:var(--ui-r3);background:var(--ui-surface)}
.ui-title{font-size:var(--ui-t5);font-weight:700;line-height:1.25;letter-spacing:-.02em;margin:0}
.ui-h{font-size:var(--ui-t4);font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.ui-sub{font-size:var(--ui-t3);line-height:1.5;color:var(--ui-muted);margin:0}   /* 16: 제목30·버튼20/16과 합쳐 3단계 */
.ui-cap{font-size:var(--ui-t1);line-height:1.5;color:var(--ui-muted);margin:0}
.ui-row{display:flex;gap:var(--ui-s2);align-items:center}
.ui-row>.ui-btn{flex:1}
.ui-spacer{flex:1}

/* 버튼: 주 버튼은 화면에 하나 */
.ui-btn{appearance:none;border:0;margin:0;font:700 var(--ui-t3)/1 var(--ui-font);color:var(--ui-text);background:var(--ui-surface2);min-height:var(--ui-touch);padding:0 var(--ui-s5);border-radius:var(--ui-r2);display:inline-flex;align-items:center;justify-content:center;gap:var(--ui-s2);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 90ms var(--ui-in),filter 90ms var(--ui-in)}
.ui-btn:active{transform:scale(.96)}
.ui-btn:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.ui-btn.primary{background:var(--ui-accent);color:var(--ui-on-accent);box-shadow:var(--ui-shadow1);min-height:calc(var(--ui-touch) + 8px);font-size:var(--ui-t4)}
.ui-btn.ghost{background:transparent;color:var(--ui-muted)}
.ui-btn.icon{width:var(--ui-touch);padding:0;flex:none;position:relative}
.ui-btn.icon>.ui-badge{position:absolute;top:-6px;right:-6px;margin:0}
.ui-btn.round{border-radius:50%}
.ui-btn:disabled,.ui-btn.off{opacity:.38;pointer-events:none}
.ui-btn .ui-badge{margin-left:2px}
.ui-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ui-bad);color:#fff;font:700 var(--ui-t1)/1 var(--ui-font);font-variant-numeric:tabular-nums}

/* 카드 · 수치 */
.ui-card{background:var(--ui-surface);border-radius:var(--ui-r3);padding:var(--ui-s4);box-shadow:var(--ui-shadow1)}
.ui-card.flat{box-shadow:none;background:var(--ui-surface2)}
.ui-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:var(--ui-s2)}
.ui-stat{background:var(--ui-surface2);border-radius:var(--ui-r2);padding:var(--ui-s3);display:flex;flex-direction:column;gap:var(--ui-s1);min-width:0}
.ui-stat b{font-size:clamp(var(--ui-t3),5vw,var(--ui-t4));font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-stat span{font-size:var(--ui-t1);color:var(--ui-muted);line-height:1.25;display:flex;align-items:center;gap:var(--ui-s1)}
.ui-big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 레벨 선택 격자 */
.ui-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--ui-s2)}
.ui-level{appearance:none;border:0;margin:0;aspect-ratio:1;border-radius:var(--ui-r2);background:var(--ui-surface2);color:var(--ui-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--ui-s1);font:700 var(--ui-t4)/1 var(--ui-font);font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation;transition:transform 90ms var(--ui-in)}
.ui-level:active{transform:scale(.94)}
.ui-level.cur{box-shadow:inset 0 0 0 2px var(--ui-text)}   /* 강조색은 주 버튼에만 → 지금 칸은 테두리로 */
.ui-level.lock{color:var(--ui-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--ui-line);pointer-events:none}
.ui-level .ui-stars .ui-icon{width:10px;height:10px}

/* 별 */
.ui-stars{display:inline-flex;gap:2px;color:var(--ui-accent)}
.ui-stars .off{color:var(--ui-line);opacity:1}
.ui-light .ui-stars .off{color:rgba(15,20,30,.15)}
.ui-stars.big .ui-icon{width:40px;height:40px}
.ui-stars.big{gap:var(--ui-s2)}

/* HUD: 위쪽 칩 줄 */

  out.push("", "[C] 생존 봇 (늘 +5m, 웨지·연장 안 함) — 기준: 발령 10% 이하, 통과 50% 이상");
  const sp = [];

    ok(ex <= .1 && cl >= .5, `[C${c.n}] 통과 ${P_(cl)} · 발령 ${P_(ex)} · 정산 중앙 ${fmt(median(rs.map(R => R.done.score)))}`); }
  ok(sp.every((v, i) => !i || v <= sp[i - 1] + .05), `[M] 목표 계단: 생존 봇 통과율이 단계마다 줄거나 같음(±5%p) ${sp.map(P_).join(" → ")}`);
  // [D] 판단이 타이밍을 이긴다
  { const rows = []; let good = true;
    for (const n of [3, 4, 5, 6]) { const ha = avg(H[n].map(R => R.done.score)), pa = avg(P[n].map(R => R.done.score)), pe = rate(P[n], R => R.done.exile);
      if (!(ha > pa && pe >= .3)) good = false; rows.push(`${n}단계 보통 손 ${fmt(ha)} vs 완벽 ${fmt(pa)} (완벽 발령 ${P_(pe)})`); }
    ok(good, `[D] 판단 > 타이밍 (G013 방지): ${rows.join(" · ")}`); }
  // [K] 멈출까 더 갈까: 연장 상한 K별 (보통 손, 눈치 무시하고 K홀까지)
  { const rows = []; let good = true;
    for (const c of STAGES) { const r = {}; for (const k of [0, 2, 3, 6]) { const rs = sim(c.n, seeds.concat(seeds2), "human", { extK: k }); r[k] = { a: avg(rs.map(R => R.done.score)), e: rate(rs, R => R.done.exile) }; }
      const g = r[6].a <= 1.1 * Math.max(r[2].a, r[3].a) && r[6].e >= .3; if (!g) good = false;
      rows.push(`${c.n}: ${[0, 2, 3, 6].map(k => `K${k} ${fmt(r[k].a)}/${P_(r[k].e)}`).join(" ")}${g ? "" : "!"}`); }
    ok(good, `[K] 연장 위험 (평균/발령) — 기준: 늘 연장(K6) 평균 ≤ 연장 2~3 최고×1.1, K6 발령 30%+ · ${rows.join(" · ")}`); }
  // [L] 얼마나 바짝: 조준 여유 a별 평균 (보통 손, 2~6단계)

    for (const n of [2, 3, 4, 5, 6]) { const r = AS.map(a => { const rs = sim(n, seeds.concat(seeds2), "human", { fixA: a }); return { a, s: avg(rs.map(R => R.done.score)), e: rate(rs, R => R.done.exile) }; });
      const best = r.reduce((x, y) => y.s > x.s ? y : x), g = best.a >= 1.8 && best.a <= 3.2 && r[0].e >= .15; if (!g && n <= 5) good = false;

        if (R.h.gallery) break; const gzBefore = gazeAt(R.h, R.gt + DT); step(R, { wedge: 1 }); if (R.kicks !== 1) { tBad++; continue; } tN++; const c = !!R.shot.caught; if ((gzBefore === 2) !== c) tBad++; } }

    ok(!sBad && !tBad && tN > 0, `[F] 숨은 확률 없음: 착지가 괄호 밖 ${sBad}/${sN} · 시선 닫힘 웨지 안 걸림/열림 웨지 걸림 위반 ${tBad}/${tN} · 사람 봇 웨지 ${wN}번`); }
  // [G] 판정 경계
  { const h = { P: 100, rb: 5, bw: 1, F0: 52, F1: 64, G0: 80, G1: 120, ob: false }, exp = [[-.01, "win"], [0, 10], [.99, 10], [1, 5], [3, 2], [7, 1], [15, 1], [15.01, "tee"]];
    const bad = [];
    for (const [m, e] of exp) { const a = judgeX(h, h.P - h.rb - m, h.rb), b = judgeX(h, h.P + h.rb + m, h.rb); if (a !== e || b !== e) bad.push(`m${m}:${a}/${b}`); }
    // 멀리건 뒤 재판정: 상사 두 번째 공이 4m 가까워지면 margin 3 → −1 (이김), 멀어지면 margin 3 → 7 (×1)
    if (judgeX(h, 92, 5) !== 2 || judgeX(h, 92, 1) !== 1 || judgeX(h, 92, 9) !== "win" || judgeX(h, 92, 6.5) !== 5) bad.push("멀리건");
    const ho = Object.assign({}, h, { ob: true });
    if (judgeX(ho, 63.5, 5) !== 10 || judgeX(ho, 62.99, 5) !== 5 || judgeX(ho, 64, 5) !== 10 || judgeX(ho, 100, 5) !== "win" || judgeX(ho, 70, 5) !== 1 || judgeX(ho, 52, 5) !== 5) bad.push("OB홀");
    if (judgeX(h, 58, 5) !== "tee") bad.push("숲OB");
    // 실제 흐름: 멀리건 홀을 상태 기계로 돌려 기준 공이 바뀌는지
    let mOk = 0, mN = 0, flip = 0; for (let seed = 1; seed <= 30; seed++) { const R = simRound(4, seed, "human", { event: "mull" }); for (const l of R.log) { mN++; const h2 = R.holes[l.i], rb2 = Math.max(.3, Math.round((h2.rb + h2.md) * 10) / 10);

  // [H] 판마다 다름 · 같은 시드 같음
  { let diff = true, same = true; const sig = R => R.holes.slice(0, R.c.holes).map(h => [h.P, h.rb, h.w, h.ev.join("+"), h.spd].join(",")).join("|");

    sink = null; selftesting = true; auto = true;

    ok(posted === before && posted === 0 && types && fails, `[J] 오락실 신호: 자동·검사 중 postMessage ${posted}건 · 사람 흉내 30판 ev 4종만(${types}) · fail 한 판 1번 이하(${fails})`); }
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#0b1a10;color:#9ff0b0;z-index:99;margin:0;padding:10px;font:11px/1.45 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre-wrap">SELFTEST ${pass}/${total}\n\n${out.join("\n")}</pre>`);

}

// ═════════ 시작 ═════════
function setSafe() { const d = document.createElement("div"); d.style.cssText = "position:fixed;bottom:0;height:env(safe-area-inset-bottom)"; document.body.appendChild(d); document.documentElement.style.setProperty("--sab", d.getBoundingClientRect().height + "px"); d.remove(); }
resize(); setSafe();
if (q.has("selftest")) { setTimeout(selftest, 30); }
else if (q.has("diag")) { selftesting = auto = true; const kind = q.get("diag"), out = [];
  for (const n of [1, 2, 3, 4, 5, 6]) { const rs = []; for (let s = 301; s <= 340; s++) rs.push(simRound(n, s, kind, q.has("fixa") ? { bot: { fixA: Number(q.get("fixa")) } } : {})); const L = rs.flatMap(R => R.log);

    const evw = {}; L.forEach(l => { const k = l.ev.join("+") || "-"; evw[k] = evw[k] || [0, 0]; evw[k][0]++; if (l.kind === "win") evw[k][1]++; });
