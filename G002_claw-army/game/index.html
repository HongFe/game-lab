<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1640">
<title>인형뽑기 군단</title>
<style>
:root{--bg:#2a1640;--bg2:#160b26;--tx:#fff5fb;--sub:#c6a9d9;--pink:#ff5fa2;--cyan:#38e1ff;--yel:#ffd84d;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#4a2370,var(--bg) 45%,var(--bg2));color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.hud{display:flex;gap:6px;align-items:center}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:12px;color:var(--sub);flex:1;text-align:center}
.hud b{display:block;font:900 18px ui-monospace,Menlo,monospace;color:var(--tx)}
.hud .coin b{color:var(--yel)}
.hud .mutegap{flex:0 0 44px;height:44px;background:none;border:0;padding:0}
.mute{position:fixed;z-index:9;top:calc(8px + env(safe-area-inset-top));right:max(12px,calc((100vw - 480px) / 2 + 12px));width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(60,30,90,.85);font-size:18px;color:#fff;cursor:pointer;padding:0;touch-action:manipulation}
.sign{text-align:center;font:900 20px -apple-system,sans-serif;letter-spacing:1px;margin:6px 0 4px;color:#fff;text-shadow:0 0 6px var(--pink),0 0 14px var(--pink),0 0 24px #ff2d8a;animation:neon 3s infinite}
@keyframes neon{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
#cv{flex:1;width:100%;min-height:0;touch-action:none;display:block}
.squad{display:flex;gap:4px;min-height:46px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0;touch-action:manipulation}
.squad span{position:relative;font-size:26px;line-height:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 5px 3px;min-width:40px;text-align:center;cursor:pointer}
.squad span i{position:absolute;right:-4px;top:-8px;font-style:normal;font-size:12px;color:var(--yel);text-shadow:0 0 4px #000}
.squad .empty{font-size:12px;color:var(--sub);background:none;border:0;cursor:default}
.squad span.new{animation:join .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes join{from{transform:translateY(-30px) scale(1.6)}}
.btns{display:flex;gap:8px}
.btns button{flex:1;border:0;border-radius:14px;padding:13px 0;font:900 15px -apple-system,sans-serif;color:#2a1640;background:var(--yel);box-shadow:0 4px 0 #b88f00;cursor:pointer;touch-action:manipulation}
.btns button.fight{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a8195a}
.btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btns button:disabled{filter:grayscale(.7) brightness(.7)}
.tip{font-size:12.5px;color:var(--sub);text-align:center;margin-top:6px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,6,26,.7);padding:18px;z-index:5}
.ov.on{display:flex}
.box{background:#2d1846;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);text-align:center;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h1{margin:0;font-size:26px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:13px;line-height:1.7;padding-left:18px;color:#f0e2f7}
.box button{width:100%;border:0;border-radius:12px;padding:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--yel);color:#2a1640}
.box .team{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}.box .team span{font-size:26px;line-height:1;white-space:nowrap}.box .team small{font-size:12px;color:var(--yel);vertical-align:top}
.box .big{font:900 40px ui-monospace,Menlo,monospace;color:var(--yel)}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:900 28px -apple-system,sans-serif;pointer-events:none;z-index:4;animation:popup 1s ease-out forwards;text-shadow:0 3px 10px rgba(0,0,0,.6);white-space:nowrap}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.2);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
/* 인형 카드 */
.cardbg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,6,26,.55);z-index:7;padding:20px;touch-action:none}
.cardbg.on{display:flex}
.card{position:relative;width:min(300px,100%);background:linear-gradient(170deg,#4a2577,#25123a);border:2px solid var(--yel);border-radius:22px;padding:22px 18px 16px;text-align:center;box-shadow:0 0 0 4px rgba(255,216,77,.15),0 18px 40px rgba(0,0,0,.5);animation:cardin .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes cardin{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.card .ribbon{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--pink);color:#fff;font:900 12px -apple-system,sans-serif;padding:5px 14px;border-radius:99px;letter-spacing:1px;white-space:nowrap}
.card .cemo{width:92px;height:92px;margin:4px auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.4)}
.card h3{margin:0;font-size:22px}
.card .role{display:inline-block;vertical-align:middle;font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 9px;margin-left:4px;color:var(--cyan)}
.card p{margin:6px 0;color:var(--sub);font-size:13.5px}
.card .sp{background:rgba(0,0,0,.28);border:1px solid rgba(255,216,77,.35);border-radius:14px;padding:10px;margin:10px 0 4px;font-size:13px;line-height:1.55;color:#f0e2f7}
.card .sp b{color:var(--yel);font-size:15px}
.card .hint{font-size:12.5px}
.card button{width:100%;min-height:44px;border:0;border-radius:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;background:var(--yel);color:#2a1640;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(30,14,50,.92);border:1px solid rgba(255,216,77,.5);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:toast 2.2s ease-out forwards;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast b{color:var(--yel)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
.syn{display:flex;gap:4px;min-height:40px;align-items:center;justify-content:center;flex-wrap:wrap;margin:5px 0;touch-action:manipulation}
.syn span{font-size:12px;line-height:1.2;padding:4px 6px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#8f7aa3;white-space:nowrap}
.syn span.on{color:#2a1640;background:var(--yel);border-color:#fff;font-weight:900;box-shadow:0 0 10px rgba(255,216,77,.5)}
.btns button.spd,.btns button.ic{flex:0 0 52px;background:#5a3a80;color:#fff;box-shadow:0 4px 0 #2a1640;font-size:14px;padding:13px 0}
.up{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);width:min(360px,94vw);background:rgba(36,18,58,.97);border:1px solid var(--yel);border-radius:16px;padding:8px;z-index:6;display:none;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.up.on{display:block;animation:rise .2s ease-out}
.up .hd{display:flex;align-items:center;gap:8px;font:900 16px -apple-system,sans-serif;margin:0 2px 6px}
.up .hd i{font-style:normal;font-size:13px;padding:2px 8px;border-radius:99px;color:#1a0a2a}
.up .hd .x{margin-left:auto;width:40px;height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:16px}
.up .row{display:flex;gap:6px}
.up .row button{flex:1;min-height:44px;border:0;border-radius:11px;background:var(--yel);color:#2a1640;font:900 14px -apple-system,sans-serif}
.up .row button:disabled{filter:grayscale(1) brightness(.6)}
.up .row.sw{margin-top:6px}.up .row.sw button{background:#5a3a80;color:#fff;font-size:20px;padding:0}
.box table{width:100%;font-size:13px;border-collapse:collapse;color:#f0e2f7;text-align:left}.box td{padding:4px 2px;border-bottom:1px solid var(--line)}.box td:last-child{text-align:right;color:var(--yel);font-weight:900}
.box .opt{display:flex;align-items:center;gap:10px;text-align:left;background:#3d2160;color:#fff;border:1px solid var(--line);min-height:56px}
.box .opt b{font-size:26px}
.btns button.spin{background:#ff5f6d;color:#fff;box-shadow:0 4px 0 #a01830}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><div>웨이브<b id="rd">0</b></div><div class="coin">코인<b id="cn">30</b></div><div>최고<b id="bst">-</b></div><div class="mutegap"></div></div>
  <div class="sign" id="sign">인형뽑기 군단</div>
  <canvas id="cv"></canvas>
  <div class="syn" id="syn"></div>
  <div class="btns"><button id="drop">🎰 10🪙</button><button class="ic" id="mis" aria-label="미션">🎯</button><button class="ic" id="prob" aria-label="확률표">📊</button><button class="spd" id="spd">▶1</button></div>
  <div class="tip" id="tip">릴을 탭해서 멈춰요</div>
</div>
<button class="mute" id="mute" aria-label="소리 켜기/끄기">🔊</button>
<div class="up" id="up"></div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<div class="cardbg" id="cardbg"><div class="card" id="card"></div></div>
<script>
"use strict";
const q = new URLSearchParams(location.search), SELFTEST = q.has("selftest"), JUICE = !q.has("nojuice");
// ───────── 데이터: 인형 6종 (역할이 행동으로 드러나게) ─────────
// rng=사거리(px), cd=공격 간격(초), chg=필살기까지 공격 횟수
const TYPES = {
  bear: { e: "🐻", ic: "🛡️", name: "곰", role: "탱커", col: "#c98a52", rare: 3, hp: 80, atk: 4, cd: 1, rng: 100, cap: 2, chg: 7, desc: "앞으로 나가 적을 붙잡고(도발) 앞발로 쓸어 침" },
  bun: { e: "🐰", ic: "🥕", name: "토끼", role: "연타", col: "#f5d0e3", rare: 3, atk: 3, cd: .75, rng: 130, pspd: 420, chg: 8, desc: "깡충 뛰며 당근 두 발을 연달아 던짐" },
  dino: { e: "🦖", ic: "🔥", name: "공룡", role: "광역 화염", col: "#5fcf7a", rare: 2, atk: 8, cd: 1.5, rng: 160, aoe: 36, pspd: 250, chg: 5, desc: "불덩이를 뿜어 떨어진 자리 주변을 모두 태움" },
  cat: { e: "🐱", ic: "🗡️", name: "고양이", role: "암살", col: "#ffb36b", rare: 2, atk: 5, cd: .55, rng: 115, crit: .3, chg: 12, desc: "가장 약한 적에게 순식간에 달려가 할큄 · 30% 치명타 ×3" },
  peng: { e: "🐧", ic: "💚", name: "펭귄", role: "회복·버프", col: "#7fa7d9", rare: 2, atk: 2, cd: 1.1, rng: 140, pspd: 300, heal: 5, chg: 6, desc: "옆 칸 인형 공격 속도 +15% · 곰 회복 · 눈덩이" },
  octo: { e: "🐙", ic: "🌀", name: "문어", role: "감속", col: "#ff7aa8", rare: 2, atk: 4, cd: 1.4, rng: 175, aoe: 42, slow: .4, pspd: 220, chg: 5, desc: "먹물탄으로 넓게 맞히고 웅덩이로 적을 느리게" },
};
const SP = {
  bear: { name: "대지진", desc: "주변 적 모두에게 큰 피해 + 1.2초 기절", short: "주변 적 기절", col: "#e0a060" },
  dino: { name: "불꽃 브레스", desc: "사거리 안 모든 적을 불태움 (공격×3)", short: "범위 적 불태우기", col: "#ff6a20" },
  cat: { name: "연속 할퀴기", desc: "가장 강한 적을 5번 할퀴고 마지막은 치명타", short: "강적 5연속 할퀴기", col: "#ffd84d" },
  bun: { name: "분신 연타", desc: "분신이 나타나 적들을 6번 때림", short: "분신 6연타", col: "#ff9ed2" },
  peng: { name: "회복 오로라", desc: "목숨 +1 · 곰 완전 회복 · 전원 5초간 공격 속도 ×1.5", short: "❤️+1·공속 업", col: "#5fffc8" },
  octo: { name: "먹물 폭탄", desc: "화면의 모든 적에게 피해 + 3초간 60% 감속", short: "전체 감속", col: "#9a6cff" },
};
// 시너지: 조합이 갖춰지면 켜짐 (아래 칩·필드 연결선으로 표시)
const SYN = [
  { id: "guard", e: "🐻🐧", name: "", desc: "곰이 받는 피해 -40%" },
  { id: "fireink", e: "🦖🐙", name: "", desc: "느려진 적에게 불 피해 +50%" },
  { id: "quick", e: "🐱🐰", name: "", desc: "고양이·토끼 공격 속도 +25%" },
  { id: "div", e: "3종", name: "", desc: "3종 이상: 전원 공격 +10%" },
  { id: "all6", e: "6종", name: "", desc: "6종 모두: 전원 공격 +30%" },
];
const KEYS = Object.keys(TYPES);
// 등급 5단계: 힘 배수·색·판매가 (신화는 판매 불가). 합성 = 같은 종류·같은 등급 2개 → 한 단계 위(70% 같은 종류, 30% 무작위 종류)
const GRADE = ["", "일반", "희귀", "영웅", "전설", "신화"], GCOL = ["", "#d9d2e6", "#4db8ff", "#c07cff", "#ff9a2e", "#ff3b6b"], SELL = [0, 5, 12, 30, 70, 0], MAXG = 5, MERGE_SAME = .7, SWAP_COST = 15, SWAP_P = .6;
// 미션 5개 + 히든 2개 (보상: 코인 또는 뽑기권)
const MISSIONS = [
  { id: "six", name: "6종 모두 모으기", rw: { coins: 40 }, test: r => new Set(r.units.map(u => u.type)).size >= 6 },
  { id: "hero", name: "영웅 등급 만들기", rw: { tickets: 2 }, test: r => r.units.some(u => u.star >= 3) },
  { id: "syn2", name: "시너지 2개 켜기", rw: { coins: 25 }, test: r => ["guard", "fireink", "quick"].filter(k => r.syn[k]).length >= 2 },
  { id: "jack3", name: "잭팟 3번", rw: { tickets: 1 }, test: r => (r.stats.jackpot || 0) >= 3 },
  { id: "legend", name: "전설 등급 만들기", rw: { coins: 80 }, test: r => r.units.some(u => u.star >= 4) },
  { id: "dust", name: "먼지 수집가 (💨💨💨)", hidden: true, rw: { tickets: 3 }, test: r => (r.stats.dust || 0) >= 1 },
  { id: "bears", name: "곰 사단 (곰 3마리 동시에)", hidden: true, rw: { coins: 50 }, test: r => r.units.filter(u => u.type === "bear").length >= 3 },
];
// 보스 보상: 3개 중 하나 골라 받기
const REWARDS = [
  { id: "hero", name: "영웅 인형", desc: "영웅 등급 소환 (칸이 없으면 60🪙)" },
  { id: "coins", name: "코인 꾸러미", desc: "+40+10×웨이브 🪙" },
  { id: "tickets", name: "뽑기권 3장", desc: "공짜 뽑기 3번" },
  { id: "lives", name: "목숨 +3", desc: "❤️ +3 (최대 10)" },
  { id: "power", name: "전원 강화", desc: "모든 인형 공격 +15% (계속)" },
];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const store = { get() { try { return JSON.parse(localStorage.getItem("g002") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g002", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ best: 0, runs: 0, seen: {}, mute: false }, store.get());

// ───────── 소리 (Web Audio 합성) ─────────
let ac = null, master = null, NB = null;
function audio() {
  if (SELFTEST) return null;
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = save.mute ? 0 : .9; master.connect(ac.destination); }
    if (ac.state === "suspended") ac.resume();
    return ac;
  } catch (e) { return null; }
}
function beep(f, d = .06, type = "square", v = .04, w = 0, f2, dest) { const a = audio(); if (!a) return; try { const t = a.currentTime + w, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .02); } catch (e) {} }
function noise(d = .1, v = .05, f = 1200, w = 0, type = "bandpass", f2, dest, at) {
  const a = audio(); if (!a) return;
  try {
    if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
    const t = at ?? a.currentTime + w, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = NB; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const vary = () => 1 + (Math.random() - .5) * .16;   // 피치 ±8%
const SFX = {
  lever() { beep(120, .18, "sawtooth", .05, 0, 60); noise(.15, .05, 900, 0, "lowpass", 200); buzz(10); },
  tick() { beep(1800 * vary(), .015, "square", .012); },
  stop(i) { beep([330, 392, 523][i] || 523, .07, "square", .06); noise(.05, .05, 2500); buzz(12); },
