<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1640">
<title>인형뽑기 군단</title>
<style>
:root{--bg:#2a1640;--bg2:#160b26;--tx:#fff5fb;--sub:#c6a9d9;--pink:#ff5fa2;--cyan:#38e1ff;--yel:#ffd84d;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#4a2370,var(--bg) 45%,var(--bg2));color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.hud{display:flex;gap:6px;align-items:center}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:11px;color:var(--sub);flex:1;text-align:center}
.hud b{display:block;font:900 18px ui-monospace,Menlo,monospace;color:var(--tx)}
.hud .coin b{color:var(--yel)}
.hud .mute{flex:0 0 44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px;color:#fff;cursor:pointer;padding:0}
.sign{text-align:center;font:900 20px -apple-system,sans-serif;letter-spacing:1px;margin:6px 0 4px;color:#fff;text-shadow:0 0 6px var(--pink),0 0 14px var(--pink),0 0 24px #ff2d8a;animation:neon 3s infinite}
@keyframes neon{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
#cv{flex:1;width:100%;min-height:0;touch-action:none;display:block}
.squad{display:flex;gap:4px;min-height:46px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0;touch-action:manipulation}
.squad span{position:relative;font-size:26px;line-height:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 5px 3px;min-width:40px;text-align:center;cursor:pointer}
.squad span i{position:absolute;right:-3px;top:-6px;font-style:normal;font-size:10px;color:var(--yel);text-shadow:0 0 4px #000}
.squad .empty{font-size:12px;color:var(--sub);background:none;border:0;cursor:default}
.squad span.new{animation:join .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes join{from{transform:translateY(-30px) scale(1.6)}}
.btns{display:flex;gap:8px}
.btns button{flex:1;border:0;border-radius:14px;padding:13px 0;font:900 15px -apple-system,sans-serif;color:#2a1640;background:var(--yel);box-shadow:0 4px 0 #b88f00;cursor:pointer;touch-action:manipulation}
.btns button.fight{background:var(--pink);color:#fff;box-shadow:0 4px 0 #a8195a}
.btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btns button:disabled{filter:grayscale(.7) brightness(.7)}
.tip{font-size:11.5px;color:var(--sub);text-align:center;margin-top:6px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,6,26,.7);padding:18px;z-index:5}
.ov.on{display:flex}
.box{background:#2d1846;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);text-align:center;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h1{margin:0;font-size:26px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:13px;line-height:1.7;padding-left:18px;color:#f0e2f7}
.box button{width:100%;border:0;border-radius:12px;padding:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--yel);color:#2a1640}
.box .big{font:900 40px ui-monospace,Menlo,monospace;color:var(--yel)}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font:900 28px -apple-system,sans-serif;pointer-events:none;z-index:4;animation:popup 1s ease-out forwards;text-shadow:0 3px 10px rgba(0,0,0,.6);white-space:nowrap}
@keyframes popup{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.2);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
/* 인형 카드 */
.cardbg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,6,26,.55);z-index:7;padding:20px;touch-action:none}
.cardbg.on{display:flex}
.card{position:relative;width:min(300px,100%);background:linear-gradient(170deg,#4a2577,#25123a);border:2px solid var(--yel);border-radius:22px;padding:22px 18px 16px;text-align:center;box-shadow:0 0 0 4px rgba(255,216,77,.15),0 18px 40px rgba(0,0,0,.5);animation:cardin .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes cardin{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.card .ribbon{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:var(--pink);color:#fff;font:900 12px -apple-system,sans-serif;padding:5px 14px;border-radius:99px;letter-spacing:1px;white-space:nowrap}
.card .cemo{width:92px;height:92px;margin:4px auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.4)}
.card h3{margin:0;font-size:22px}
.card .role{display:inline-block;vertical-align:middle;font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 9px;margin-left:4px;color:var(--cyan)}
.card p{margin:6px 0;color:var(--sub);font-size:13.5px}
.card .sp{background:rgba(0,0,0,.28);border:1px solid rgba(255,216,77,.35);border-radius:14px;padding:10px;margin:10px 0 4px;font-size:13px;line-height:1.55;color:#f0e2f7}
.card .sp b{color:var(--yel);font-size:15px}
.card .hint{font-size:11.5px}
.card button{width:100%;min-height:44px;border:0;border-radius:12px;font:900 15px -apple-system,sans-serif;margin-top:8px;background:var(--yel);color:#2a1640;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(30,14,50,.92);border:1px solid rgba(255,216,77,.5);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:toast 2.2s ease-out forwards;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.toast b{color:var(--yel)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
</style>
</head>
<body>
<div id="app">
  <div class="hud"><div>라운드<b id="rd">1</b></div><div class="coin">코인<b id="cn">3</b></div><div>최고<b id="bst">-</b></div><button class="mute" id="mute" aria-label="소리 켜기/끄기">🔊</button></div>
  <div class="sign" id="sign">인형뽑기 군단</div>
  <canvas id="cv"></canvas>
  <div class="squad" id="squad"></div>
  <div class="btns"><button id="drop">🕹 뽑기 (탭)</button><button class="fight" id="fight">⚔️ 전투 시작</button></div>
  <div class="tip" id="tip">집게가 인형 바로 위에 올 때 탭! 가운데일수록 잘 잡혀요</div>
</div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<div class="cardbg" id="cardbg"><div class="card" id="card"></div></div>
<script>
"use strict";
const q = new URLSearchParams(location.search), SELFTEST = q.has("selftest");
// ───────── 데이터 ─────────
const TYPES = {
  bear: { e: "🐻", name: "곰", role: "탱커", col: "#c98a52", hp: 30, atk: 3, w: 0, rare: 3, desc: "체력 높음 · 맨 앞에서 버팀" },
  bun: { e: "🐰", name: "토끼", role: "연타", col: "#f5d0e3", hp: 14, atk: 2, w: 0, rare: 3, desc: "한 턴에 두 번 공격" },
  dino: { e: "🦖", name: "공룡", role: "딜러", col: "#5fcf7a", hp: 18, atk: 6, w: .1, rare: 2, desc: "공격력 높음" },
  cat: { e: "🐱", name: "고양이", role: "치명타", col: "#ffb36b", hp: 15, atk: 4, w: .1, rare: 2, desc: "30% 확률 치명타 ×3" },
  peng: { e: "🐧", name: "펭귄", role: "회복", col: "#7fa7d9", hp: 16, atk: 1, w: .22, rare: 1, desc: "매 턴 맨 앞 아군 회복" },
  octo: { e: "🐙", name: "문어", role: "광역", col: "#ff7aa8", hp: 16, atk: 3, w: .22, rare: 1, desc: "맨 앞 적 둘을 동시에 공격" },
};
// 필살기: 게이지(GMAX)가 차면 그 인형 차례에 자동 발동. gain=행동 1번에 차는 양, dur/hit=연출 시간(로직과 무관)
const GMAX = 100, HIT_G = 12;
const SP = {
  bear: { name: "대지진", desc: "땅을 내리쳐 모든 적에게 피해 (공격력×1.6)", gain: 20, col: "#e0a060", dur: .85, hit: .05 },
  dino: { name: "불꽃 브레스", desc: "앞쪽 적 셋을 불태움 (공격력×1.8)", gain: 25, col: "#ff6a20", dur: .7, hit: .1 },
  cat: { name: "연속 할퀴기", desc: "맨 앞 적을 4번 할퀴고 마지막 일격은 치명타", gain: 25, col: "#ffd84d", dur: .55, hit: .17 },
  bun: { name: "분신 연타", desc: "분신 셋과 함께 적을 6번 때림", gain: 22, col: "#ff9ed2", dur: .6, hit: .1 },
  peng: { name: "회복 오로라", desc: "아군 전원 회복", gain: 30, col: "#5fffc8", dur: .85, hit: .07 },
  octo: { name: "먹물 폭탄", desc: "모든 적에게 피해 + 2턴 동안 적 공격력 40% 감소", gain: 25, col: "#9a6cff", dur: .75, hit: .05 },
};
const KEYS = Object.keys(TYPES), STAR = [0, 1, 1.8, 3.2], ORDER = ["bear", "dino", "cat", "bun", "octo", "peng"];
const DT = 1 / 120, CAB_W = 360, CAB_H = 430, FLOOR = 395, TOPY = 58, CHUTE_X = 46, PIT_L = 96, PIT_R = 336;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const store = { get() { try { return JSON.parse(localStorage.getItem("g002") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g002", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ best: 0, runs: 0, seen: {}, mute: false }, store.get());
const JUICE = !q.has("nojuice");

// ───────── 소리 (Web Audio 합성) ─────────
let ac = null, master = null, NB = null;
function audio() {
  if (SELFTEST) return null;
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = save.mute ? 0 : .9; master.connect(ac.destination); }
    if (ac.state === "suspended") ac.resume();
    return ac;
  } catch (e) { return null; }
}
function beep(f, d = .06, type = "square", v = .04, w = 0, f2, dest) { const a = audio(); if (!a) return; try { const t = a.currentTime + w, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .02); } catch (e) {} }
function noise(d = .1, v = .05, f = 1200, w = 0, type = "bandpass", f2, dest, at) {
  const a = audio(); if (!a) return;
  try {
    if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
    const t = at ?? a.currentTime + w, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = NB; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t, Math.random() * .5); s.stop(t + d + .02);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const vary = () => 1 + (Math.random() - .5) * .16;   // 피치 ±8%
const SFX = {
  coin() { beep(988, .05); beep(1319, .1, "square", .04, .05); },
  motor() { beep(90, .5, "sawtooth", .025, 0, 70); },
  grab() { beep(260, .05, "square", .06); beep(180, .08, "triangle", .07, .04); buzz(15); },
  miss() { beep(200, .25, "triangle", .06, 0, 110); },
  slip() { [600, 450, 300].forEach((f, i) => beep(f, .08, "square", .045, i * .08)); buzz([20, 30, 20]); },
  wobble() { beep(520 + Math.random() * 60, .04, "square", .025); },
  get() { [523, 659, 784, 1046].forEach((f, i) => beep(f, .09, "square", .045, i * .06)); buzz(20); },
  card() { [784, 1046, 1319, 1568, 2093].forEach((f, i) => beep(f, .12, "triangle", .05, i * .05)); },
  merge() { [784, 988, 1175, 1568, 2093].forEach((f, i) => beep(f, .08, "square", .04, i * .05)); buzz([15, 30, 15]); },
  hit(c, v = 3) { const k = vary() / (1 + Math.min(1.4, v / 25)); beep((c ? 150 : 240) * k, c ? .16 : .06, c ? "sawtooth" : "square", c ? .075 : .045, 0, (c ? 60 : 120) * k); noise(c ? .12 : .05, c ? .07 : .04, 1800 * k); if (c) buzz(25); },
  weak() { beep(300 * vary(), .03, "square", .02); },
  heal() { beep(880 * vary(), .08, "sine", .05, 0, 1320); },
  die() { beep(330 * vary(), .2, "triangle", .05, 0, 110); noise(.18, .05, 900, 0, "lowpass", 200); },
  vs(boss) { noise(.35, .09, 400, 0, "lowpass", 3000); beep(70, .5, "sine", .22, .02, 35); if (boss) [0, .3, .6, .9].forEach((w, i) => beep(i % 2 ? 660 : 880, .28, "sawtooth", .04, w + .1)); },
  whoosh() { noise(.3, .07, 400, 0, "bandpass", 4000); },
  ready() { beep(1568, .06, "square", .03); beep(2093, .08, "square", .03, .05); },
  special(t) {
    SFX.whoosh(); beep(330, .25, "square", .04, 0, 990);
    if (t === "bear") { beep(55, .9, "sine", .3, .7, 28); noise(.8, .14, 300, .7, "lowpass", 60); }
    if (t === "dino") noise(1.1, .1, 600, .25, "lowpass", 2400);
    if (t === "peng") [1046, 1319, 1568, 2093, 2637, 3136].forEach((f, i) => beep(f, .4, "sine", .035, .1 + i * .08));
    if (t === "octo") { beep(500, .5, "sine", .09, .1, 70); noise(.4, .08, 700, .35, "lowpass", 150); }
    if (t === "bun") [0, .1, .2].forEach(w => beep(900, .06, "square", .03, .2 + w, 1400));
    if (t === "cat") beep(1400, .12, "sawtooth", .03, .3, 300);
  },
  slash() { noise(.07, .07, 5000 * vary(), 0, "highpass"); },
  final() { beep(60, 1.2, "sine", .3, 0, 30); noise(1, .12, 2500, 0, "lowpass", 100); buzz([40, 40, 80]); },
  win() { [523, 659, 784, 1046, 0, 784, 1046, 1319].forEach((f, i) => f && beep(f, i === 7 ? .5 : .14, "square", .05, i * .1)); [262, 330, 392].forEach(f => beep(f, .9, "triangle", .05, .7)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => beep(f, .25, "triangle", .06, i * .18)); },
};
// 전투 BGM: 16스텝 리듬 루프. lvl(0~3)이 오를수록 악기가 쌓인다. 보스는 빠르고 긴장되는 진행
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const BGM = {
  on: false, step: 0, next: 0, tid: 0, lvl: 0, boss: false, g: null,
  start(boss) {
    const a = audio(); if (!a) return; this.stop(); this.boss = boss; this.lvl = boss ? 1 : 0; this.step = 0; this.next = a.currentTime + .08;
    try { this.g = a.createGain(); this.g.gain.setValueAtTime(.0001, a.currentTime); this.g.gain.exponentialRampToValueAtTime(.8, a.currentTime + .5); this.g.connect(master); } catch (e) { return; }
    this.on = true; this.tid = setInterval(() => this.sched(), 25);
  },
  stop() { if (!this.on) return; this.on = false; clearInterval(this.tid); const g = this.g; try { g.gain.setTargetAtTime(.0001, ac.currentTime, .12); setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 900); } catch (e) {} },
  sched() { if (!ac) return; const st = 60 / (this.boss ? 150 : 128) / 4; while (this.next < ac.currentTime + .15) { this.play(this.step, this.next, st); this.next += st; this.step++; } },
  play(s, t, st) {
    const L = this.lvl, i = s % 16, bar = Math.floor(s / 16) % 4, d = this.g;
    const prog = this.boss ? [[45, 0], [46, 1], [45, 0], [40, 1]] : [[45, 0], [41, 1], [48, 1], [43, 1]], [root, maj] = prog[bar], ch = [0, maj ? 4 : 3, 7, 12];
    const tone = (m, dur, type, v) => { try { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(mtof(m), t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(d); o.start(t); o.stop(t + dur + .02); } catch (e) {} };
    if (i % 4 === 0 || (L >= 2 && i === 14)) { try { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12); g.gain.setValueAtTime(.32, t); g.gain.exponentialRampToValueAtTime(.0001, t + .16); o.connect(g); g.connect(d); o.start(t); o.stop(t + .18); } catch (e) {} }
    if (L >= 1 && (i === 4 || i === 12)) noise(.12, .09, 1800, 0, "bandpass", 900, d, t);
    if (L >= 3 && (i === 15)) noise(.08, .06, 2000, 0, "bandpass", 900, d, t);
    if ((L >= 1 && i % 2 === 0) || L >= 3) noise(.03, i % 4 === 2 ? .045 : .025, 8000, 0, "highpass", 0, d, t);
    if (i % 2 === 0) tone(root - 12 + ([0, 0, 12, 0, 0, 12, 7, 0][i / 2]), st * 1.8, "sawtooth", .05);
    if (L >= 2) tone(root + 12 + ch[(i * 3 + bar) % 4], st * .9, "square", .018);
    if (L >= 3 && [0, 3, 6, 10, 12].includes(i)) tone(root + 24 + ch[(i + bar) % 3], st * 2.4, "triangle", .04);
  },
};
function setMute(m) { save.mute = m; store.set(save); $("mute").textContent = m ? "🔇" : "🔊"; if (master) try { master.gain.setTargetAtTime(m ? 0 : .9, ac.currentTime, .02); } catch (e) {} }

function emit(ev, data = {}) { try { if (parent !== window) parent.postMessage({ type: "nhc-game", game: "G002", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0;
addEventListener("pointerdown", () => { audio(); const t = Date.now(); if (t - lastInputEmit > 4000) { lastInputEmit = t; emit("input"); } }, true);

// ───────── 런·라운드 (순수 로직: 봇과 실제 플레이 공통) ─────────
function newRun(seed) { return { seed, R: rng(seed), round: 1, coins: 4, squad: [], pit: [], claw: null, log: [] }; }
function pickType(R) { const pool = []; KEYS.forEach(k => { for (let i = 0; i < TYPES[k].rare; i++) pool.push(k); }); return pool[Math.floor(R() * pool.length)]; }
function fillPit(run) {
  const n = 9 - run.pit.length;

  fx.parts = fx.parts.filter(p => (p.life -= gdt) > 0); fx.parts.forEach(p => { p.x += p.vx * gdt; p.y += p.vy * gdt; p.vy += p.g * gdt; p.vx *= Math.pow(.97, gdt * 60); });
  fx.floats = fx.floats.filter(f => (f.t += gdt) < 1); fx.shake *= Math.pow(.01, dt); fx.flash = Math.max(0, fx.flash - dt * 2);
  return gdt;
}
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (scene === "claw" && run) {
    acc += dt;
    while (acc >= DT) { acc -= DT; let tap = tapQ; tapQ = false; if (auto) { tap = botTap(run); if (run.claw.phase === "swing" && run.coins <= 0) { startBattle(); break; } } const evs = clawStep(run, tap); if (evs.length) handleEvents(evs); }
    if (run && run.claw && run.claw.phase === "swing") hud();
  } else if (scene === "battle" && bt) battleTick(dt);
  const gdt = fxTick(dt);
  draw(t / 1000, gdt); requestAnimationFrame(loop);
}

// ───────── 시작 ─────────
resize(); setMute(!!save.mute);
function simRun(seed) {
  const r = newRun(seed); fillPit(r); r.claw = newClaw(r); let ticks = 0, maxTurns = 0, err = null, sps = 0, fights = 0, secs = 0;
  try {
    while (r.round <= 12 && ticks < 2e6) {
      ticks++; const tap = botTap(r); clawStep(r, tap);
      if (r.claw.phase === "swing" && r.coins <= 0) {
        const res = battle(r); fights++; sps += res.ev.filter(e => e.k === "sp").length; secs += 2 + res.ev.reduce((s, e) => s + evDur(e), 0) + res.ev.filter(e => e.k === "atk" && !e.weak).length * .08;
        maxTurns = Math.max(maxTurns, res.turns); if (res.turns >= 300) { err = "전투가 안 끝남"; break; } if (!afterBattle(r, res)) break; fillPit(r); r.claw = newClaw(r);
      }
    }
  } catch (e) { err = String(e); }
  return { round: r.round, squad: r.squad.map(u => TYPES[u.type].e + u.star).join(""), maxTurns, err, sps, fights, secs };
}
// 연출 스모크 검사: 실제 연출 코드를 가짜 시간으로 끝까지 돌려 본다 (필살기 6종·보스·마지막 일격·패배)
function smokeTest() {
  const out = []; let ok = true;
  const cases = [{ seed: 77, round: 5, squad: KEYS.map(k => ({ type: k, star: 3 })) }, { seed: 78, round: 3, squad: KEYS.map(k => ({ type: k, star: 1 })) }, { seed: 80, round: 8, squad: KEYS.map(k => ({ type: k, star: 3 })) }, { seed: 81, round: 10, squad: KEYS.map(k => ({ type: k, star: 3 })) }, { seed: 79, round: 12, squad: [] }];
  const spSeen = {};
  cases.forEach(cs => {
    try {
      run = newRun(cs.seed); run.round = cs.round; run.squad = cs.squad; fillPit(run); run.claw = newClaw(run); scene = "claw"; startBattle(true);
      let steps = 0; while (bt.phase !== "done" && steps < 60 * 300) { steps++; battleTick(1 / 60); fxTick(1 / 60); draw(steps / 60, 1 / 60); }
      bt.res.ev.forEach(e => { if (e.k === "sp") spSeen[e.type] = 1; });
      const pass = bt.phase === "done"; if (!pass) ok = false;
      out.push(`연출 R${cs.round}${bt.boss ? "(보스)" : ""}: ${pass ? "OK" : "FAIL"} ${bt.res.win ? "승리" : "패배"} · ${(steps / 60).toFixed(1)}초 · 필살기 ${bt.res.ev.filter(e => e.k === "sp").length}회`);
    } catch (e) { ok = false; out.push("연출 오류: " + e); }
  });
  const all = KEYS.every(k => spSeen[k]); if (!all) ok = false;
  out.push(`필살기 6종 연출: ${all ? "OK" : "FAIL"} (${KEYS.filter(k => spSeen[k]).map(k => TYPES[k].e).join("")})`);
  scene = "over"; bt = null; fx.parts = []; fx.floats = [];
  return { ok, out };
}
if (SELFTEST) {
  const rows = [], dist = {}; let ok = 0, sps = 0, fights = 0, secs = 0, inRange = 0;
  for (let s = 1; s <= 20; s++) {
    const r = simRun(s), pass = !r.err && r.round >= 3 && r.round <= 12; /* 3라운드는 가야 하고, 상한(13)까지 가면 너무 쉬움 */
    if (pass) ok++; if (r.round >= 5 && r.round <= 10) inRange++; dist[r.round] = (dist[r.round] || 0) + 1; sps += r.sps; fights += r.fights; secs += r.secs;
    rows.push(`${s}\t${pass ? "OK" : "FAIL"}\t도달 라운드 ${r.round}\t${r.squad}\t최장 전투 ${r.maxTurns}턴\t필살기 ${r.sps}회${r.err ? "\t" + r.err : ""}`);
  }
  const sm = smokeTest(); if (sm.ok) ok++;
  rows.push("", `라운드 분포: ${Object.keys(dist).sort((a, b) => a - b).map(k => `${k}:${dist[k]}`).join("  ")} · 목표(5~10) ${inRange}/20`, `필살기 평균 ${(sps / fights).toFixed(1)}회/전투 · 연출 예상 평균 ${(secs / fights).toFixed(1)}초/전투`, ...sm.out);
  document.body.insertAdjacentHTML("beforeend", `<pre id="selftest" style="position:fixed;inset:0;background:#000;color:#0f0;z-index:9;margin:0;padding:10px;overflow:auto;font-size:11px">${rows.join("\n")}</pre>`);
  document.title = `SELFTEST ${ok}/21`;
} else if (q.has("autoplay")) { auto = true; startRun(Number(q.get("autoplay")) || 1); }
else menu();
window.__g002 = { newRun, fillPit, newClaw, clawStep, battle, simRun, evDur };
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
