<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2a3a">
<title>맛집 새치기</title>
<style>
:root{--bg:#1f2a3a;--tx:#fff8ee;--sub:#b9c2d3;--acc:#ffb020;--red:#ff5a4f;--ok:#4fd18b;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* 상단 목표 (항상 표시) */
.hud{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;pointer-events:none;z-index:2}
.goal{flex:1;background:rgba(15,20,30,.8);border:1px solid var(--line);border-radius:14px;padding:6px 10px;min-width:0}
.goal .g1{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .g1 b{font:900 15px ui-monospace,Menlo,monospace;color:var(--tx)}
.goal .g1 .bw{color:var(--acc)}
.goal .g2{font-size:15px;font-weight:900;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .g2 b{font:900 20px ui-monospace,Menlo,monospace;color:var(--red)}
.goal .g2.ok{color:var(--ok)}
.goal.bump{animation:bump .35s cubic-bezier(.3,1.8,.6,1)}
@keyframes bump{40%{transform:scale(1.05)}}
.warnb{width:70px;flex:none;background:rgba(15,20,30,.8);border:1px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-size:10.5px;color:var(--sub)}
.warnb b{display:block;font:900 17px ui-monospace,Menlo,monospace;color:var(--red);letter-spacing:1px;margin-top:3px}
#hold{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:74px;border:0;border-radius:20px;background:linear-gradient(#ffcc5c,#ff9f1a);color:#3a2300;font:900 18px -apple-system,sans-serif;box-shadow:0 6px 0 #b86a00,0 10px 24px rgba(0,0,0,.35);touch-action:none;overflow:hidden;z-index:2}
#hold small{display:block;font-size:11.5px;font-weight:700;opacity:.8}
#hold .bar{position:absolute;left:0;bottom:0;height:7px;background:#3a2300;opacity:.55;width:0}
#hold.on{transform:translateY(4px);box-shadow:0 2px 0 #b86a00;background:linear-gradient(#ffb020,#f08800)}
#hold.danger{background:linear-gradient(#ff7a6b,#e0362b);color:#fff;box-shadow:0 6px 0 #8f1d15,0 10px 24px rgba(0,0,0,.35);animation:dz .18s infinite alternate}
#hold.danger.on{box-shadow:0 2px 0 #8f1d15}
@keyframes dz{to{filter:brightness(1.18)}}
#hold:disabled{filter:grayscale(.8) brightness(.7)}
/* 튜토리얼 코치 */
#coach{position:absolute;left:12px;right:12px;top:calc(76px + env(safe-area-inset-top));z-index:3;display:none;background:#fff8ee;color:#2a1c06;border-radius:16px;padding:10px 12px 10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#coach.on{display:block;animation:rise .25s ease-out}
#coach .top{display:flex;align-items:center;gap:8px}
#coach .dots{flex:1;font-size:11px;font-weight:800;color:#9a7a3a;letter-spacing:2px}
#coach #skip{border:0;background:#e9dcc4;color:#5a4320;border-radius:10px;font:800 12px -apple-system,sans-serif;min-height:40px;min-width:76px;padding:0 10px;cursor:pointer}
#coach .msg{font-size:18px;font-weight:900;line-height:1.35;margin-top:2px}
#coach .msg em{font-style:normal;color:#e0362b}
#coach .msg.good{color:#1d8a52}
#coach.pulse{animation:cp .4s cubic-bezier(.3,1.8,.6,1)}
@keyframes cp{40%{transform:scale(1.04)}}
#arrow{position:absolute;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:40px;z-index:3;display:none;pointer-events:none;animation:ar .5s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#arrow.on{display:block}
@keyframes ar{to{transform:translate(-50%,10px)}}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,22,.68);padding:18px;z-index:5}
.ov.on{display:flex}
.box{background:#28344a;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(360px,100%);text-align:center;animation:rise .25s ease-out;max-height:100%;overflow:auto}
@keyframes rise{from{transform:translateY(20px);opacity:.5}}
.box h1{margin:0;font-size:26px} .box h2{margin:0 0 4px;font-size:22px}
.box p{color:var(--sub);font-size:13.5px;line-height:1.6;margin:6px 0}
.box ul{text-align:left;font-size:13px;line-height:1.75;padding-left:18px;color:#eef2f8}
.box button{width:100%;border:0;border-radius:12px;padding:12px;min-height:44px;font:900 15px -apple-system,sans-serif;margin-top:8px;cursor:pointer;background:var(--acc);color:#3a2300}
.box button.sec{background:#3b4862;color:var(--tx)}
.box .food{font-size:64px;animation:food .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes food{from{transform:scale(0) rotate(-30deg)}}
.box .stars{font-size:30px;color:var(--acc);letter-spacing:4px}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.list button{margin:0;padding:9px 6px;font-size:13px;background:#3b4862;color:var(--tx)}
.list button.done{background:#3c5a4a} .list button:disabled{opacity:.35}
.list small{display:block;font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="goal" id="goal"><div class="g1">그릇 <b class="bw" id="bowl">-</b>개 남음 / 내 앞 <b id="ahead">-</b>명</div><div class="g2" id="need">-</div></div>
    <div class="warnb">경고<b id="warn">○○○</b></div>
  </div>
  <div id="coach"><div class="top"><div class="dots" id="dots">연습 1/4</div><button id="skip">건너뛰기</button></div><div class="msg" id="cmsg"></div></div>
  <div id="arrow">👇</div>
  <button id="hold"><span id="holdT">🤫 살금살금</span><small id="holdS">누르고 있기 · ❗ 뜨면 손 떼기</small><span class="bar" id="bar"></span></button>
  <div class="ov" id="ov"><div class="box" id="box"></div></div>
</div>
<script>
"use strict";
// ───────── 데이터 ─────────
const TYPES = {
  office: { e: "📱", hair: "#3a2c24", skin: "#f2c9a0", body: "#5a6b8c", fwd: [3.5, 6.5], tele: [.6, .8], look: [.8, 1.2], name: "직장인" },
  kid: { e: "🧒", hair: "#6b3f1d", skin: "#ffd6b0", body: "#ff8a5b", fwd: [1.3, 2.6], tele: [.35, .45], look: [.9, 1.3], name: "아이" },
  granny: { e: "👵", hair: "#d9d6d0", skin: "#efc6a4", body: "#8e6aa8", fwd: [2.2, 4.0], tele: [.9, 1.2], look: [2.0, 2.8], name: "할머니" },
  uncle: { e: "🕶", hair: "#1c1c1c", skin: "#d9a77c", body: "#3b3b3b", fwd: [1.6, 2.8], tele: [.45, .6], look: [1.6, 2.4], name: "아저씨" },
};
const FACES = { office: "😑", kid: "🤨", granny: "🧐", uncle: "😠" };
const ANGRY = ["😠", "😤", "🤨", "😡", "🙄", "😒"];
const SHOPS = [
  { name: "분식집", food: "🍢", n: 8, cut: 2, every: 3.4, mix: { office: 5, kid: 2 } },
  { name: "떡볶이", food: "🌶️", n: 9, cut: 3, every: 3.3, mix: { office: 4, kid: 3, granny: 1 } },
  { name: "국밥집", food: "🍲", n: 10, cut: 3, every: 3.2, mix: { office: 3, kid: 2, granny: 3 } },
  { name: "칼국수", food: "🍜", n: 11, cut: 4, every: 3.2, mix: { office: 3, kid: 3, granny: 2, uncle: 1 } },
  { name: "마라탕", food: "🥘", n: 12, cut: 4, every: 3.1, mix: { office: 2, kid: 3, granny: 2, uncle: 2 } },
  { name: "돈가스", food: "🍛", n: 12, cut: 5, every: 3.1, mix: { office: 2, kid: 3, granny: 2, uncle: 3 } },
  { name: "베이글", food: "🥯", n: 13, cut: 5, every: 3.0, mix: { office: 2, kid: 4, granny: 1, uncle: 3 } },
  { name: "평양냉면", food: "🥢", n: 14, cut: 6, every: 3.2, mix: { office: 1, kid: 3, granny: 3, uncle: 3 } },
  { name: "소금빵", food: "🥐", n: 14, cut: 6, every: 4.3, mix: { office: 1, kid: 4, granny: 2, uncle: 4 } },
  { name: "오마카세", food: "🍣", n: 15, cut: 7, every: 4.3, mix: { office: 1, kid: 3, granny: 3, uncle: 5 } },
];
const TUT_SHOP = { name: "연습 김밥", food: "🍙" };
// 가게별 속도(every)는 반응형 봇 최소 통과값 + 사람 반응 여유 (2026-11-26 조정)
const DT = 1 / 60, PASS_TIME = .7, WATCH = 2, CAUGHT_PUSH = 2;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const store = { get() { try { return JSON.parse(localStorage.getItem("g006") || "{}"); } catch (e) { return {}; } }, set(v) { try { localStorage.setItem("g006", JSON.stringify(v)); } catch (e) {} } };
let save = Object.assign({ stars: {}, unlocked: 1, tut: 0 }, store.get());

// ───────── 소리 ─────────
let ac = null;
const actx = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; };
function beep(f, d = .06, type = "square", v = .04, w = 0, f2) { try { const a = actx(); if (!a) return; const t = a.currentTime + w, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d); } catch (e) {} }
// 휙 (필터 걸린 잡음)
function whoosh(d = .22, v = .12, f1 = 600, f2 = 2400) { try { const a = actx(); if (!a) return; const t = a.currentTime, n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); } catch (e) {} }
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const JUICE = !new URLSearchParams(location.search).has("nojuice");
const vary = f => f * (1 + (Math.random() - .5) * .14);
const SFX = {
  step() { beep(vary(190), .03, "triangle", .03); },
  pass(c) { const f = 620 * Math.pow(1.06, Math.min(c, 10)); beep(f, .06, "sine", .045, 0, f * 1.5); },
  tele() { beep(1320, .06, "square", .035); beep(1320, .06, "square", .035, .1); beep(1760, .08, "square", .03, .2); },
  look() { whoosh(.2, .14, 500, 2600); beep(95, .45, "sawtooth", .035, .05, 140); beep(1900, .12, "sine", .02, .05, 2300); },
  caught() { beep(220, .3, "sawtooth", .07, 0, 120); whoosh(.35, .1, 300, 900); [0, .12, .24].forEach(w => beep(vary(520), .09, "square", .03, .15 + w, vary(380))); buzz([40, 40, 80]); },
  phew() { beep(500, .25, "sine", .04, 0, 300); },
  heart() { beep(70, .08, "sine", .12); beep(60, .08, "sine", .1, .14); },
  enter() { beep(vary(392), .08, "triangle", .04); },
  good() { [660, 880, 1175].forEach((f, i) => beep(f, .1, "sine", .05, i * .07)); },
  win() { [523, 659, 784, 1046, 1319].forEach((f, i) => beep(f, .12, "square", .045, i * .08)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => beep(f, .2, "triangle", .06, i * .15)); },
};
function emit(ev, data = {}) { try { if (parent !== window) parent.postMessage({ type: "nhc-game", game: "G006", ev, data }, "*"); } catch (e) {} }
let lastInputEmit = 0;
addEventListener("pointerdown", () => { const t = Date.now(); if (t - lastInputEmit > 4000) { lastInputEmit = t; emit("input"); } }, true);

// ───────── 로직 (봇과 실제 플레이 공통, 고정 틱) ─────────
const between = (R, [a, b]) => a + R() * (b - a);
function newLevel(li, seed) {
  const S = SHOPS[li], R = rng(seed), pool = [];
  Object.entries(S.mix).forEach(([k, n]) => { for (let i = 0; i < n; i++) pool.push(k); });
  const line = [];
  for (let i = 0; i < S.n; i++) { const type = pool[Math.floor(R() * pool.length)]; line.push({ id: i, type, st: "fwd", t: 0, dur: between(R, TYPES[type].fwd) * (.3 + R() * .9), me: false }); }
  line.push({ id: 99, me: true });
  return { li, shop: S, R, line, bowls: S.n + 1 - S.cut, adv: S.every, advT: S.every, strikes: 0, prog: 0, cool: 0, time: 0, over: null, passed: 0, glare: 0, caughtN: 0 };
}
const meIdx = L => L.line.findIndex(p => p.me);
function watchers(L) { const p = meIdx(L); return L.line.slice(Math.max(0, p - WATCH), p).filter(x => !x.me); }
// 이대로 기다리면 못 먹는 사람 수: 내 앞 p명이 다 들어가도 그릇이 1개 이상 남아야 한다
const needPass = L => Math.max(0, meIdx(L) - L.bowls + 1);
function stepLevel(L, hold, ev) {
  if (L.over) return;
  L.time += DT; L.cool = Math.max(0, L.cool - DT); L.glare = Math.max(0, L.glare - DT);
  // 손님 고개 돌리기 (noTurn: 연습 단계 — 앞보기에서 스스로 돌아보지 않음)
  for (const n of L.line) {
    if (n.me) continue; n.t += DT;
    if (n.st === "fwd" && L.noTurn) { n.t = 0; continue; }
    if (n.t >= n.dur) {
      const T = TYPES[n.type]; n.t = 0;
      if (n.st === "fwd") { n.st = "tele"; n.dur = between(L.R, T.tele); if (watchers(L).includes(n)) ev && ev("tele", n); }
      else if (n.st === "tele") { n.st = "look"; n.dur = between(L.R, T.look); ev && ev("look", n); }
      else { n.st = "fwd"; n.dur = between(L.R, T.fwd); }
    }
  }
  // 줄이 줄어듦
  if (!L.noAdv) {
    L.advT -= DT;
    if (L.advT <= 0) {
      L.advT = L.adv;
      const f = L.line[0];
      if (f.me) { L.over = "win"; ev && ev("win"); return; }
      L.line.shift(); L.bowls--; ev && ev("enter", f);
      if (L.bowls <= 0) { L.over = "soldout"; ev && ev("soldout"); return; }
    }
  }
  // 살금살금
  const p = meIdx(L);
  const moving = hold && p > 0 && L.cool <= 0;
  if (moving) {
    if (watchers(L).some(n => n.st === "look")) {   // 들킴
      if (!L.noStrike) L.strikes++; L.caughtN++; L.prog = 0; L.cool = 1.1; L.glare = 1.1;
      const me = L.line.splice(p, 1)[0], np = Math.min(L.line.length, p + CAUGHT_PUSH); L.line.splice(np, 0, me);
      ev && ev("caught"); if (L.strikes >= 3) { L.over = "kicked"; ev && ev("kicked"); } return;
    }
    L.prog += DT / PASS_TIME; ev && ev("sneak");
    if (L.noPass && L.prog >= 1) L.prog = .99;   // 연습: ❗~돌아보기 동안은 지나가지 않음
    if (L.prog >= 1) { L.prog = 0; const me = L.line.splice(p, 1)[0]; L.line.splice(p - 1, 0, me); L.passed++; ev && ev("pass"); }
  }
}
// 반응형 봇: 지켜보는 사람 중 누구라도 ❗(예고)거나 돌아보고 있으면 멈춘다 — 사람이 화면을 보고 할 수 있는 최선과 같다
function botHold(L) { return meIdx(L) > 0 && L.cool <= 0 && !watchers(L).some(n => n.st !== "fwd"); }

// ───────── 튜토리얼 (직접 겪기: 누르기 → ❗ 손 떼기 → 들키면 뒤로 → 짧은 실전) ─────────
const TUT_STEPS = 4;
function tutLine(types) { const line = types.map((type, i) => ({ id: 200 + i, type, st: "fwd", t: 0, dur: 99, me: false })); line.push({ id: 99, me: true }); return line; }
function newTut() {
  return { li: -1, shop: TUT_SHOP, R: rng(4242), line: tutLine(["office", "granny", "office", "kid", "office", "office"]), bowls: 9, adv: 99, advT: 99, strikes: 0, prog: 0, cool: 0, time: 0, over: null, passed: 0, glare: 0, caughtN: 0,
    noTurn: true, noAdv: true, noStrike: true, tut: { s: 0, ph: "wait", t: 0, okT: 0, seen: false, c0: 0, n: null, msg: "", good: false, done: false } };
}
function tutRun(L) {   // 4단계: 짧은 실전 (그릇 4 · 내 앞 5 → 2명 앞지르기)
  const R = rng(777 + L.caughtN), types = ["office", "kid", "office", "office", "kid"];
  L.line = types.map((type, i) => ({ id: 300 + i, type, st: "fwd", t: 0, dur: between(R, TYPES[type].fwd) * (.5 + R() * .6), me: false })); L.line.push({ id: 99, me: true });
  Object.assign(L, { R, bowls: 4, adv: 3.0, advT: 3.0, prog: 0, cool: 0, over: null, noTurn: false, noAdv: false, noStrike: true });
}
function tutSay(U, msg, good) { if (U.msg !== msg) { U.msg = msg; U.good = !!good; U.changed = true; } }
function tutGo(L, s) { const U = L.tut; U.s = s; U.ph = "wait"; U.t = 0; U.n = null; U.c0 = L.caughtN; L.noPass = false; U.ran = false; }
function tutForce(L, ev, teleDur) {   // 가장 가까운 앞사람에게 ❗ → 돌아보기
  const w = watchers(L); const n = w[w.length - 1]; if (!n) return null;
  n.st = "tele"; n.t = 0; n.dur = teleDur; ev && ev("tele", n); return n;
}
function tutTick(L, hold, ev) {
  const U = L.tut; if (!U || U.done) return;
  U.t += DT; if (U.okT > 0) { U.okT -= DT; return; }   // 칭찬 보여 주는 동안 잠깐 멈춤
  if (U.n && U.n.st === "look" && U.ph === "tele") { U.ph = "look"; U.n.dur = 1.8; }
  if (U.ph === "tele" && U.n && !watchers(L).includes(U.n)) { U.n.st = "fwd"; U.n.t = 0; U.ph = "wait"; U.t = 0; U.n = null; }
  L.noPass = (U.s === 1 || U.s === 2) && U.ph !== "wait";
  if (U.s === 0) {
    tutSay(U, hold ? "좋아요, 계속 꾹~ 앞사람을 <em>살금살금</em> 지나가는 중" : "👇 아래 버튼을 <em>꾹 누르고 있어</em> 보세요");
    if (L.passed >= 1) { tutSay(U, "한 명 앞질렀다! 👍 누르면 앞으로 가요", true); ev && ev("tgood"); U.okT = 1.3; tutGo(L, 1); }
  } else if (U.s === 1) {
    if (U.ph === "wait") {
      tutSay(U, "다시 꾹 눌러서 앞으로… <em>앞사람 머리 위</em>를 잘 보세요");
